        character: (a, b) => (a.character || "").localeCompare(b.character || ""),
        raid: (a, b) => (a.raid || "").localeCompare(b.raid || ""),
      };
      const sorted = filtered.slice().sort(cmp[runSort] || cmp.date);
      const s = summarizeRuns(filtered);
      // Value scope (SPEC §16.11): "mine" = self-only; "pooled" = per-player party-pooled value
      // (items ÷ party size + your gold). The toggle only appears once some run has party data.
      // With none, pooled == mine, so force self to avoid a misleading inert toggle.
      const anyPartyRuns = s.partyRuns > 0;
      const pooled = dropDataView === "pooled" && anyPartyRuns;
      // In pooled mode every party member's run is a SAMPLE: the run count is Σ party sizes and
      // the total is everyone's assumed haul; per-run/per-hour stay per-player (SPEC §16.11).
      const runsN = pooled ? s.pooledCount : s.count;
      const totalVal = pooled ? s.totalPooledValue : s.totalValue;
      const perRunVal = pooled ? s.pooledPerRun : s.valuePerRun;
      const perHourVal = pooled ? s.pooledPerHour : s.valuePerHour;
      const perHour = perHourVal == null ? "—" : fmt(perHourVal);
      const dataViewToggle = anyPartyRuns
        ? `<div class="modeToggle mini scan-dataview" title="Off = only your drops. On = every party member's run counts as a sample (runs and total scale with party size; per-run and per-hour are what one player gets). A bigger sample of what a run is worth. The Core buffs panel is always your own data.">
            <button type="button" data-dataview="${pooled ? "mine" : "pooled"}" class="onoff${pooled ? " on" : ""}">Pooled</button></div>`
        : "";
      const summary = `<div class="scan-run-summary">
        <div><span class="srs-n">${runsN}</span><span class="srs-l">run${runsN !== 1 ? "s" : ""}</span></div>
        <div><span class="srs-n">${s.totalDurationSec ? fmtDuration(s.totalDurationSec) : "—"}</span><span class="srs-l">total time</span></div>
        <div><span class="srs-n gold">${fmt(totalVal)}</span><span class="srs-l">total value</span></div>
        <div><span class="srs-n gold">${fmt(perRunVal)}</span><span class="srs-l">per run</span></div>
        <div><span class="srs-n gold">${perHour}</span><span class="srs-l">per hour</span></div>
      </div>`;
      // Per-raid breakdown, the interesting "which run type is worth farming" view. ONE ROW PER
      // RAID+MODE (a raid run in both modes gets two rows), so Per run / Time / value-per-hour
      // never mix Hero and Normal. In pooled mode the value columns show the party-pooled
      // per-player figures (no suffix, the toggle says so) and Runs counts every party sample.
      const bRuns = (b) => (pooled ? b.pooledCount : b.count) || 0;
      const bTotal = (b) => (pooled ? b.pooledTotalValue : b.value) || 0;
      const bPerRun = (b) => (pooled ? b.pooledPerRun : b.valuePerRun) || 0;
      const bHr = (b) => (b ? (pooled ? b.pooledPerHour : b.valuePerHour) : 0) || 0;
      const byRaidCmp = {
        raid: (a, b) => a.label.localeCompare(b.label),
        runs: (a, b) => bRuns(b.b) - bRuns(a.b),
        time: (a, b) => (b.b.avgDurationSec || 0) - (a.b.avgDurationSec || 0),
        total: (a, b) => bTotal(b.b) - bTotal(a.b),
        perrun: (a, b) => bPerRun(b.b) - bPerRun(a.b),
        hr: (a, b) => bHr(b.b) - bHr(a.b),
      };
      const raidRows = Object.entries(s.perRaid)
        .flatMap(([raid, rb]) => Object.entries(rb.byMode || {}).map(([mode, b]) => ({ raid, mode, label: `${raid} ${mode}`, b })))
        .sort(byRaidCmp[byRaidSort] || byRaidCmp.perrun);
      // Core-source analysis (SPEC §16.9). All-time stats feed the per-raid breakdowns; the
      // 30-day window (with live buff costs) feeds the "Core buffs" panel below the summary.
      // The Pooled toggle folds party members' cores into the BY-RAID sample only (§16.11);
      // the Core buffs panel is ALWAYS self-only, your spend, your cores, stable layout.
      const vvipCost = priceByMatch(VVIP_PRICE_MATCH, VVIP_COST_30D);
      const cadetCost = priceByMatch(CADET_PRICE_MATCH, CADET_COST_30D);
      const coreAll = summarizeCoreSources(filtered, { windowDays: Infinity, campfireCost: CAMPFIRE_CORE_COST, pooled });
      const core30 = summarizeCoreSources(filtered, { campfireCost: CAMPFIRE_CORE_COST, vvipCost, cadetCost, plusUSD: CORE_BOOST_PLUS_USD });
      // Base-boost drop-QUALITY comparison: the daily core boost adds no lines, it upgrades what
      // base cores contain, so compare avg base-core value, boosted vs unboosted, per raid+mode.
      const boostCmp = {}; // "raid|mode" → { boosted:{runs,val}, plain:{runs,val} }
      for (const r of filtered) {
        if (!(r.drops || []).length || !r.drops.every((d) => CORE_SOURCES.includes(d.source))) continue;
        const k = `${r.raid || "—"}|${r.mode === "Hero" ? "Hero" : "Normal"}`;
        const e = (boostCmp[k] ??= { boosted: { runs: 0, val: 0 }, plain: { runs: 0, val: 0 } });
        const t = r.coreBoost ? e.boosted : e.plain;
        t.runs++; t.val += r.drops.filter((d) => d.source === "base").reduce((a, d) => a + (d.value || 0), 0);
      }
      const goodBad = (n) => `<b class="${n >= 0 ? "scan-good" : "scan-bad"}">${n >= 0 ? "worth it" : "not covering it"} (${sfmt(n)})</b>`;
      // Expanded raid+mode row: that mode's core-source averages + the per-run verdicts.
      // Source lines are per CORE (value ÷ cores). Per-run would average in players/runs the
      // source never fired on (a missing campfire core means "didn't buy one", not bad luck).
      // `sampleN` = the row's run count in the current view (pooled: every party sample).
      const raidBreakdown = (raid, mode, sampleN) => {
        const rm = coreAll.perRaidMode[`${raid}|${mode}`];
        if (!rm) return `<div class="hint">No core-source data for this raid yet, runs saved from now on record where each core came from.</div>`;
        const n = sampleN || rm.runs;
        const lines = CORE_SOURCES.map((src) => {
          const b = rm.sources[src];
          if (!b.cores) return "";
          return `<div class="scan-src-line">${srcChip(src) || '<span class="src-chip src-base">CORE</span>'} ${escTxt(SRC_LABEL[src])}: ${b.cores} core${b.cores !== 1 ? "s" : ""} · avg ${fmt(b.value / b.cores)}/core</div>`;
        }).join("");
        // Campfire verdict = the raid's AVERAGE core value vs the 65k buy: the campfire core is
        // one more draw from the same pool, so the pool's EV (spikes included) prices it, not
        // whatever the campfire-tagged lines happened to be.
        const verdict = rm.avgCore != null
          ? `<div class="scan-src-verdict">Avg core here: ${fmt(rm.avgCore)} (over ${rm.cores} cores) vs ${fmt(CAMPFIRE_CORE_COST)} campfire → ${goodBad(rm.avgCore - CAMPFIRE_CORE_COST)} per campfire</div>` : "";
        const bc = boostCmp[`${raid}|${mode}`];
        const boostLine = bc && bc.boosted.runs && bc.plain.runs
          ? `<div class="scan-src-verdict">Core boost (drop quality): base cores avg ${fmt(bc.boosted.val / bc.boosted.runs)}/run boosted vs ${fmt(bc.plain.val / bc.plain.runs)}/run unboosted (${bc.boosted.runs}B/${bc.plain.runs}U)</div>` : "";
        return `<div class="scan-raid-mode">${rm.runs} tracked run${rm.runs !== 1 ? "s" : ""}${pooled ? ` (${n} pooled samples)` : ""}${lines}${verdict}${boostLine}</div>`;
      };
      // Show the By-raid table when there's more than one row or core-source data to expand into.
      const hr = (b) => { const v = bHr(b); return v ? fmt(v) : "—"; };
      const brth = (key, label, cls = "num", attrs = "") => `<th class="scan-sort${cls ? " " + cls : ""}${byRaidSort === key ? " on" : ""}" data-byraidsort="${key}"${attrs}>${label}${byRaidSort === key ? " ▾" : ""}</th>`;
      const perRaid = raidRows.length > 1 || coreAll.trackedCount > 0
        ? `<table class="scan-table scan-run-byraid"><thead><tr>${brth("raid", "Raid", "")}${brth("runs", "Runs")}${brth("time", "Time", "num", ` title="Average time per run (from timed runs)"`)}${brth("total", "Total")}${brth("perrun", "Per run")}${brth("hr", "Value /hr", "num", ` title="Value per hour (from timed runs)"`)}</tr></thead><tbody>${
            raidRows.map(({ raid, mode, b }) => {
              const key = `${raid}|${mode}`;
              const open = raidExpanded.has(key);
              const modeTag = mode === "Hero" ? ' <span class="scan-mode-pill scan-hero-pill" title="Hero mode">H</span>' : "";
              const head = `<tr class="scan-run-row${open ? " on" : ""}" data-raid-toggle="${escTxt(key)}" title="Click for this raid's core-source breakdown"><td>${escTxt(raid)}${modeTag}</td><td class="num">${bRuns(b)}</td><td class="num">${b.avgDurationSec != null ? fmtDuration(b.avgDurationSec) : "—"}</td><td class="num gold">${fmt(bTotal(b))}</td><td class="num gold">${fmt(bPerRun(b))}</td><td class="num gold">${hr(b)}</td></tr>`;
              return open ? head + `<tr class="scan-run-drop scan-raid-detail"><td colspan="6">${raidBreakdown(raid, mode, bRuns(b))}</td></tr>` : head;
            }).join("")}</tbody></table>`
        : "";
      // "Core buffs, last 30 days": CONTRIBUTION only (what each buff's tagged cores actually
      // earned, no worth-it math here; guild is free-for-everyone so it's not listed). The EV
      // worth-it lines below it price a buff's marginal cores at the raids' AVERAGE core value
      // (spikes carry the EV). Campfire's verdict is per-raid, in the By-raid expansion.
      const buffPanel = (() => {
        const cs = core30;
        if (!cs.trackedCount) return "";
        const rows = [];
        const row = (label, html) => rows.push(`<div class="scan-buff-row"><span class="scan-buff-lbl">${escTxt(label)}</span><span>${html}</span></div>`);
        const src = cs.sources;
        const cores = (b) => `${b.cores} core${b.cores !== 1 ? "s" : ""} · ${fmt(b.value)}`;
        if (cs.campfire.runsWith) row("Campfire", `${cores(src.campfire)} · spent ${fmt(cs.campfire.cost)}`);
        // Plus fires on every core-boosted battle (no separate currency). Headline is what a
        // boosted run yielded; the Hero/Normal split (verifying +3 even on Hero) lives in the tooltip.
        if (src.plus.cores) {
          const bm = cs.plus.byMode;
          const modeSplit = ["Hero", "Normal"].filter((m) => bm[m].runs)
            .map((m) => `${m}: ${bm[m].cores} core${bm[m].cores !== 1 ? "s" : ""} over ${bm[m].runs} boosted run${bm[m].runs !== 1 ? "s" : ""}`).join(" · ");
          row("Core Boost Plus", `<span title="${escTxt(modeSplit)}">${cores(src.plus)} over ${cs.plus.runsWith} boosted run${cs.plus.runsWith !== 1 ? "s" : ""}${cs.plus.valuePerBoostedRun != null ? ` → ${fmt(cs.plus.valuePerBoostedRun)}/boosted run` : ""}</span>`);
        }
        if (src.vvip.cores) row("VVIP", cores(src.vvip));
        if (src.pet.cores) row("Pet", `${cores(src.pet)} · ${src.pet.runsWith} run${src.pet.runsWith !== 1 ? "s" : ""}`);
        const luckLevels = Object.keys(cs.luck.byLevel).sort((a, b) => a - b);
        for (const lv of luckLevels) {
          const b = cs.luck.byLevel[lv];
          row(`Luck ${lv}`, `${(b.cores / b.runs).toFixed(2)} cores/run · ${fmt(b.value / b.runs)}/run (${b.runs} run${b.runs !== 1 ? "s" : ""})`);
        }
        // EV worth-it: VVIP = +1 avg core every run; Plus = +3 avg cores per boosted run.
        const evRows = [];
        const evRow = (label, html) => evRows.push(`<div class="scan-buff-row"><span class="scan-buff-lbl">${escTxt(label)}</span><span>${html}</span></div>`);
        if (cs.ev.vvip.runs) evRow("VVIP", `+1 core × ${cs.ev.vvip.runs} run${cs.ev.vvip.runs !== 1 ? "s" : ""} ≈ ${fmt(cs.ev.vvip.value)} vs ${fmt(vvipCost)}/30d → ${goodBad(cs.ev.vvip.net)}`);
        if (cs.ev.plus.runs) evRow("Core Boost Plus", `+3 cores × ${cs.ev.plus.runs} boosted run${cs.ev.plus.runs !== 1 ? "s" : ""} ≈ ${fmt(cs.ev.plus.value)} → ${fmt(cs.ev.plus.goldPerUsd)} gold/$ at $${CORE_BOOST_PLUS_USD}/30d`);
        if (!rows.length && !evRows.length) return "";
        const untracked = cs.runCount - cs.trackedCount;
        const note = untracked > 0 ? `<p class="hint">${untracked} older run${untracked !== 1 ? "s" : ""} excluded (no source data).</p>` : "";
        const evBlock = evRows.length ? `<div class="scan-buff-sub" title="An extra core is valued at the raid's average core value, rare spikes carry the average, whichever line they drop on. Campfire is judged per raid, in the By-raid rows.">Worth it? (extra core ≈ raid's avg core · campfire: see By raid)</div>${evRows.join("")}` : "";
        // Open state is sticky (runPrefs.buffOpen, SPEC §16.8). Survives re-renders AND reloads.
        // ALWAYS self-only (never pooled). Same numbers and same height whatever the toggle says.
        return `<details class="scan-run-section scan-buff-panel"${runPrefs.buffOpen ? " open" : ""}><summary class="scan-run-h4">Core buffs, last 30 days</summary>
          ${rows.join("")}${evBlock}${note}</details>`;
      })();
      const chars = distinctCharacters(runs);
      const filterSel = chars.length > 1
        ? `<label class="scan-run-filter">Character: <select id="runFilterChar"><option value=""${runFilterChar ? "" : " selected"}>All</option>${chars.map((c) => `<option value="${escTxt(c)}"${c === runFilterChar ? " selected" : ""}>${escTxt(c)}</option>`).join("")}</select></label>` : "";
      const th = (key, label, cls = "") => `<th class="scan-sort${cls ? " " + cls : ""}${runSort === key ? " on" : ""}" data-runsort="${key}">${label}${runSort === key ? " ▾" : ""}</th>`;
      const rows = sorted.map((r) => {
        const open = runExpanded.has(r.id);
        const dur = r.durationSec == null ? "—" : fmtDuration(r.durationSec);
        const date = new Date(r.savedAt).toLocaleDateString();
        const goldTotal = (r.gold || 0) + (r.baseGold || 0) + (r.coreGold || 0) + (r.levelBonus || 0); // all gold: chat-log + run reward + core boost + level-cap bonus
        const head = `<tr class="scan-run-row${open ? " on" : ""}" data-run-toggle="${r.id}">
          <td>${date}</td><td>${escTxt(r.character) || "—"}</td><td>${escTxt(r.raid) || "—"}${r.mode === "Hero" ? ' <span class="scan-mode-pill scan-hero-pill" title="Hero mode">H</span>' : ""}${r.coreBoost && r.coreGold ? ' <span class="scan-mode-pill scan-core-pill" title="Core boosted">C</span>' : ""}${r.partySize > 1 ? ` <span class="scan-mode-pill scan-party-pill" title="Party tracked — ${r.partySize} players' drops sampled">×${r.partySize}</span>` : ""}</td>
          <td class="num">${dur}</td><td class="num gold">${fmt(r.itemsValue || 0)}</td><td class="num gold">${fmt(goldTotal)}</td><td class="num gold">${fmt(r.total)}</td>
          <td class="num scan-run-actions"><button class="scan-run-edit" data-run-edit="${r.id}" title="Edit this run, change the time or redo the drops">Edit</button><button class="scan-run-del" data-run-del="${r.id}" title="Delete this run">×</button></td></tr>`;
        if (!open) return head;
        // Drop breakdown; also recompute against TODAY's prices so drift is visible.
        const nowVal = (r.drops || []).reduce((a, d) => { const u = dropUnitValue(d.name, prices); return a + (u != null ? u * d.qty : 0); }, 0) + (r.gold || 0) + (r.baseGold || 0) + (r.coreGold || 0) + (r.levelBonus || 0);
        // Drops sorted by core source (SPEC §16.9) so same-source cores cluster, each keeping its
        // source tag chip. No subtotal/total rows, the per-source breakdown lives in the By-raid
        // rows + the 30-day panel; a single run just lists its drops. Unknown sources sink last,
        // preserving scan order (stable sort). Pre-tracking runs (source "base") render in order.
        const dropRow = (d) => `<tr class="scan-run-drop"><td colspan="3">${escTxt(normalizeBottleName(d.name))}${srcChip(d.source)}</td><td class="num">×${d.qty}</td><td></td><td></td><td class="num gold">${d.value == null ? '<span class="hint">unpriced</span>' : fmt(d.value)}</td><td></td></tr>`;
        const srcRank = (d) => { const i = CORE_SOURCES.indexOf(d.source); return i === -1 ? CORE_SOURCES.length : i; };
        const drops = (r.drops || []).map((d, i) => [d, i])
          .sort((a, b) => srcRank(a[0]) - srcRank(b[0]) || a[1] - b[1])
          .map(([d]) => dropRow(d)).join("");
        const goldRow = r.gold ? `<tr class="scan-run-drop"><td colspan="3">Gold</td><td></td><td></td><td></td><td class="num gold">${fmt(r.gold)}</td><td></td></tr>` : "";
        const baseGoldRow = r.baseGold ? `<tr class="scan-run-drop"><td colspan="3">Run reward${r.mode === "Hero" ? " (Hero)" : ""}</td><td></td><td></td><td></td><td class="num gold">${fmt(r.baseGold)}</td><td></td></tr>` : "";
        const coreGoldRow = r.coreGold ? `<tr class="scan-run-drop"><td colspan="3">Core boost</td><td></td><td></td><td></td><td class="num gold">${fmt(r.coreGold)}</td><td></td></tr>` : "";
        const levelBonusRow = r.levelBonus ? `<tr class="scan-run-drop"><td colspan="3">Level cap bonus (+20%)</td><td></td><td></td><td></td><td class="num gold">${fmt(r.levelBonus)}</td><td></td></tr>` : "";
        const nowRow = `<tr class="scan-run-drop scan-run-now"><td colspan="6" class="hint">at today's prices</td><td class="num gold">${fmt(nowVal)}</td><td></td></tr>`;
        // Party run (SPEC §16.11): per-CHARACTER drop carousel (recipe-carousel style, one player
        // per slide, you first) instead of one long flat list, so who dropped what stays legible.
        // Gold rows stay flat below it, they're yours, not a drop.
        if ((r.party || []).length) {
          const slide = (who, ds, val, tag) => {
            const n = ds.reduce((a, d) => a + d.qty, 0);
            return {
              label: `${who}${tag ? ` ${tag}` : ""}, ${n} drop${n !== 1 ? "s" : ""} · ${fmt(val)}`,
              body: (ds.length ? ds.map((d) => `<div class="scan-party-row"><span>${escTxt(normalizeBottleName(d.name))}${srcChip(d.source)}</span><span class="num">×${d.qty}</span><span class="num gold">${d.value == null ? "—" : fmt(d.value)}</span></div>`).join("") : '<div class="hint">No drops recorded.</div>'),
            };
          };
          const sortedDrops = (r.drops || []).map((d, i) => [d, i]).sort((a, b) => srcRank(a[0]) - srcRank(b[0]) || a[1] - b[1]).map(([d]) => d);
          const slides = [slide(r.character || "You", sortedDrops, r.itemsValue || 0, "(you)"),
            ...(r.party || []).map((m) => slide(m.actor, m.drops || [], m.itemsValue || 0, "(party)"))];
          const key = `run:${r.id}`;
          const idx = Math.min(Math.max(0, openCarouselSlide.get(key) ?? 0), slides.length - 1);
          const carousel = `<tr class="scan-run-drop"><td colspan="8"><div class="recipe-carousel scan-party-carousel" data-carousel data-carousel-key="${escTxt(key)}" data-n="${slides.length}">
            <div class="rc-nav"><button class="recipe-nav" data-dir="-1" type="button" title="Previous player">‹</button>
              <span class="rc-count">${idx + 1} / ${slides.length}</span>
              <button class="recipe-nav" data-dir="1" type="button" title="Next player">›</button>
              <span class="rc-title">${escTxt(slides[idx].label)}</span></div>
            <div class="rc-slides">${slides.map((s, i) => `<div class="recipe-slide${i === idx ? " active" : ""}" data-i="${i}" data-label="${escTxt(s.label)}">${s.body}</div>`).join("")}</div></div></td></tr>`;
          return head + carousel + goldRow + baseGoldRow + coreGoldRow + levelBonusRow + nowRow;
        }
        return head + drops + goldRow + baseGoldRow + coreGoldRow + levelBonusRow + nowRow;
      }).join("");
      return `<p class="hint">Your saved raid runs. Value is frozen at save time. Click a row for its drop breakdown (and what it's worth at today's prices). Export a TSV to paste into a Sheet for permanent storage.${anyPartyRuns ? " Toggle <b>Pooled</b> to score every run by the whole party's drops per player. A bigger sample for value-per-hour." : ""}</p>
        <div class="scan-actions">
          ${filterSel}
          ${chars.length ? `<button data-scan="runrename">Rename character…</button>` : ""}
          <button data-scan="runexport">Export TSV</button>
          <button data-scan="runcopy">Copy TSV</button>
          <button data-scan="runclear" class="danger">Clear all runs</button>
        </div>
        ${summary}
        ${buffPanel}
        ${perRaid ? `<section class="scan-run-section"><h4 class="scan-run-h4 scan-byraid-h">By raid ${dataViewToggle}</h4>${perRaid}</section>` : ""}
        <section class="scan-run-section"><h4 class="scan-run-h4">Run log</h4>
        <table class="scan-table scan-run-table"><thead><tr>${th("date", "Date")}${th("character", "Character")}${th("raid", "Raid")}<th class="num">Duration</th><th class="num">Items</th><th class="num">Gold</th>${th("value", "Total", "num")}<th></th></tr></thead><tbody>${rows}</tbody></table></section>`;
    }

    // Resolve a review row: relabel its already-stored listings onto `target` and (when `target`
    // is a known item) remember the alias so this exact garble auto-resolves on future scans.
    function resolveReview(id, target) {
      const it = scanReview.find((r) => r.id === id);
      if (!it) return;
      target = String(target || "").trim();
      if (target) {
        const canon = isKnownName(target) ? scanCanonRaw(target) : target; // snap casing to the real item
        scanStore.relabel(it.name, canon);
        if (isKnownName(canon) && canon.toLowerCase() !== it.name.toLowerCase()) {
          scanAliases[it.name.toLowerCase()] = canon;
          persistScanAliases();
        }
      }
      const i = scanReview.indexOf(it); if (i >= 0) scanReview.splice(i, 1);
      renderScanner();
    }

    const scanProgress = (m) => {
      const el = scannerPanel.querySelector(".scan-status");
      if (el && m?.status) el.textContent = m.status === "loading models" ? "Loading OCR model (first scan)…" : "Scanning…";
    };

    async function scanFiles(blobs) {
      if (scanMode === "drops") return scanDropFiles(blobs);
      if (scanMode === "boxes") return scanBoxFiles(blobs);
      blobs = [...blobs].filter(Boolean);
      if (!blobs.length || scanBusy) return;
      scanBusy = true; ocrError = null; renderScanner();
      let scanImage;
      try { scanImage = await getScanImage(); }
      catch { ocrError = "Couldn't load the OCR engine."; scanBusy = false; renderScanner(); return; }
      for (const blob of blobs) {
        const fname = blob.name || "clipboard image";
        try {
          // Name resolution (canonicalize → alias → vocab-guarded repair) all runs inside scanImage
          // now, so entries carry final names and `review` holds the rows that still didn't match.
          const { entries, unpriced, review, height } = await scanImage(blob, {
            canonicalize: scanCanon,
            isKnown: isKnownName,
            repair: (n) => repairName(n, isKnownName, scanCanon),
            onProgress: (m) => {
              const el = scannerPanel.querySelector(".scan-status");
              if (el && m?.status) el.textContent = m.status === "loading models" ? "Loading OCR model (first scan)…" : "Scanning…";
            },
          });
          if (entries.length) scanStore.add(entries);
          // Unmatched rows → the review UI: crop the row strip and rank candidate matches so the
          // user can one-click the fix (which becomes a persisted alias). Dedupe by read name so a
          // repeated garble across shots isn't reviewed twice.
          for (const r of review) {
            if (scanReview.some((x) => x.name.toLowerCase() === r.name.toLowerCase())) continue;
            let cropUrl = null;
            try { if (r.y != null && height) cropUrl = await cropRowStrip(blob, r, height); } catch { /* crop is best-effort */ }
            scanReview.push({ id: ++scanReviewId, name: r.name, price: r.price, cropUrl, candidates: reviewCandidates(r.name, r.price) });
          }
          // Surface KNOWN rows whose price didn't parse, so no listing is lost silently.
          const surfaced = unpriced.filter(isKnownName);
          if (!entries.length && !review.length && !surfaced.length) scanSkips.push({ file: fname, reason: "No items extracted" });
          for (const name of surfaced) scanSkips.push({ file: fname, reason: `read "${name}" but couldn't read its price, add it manually` });
        } catch (err) {
          scanSkips.push({ file: fname, reason: String(err?.message || err) });
        }
      }
      scanBusy = false; renderScanner();
    }

    // Raid-drops OCR: chat-log screenshot → text lines → parseDrops (filtered to the player's
    // character) → accumulate into dropStore. Nothing to review (drop names aren't corrected, an
    // unpriced name just doesn't add to the run value).
    async function scanDropFiles(blobs) {
      blobs = [...blobs].filter(Boolean);
      if (!blobs.length || scanBusy) return;
      if (!charName.trim()) { ocrError = "Enter your character name first."; renderScanner(); return; }
      scanBusy = true; ocrError = null; renderScanner();
      let scanDropImage;
      try { scanDropImage = await getScanDropImage(); }
      catch { ocrError = "Couldn't load the OCR engine."; scanBusy = false; renderScanner(); return; }
      const matcher = makeActorMatcher(charName);
      let gifMod = null; // loaded lazily only if a GIF is in the batch
      scanDropDebug.length = 0; // trace only the most recent scan batch
      // Collect EVERY image's OCR'd lines into one ordered list of "frames", a screenshot
      // contributes one frame, a GIF contributes its decoded frames inline, then run the
      // scroll-overlap stitch (mergeGifFrameLines) across the WHOLE batch. This dedups the
      // overlap between consecutive shots of the same chat log (cross-shot double-counting,
      // SPEC §16.8), not just frames within a single GIF; unrelated shots share no overlap so
      // they simply append. parseDrops/resolve then run ONCE over the merged log.
      const perFrame = [];
      let anyDecoded = false;
      for (const blob of blobs) {
        const fname = blob.name || "clipboard image";
        try {
          if ((gifMod ||= await getGif()).isGif(blob)) {
            const frames = await gifMod.gifToFrames(blob, {
              onProgress: (p) => { const el = scannerPanel.querySelector(".scan-status"); if (el) el.textContent = `Decoding GIF, frame ${p.frame}…`; },
            });
            if (!frames.length) { scanSkips.push({ file: fname, reason: "Couldn't decode any GIF frames" }); continue; }
            for (let i = 0; i < frames.length; i++) {
              const label = `Scanning GIF, frame ${i + 1}/${frames.length}…`;
              const el = scannerPanel.querySelector(".scan-status"); if (el) el.textContent = label;
              const { lines: fl } = await scanDropImage(frames[i], {
                onProgress: (m) => { const e = scannerPanel.querySelector(".scan-status"); if (e) e.textContent = m?.status === "loading models" ? "Loading OCR model (first scan)…" : label; },
              });
              perFrame.push(fl);
            }
            anyDecoded = true;
          } else {
            const { lines: fl } = await scanDropImage(blob, { onProgress: scanProgress });
            perFrame.push(fl);
            anyDecoded = true;
          }
        } catch (err) {
          scanSkips.push({ file: fname, reason: String(err?.message || err) });
        }
      }
      if (anyDecoded) {
        // Re-join lines the game wrapped mid-message (a long line's core-source tag lands on the
        // next visual line) BEFORE parsing, per-line parsing would mis-read both halves.
        const lines = unwrapLines(mergeGifFrameLines(perFrame));
        // Trace each raw line's fate so a missing drop can be diagnosed (OCR vs parse vs filter).
        for (const line of lines) {
          const p = parseDropLine(line);
          const mine = p && (p.self || (p.actor && matcher(p.actor)));
          const kind = !p ? "skip"
            : p.kind === "gold" ? (mine ? "gold" : "skip")
            : mine ? "mine"
            : partyTrack ? "party" : "foreign";
          scanDropDebug.push({ line, kind });
        }
        const parsed = parseDrops(lines, matcher, { party: partyTrack });
        // Resolve each drop name to a canonical item (raid-scoped first, then global) so the
        // stored tally + price lookup use real item names, not the raw OCR read. Junk drops
        // (per the user's filter) skip canonicalization so they can't fuzzy-match a priced item.
        const resolve = (d) => ({ name: isJunk(d.name, scanJunk) ? d.name : resolveDropName(d.name), qty: d.qty, source: d.source });
        parsed.drops = parsed.drops.map(resolve);
        for (const m of parsed.party || []) m.drops = m.drops.map(resolve);
        dropAdd(parsed);
        if (!parsed.drops.length && !parsed.gold && !(parsed.party || []).length) scanSkips.push({ file: blobs.length > 1 ? `${blobs.length} images` : (blobs[0]?.name || "image"), reason: "No drops matched your character name" });
      }
      scanBusy = false; renderScanner();
    }

    // Box-opening OCR (SPEC §16.12): chat-log screenshots/GIF → text lines → parseBoxOpenings →
    // pending openings for review. Same batch pipeline as the drops scan (frame stitch across
    // shots + wrapped-line re-join), but no character filter, "You used/obtained" is self-only.
    async function scanBoxFiles(blobs) {
      blobs = [...blobs].filter(Boolean);
      if (!blobs.length || scanBusy) return;
      scanBusy = true; ocrError = null; renderScanner();
      let scanDropImage;
      try { scanDropImage = await getScanDropImage(); }
      catch { ocrError = "Couldn't load the OCR engine."; scanBusy = false; renderScanner(); return; }
      let gifMod = null;
      scanBoxDebug.length = 0;
      const perFrame = [];
      let anyDecoded = false;
      for (const blob of blobs) {
        const fname = blob.name || "clipboard image";
        try {
          if ((gifMod ||= await getGif()).isGif(blob)) {
            const frames = await gifMod.gifToFrames(blob, {
              onProgress: (p) => { const el = scannerPanel.querySelector(".scan-status"); if (el) el.textContent = `Decoding GIF, frame ${p.frame}…`; },
            });
            if (!frames.length) { scanSkips.push({ file: fname, reason: "Couldn't decode any GIF frames" }); continue; }
            for (let i = 0; i < frames.length; i++) {
              const label = `Scanning GIF, frame ${i + 1}/${frames.length}…`;
              const el = scannerPanel.querySelector(".scan-status"); if (el) el.textContent = label;
              const { lines: fl } = await scanDropImage(frames[i], {
                onProgress: (m) => { const e = scannerPanel.querySelector(".scan-status"); if (e) e.textContent = m?.status === "loading models" ? "Loading OCR model (first scan)…" : label; },
              });
              perFrame.push(fl);
            }
            anyDecoded = true;
          } else {
            const { lines: fl } = await scanDropImage(blob, { onProgress: scanProgress });
            perFrame.push(fl);
            anyDecoded = true;
          }
        } catch (err) {
          scanSkips.push({ file: fname, reason: String(err?.message || err) });
        }
      }
      if (anyDecoded) {
        const lines = unwrapLines(mergeGifFrameLines(perFrame));
        for (const line of lines) { const p = parseBoxLine(line); scanBoxDebug.push({ line, kind: p ? p.kind : "skip" }); }
        const { openings, orphans } = parseBoxOpenings(lines);
        // Resolve names against the vocabulary (aliases + previously logged boxes/payouts) so
        // the stored log holds clean names; the Gold pseudo-item passes through untouched.
        for (const o of openings) boxPending.push({
          box: scanCanon(o.box),
          items: o.items.map((it) => ({ name: it.name === "Gold" ? "Gold" : resolveDropName(it.name), qty: it.qty })),
        });
        const src = blobs.length > 1 ? `${blobs.length} images` : (blobs[0]?.name || "image");
        if (orphans.length) scanSkips.push({ file: src, reason: `${orphans.length} obtained line${orphans.length !== 1 ? "s" : ""} had no preceding "You used" line (cropped screenshot?). Not counted` });
        if (!openings.length && !orphans.length) scanSkips.push({ file: src, reason: "No box openings found in the chat log" });
      }
      scanBusy = false; renderScanner();
    }

    function downloadScanCSV() {
      const blob = new Blob([scanStore.toCSV()], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `auction_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click(); URL.revokeObjectURL(url);
    }

    // Rename a scanned drop the OCR misread (usually an unpriced row). Writes a persistent name
    // alias. The same store the Marketplace review flow uses. So every FUTURE scan auto-fixes
    // this garble, and relabels the CURRENT tally (self + party buckets, merging quantities).
    // Saved runs are untouched: the log stays a frozen record (SPEC §16.8).
    function renameDrop(from) {
      const to = (prompt(`Rename "${from}" to:`, from) || "").trim();
      if (!to || to.toLowerCase() === from.toLowerCase()) return;
      const canon = scanCanonRaw && isKnownName(to) ? scanCanonRaw(to) : to; // snap casing to the real item when known
      scanAliases[from.toLowerCase()] = canon;
      persistScanAliases();
      const relabel = (map) => {
        for (const [key, qty] of [...map]) {
          const { name, source } = parseDropKey(key);
          if (name.toLowerCase() !== from.toLowerCase()) continue;
          map.delete(key);
          const nk = dropKey(canon, source);
          map.set(nk, (map.get(nk) || 0) + qty);
        }
      };
      relabel(dropStore.items);
      for (const bucket of dropStore.party.values()) relabel(bucket);
      renderScanner();
    }

    // Remove one tracked party member (and their drops) from the current run, a stray
    // OCR-invented actor that the clustering couldn't fold. Session-only, like the rest of the
    // scratchpad; save/update the run afterwards to make it stick. SPEC §16.11.
    function removePartyActor(actor) {
      dropStore.party.delete(actor);
      renderScanner();
    }
    // Rename a tracked party member, fix an OCR misread of their name. The prompt lists the
    // run's OTHER players so the right spelling is one copy-paste away; renaming onto a listed
    // player MERGES the two buckets (the usual case: one player split into two spellings the
    // frequency-based clustering kept apart). Session-only, like removePartyActor.
    function renamePartyActor(from) {
      const others = [...dropStore.party.keys()].filter((a) => a !== from);
      const msg = `Rename "${from}" to:${others.length ? `\n\nOther players in this run:\n${others.join("\n")}` : ""}`;
      const to = (prompt(msg, from) || "").trim();
      if (!to || to === from) return;
      const bucket = dropStore.party.get(from);
      if (!bucket) return;
      dropStore.party.delete(from);
      const existing = [...dropStore.party.keys()].find((a) => a.toLowerCase() === to.toLowerCase());
      const target = existing ? dropStore.party.get(existing) : new Map();
      for (const [k, q] of bucket) target.set(k, (target.get(k) || 0) + q);
      dropStore.party.set(existing || to, target);
      renderScanner();
    }

    // True when the drops scratchpad holds something worth saving (drops, gold, or a recorded time).
    // A timed-but-empty run is allowed so you can time a run live now and add screenshots later.
    function canSaveRun() { return charName.trim() && (dropStore.items.size || dropStore.party.size || dropStore.gold || runElapsed() > 0 || editingRunId); }

    // Snapshot the current scratchpad as a run. If editing an existing run, UPDATE it in place
    // (keeping its id + original date); otherwise push a new one. Then clear the log + timer.
    function saveRun() {
      if (!canSaveRun()) return;
      timerPause();
      const editing = editingRunId ? runs.find((r) => r.id === editingRunId) : null;
      const rec = makeRunRecord({
        items: [...dropStore.items.entries()].map(([k, qty]) => { const { name, source } = parseDropKey(k); return [name, qty, source]; }).filter(([n]) => !isJunk(n, scanJunk)),
        party: [...dropStore.party.entries()].map(([actor, bucket]) => ({
          actor,
          items: [...bucket.entries()].map(([k, qty]) => { const { name, source } = parseDropKey(k); return [name, qty, source]; }).filter(([n]) => !isJunk(n, scanJunk)),
        })),
        gold: dropStore.gold, prices,
        character: charName, raid: selectedRaid, mode: currentRaidModes().locked || runModeSel, coreBoost: coreBoosted() && raidCoreGold(selectedRaid) > 0, maxLevel: isMaxLevel(charName), luck: charLuck(charName),
        durationSec: runTimer.elapsedSec || null,
        id: editing?.id, savedAt: editing?.savedAt,
      });
      if (editing) runs[runs.indexOf(editing)] = rec; else runs.push(rec);
      if (editing) restoreRunPrefs(); // an edit loaded the OLD run's raid/mode/boost, put your sticky setup back
      editingRunId = null;            // raid/mode/core-boost otherwise stay as set (sticky, SPEC §16.8)
      dropClear(); timerReset();
      if (editing) scanMode = "history"; // updating a run returns to the Runs list, not the edit screen
      applyRuns();
    }
    // Put the sticky run options back after an edit temporarily loaded another run's setup.
    function restoreRunPrefs() {
      setSelectedRaid(runPrefs.raid && dRaidMeta[runPrefs.raid] ? runPrefs.raid : "");
      if (currentRaidModes().options.includes(runPrefs.mode)) runModeSel = runPrefs.mode;
      runCoreBoost = !!runPrefs.coreBoost;
    }

    // Load a saved run back into the drops scratchpad for editing (change time, redo drops, etc.).
    // Switches to the drops subtab; Save then becomes "Update run".
    function editRun(id) {
      const r = runs.find((x) => x.id === id);
      if (!r) return;
      editingRunId = id;
      dropStore.items = new Map((r.drops || []).map((d) => [dropKey(d.name, d.source), d.qty]));
      dropStore.party = new Map((r.party || []).map((m) => [m.actor, new Map((m.drops || []).map((d) => [dropKey(d.name, d.source), d.qty]))]));
      dropStore.gold = r.gold || 0; dropStore.foreign.clear(); scanDropDebug.length = 0;
      charName = r.character || charName; persistCharName();
      setSelectedRaid(r.raid || "");                 // re-defaults runModeSel…
      runModeSel = currentRaidModes().locked || r.mode || "Normal"; // …then restore the run's mode
      runCoreBoost = !!r.coreBoost;                     // restore the saved flag explicitly (an edit overrides the inference)
      timerReset(); runTimer.elapsedSec = r.durationSec || 0;
      scanMode = "drops"; scanSkips.length = 0; ocrError = null;
      renderScanner();
      window.scrollTo({ top: 0 }); // the Run log lives far down the page, land on the edit setup, not mid-scroll
    }
    function cancelEdit() {
      editingRunId = null; restoreRunPrefs();
      dropClear(); timerReset();
      scanMode = "history"; // cancelling an edit returns to the Runs list it was opened from
      renderScanner();
    }

    function downloadRunsTSV() {
      const blob = new Blob([runsToTSV(runs.map(withBaseGold))], { type: "text/tab-separated-values" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `raid_runs_${new Date().toISOString().slice(0, 10)}.tsv`;
      a.click(); URL.revokeObjectURL(url);
    }

    scannerPanel.addEventListener("click", (e) => {
      const mode = e.target.closest("button[data-scanmode]");
      if (mode) { scanMode = mode.dataset.scanmode; ocrError = null; renderScanner(); return; }
      const sortTh = e.target.closest("[data-dropsort]");
      if (sortTh) { dropSort = sortTh.dataset.dropsort; renderScanner(); return; }
      const timerBtn = e.target.closest("[data-timer]");
      if (timerBtn) {
        const t = timerBtn.dataset.timer;
        if (t === "toggle") { runTimer.startedAt ? timerPause() : timerStart(); timerEditing = false; }
        else if (t === "reset") { timerReset(); timerEditing = false; }
        renderScanner(); return;
      }
      // Click the paused readout to type a time in place (Enter applies, Esc cancels).
      if (e.target.id === "runTimerReadout" && !runTimer.startedAt) {
        timerEditing = true; renderScanner();
        const inp = document.getElementById("runTimeEdit"); if (inp) { inp.focus(); inp.select(); }
        return;
      }
      const modeBtn = e.target.closest("[data-runmode]");
      if (modeBtn) { runModeSel = modeBtn.dataset.runmode; rememberRunPrefs(); renderScanner(); return; }
      const junkAdd = e.target.closest("[data-junk-add]");
      if (junkAdd) { addJunk(junkAdd.dataset.junkAdd); return; }
      const dropRename = e.target.closest("[data-drop-rename]");
      if (dropRename) { renameDrop(dropRename.dataset.dropRename); return; }
      const partyRename = e.target.closest("[data-party-rename]");
      if (partyRename) { renamePartyActor(partyRename.dataset.partyRename); return; }
      const partyDel = e.target.closest("[data-party-del]");
      if (partyDel) { removePartyActor(partyDel.dataset.partyDel); return; }
      const junkRestore = e.target.closest("[data-junk-restore]");
      if (junkRestore) { unhideDrop(junkRestore.dataset.junkRestore); return; }
      const junkDel = e.target.closest("[data-junk-del]");
      if (junkDel) { removeJunk(junkDel.dataset.junkDel); return; }
      const runSortTh = e.target.closest("[data-runsort]");
      if (runSortTh) { runSort = runSortTh.dataset.runsort; renderScanner(); return; }
      const byRaidTh = e.target.closest("[data-byraidsort]");
      if (byRaidTh) { byRaidSort = byRaidTh.dataset.byraidsort; renderScanner(); return; }
      const dataView = e.target.closest("[data-dataview]");
      if (dataView) { dropDataView = dataView.dataset.dataview; renderScanner(); return; }
      // Sticky Core-buffs expander: record the state this click is about to produce (SPEC §16.8).
      const buffSummary = e.target.closest(".scan-buff-panel > summary");
      if (buffSummary) { runPrefs.buffOpen = !buffSummary.parentElement.open; persistRunPrefs(); return; } // no re-render, the <details> toggles natively
      const raidToggle = e.target.closest("[data-raid-toggle]");
      if (raidToggle) { const k = raidToggle.dataset.raidToggle; if (raidExpanded.has(k)) raidExpanded.delete(k); else raidExpanded.add(k); renderScanner(); return; }
      const runDel = e.target.closest("[data-run-del]");
      if (runDel) { const i = runs.findIndex((r) => r.id === runDel.dataset.runDel); if (i >= 0) { runExpanded.delete(runs[i].id); runs.splice(i, 1); applyRuns(); } return; }
      const runEdit = e.target.closest("[data-run-edit]");
      if (runEdit) { editRun(runEdit.dataset.runEdit); return; }
      const runToggle = e.target.closest("[data-run-toggle]");
      if (runToggle) { const id = runToggle.dataset.runToggle; runExpanded.has(id) ? runExpanded.delete(id) : runExpanded.add(id); renderScanner(); return; }
      // Boxes subtab (SPEC §16.12)
      const boxRename = e.target.closest("[data-box-rename]");
      if (boxRename) { renameBoxName(boxRename.dataset.boxRename); return; }
      const boxToggle = e.target.closest("[data-box-toggle]");
      if (boxToggle) { const k = boxToggle.dataset.boxToggle; boxExpanded.has(k) ? boxExpanded.delete(k) : boxExpanded.add(k); renderScanner(); return; }
      const boxPendDel = e.target.closest("[data-boxpend-del]");
      if (boxPendDel) { boxPending.splice(+boxPendDel.dataset.boxpendDel, 1); renderScanner(); return; }
      const boxLogDel = e.target.closest("[data-boxlog-del]");
      if (boxLogDel) { const i = boxLog.findIndex((r) => r.id === +boxLogDel.dataset.boxlogDel); if (i >= 0) { boxLog.splice(i, 1); persistBoxLog(); refreshBoxPrices(); renderScanner(); } return; }
      const btn = e.target.closest("button[data-scan]");
      if (btn) {
        const act = btn.dataset.scan;
        if (act === "copy") { navigator.clipboard.writeText(scanStore.toTSV()); btn.textContent = "Copied!"; setTimeout(() => { if (active === SCANNER_TAB) renderScanner(); }, 1200); }
        else if (act === "csv") downloadScanCSV();
        else if (act === "clear") { scanStore.clear(); scanSkips.length = 0; scanReview.length = 0; renderScanner(); }
        else if (act === "dropclear") { dropClear(); scanSkips.length = 0; renderScanner(); }
        else if (act === "junk-add-btn") { const inp = document.getElementById("junkAdd"); if (inp) addJunk(inp.value); }
        else if (act === "junk-clear") { if (scanJunk.length && confirm(`Clear all ${scanJunk.length} junk pattern${scanJunk.length !== 1 ? "s" : ""}?`)) { scanJunk.length = 0; persistScanJunk(); renderScanner(); } }
        else if (act === "runrename") renameCharacter();
        else if (act === "runsave") saveRun();
        else if (act === "runcancel") cancelEdit();
        else if (act === "runexport") downloadRunsTSV();
        else if (act === "runcopy") { navigator.clipboard.writeText(runsToTSV(runs.map(withBaseGold))); btn.textContent = "Copied!"; setTimeout(() => { if (active === SCANNER_TAB) renderScanner(); }, 1200); }
        else if (act === "runclear") { if (runs.length && confirm(`Delete all ${runs.length} saved run${runs.length !== 1 ? "s" : ""}? This can't be undone.`)) { runs.length = 0; runExpanded.clear(); applyRuns(); } }
        else if (act === "alias-copy") { // export-to-code: promote confirmed aliases into SCAN_OVERRIDES-style lines
          const txt = Object.entries(scanAliases).map(([r, c]) => `  [${JSON.stringify(r)}, ${JSON.stringify(c)}],`).join("\n");
          navigator.clipboard.writeText(txt); btn.textContent = "Copied!"; setTimeout(() => { if (active === SCANNER_TAB) renderScanner(); }, 1200);
        }
        else if (act === "alias-clear") { scanAliases = {}; persistScanAliases(); renderScanner(); }
        else if (act === "boxadd") commitBoxPending();
        else if (act === "boxpendclear") { boxPending.length = 0; scanSkips.length = 0; scanBoxDebug.length = 0; renderScanner(); }
        else if (act === "boxlogclear") { if (boxLog.length && confirm(`Delete all ${boxLog.length} logged opening${boxLog.length !== 1 ? "s" : ""}? This can't be undone.`)) { boxLog.length = 0; boxExpanded.clear(); persistBoxLog(); refreshBoxPrices(); renderScanner(); } }
        return;
      }
      // Review-card actions
      const pick = e.target.closest("[data-review-pick]");
      if (pick) { resolveReview(+pick.dataset.reviewPick, pick.dataset.name); return; }
      const ract = e.target.closest("[data-review-act]");
      if (ract) {
        const act = ract.dataset.reviewAct;
        if (act === "allnew") { scanReview.length = 0; renderScanner(); }       // keep every unmatched row as a new item
        else if (act === "new") { const it = scanReview.find((r) => r.id === +ract.dataset.review); if (it) { scanReview.splice(scanReview.indexOf(it), 1); renderScanner(); } }
        else if (act === "discard") { const it = scanReview.find((r) => r.id === +ract.dataset.review); if (it) { scanStore.remove(it.name); scanReview.splice(scanReview.indexOf(it), 1); renderScanner(); } }
        return;
      }
      const ax = e.target.closest("[data-alias-remove]");
      if (ax) { delete scanAliases[ax.dataset.aliasRemove]; persistScanAliases(); renderScanner(); return; }
      if (e.target.closest("#scanDrop")) document.getElementById("scanFiles")?.click();
    });
    // Commit a typed correction in a review card (Enter).
    scannerPanel.addEventListener("keydown", (e) => {
      const inp = e.target.closest("[data-review-input]");
      if (inp && e.key === "Enter") { e.preventDefault(); const v = inp.value.trim(); if (v) resolveReview(+inp.dataset.reviewInput, v); }
    });
    // Run-name field: track keystrokes live without re-rendering (keeps focus); it's committed on save.
    scannerPanel.addEventListener("input", (e) => {
    });
    scannerPanel.addEventListener("change", (e) => {
      if (e.target.id === "scanFiles") { scanFiles(e.target.files); e.target.value = ""; }
      else if (e.target.id === "scanCharName") {
        let v = e.target.value;
        if (v === "__new__") { v = (prompt("New character name:", "") || "").trim(); if (!v) { renderScanner(); return; } }
        charName = v; persistCharName(); ocrError = null;
        if (!editingRunId) runCoreBoost = false; // new context → reset the manual toggle
        renderScanner();
      }
      else if (e.target.id === "scanRaid") { setSelectedRaid(e.target.value); rememberRunPrefs(); renderScanner(); } // core boost stays as set, sticky, SPEC §16.8
      else if (e.target.id === "scanCoreBoost") { runCoreBoost = e.target.checked; rememberRunPrefs(); renderScanner(); } // manual override of the auto-infer; sticky
      else if (e.target.id === "scanPartyTrack") { partyTrack = e.target.checked; persistPartyTrack(); renderScanner(); } // global pref; applies to the NEXT scan
      else if (e.target.id === "scanMaxLevel") { setMaxLevel(charName, e.target.checked); renderScanner(); } // per-character setting
      else if (e.target.id === "scanLuck") { setCharLuck(charName, e.target.value); renderScanner(); } // per-character sticky luck stat
      else if (e.target.id === "runFilterChar") { runFilterChar = e.target.value; renderScanner(); }
      else if (e.target.id === "runTimeEdit") { const secs = parseTimeInput(e.target.value); if (secs != null) { timerPause(); runTimer.elapsedSec = secs; } timerEditing = false; renderScanner(); }
    });
    // Manual prep-goal checkboxes (Redeemers, Ein Lacher, …): toggle done state, fold/unfold the
    // stat reward into currentStats, persist both, and re-derive everything (sidebar totals, ranked
    // list, Target tab "current"). A no-op if the box is already in the target state.
    checklistPanel.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-goal-plan]"); if (!btn) return;
      const n = addStepsToPlan([newGoalStep(btn.dataset.goalPlan)]);
      btn.textContent = n ? "Added ✓" : "Already in plan";
      setTimeout(() => { btn.textContent = "Add to plan"; }, 1500);
    });
    checklistPanel.addEventListener("change", (e) => {
      const id = e.target.closest(".chk-goal")?.dataset.goal;
      if (!id) return;
      const has = checklistDone.has(id);
      if (e.target.checked && !has) { checklistDone.add(id); applyGoalStats(id, +1); }
      else if (!e.target.checked && has) { checklistDone.delete(id); applyGoalStats(id, -1); }
      else return;
      persistChecklist();
      persistStats();
      recomputeLoadout();      // re-derive ranked list + Target tab off the new totals
      renderChecklist();
      renderSidebar();         // reflect the new stat totals in the sidebar
    });
    scannerPanel.addEventListener("keydown", (e) => {
      if (e.target.id === "runTimeEdit" && e.key === "Enter") { e.preventDefault(); const secs = parseTimeInput(e.target.value); if (secs != null) { timerPause(); runTimer.elapsedSec = secs; } timerEditing = false; renderScanner(); }
      else if (e.target.id === "runTimeEdit" && e.key === "Escape") { e.preventDefault(); timerEditing = false; renderScanner(); }
      else if (e.target.id === "junkAdd" && e.key === "Enter") { e.preventDefault(); addJunk(e.target.value); }
    });
    scannerPanel.addEventListener("dragover", (e) => { if (e.target.closest("#scanDrop")) e.preventDefault(); });
    scannerPanel.addEventListener("drop", (e) => {
      if (!e.target.closest("#scanDrop")) return;
      e.preventDefault();
      const files = [...(e.dataTransfer?.files || [])].filter((f) => f.type.startsWith("image/"));
      if (files.length) scanFiles(files);
    });
    // Ctrl+V anywhere on the Scanner tab pastes a clipboard screenshot. Files copied from the
    // OS (e.g. a ShareX .gif. Windows has no animated-image clipboard format, so the GIF only
    // arrives as a FILE) can land in clipboardData.files without a matching image item; check
    // both and dedupe.
    document.addEventListener("paste", (e) => {
      if (active !== SCANNER_TAB) return;
      const imgs = [...(e.clipboardData?.items || [])].filter((it) => it.type.startsWith("image/")).map((it) => it.getAsFile()).filter(Boolean);
      for (const f of e.clipboardData?.files || []) {
        if (f.type.startsWith("image/") && !imgs.some((i) => i.name === f.name && i.size === f.size)) imgs.push(f);
      }
      if (imgs.length) { e.preventDefault(); scanFiles(imgs); }
    });

    // Apply one numeric field's value (grouping commas stripped) to the goal it keys on.
    function applyNumField(t) {
      const val = parseNum(t.value);
      if (t.dataset.cur != null) { thCurrent[t.dataset.cur] = val ?? 0; persistStats(); renderSidebar(); }
      else if (t.dataset.tgt != null) { if (val == null) delete thTarget[t.dataset.tgt]; else thTarget[t.dataset.tgt] = val; }
      recomputeThreshold();
    }
    thresholdPanel.addEventListener("input", (e) => {
      const t = e.target; if (t.tagName !== "INPUT") return;
      if (t.dataset.max != null) {
        const k = t.dataset.max;
        if (t.checked) {
          if (k === "points") thMaximize.clear();   // points = overall value, exclusive of stats
          else thMaximize.delete("points");          // a specific stat → drop the points goal
          thMaximize.add(k);
        } else thMaximize.delete(k);
        renderThresholdForm();                        // reflect exclusivity in the checkboxes
        recomputeThreshold(); return;
      }
      if (t.classList.contains("numedit")) applyNumField(t); // raw while typing; reformatted on blur
    });
    // Reformat a numeric field with grouping commas once the user leaves it.
    thresholdPanel.addEventListener("focusout", (e) => {
      const inp = e.target.closest(".numedit"); if (!inp) return;
      const v = parseNum(inp.value); inp.value = v == null ? "" : fmt(v);
    });
    thresholdPanel.addEventListener("click", (e) => {
      const planB = e.target.closest("[data-th-plan]");
      if (planB) {
        // Raw unmerged bundle → atomic steps (onItem from each move's current slot base).
        const steps = (thResult.chosen || []).flatMap((m) => moveToSteps(m, moveCtx, loadout[m.slot]?.base ?? null));
        const n = addStepsToPlan(steps);
        planB.textContent = n ? `Added ${n} step${n !== 1 ? "s" : ""} ✓` : "Already in plan";
        setTimeout(() => { if (active === THRESHOLD_TAB) updateThresholdSummary(); }, 1500);
        return;
      }
      const stepBtn = e.target.closest(".numstep"); // sidebar-style −/+ nudge
      if (stepBtn) {
        const inp = stepBtn.parentElement.querySelector(".numedit"); if (!inp) return;
        const next = Math.max(0, (parseNum(inp.value) ?? 0) + Number(stepBtn.dataset.step));
        inp.value = fmt(next);
        applyNumField(inp);
        return;
      }
      const b = e.target.closest(".modeToggle button"); if (!b) return;
      if (b.dataset.aim != null) { thRaidAim = b.dataset.aim; } // raid QB/Caps sub-toggle
      else thMode = b.dataset.mode;
      // Rebuild the bundle FIRST (refreshes thResult for the NEW mode), then re-render the
      // form. Order matters: renderThresholdForm() calls updateThresholdSummary(), which reads
      // thResult, rendering the form before the recompute reads the PREVIOUS mode's result
      // (e.g. a maximize-points thResult has no `remaining` map and a "points" pseudo-need),
      // which threw and aborted the switch, freezing the table on the old bundle.
      recomputeThreshold(true); // refreshForm → renders the (structurally different) form last
    });
    thresholdPanel.addEventListener("change", (e) => {
      const sel = e.target.closest("select[data-raid]"); if (!sel) return;
      thRaid = sel.value;
      renderThresholdForm(); // refresh the read-only target table for the new raid
      recomputeThreshold();
    });
    renderThresholdForm();

    // Header badge shows data freshness: the newest price date in the snapshot.
    // Data is snapshot-only; the Sheet pushes edits into the repo automatically
    // (debounced Apps Script trigger + weekly cron backstop), so "how fresh" is
    // simply the latest scan date the pricing tab carries.
    function renderStatus() {
      let latest = null;
      for (const p of Object.values(prices)) if (p.date && (!latest || p.date > latest)) latest = p.date;
      const label = latest
        ? new Date(latest + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" })
        : null;
      document.getElementById("status").innerHTML = label
        ? `<span class="badge live" title="Newest marketplace scan in the data: ${latest}. Snapshots push automatically from the Sheet.">DATA ${label.toUpperCase()}</span>`
        : `<span class="badge fallback" title="No dated price rows in the snapshot">NO DATA</span>`;
    }
    // Header version button → changelog modal (js/changelog.js is the single source of truth).
    document.getElementById("verBtn").textContent = "v" + VERSION;
    function openChangelog() {
      const back = document.createElement("div");
      back.className = "modal-back";
      back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="Changelog">
        <div class="mhead"><h2>What's new</h2><button type="button" class="mclose" title="Close">&times;</button></div>
        <div class="mbody">${CHANGELOG.map((r, i) => {
          // Newest release opens expanded; older ones collapse to a one-line header so the
          // modal stays scannable once there are many of them.
          const n = (r.changes || []).length;
          return `<details class="chg-rel"${i === 0 ? " open" : ""}>
          <summary><span class="chg-ver">v${escTxt(r.version)}</span><span class="chg-date">${escTxt(r.date || "")}</span>${r.notes ? `<span class="chg-title">${escTxt(r.notes)}</span>` : ""}<span class="chg-count">${n} change${n === 1 ? "" : "s"}</span></summary>
          <ul>${(r.changes || []).map((c) => `<li>${escTxt(c)}</li>`).join("")}</ul>
        </details>`;
        }).join("")}</div></div>`;
      const close = () => { back.remove(); document.removeEventListener("keydown", onKey); };
      const onKey = (e) => { if (e.key === "Escape") close(); };
      back.addEventListener("click", (e) => { if (e.target === back || e.target.closest(".mclose")) close(); });
      document.addEventListener("keydown", onKey);
      document.body.appendChild(back);
    }
    document.getElementById("verBtn").addEventListener("click", openChangelog);

    // Pre-apply explainer for a gear preset (GEAR_PRESETS `blurb`, SPEC §9.1): what it
    // does + what's left to enter by hand, with Apply / Cancel. Same chrome as the
    // changelog modal; × / backdrop / Escape / Cancel all dismiss WITHOUT applying.
    function openPresetInfo(preset, onApply) {
      const b = preset.blurb || {};
      const back = document.createElement("div");
      back.className = "modal-back";
      back.innerHTML = `<div class="modal preset-modal" role="dialog" aria-modal="true" aria-label="About this preset">
        <div class="mhead"><h2>${escTxt(preset.name)}</h2><button type="button" class="mclose" title="Close">&times;</button></div>
        <div class="mbody">
          ${b.goal ? `<h3 class="preset-sec">What this does</h3><p class="preset-goal">${escTxt(b.goal)}</p>` : ""}
          ${(b.steps || []).length ? `<h3 class="preset-sec">What to do next</h3><ul>${b.steps.map((s) => `<li>${escTxt(s)}</li>`).join("")}</ul>` : ""}
          <div class="preset-acts">
            <button type="button" class="preset-cancel">Cancel</button>
            <button type="button" class="preset-apply">Apply preset</button>
          </div>
        </div></div>`;
      const close = () => { back.remove(); document.removeEventListener("keydown", onKey); };
      const onKey = (e) => { if (e.key === "Escape") close(); };
      back.addEventListener("click", (e) => {
        if (e.target.closest(".preset-apply")) { close(); onApply?.(); return; }
        if (e.target === back || e.target.closest(".mclose") || e.target.closest(".preset-cancel")) close();
      });
      document.addEventListener("keydown", onKey);
      document.body.appendChild(back);
      back.querySelector(".preset-apply").focus();
    }

    renderStatus();
    renderTabs();
    renderTable();
    renderVetoPanel(); // seed the header count from any persisted vetoes
    document.getElementById("bootLoading").remove(); // data loaded + first render done, drop the spinner
    document.body.classList.remove("booting"); // reveal the tabs, controls, table, and sidebar
  </script>
</body>
</html>
