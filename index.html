    const TYPE_LABEL = { enchantSwap: "enchant", baseSwap: "base", enhanceStep: "enhance", tierStep: "advance", tuneStep: "tune", gearEnhance: "enhance" };
    const surplusRoman = (u) => (u === 1 ? "I" : "II");
    // The in-game "ATT Surplus I/II" tuning stat IS Destruction (SPEC §2/§12). Show it as
    // "Dest I/II" everywhere; base stats (DEF/BAL/…) keep their own label.
    const tuneStatDisplay = (stat) => ({ "ATT Surplus I": "Dest I", "ATT Surplus II": "Dest II" }[stat] || stat);
    // Post-item hover text for the tune ⚙ badge. The capstone tip is CONDITIONAL, it only
    // claims to max prerequisites when lower tunes are actually being maxed (the breakdown
    // carries prereq-flagged rows). Otherwise it just states the unlock (bug fix: the old
    // label said "maxes prerequisites" even when there was nothing left to max).
    const tuneTip = (m) => {
      if (!m.capstone) return `Tunes ${tuneStatDisplay(m.stat)} to its cap.`;
      const pre = (m.breakdown || []).filter((b) => b.prereq).map((b) => tuneStatDisplay(b.stat));
      return pre.length
        ? `Unlocks Dest ${surplusRoman(m.capstone)}. Also maxes the lower-tier tuning first: ${pre.join(", ")}.`
        : `Tunes Dest ${surplusRoman(m.capstone)} to its cap.`;
    };
    // Post-item descriptions are compact glyph badges with the full text in the hover tooltip
    // (SPEC §7.3): ⚙ tune (cap / maxes-prereqs), ↻ re-enhance, ⚠ enchants wiped on advance, plus
    // a muted ×N tier count. Pre-item verb + target and the enhance-level parentheticals stay text.
    const moveLabel = (m, rebasedSlots) =>
      (m.type === "enchantSwap" ? `${m.from ? `swap ${m.affix}` : `add ${m.affix}`} → <b>${m.to}</b>`
      : m.type === "baseSwap" ? `${m.from ? "swap base" : "acquire"} → <b>${m.to}</b>${m.toLevel ? hintChip("↻", "hint-reenh", `The new base must be re-enhanced up to +${m.toLevel}.`) : ""}`
      : m.type === "tierStep" ? `advance → <b>${m.to}</b> <span class="muted tiercount" data-tip="${esc(`${m.steps} tier advance${m.steps > 1 ? "s" : ""}.`)}">×${m.steps}</span>${m.wipe && !m.wipePreserved ? hintChip("⚠", "hint-wipe", "Advancing across a system boundary wipes this item's enchants. You'll need to re-enchant.") : ""}`
      : m.type === "tuneStep" ? `${m.capstone ? `tune → <b>Dest ${surplusRoman(m.capstone)}</b>` : `tune <b>${tuneStatDisplay(m.stat)}</b>`}${hintChip("⚙", "hint-tune", tuneTip(m))}`
      : m.type === "gearEnhance" ? `enhance → <b>${m.to}</b> <span class="muted">(+${m.fromLevel}→+${m.toLevel})</span>`
      : `enhance <b>${m.from} → ${m.to}</b>`) + rebaseBadge(m, rebasedSlots) + betterHint(m);

    // Free-text the search bar matches against (the move's plain-text label + type word +
    // slot + affix), so a user can filter by what they SEE, "advance", "swap suffix",
    // "enchant weapon", not just the internal moveKey (tierStep:weapon:base:…).
    const moveSearch = (m) => {
      // Include the badges' data-tip tooltip text so terms now living only in the hover
      // ("cap", "re-enhance", "re-enchant") still match the filter box after symbol-izing.
      const html = moveLabel(m);
      const tips = [...html.matchAll(/data-tip="([^"]*)"/g)].map((x) => x[1]);
      return [html.replace(/<[^>]+>/g, " "), ...tips, TYPE_LABEL[m.type], m.slot, m.affix]
        .filter(Boolean).join(" ").replace(/\s+/g, " ").toLowerCase();
    };

    // Inventory-credit row for a move's Math grid (SPEC §5.2): the gold saved by stock you own
    // (already subtracted from the total). ALWAYS rendered (shows "—" when nothing is owned) so
    // toggling a material's count doesn't add/remove a grid row and shift the recipe steppers
    // below it. The value stays SHORT and CONSTANT. Credit + an item COUNT. Regardless of how
    // many items are consumed: a long inline name list would either wrap to a 2nd line (shifting
    // the recipe) or, if forced nowrap, squeeze the label column. The full list is a hover tooltip;
    // the recipe below already itemizes each owned material via its stepper + colored line total.
    const invLine = (m) => {
      if (!(m.inventoryCredit > 0))
        return `<div class="k">From inventory</div><div class="v muted">—</div>`;
      const items = Object.entries(m.inventoryUsed || {});
      const list = items.map(([n, q]) => `${q}× ${n}`).join(", ") || "owned stock";
      const summary = items.length ? `${items.length} item${items.length > 1 ? "s" : ""}` : "owned stock";
      return `<div class="k">From inventory</div><div class="v gold" title="${esc(list)}">− ${fmt(m.inventoryCredit)} <span class="muted">(${summary})</span></div>`;
    };

    // "Craft" button for an opened move (SPEC §5.2 side goal): consume the owned materials this
    // move would draw from stock (exactly `m.inventoryUsed`, already capped at what you own, so
    // partial crafts are fine and a count never goes negative). A manual bookkeeping tool to clear
    // inventory as you actually do the upgrade in-game; it does NOT add the crafted output back
    // (a clear-stock helper, not a production sim). Shown only when there's owned stock to use.
    // The amounts are encoded on the button so the handler is independent of the (regenerated) move.
    const craftButton = (m) => {
      const used = Object.entries(m.inventoryUsed || {});
      if (!used.length) return "";
      const list = used.map(([n, q]) => `${q}× ${n}`).join(", ");
      return `<button class="craftbtn" type="button" data-craft="${esc(JSON.stringify(used))}" title="Subtract from your inventory: ${esc(list)}">⚒ Craft: use ${used.length} owned material${used.length > 1 ? "s" : ""}</button>`;
    };

    // Veto controls appended to every opened move (SPEC §7.4). Offers the scopes that apply to
    // THIS move so the user chooses granularity per-veto: the exact move, every move producing
    // the same target item/scroll, or every move of this type on this slot. Each button encodes
    // its rule (with a display label for the manage panel) so the delegated handler is independent
    // of the regenerated move. A vetoed move never renders, so these always ADD (un-veto is the
    // manage panel's job, no toggle here).
    const vetoFooter = (m) => {
      // Drop the appended rebase (⇄) / better (▲) hint symbols before plain-texting, so the manage
      // list shows just the move (those hints are advisory, not part of the move's identity).
      const plain = (s) => String(s).replace(/<span class="movehint[\s\S]*?<\/span>/g, "")
        .replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
      const moveRule = { kind: "move", key: moveKey(m), label: plain(moveLabel(m)) };
      const tname = TYPE_LABEL[m.type];
      const btn = (rule, text, title) =>
        `<button class="vetobtn" type="button" data-veto="${esc(JSON.stringify(rule))}" title="${esc(title)}">${esc(text)}</button>`;
      let html = btn(moveRule, "this move", "Hide this exact move everywhere: Upgrades, stat targets, and the Target solver.");
      if (m.to != null)
        html += btn({ kind: "target", to: m.to, label: `Any → ${m.to}` }, `any → ${m.to}`, `Hide every move that produces ${m.to}.`);
      html += btn({ kind: "slotType", slot: m.slot, type: m.type, label: `All ${tname} on ${m.slot}` },
        `all ${tname} on ${m.slot}`, `Hide every ${tname} move on the ${m.slot} slot.`);
      return `<div class="vetobar"><span class="veto-h">Veto</span>${html}</div>`;
    };

    // "Add to plan" footer beside the veto bar in every opened move (SPEC §17 entry point).
    // Carries the moveKey; the delegated handler resolves the LIVE move (moves change with
    // gear/prices) and funnels it through moveToSteps → the working Planner path.
    const planFooter = (m) =>
      `<div class="planbar"><button class="planbtn" type="button" data-plan-add="${esc(moveKey(m))}" ` +
      `title="Append this upgrade to your Planner path (as one or more atomic steps).">Add to plan</button></div>`;

    // Re-enchant WHAT-IF (issue 3)
    // A swapped base is BARE (enchants wiped), so keeping your current prefix/suffix means re-buying
    // those scrolls. The detail lets the user PRICE-CHECK that: ignore a scroll (you'll handle it
    // yourself), or re-enchant with a DIFFERENT scroll (changing both cost AND points). This is an
    // EPHEMERAL, in-memory overlay. NOT persisted, reset on reload, and never fed to the solver or
    // the ranked list, keyed by the move's row key then affix:
    //   reEnchantWhatIf.get(moveKey(m))[affix] = { ignore:true } | { scroll:"Other Scroll" }
    const reEnchantWhatIf = new Map();
    const mergeStatMaps = (a, b) => { const o = { ...a }; for (const k in b) { o[k] = (o[k] || 0) + b[k]; if (!o[k]) delete o[k]; } return o; };
    // Apply the what-if to a base-swap's kept-affix list → adjusted rows + deltas to fold into the
    // displayed gold/points/stats. `ignore` → gold 0, affix unchanged (no stat/point move, like
    // owning the scroll). `scroll:X` → re-buy X instead: gold = price(X), and the affix's stats shift
    // from the original scroll to X (so points + the stat-change line move with it).
    const reEnchantCalc = (m) => {
      const wf = reEnchantWhatIf.get(moveKey(m)) || {};
      let total = 0, dPoints = 0, dStats = {};
      const rows = (m.reEnchantItems || []).map((x) => {
        const ov = wf[x.affix] || {};
        const origStats = enchants[x.scroll]?.stats || {};
        if (ov.ignore) return { ...x, effScroll: x.scroll, gold: 0, ignored: true };
        if (ov.scroll && ov.scroll !== x.scroll) {
          const ne = enchants[ov.scroll];
          const g = ne ? (enchantCost(ne, prices)?.gold ?? 0) : 0;
          total += g;
          dStats = mergeStatMaps(dStats, statDelta(ne?.stats || {}, origStats));
          dPoints += score(ne?.stats || {}) - score(origStats);
          return { ...x, effScroll: ov.scroll, gold: g, changed: true };
        }
        total += x.gold;
        return { ...x, effScroll: x.scroll, gold: x.gold };
      });
      return { rows, total, dPoints, dStats, active: (m.reEnchantItems || []).some((x) => wf[x.affix]) };
    };
    // Long-form explanation lives in a "?" hover (issue 1), so the row stays terse but the two scrolls
    // still show. Each scroll line carries an "ignore" toggle + a "change" picker (a <details> whose
    // summary is the button; the <select> inside re-enchants with a different scroll, price check only).
    const RE_ENCHANT_HELP = "A new base has no scrolls. This is the cost to enchant with the same scrolls. If not using the same scrolls, you can ignore this cost with the “ignore” button next to the scroll. You can also change the scroll you are re-enchanting with using the “change” button next to the scroll (price check only, not saved).";
    const reEnchantRows = (m, calc) => {
      const rows = calc.rows;
      if (!rows.length) return "";
      const mk = esc(moveKey(m));
      const lines = rows.map((x) => {
        const igBtn = `<button class="ignorebtn${x.ignored ? " on" : ""}" type="button" data-reench-ignore="${mk}" data-reench-affix="${x.affix}" title="${x.ignored ? "Price this scroll again" : "Ignore this re-enchant cost, you’ll re-enchant it yourself / already own the scroll"}">${x.ignored ? "ignored ✓" : "ignore"}</button>`;
        const opts = Object.values(enchants).filter((e) => e.affix === x.affix && e.appliesTo.includes(m.slot))
          .sort((a, b) => score(b.stats) - score(a.stats));
        const sel = `<details class="reench-change"><summary title="Re-enchant with a different scroll (price check only, not saved)">change</summary>`
          + `<select class="reench-sel" data-reench-move="${mk}" data-reench-affix="${x.affix}"${x.ignored ? " disabled" : ""}>`
          + opts.map((e) => `<option value="${esc(e.scroll)}"${e.scroll === x.effScroll ? " selected" : ""}>${esc(e.scroll.replace(/\s*Enchant Scroll\s*$/i, ""))}</option>`).join("")
          + `</select></details>`;
        const name = x.changed ? `${x.affix} · ${esc(x.effScroll)} <span class="muted">(was ${esc(x.scroll)})</span>` : `${x.affix} · ${esc(x.effScroll)}`;
        return `<div class="reench-line"><span class="muted">${name}</span><span class="rn-gold${x.ignored ? " struck" : ""}">${x.ignored ? "0" : fmt(x.gold)}</span>${igBtn}${sel}</div>`;
      }).join("");
      return `<div class="k">Re-enchant</div><div class="v gold">+${fmt(calc.total)} <span class="help-icon" tabindex="0" title="${esc(RE_ENCHANT_HELP)}">?</span><div class="reench-list">${lines}</div></div>`;
    };
    // Re-enhance row (issue 1/2): terse line + a "?" hover explaining what +N means and why it's an
    // expected cost. Explanation-only (no ignore/change).
    const reEnhanceRow = (m) => m.reEnhance
      ? `<div class="k">Re-enhance → +${m.toLevel}</div><div class="v gold">+${fmt(m.reEnhance)} <span class="help-icon" tabindex="0" title="A new base is at +0, meaning a net loss in Def Pen. Re-enhancing to +${m.toLevel} maintains the Def Pen that was in the prior item. This is an expected cost, due to re-enhancing not being guaranteed.">?</span></div>`
      : "";

    // Detail for a MERGED step-run (issue 5): the whole enhance chain is one row ("enhance +12→+16"),
    // so its detail shows the totals + a per-level list, each level expandable to its own attempt math.
    const mergedStepDetail = (m) => {
      const steps = m.steps.map((s) => {
        const lvl = s.type === "gearEnhance" ? `+${s.fromLevel} → +${s.toLevel}` : `${s.from} → ${s.to}`;
        return `<details class="stepsub"><summary><span class="ss-lvl">${lvl}</span> <span class="pos">${sfmt(s.pointGain)} pts</span> · <span class="gold">${fmt(s.goldCost)}</span></summary><div class="stepsub-body">${moveDetail(s)}</div></details>`;
      }).join("");
      return `<div class="detail">
        <h4>Enhance ${m.from} → ${m.to} <span class="muted">(${m.steps.length} levels combined)</span></h4>
        <h4 style="margin-top:10px">Stat change (vs equipped)</h4><div class="statline">${diffLine(m.statDiff)}</div>
        <h4 style="margin-top:10px">Math</h4><div class="grid">
          <div class="k">Point gain</div><div class="v">+${fmt(m.pointGain)}</div>
          <div class="k">Total gold</div><div class="v gold">${fmt(m.goldCost)}</div>
          <div class="k">Gold / point</div><div class="v gold">${fmt(m.goldPerPoint)}</div>
        </div>
        <h4 style="margin-top:10px">Per level <span class="muted">(expand a level for its attempt math)</span></h4>${steps}</div>`;
    };

    const moveDetail = (m) => {
      if (m.merged) return mergedStepDetail(m);
      if (m.type === "gearEnhance") {
        return `<div class="detail">
          <h4>Enhance ${m.from} → ${m.to}</h4><div class="statline muted">one enhancement level · failure keeps the level (expected-value cost)</div>
          <h4 style="margin-top:10px">Stat change (vs equipped)</h4><div class="statline">${diffLine(m.statDiff)}</div>
          <h4 style="margin-top:10px">Math</h4><div class="grid">
            <div class="k">Point gain</div><div class="v">+${fmt(m.pointGain)}</div>
            ${invLine(m)}
            <div class="k">Expected gold</div><div class="v gold">${fmt(m.goldCost)}</div>
            <div class="k">Gold / point</div><div class="v gold">${fmt(m.goldPerPoint)}</div>
          </div>${enhanceStepsBlock(m)}${craftButton(m)}</div>`;
      }
      if (m.type === "enhanceStep") {
        const mats = m.materials ? Object.entries(m.materials).map(([n, q]) => matLi(n, q, null, new Set())).join("") : "";
        const matsBlock = mats
          ? `<h4 style="margin-top:10px">Per-attempt cost (× the ${m.attempts.toFixed(1)} expected attempts)</h4>
             <div class="statline muted">${m.fee ? `${fmt(m.fee)} gold fee + ` : ""}materials, each attempt:</div><div class="mats">${mats}</div>`
          : "";
        return `<div class="detail">
          <h4>Enhancement step</h4><div class="statline">${m.from} → ${m.to} on a level ${m.bracket} accessory · mostly Def Pen</div>
          <h4 style="margin-top:10px">Stat change (vs equipped)</h4><div class="statline">${diffLine(m.statDiff)}</div>
          <h4 style="margin-top:10px">Math</h4><div class="grid">
            <div class="k">Point gain</div><div class="v">+${fmt(m.pointGain)}</div>
            <div class="k">Expected attempts</div><div class="v">${m.attempts.toFixed(1)}× <span class="muted">(failure keeps the level)</span></div>
            <div class="k">Gold / attempt</div><div class="v gold">${fmt(Math.round(m.perAttempt))}</div>
            <div class="k">Expected gold</div><div class="v gold">${fmt(m.goldCost)}</div>
            <div class="k">Gold / point</div><div class="v gold">${fmt(m.goldPerPoint)}</div>
            <div class="k">From inventory</div><div class="v muted" title="Enhancement is an expected value over a random number of attempts, so a finite owned stock can't net cleanly against it. Its materials are left at full price (SPEC §5.2).">not applied <span class="muted">(probabilistic. EV over random attempts)</span></div>
          </div>${matsBlock}</div>`;
      }
      if (m.type === "enchantSwap") {
        const e = enchants[m.to], old = m.from ? enchants[m.from] : null;
        return `<div class="detail">
          <h4>New enchant</h4><div class="statline">${statLine(e.stats)}${e.effect ? ` · <span class="muted">${e.effect}</span>` : ""}</div>
          ${old ? `<h4 style="margin-top:10px">Replaces</h4><div class="statline muted">${m.from} · ${statLine(old.stats)}</div>` : ""}
          <h4 style="margin-top:10px">Stat change (vs equipped)</h4><div class="statline">${diffLine(m.statDiff)}</div>
          <h4 style="margin-top:10px">Math</h4><div class="grid">
            <div class="k">Point gain</div><div class="v">+${fmt(m.pointGain)}</div>
            ${invLine(m)}
            <div class="k">Gold cost (${m.method})</div><div class="v gold">${fmt(m.goldCost)}${m.goldCost === 0 ? ` <span class="profit">net-profitable</span>` : ""}</div>
            <div class="k">Gold / point</div><div class="v gold">${fmt(m.goldPerPoint)}</div>
          </div>${craftButton(m)}</div>`;
      }
      if (m.type === "tuneStep") {
        const ticksLine = m.capstone
          ? `<div class="k">Tunes</div><div class="v">${m.apply.maxes.map((x) => tuneStatDisplay(x.stat)).join(", ")} <span class="muted">→ caps</span></div>`
          : `<div class="k">Ticks to cap</div><div class="v">${m.ticks}×</div>`;
        return `<div class="detail">
          <h4>Tune ${m.slot} · <span class="muted">${m.capstone
            ? ((m.breakdown || []).some((b) => b.prereq)
              ? `unlocks Dest ${surplusRoman(m.capstone)}, maxes the lower-tier stats first`
              : `Dest ${surplusRoman(m.capstone)} to its cap`)
            : `${tuneStatDisplay(m.stat)} to its cap`}</span></h4>
          <h4 style="margin-top:10px">Stat change</h4><div class="statline">${diffLine(m.statDiff)}</div>
          <h4 style="margin-top:10px">Math</h4><div class="grid">
            <div class="k">Point gain</div><div class="v">+${fmt(m.pointGain)}</div>
            ${ticksLine}
            ${invLine(m)}
            <div class="k">Gold cost (total)</div><div class="v gold">${fmt(m.goldCost)}</div>
            <div class="k">Gold / point</div><div class="v gold">${fmt(m.goldPerPoint)}</div>
          </div>${tuneBreakdown(m)}${craftButton(m)}</div>`;
      }
      if (m.type === "tierStep") {
        const it = itemByName[m.to], cr = craftCost(it.name);
        return `<div class="detail">
          <h4>Advance ${m.steps} tier${m.steps > 1 ? "s" : ""}${m.wipe ? (m.wipePreserved ? ` · <span class="muted">crosses a system jump (enchants kept via extraction rune)</span>` : ` · <span class="muted">crosses a system jump (enchants wiped → re-enchanted)</span>`) : ` · <span class="muted">enchants preserved</span>`}</h4>
          <div class="statline">${m.from} → ${it.name} · ${statLine(it.stats)}</div>
          <h4 style="margin-top:10px">Stat change (vs equipped)</h4><div class="statline">${diffLine(m.statDiff)}</div>
          ${m.setDelta && Object.keys(m.setDelta).length ? `<h4 style="margin-top:10px">Set bonus change <span class="muted">(included above)</span></h4><div class="statline">${diffLine(m.setDelta)}</div>` : ""}
          <h4 style="margin-top:10px">Math</h4><div class="grid">
            <div class="k">Point gain</div><div class="v">+${fmt(m.pointGain)}</div>
            <div class="k">Craft target tier</div><div class="v gold">${fmt(cr)}</div>
            <div class="k">Own current tier</div><div class="v gold">− ${fmt(m.ownCredit)} <span class="muted">${m.ownCredit ? "(already owned)" : "(baseline, owned/free)"}</span></div>
            ${m.enhanceGold ? `<div class="k">Enhance +${m.enhanceFrom}→+15</div><div class="v gold">+ ${fmt(m.enhanceGold)} <span class="muted">(the craft assumes a +15 Orna, expected cost to enhance yours up first)</span></div>` : ""}
            ${m.tunePrereqGold ? `<div class="k">Max base tuning</div><div class="v gold">+ ${fmt(m.tunePrereqGold)} <span class="muted">(required gate: the piece must be fully base-tuned before the jump, then that tuning is wiped. Pure sunk gold, it buys no lasting stat. The stat change above is measured against your current tuning.)${m.tunePrereqOk === false ? " ⚠ some tuning materials unpriced. Cost understated" : ""}</span></div>` : ""}
            ${m.reEnchant ? `<div class="k">Re-enchant</div><div class="v gold">+ ${fmt(m.reEnchant)} <span class="muted">(enchants wiped on the jump, base-stat tuning is wiped too, only Destruction carries)</span></div>` : ""}
            ${m.extraction ? `<div class="k">Extraction rune</div><div class="v gold">+ ${fmt(m.extraction)} <span class="muted">(carries your enchants across, cheaper than re-enchanting)</span></div>` : ""}
            ${invLine(m)}
            <div class="k">Gold cost (total)</div><div class="v gold">${fmt(m.goldCost)}</div>
            <div class="k">Gold / point</div><div class="v gold">${fmt(m.goldPerPoint)}</div>
          </div>${enhanceStepsBlock(m)}${tunePrereqBlock(m)}${wipeDecision(m)}${tierRecipeCarousel(m)}${craftButton(m)}</div>`;
      }
      const it = itemByName[m.to];
      const mk = priceOf(it.name), cr = craftCost(it.name);
      // Apply the ephemeral re-enchant what-if (ignore / change scroll): recompute the displayed
      // gold, points, gold/pt and stat change so the detail reflects the user's price-check choices
      // (the ranked row keeps the solver's honest default). No override ⇒ these equal the defaults.
      const rc = reEnchantCalc(m);
      const goldWF = m.goldCost - m.reEnchant + rc.total;
      const pointsWF = m.pointGain + rc.dPoints;
      const gppWF = pointsWF > 0 ? goldWF / pointsWF : Infinity;
      const statWF = mergeStatMaps(m.statDiff, rc.dStats);
      const wfTag = rc.active ? ` <span class="muted">(your scroll choices)</span>` : "";
      return `<div class="detail">
        <h4>Base stats</h4><div class="statline">${statLine(it.stats)}${it.effect ? ` · <span class="muted">${it.effect}</span>` : ""}</div>
        <h4 style="margin-top:10px">Stat change (vs equipped)${wfTag}</h4><div class="statline">${diffLine(statWF)}</div>
        ${m.setDelta && Object.keys(m.setDelta).length ? `<h4 style="margin-top:10px">Ring set bonus change <span class="muted">(included above)</span></h4><div class="statline">${diffLine(m.setDelta)}</div>` : ""}
        <h4 style="margin-top:10px">Math</h4><div class="grid">
          <div class="k">Point gain</div><div class="v">+${fmt(pointsWF)}</div>
          <div class="k">Market / Craft</div><div class="v gold">${fmt(mk)} / ${fmt(cr)}</div>
          ${reEnchantRows(m, rc)}
          ${reEnhanceRow(m)}
          ${invLine(m)}
          <div class="k">Gold cost (total)</div><div class="v gold">${fmt(goldWF)}</div>
          <div class="k">Gold / point</div><div class="v gold">${fmt(gppWF)}</div>
        </div>${recipeBlock(it.name, true, new Set(), null, true)}${craftButton(m)}</div>`;
    };

    // Upgrade list, optionally TARGETED at one stat. target === "points" ranks by
    // gold-per-ranking-point (the default product view, SPEC §7.1). A specific stat
    // key (e.g. "crit") filters to moves that improve THAT stat and ranks by
    // gold-per-unit-of-that-stat, the §7.2 threshold primitive ("best crit buy")
    //, while still showing the overall point gain so total value stays visible.
    const pill = (t) => `<span class="pill">${t}</span>`;
    // `moveKey` (shared row identity + veto key) lives in utils.js, unique per move row;
    // tuneStep moves disambiguate by tuned stat since they carry no `affix`/`to`.
    const freeTag = (m) => (m.goldCost === 0 ? ` <span class="deal">free</span>` : "");

    // Damage-model reference boss (SPEC §19)
    // The Damage tab's picked raid (persisted) is the reference boss for the tab's
    // per-stat marginals AND the Upgrades tab's DPS%/Gold-per-DPS% columns. `custom`
    // holds per-field overrides (cleared when a raid is re-picked); `tweaks` is the
    // tab's what-if stat overlay (per-stat DELTA on currentStats, never mutates them).
    const loadDamagePrefs = () => {
      try {
        const p = JSON.parse(localStorage.getItem(DAMAGE_STORAGE_KEY));
        return { raid: p?.raid ?? null, custom: { ...(p?.custom || {}) }, tweaks: { ...(p?.tweaks || {}) } };
      } catch { return { raid: null, custom: {}, tweaks: {} }; }
    };
    let damagePrefs = loadDamagePrefs();
    const persistDamagePrefs = () => localStorage.setItem(DAMAGE_STORAGE_KEY, JSON.stringify(damagePrefs));
    // Raids that can drive the model = those with a boss Def filled in the sheet.
    const damageRaids = () => raids.filter((r) => r.boss?.def > 0);
    // Resolve the reference boss: picked raid's sheet values (def from boss{}, caps
    // from caps{}), with custom overrides on top. No picked raid → easiest raid with
    // a Def value (so the DPS columns work out of the box); null def → model disabled.
    function damageBoss() {
      const r = damagePrefs.raid ? raidByName[damagePrefs.raid] : (damageRaids()[0] ?? null);
      return {
        raid: r?.raid ?? null,
        def: damagePrefs.custom.def ?? r?.boss?.def ?? null,
        balCap: damagePrefs.custom.balCap ?? r?.caps?.bal ?? null,
        critCap: damagePrefs.custom.critCap ?? r?.caps?.crit ?? null,
      };
    }
    // % formats: row values get 2 decimals; per-+1 marginals are tiny → 3 sig figs.
    const dpsFmt = (g) => (g == null ? "—" : `${g > 0 ? "+" : ""}${g.toFixed(2)}%`);
    const marginFmt = (g) => (g == null || g <= 0 ? "—" : `${Number(g.toPrecision(3))}%`);
    // Appended to every move detail (same chrome as planFooter): the move's damage
    // effect against the reference boss.
    const dpsFooter = (m) => {
      const b = damageBoss();
      const g = dpsGain(m.statDiff, currentStats, b);
      if (g == null) return "";
      return `<div class="detail dmg-foot"><h4>Damage vs ${esc(b.raid ?? "custom boss")}</h4><div class="grid">
        <div class="k">DPS change</div><div class="v"><span class="${g > 0 ? "pos" : g < 0 ? "neg" : "muted"}">${dpsFmt(g)}</span></div>
        <div class="k">Gold / DPS%</div><div class="v gold">${g > 0 ? fmt(m.goldCost / g) : "—"}</div>
      </div></div>`;
    };

    function buildUpgradeView(target) {
      // Per-row DPS% vs the Damage tab's reference boss (null when no boss Def is
      // known or the move touches no damage stat direction). Computed at render time
      // from statDiff, the solver itself still ranks by pointGain.
      const dmgBoss = damageBoss();
      const rowDps = (m) => dpsGain(m.statDiff, currentStats, dmgBoss);
      const dpsCells = (m) => {
        const g = rowDps(m);
        return {
          sort: [g ?? -Infinity, g > 0 ? m.goldCost / g : Infinity],
          cells: [["num", g == null ? "—" : `<span class="${g > 0 ? "pos" : g < 0 ? "neg" : "muted"}">${dpsFmt(g)}</span>`],
                  ["num", g > 0 ? fmt(m.goldCost / g) : "—"]],
        };
      };
      if (target === "points") {
        // Points view is already net-positive only (rankedMoves = pointGain>0), so
        // there are no lossy (net-loss) moves to gate here, the toggle is a no-op.
        return {
          columns: [{ label: "Best buys (cheapest gold/point first)" }, { label: "Type" }, { label: "Slot" },
                    { label: "Pts", num: true }, { label: "Gold", num: true }, { label: "Trend", num: true }, { label: "Gold / Pt", num: true },
                    { label: "DPS %", num: true }, { label: "Gold / DPS%", num: true }],
          defaultSort: { col: 6, dir: "asc" },
          rows: rankedMoves.map((m, i) => { const d = dpsCells(m); return {
            key: moveKey(m), search: moveSearch(m), pts: m.pointGain, gold: m.goldCost,
            rebase: moveNeedsRebase(m), better: moveHasBetter(m),
            sort: [i, TYPE_LABEL[m.type], m.slot, m.pointGain, m.goldCost, moveTrend(m) ?? 0, m.goldPerPoint, ...d.sort],
            cells: [moveLabel(m), ["", pill(TYPE_LABEL[m.type])], ["", pill(m.slot)],
              ["num", `<span class="${m.pointGain > 0 ? "pos" : "muted"}">${sfmt(m.pointGain)}</span>`], ["num", fmt(m.goldCost)], ["num", moveTrendChip(m)],
              // Wash tier advance (pointGain ≤ 0): no meaningful gold/point. Show "—" not ∞.
              ["num", `${m.pointGain > 0 ? fmt(m.goldPerPoint) : "—"}${freeTag(m)}`], ...d.cells],
            detail: moveDetail(m) + dpsFooter(m) + vetoFooter(m) + planFooter(m),
          }; }),
        };
      }
      const tl = STAT_LABEL[target];
      // Moves improving the target stat. Net-loss moves (lossy, sacrificing overall
      // value for this stat, e.g. a Fast scroll) are hidden unless "allow lossy" is on.
      const targeted = moves
        .filter((m) => (m.statDiff?.[target] || 0) > 0 && (allowLossy || !isLossy(m)))
        .map((m) => ({ m, gain: m.statDiff[target], gps: m.goldCost / m.statDiff[target] }))
        .sort((a, b) => a.gps - b.gps);
      return {
        columns: [{ label: `Best ${tl} buys (${targeted.length})` }, { label: "Type" }, { label: "Slot" },
                  { label: `+${tl}`, num: true }, { label: "Pts", num: true }, { label: "Gold", num: true },
                  { label: "Trend", num: true }, { label: `Gold / ${tl}`, num: true },
                  { label: "DPS %", num: true }, { label: "Gold / DPS%", num: true }],
        defaultSort: { col: 7, dir: "asc" },
        rows: targeted.map(({ m, gain, gps }, i) => { const d = dpsCells(m); return {
          key: moveKey(m), search: moveSearch(m), pts: m.pointGain, gold: m.goldCost,
          rebase: moveNeedsRebase(m), better: moveHasBetter(m),
          sort: [i, TYPE_LABEL[m.type], m.slot, gain, m.pointGain, m.goldCost, moveTrend(m) ?? 0, gps, ...d.sort],
          cells: [moveLabel(m), ["", pill(TYPE_LABEL[m.type])], ["", pill(m.slot)],
            ["num", `+${fmt(gain)}`], ["num", `<span class="${m.pointGain < 0 ? "neg" : "pos"}">${sfmt(m.pointGain)}</span>`], ["num", fmt(m.goldCost)], ["num", moveTrendChip(m)],
            ["num", `${fmt(gps)}${freeTag(m)}`], ...d.cells],
          detail: moveDetail(m) + dpsFooter(m) + vetoFooter(m) + planFooter(m),
        }; }),
      };
    }

    // THRESHOLD mode (SPEC §7.2)
    // The greedy RE-BASELINING solver lives in js/solver.js (solveThreshold):
    // per-slot state, regenerated after each pick, so a bundle can chain moves on
    // one slot (swap a base, then enchant/enhance it) and credit back a restored
    // affix it later replaces. Needs come from absolute targets (target − current).

    // Threshold goal state. Entry styles: absolute targets and "maximize" (take every
    // move that improves the stat, for "max att spd, costs be damned", accepting
    // tradeoffs on other stats).
    let thMode = "target"; // "target" | "maximize" | "raid"
    // Threshold's "current" column IS the live stat totals, same object the sidebar
    // edits, so gear/stat changes flow straight into the gap math (and vice-versa).
    const thCurrent = currentStats;
    const thTarget = {};   // stat → absolute target
    const thMaximize = new Set(); // stats to maximize
    // Raid mode (SPEC §7.2): pick a raid → its `targets` become the goals. Default
    // to the easiest raid the current stats can't yet enter (QB floors unmet).
    const raidByName = Object.fromEntries(raids.map((r) => [r.raid, r]));
    let thRaid = nextRaid(raids, thCurrent);
    let thRaidAim = "qb"; // "qb" = Quick-Battle entry floors only; "cap" = floors + raid caps
    let thResult = { needs: {}, chosen: [], remaining: {}, gained: {} };

    // Target stat map for the selected raid, per aim: QB-entry floors only, or those
    // floors with bal/crit/critRes raised to the raid's caps (r.targets).
    const raidTargets = (r) => (thRaidAim === "qb" ? r.qb : r.targets);

    function thNeeds() {
      const needs = {};
      if (thMode === "raid") {
        const r = raidByName[thRaid];
        if (r) for (const [k, t] of Object.entries(raidTargets(r))) {
          const n = t - (thCurrent[k] ?? 0);
          if (n > 0) needs[k] = n;
        }
        return needs;
      }
      if (thMode === "maximize") {
        // "points" is not a statDiff key, it routes to solveBudget in buildThresholdView,
        // so keep it out of the stat needs handed to the greedy stat-maximizer.
        for (const k of thMaximize) if (k !== "points") needs[k] = Infinity;
        return needs;
      }
      for (const k of Object.keys(STAT_LABEL)) {
        let n = 0;
        const t = thTarget[k];
        if (t != null && !Number.isNaN(t)) n = t - (thCurrent[k] ?? 0);
        if (n > 0) needs[k] = n;
      }
      return needs;
    }

    // The "Helps" column reads as what each pick buys you.
    // The move's FULL stat change. Gains (green) AND losses (red). So a tradeoff move (e.g.
    // Tempestuous: +Att Spd, −Crit, −Bal) shows what it costs, not just what it helps (issue 6).
    const helpsCell = (m) => Object.keys(STAT_LABEL)
      .filter((s) => (m.statDiff?.[s] || 0) !== 0)
      .map((s) => { const v = m.statDiff[s]; return `<span class="${v > 0 ? "pos" : "neg"}">${STAT_LABEL[s]} ${sfmt(v)}</span>`; })
      .join(", ") || "—";

    // Hard floors for the greedy solver (SPEC §7.2, issue 6/7): every stat protected at a minimum so
    // a bundle never silently regresses a stat you care about.
    //   • Target mode, floor = each stat's Target input, but ONLY for stats the user actually enters a
    //     value for (blank = no min; the inputs start blank so you choose your mins). A value is both a
    //     goal (if above current) and a hard floor. These are EXPLICIT user floors, so they ALWAYS hold
    //, even with Tradeoffs on (the toggle only controls whether net-LOSS moves are considered; a
    //     lossy move that would still breach a floor stays blocked).
    //   • Maximize / Raid, no per-stat floor inputs, so floor = current (hold the line while
    //     pushing other stats); here the Tradeoffs toggle (allowLossy) is the only relax knob and it
    //     clears these IMPLICIT floors so sacrifices are allowed (with the per-move losses shown).
    // Maximize-points routes through solveBudget (point-maximizing, non-regressing) → no floors.
    const floorsFor = () => {
      const f = {};
      if (thMode === "target") {
        // Only the stats you actually enter a value for are floored, a blank target = no min.
        for (const k of Object.keys(STAT_LABEL)) { const v = thTarget[k]; if (v != null && !Number.isNaN(v) && v > 0) f[k] = v; }
      } else if (!allowLossy && (thMode === "maximize" || thMode === "raid")) {
        for (const k of Object.keys(STAT_LABEL)) { const v = thCurrent[k]; if (v != null) f[k] = v; }
      }
      return Object.keys(f).length ? f : null;
    };

    // Collapse a run of consecutive same-slot enhancement steps into ONE display row (issue 5): a
    // Target bundle often enhances an accessory +12→+13→+14→+15→+16 (or an Orna piece +12→+15) as
    // several rows; grouping them into "enhance +12→+16" with a per-level breakdown behind the row's
    // expander keeps the list readable. Only enhanceStep/gearEnhance chains collapse, tune chains
    // (Dest I vs Dest II) stay separate, distinct decisions. Runs of length 1 pass through unchanged.
    const STEP_MERGE_TYPES = new Set(["enhanceStep", "gearEnhance"]);
    const mergeStepRuns = (list) => {
      const out = [];
      for (let i = 0; i < list.length; i++) {
        const m = list[i];
        if (!STEP_MERGE_TYPES.has(m.type)) { out.push(m); continue; }
        const run = [m];
        while (i + 1 < list.length && list[i + 1].type === m.type && list[i + 1].slot === m.slot) run.push(list[++i]);
        if (run.length === 1) { out.push(m); continue; }
        const first = run[0], last = run[run.length - 1];
        const statDiff = {};
        let pts = 0, gold = 0;
        for (const s of run) { pts += s.pointGain; gold += s.goldCost; for (const k in (s.statDiff || {})) statDiff[k] = (statDiff[k] || 0) + s.statDiff[k]; }
        for (const k in statDiff) if (!statDiff[k]) delete statDiff[k];
        out.push({
          ...first, merged: true, steps: run,
          from: first.from, to: last.to, fromLevel: first.fromLevel, toLevel: last.toLevel,
          pointGain: pts, goldCost: gold, statDiff,
          goldPerPoint: pts > 0 ? gold / pts : Infinity,
        });
      }
      return out;
    };

    function buildThresholdView() {
      let needs, solved;
      if (thMode === "maximize" && thMaximize.has("points")) {
        // Maximize total ranking points = an unbounded budget knapsack (take every
        // net-positive move). Distinct from maximizing individual stats below.
        needs = { points: Infinity };
        solved = solveBudget(Infinity, loadout, moveCtx);
      } else {
        needs = thNeeds();
        // Target/Maximize/Raid assemble the cheapest bundle to reach their goals.
        // Hard floors (issue 6/7) keep the bundle from regressing a stat below its
        // floor; `allow tradeoffs` clears them.
        solved = Object.keys(needs).length
          ? solveThreshold(needs, loadout, moveCtx, { allowLossy, floors: floorsFor(), current: thCurrent })
          : { chosen: [], remaining: {}, gained: {}, budgetLimited: false, lossyLimited: false, floorLimited: false, floorStats: [] };
      }
      thResult = { needs, ...solved };
      // Display-only: collapse enhance-step runs into one expandable row (issue 5). thResult keeps the
      // raw (unmerged) chosen list, so the summary totals are unaffected.
      const chosen = mergeStepRuns(solved.chosen);
      // Slots whose base/tier is changed within THIS bundle no longer need a rebase
      // warning, and their enchant/enhance moves depend on that change (group them). A
      // wipe tier jump counts like a base swap (enchants wiped); a rune-preserved or
      // in-line tier keeps enchants, so it doesn't form a wipe dependency.
      const rebasedSlots = new Set(chosen
        .filter((m) => m.type === "baseSwap" || (m.type === "tierStep" && m.wipe && !m.wipePreserved))
        .map((m) => m.slot));

      // Default display order: gold-per-point ascending, BUT a base-swapped slot's moves
      // stay together in canonical order (base swap → enchant → enhance) so the prerequisite
      // base swap renders before the enchant/enhance now sitting on it (else a cheap scroll
      // sorts above the base it depends on, reading as "enchant the old item, then throw it
      // away". SPEC §7.2). Only base-swapped slots form a real dependency group; the group
      // is anchored by its best (lowest) gold/pt. Moves on slots WITHOUT a base swap are
      // INDEPENDENT (prefix and suffix don't depend on each other), so each is its own unit
      // and sorts on its own gold/pt, a pricey scroll never rides up under a cheaper sibling.
      // A slot forms a dependency group when its moves must stay ORDERED + contiguous:
      //   • a base swap (the enchant/enhance now sit on the new base), or
      //   • a Destruction tune chain. Dest II requires Dest I first, so the cheaper-per-
      //     point Dest II must NOT float above its Dest I prerequisite.
      // Grouped slots keep their canonical (chosen) order and the group anchors at its best
      // (lowest) gold/pt. Other moves (independent prefix/suffix, a lone tune) stand alone.
      const tuneCount = {};
      for (const m of chosen) if (m.type === "tuneStep") tuneCount[m.slot] = (tuneCount[m.slot] || 0) + 1;
      const groupedSlot = (slot) => rebasedSlots.has(slot) || tuneCount[slot] > 1;
      const gpp = (m) => Number.isFinite(m.goldPerPoint) ? m.goldPerPoint : Infinity;
      const units = [], grouped = new Map();
      for (const m of chosen) {
        if (groupedSlot(m.slot)) {
          if (!grouped.has(m.slot)) { const u = []; grouped.set(m.slot, u); units.push(u); }
          grouped.get(m.slot).push(m);
        } else units.push([m]); // independent move
      }
      // Order by gold-per-point; when two units tie at the SAME displayed gold/pt (e.g.
      // several armor Dest tunes with identical economics), finish the piece that already
      // has the MOST destruction tuned first (concentrate, don't spread. SPEC §12). Round
      // the gpp so "same as shown" groups; raw gpp is the final tiebreak for stability.
      const unitGpp = (u) => Math.min(...u.map(gpp));
      const unitDest = (u) => Math.max(...u.map((m) => m.existingDest ?? -1));
      units.sort((a, b) => {
        const ra = Math.round(unitGpp(a)), rb = Math.round(unitGpp(b));
        if (ra !== rb) return ra - rb;
        if (unitDest(a) !== unitDest(b)) return unitDest(b) - unitDest(a);
        return unitGpp(a) - unitGpp(b);
      });
      const orderIx = new Map(units.flat().map((m, i) => [m, i]));

      return {
        columns: [{ label: `Cheapest bundle (${chosen.length})` }, { label: "Type" }, { label: "Slot" },
                  { label: "Stat change" }, { label: "Pts", num: true }, { label: "Gold", num: true },
                  { label: "Gold / Pt", num: true }],
        defaultSort: { col: 6, dir: "asc" }, // gold-per-point, prereq-safe (slot moves stay grouped & canonical)
        rows: chosen.map((m) => ({
          key: moveKey(m), search: moveSearch(m), pts: m.pointGain, gold: m.goldCost,
          // Dependency group (base swap, or a Dest tune chain) → the renderer brackets
          // contiguous same-group rows and they stay in canonical order. null = independent.
          group: groupedSlot(m.slot) ? m.slot : null,
          sort: [orderIx.get(m), TYPE_LABEL[m.type], m.slot, "", m.pointGain, m.goldCost, orderIx.get(m)],
          cells: [moveLabel(m, rebasedSlots), ["", pill(TYPE_LABEL[m.type])], ["", pill(m.slot)],
            ["", helpsCell(m)], ["num", `<span class="${m.pointGain < 0 ? "neg" : "pos"}">${sfmt(m.pointGain)}</span>`], ["num", fmt(m.goldCost)],
            ["num", Number.isFinite(m.goldPerPoint) ? fmt(m.goldPerPoint) : "—"]],
          detail: moveDetail(m) + vetoFooter(m) + planFooter(m),
        })),
      };
    }

    // Tab KEYS are static, counts are appended at render time (renderTabs) so they track
    // live changes (vetoes, inventory, loadout edits, free-item toggles) instead of freezing
    // at the startup number.
    const UPGRADES_TAB = "Upgrades";
    const THRESHOLD_TAB = "Target"; // display label; internal names keep the old "threshold" word
    const PLANNER_TAB = "Planner";  // NEW user-built upgrade-path tab, unrelated to THRESHOLD_TAB (the old "Planner")
    const DAMAGE_TAB = "Damage";    // damage-model tab (SPEC §19): per-stat % marginals vs a reference boss
    const BUILDER_TAB = "Appraiser";
    const CATALOG_TAB = "Items";
    const SCANNER_TAB = "Tracker"; // display label; internal names keep the old "Scanner" word
    const CHECKLIST_TAB = "Checklist";
    let statTarget = "points";

    const views = {
      [UPGRADES_TAB]: buildUpgradeView(statTarget),
      [THRESHOLD_TAB]: buildThresholdView(),
      [PLANNER_TAB]: { columns: [], rows: [], defaultSort: { col: 0, dir: "asc" } },
      [DAMAGE_TAB]: { columns: [], rows: [], defaultSort: { col: 0, dir: "asc" } },
      [BUILDER_TAB]: { columns: [], rows: [], defaultSort: { col: 0, dir: "asc" } },
      [CATALOG_TAB]: catalogView,
      [SCANNER_TAB]: { columns: [], rows: [], defaultSort: { col: 0, dir: "asc" } },
      [CHECKLIST_TAB]: { columns: [], rows: [], defaultSort: { col: 0, dir: "asc" } },
    };

    // generic render (sort + filter + expand)
    const tabsEl = document.getElementById("tabs");
    const theadEl = document.getElementById("thead");
    const rowsEl = document.getElementById("rows");
    const searchEl = document.getElementById("search");
    const vetoToggleEl = document.getElementById("vetoToggle");
    const vetoPanelEl = document.getElementById("vetoPanel");
    let vetoPanelOpen = false;
    // Manage panel for active vetoes: count on the header toggle, a list with per-rule un-veto
    // (×) + "Clear all". Each rule shows its scope (move/target/slot) and stored label. Called on
    // init and after every veto edit (applyVetoes).
    const VETO_KIND_LABEL = { move: "move", target: "item", slotType: "slot" };
    function renderVetoPanel() {
      vetoToggleEl.textContent = `Vetoed (${vetoes.length})`;
      vetoToggleEl.classList.toggle("on", vetoes.length > 0);
      vetoPanelEl.style.display = vetoPanelOpen ? "block" : "none";
      if (!vetoPanelOpen) return;
      const body = vetoes.length
        ? `<ul>${vetoes.map((v) => `<li><span class="vk">${VETO_KIND_LABEL[v.kind] || v.kind}</span>` +
            `<span class="vlabel">${esc(v.label || vetoId(v))}</span>` +
            `<button class="vx" type="button" data-unveto="${esc(vetoId(v))}" title="Un-veto, show this again">×</button></li>`).join("")}</ul>`
        : `<p class="vp-empty">No vetoed upgrades. Open any move and use its “Veto” buttons to hide it from every list and the Target solver.</p>`;
      vetoPanelEl.innerHTML =
        `<div class="vp-head"><b>Vetoed upgrades (${vetoes.length})</b>` +
        (vetoes.length ? `<button class="vp-clear" type="button" id="vetoClear">Clear all</button>` : "") +
        `</div>${body}`;
    }
    // Add a veto from an opened move's scope button (rule encoded on the button).
    document.addEventListener("click", (e) => {
      const btn = e.target.closest(".vetobtn"); if (!btn) return;
      e.stopPropagation(); // don't toggle the expanded row
      let rule; try { rule = JSON.parse(btn.dataset.veto); } catch { return; }
      addVeto(rule);
      applyVetoes(); // the now-vetoed move vanishes from the list on re-render
    });
    // "Add to plan" from an opened Upgrades move, resolve the LIVE move by moveKey (gear/prices
    // may have shifted since render), decompose via moveToSteps (onItem stamped from the slot's
    // current base), and append de-duped. Flash the count on the button; nothing else re-renders
    // (adding to the path doesn't change the ranked list), so the button stays put for the flash.
    document.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-plan-add]"); if (!btn) return;
      e.stopPropagation(); // don't toggle the expanded row
      const key = btn.dataset.planAdd;
      // Upgrades rows resolve against the LIVE move list (generated from the current loadout).
      // Target/Raid bundle rows don't live there: solveThreshold forward-simulates, so a bundle
      // can enhance past the current level (e.g. earring +14→+15 when the loadout is still +13),
      // and those rows are display-MERGED into one run ("enhance +13→+16"). Fall back to the
      // merged bundle (then its raw steps) so those rows add too, moveToSteps flattens a merged
      // run into its per-level steps.
      const m = moves.find((x) => moveKey(x) === key)
        || mergeStepRuns(thResult.chosen || []).find((x) => moveKey(x) === key)
        || (thResult.chosen || []).find((x) => moveKey(x) === key);
      if (!m) { btn.textContent = "Move no longer available"; setTimeout(() => { btn.textContent = "Add to plan"; }, 1500); return; }
      const n = addStepsToPlan(moveToSteps(m, moveCtx, loadout[m.slot]?.base ?? null));
      btn.textContent = n ? `Added ${n} step${n !== 1 ? "s" : ""} ✓` : "Already in plan";
      setTimeout(() => { btn.textContent = "Add to plan"; }, 1500);
    });
    // Re-enchant WHAT-IF (issue 3), EPHEMERAL, toggles the in-memory `reEnchantWhatIf` overlay and
    // re-renders (recomputeLoadout re-runs moveDetail, which reads the overlay). Nothing is persisted;
    // a reload clears it. The solver/ranked list are untouched, this only recomputes the detail.
    document.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-reench-ignore]"); if (!btn) return;
      e.stopPropagation();
      const mk = btn.dataset.reenchIgnore, affix = btn.dataset.reenchAffix;
      const cur = reEnchantWhatIf.get(mk) || {};
      if (cur[affix]?.ignore) delete cur[affix]; else cur[affix] = { ignore: true };
      Object.keys(cur).length ? reEnchantWhatIf.set(mk, cur) : reEnchantWhatIf.delete(mk);
      recomputeLoadout();
    });
    document.addEventListener("change", (e) => {
      const sel = e.target.closest(".reench-sel"); if (!sel) return;
      const mk = sel.dataset.reenchMove, affix = sel.dataset.reenchAffix;
      const cur = reEnchantWhatIf.get(mk) || {};
      cur[affix] = { scroll: sel.value }; // "change scroll" supersedes an ignore on that affix
      reEnchantWhatIf.set(mk, cur);
      recomputeLoadout();
    });
    // Header toggle: open/close the manage panel.
    vetoToggleEl.addEventListener("click", () => { vetoPanelOpen = !vetoPanelOpen; renderVetoPanel(); });
    // Panel: un-veto one rule (×) or clear all.
    vetoPanelEl.addEventListener("click", (e) => {
      if (e.target.closest("#vetoClear")) { vetoes.splice(0, vetoes.length); applyVetoes(); return; }
      const x = e.target.closest(".vx"); if (!x) return;
      removeVeto(x.dataset.unveto);
      applyVetoes();
    });
    const statTargetEl = document.getElementById("statTarget");
    const statTargetWrap = document.getElementById("statTargetWrap");
    const hideLossyEl = document.getElementById("hideLossy");
    const hideGroupWrap = document.getElementById("hideGroupWrap");
    const noRebaseEl = document.getElementById("noRebase");
    const noRebaseChip = document.getElementById("noRebaseChip");
    const noBetterEl = document.getElementById("noBetter");
    const noBetterChip = document.getElementById("noBetterChip");
    const thresholdPanel = document.getElementById("thresholdPanel");
    const plannerPanel = document.getElementById("plannerPanel");
    const damagePanel = document.getElementById("damagePanel");
    const builderPanel = document.getElementById("builderPanel");
    const scannerPanel = document.getElementById("scannerPanel");
    const checklistPanel = document.getElementById("checklistPanel");
    const sidebarEl = document.getElementById("sidebar");
    const controlsEl = document.getElementById("controls");
    const tableEl = document.getElementById("maintable");
    const kindFilterWrap = document.getElementById("kindFilterWrap");
    const kindFilterEl = document.getElementById("kindFilter");
    let catalogKind = "all"; // Catalog tab: filter rows by Kind (all/gear/enchant/material)
    let ownedOnly = false;   // Catalog tab: restrict to items you own (inventory > 0, SPEC §5.2)
    const ownedFilterEl = document.getElementById("ownedFilter");
    // Order-preserve for inventory edits: a +/- stepper re-nets every move, which changes the
    // clicked row's gold/pt and would re-sort it OUT from under the cursor. `preserveRowOrder`
    // (one-shot, consumed each render) tells renderTable to keep the LAST displayed order
    // (`lastRowOrder`) so the row stays put while you click; any other action sorts normally.
    let preserveRowOrder = false, lastRowOrder = null;
    // Which Catalog columns are meaningful per Kind (indices into the Catalog `columns`:
    // 0 Item, 1 Kind, 2 Slot/Affix, 3 Lvl/R, 4 Pts, 5 Trend, 6 Price, 7 Gold/Pt, 8 Owned).
    // Scoping to one kind drops the columns always blank for it (+ the redundant Kind col);
    // "all" shows everything. Owned (8) shows for every kind. Sorting still uses original
    // indices (th keeps data-col=i).
    const CATALOG_COLS = {
      gear:     [0, 2, 3, 4, 5, 6, 7, 8],  // drop Kind
      enchant:  [0, 2, 3, 4, 5, 6, 7, 8],  // drop Kind (Trend = gold-weighted over the cheapest method's buys)
      material: [0, 5, 6, 8],              // drop Kind, Slot/Affix, Lvl/R, Pts, Gold/Pt
      sealshop: [0, 6, 8],                 // Item, Price (derived redemption worth), Owned, no trend/pts
      legacy:   [0, 2, 3, 8],              // Item, Slot/Affix (= Type pill: Gear/Material/Enchant, sortable), Lvl/R, Owned
    };
    statTargetEl.innerHTML = `<option value="points">Ranking points</option>` +
      Object.entries(STAT_LABEL).map(([k, l]) => `<option value="${k}">${l}</option>`).join("");
    let active = Object.keys(views)[0];
    let sort = { ...views[active].defaultSort };
    const expanded = new Set();

    function compare(a, b, dir) {
      const an = a == null || a === "" || Number.isNaN(a), bn = b == null || b === "" || Number.isNaN(b);
      if (an && bn) return 0; if (an) return 1; if (bn) return -1; // nulls always last
      const mul = dir === "asc" ? 1 : -1;
      if (typeof a === "string" || typeof b === "string") return mul * String(a).localeCompare(String(b));
      return mul * (a - b);
    }

    // Live per-tab counts (the tab keys are static; these read the CURRENT lists so a veto/
    // inventory/loadout/free-item change updates the number via recomputeLoadout → renderTabs).
    const tabCount = (name) =>
      name === UPGRADES_TAB ? ` (${rankedMoves.length})`
      : name === CATALOG_TAB ? ` (${catalogView.rows.length})` : "";
    function renderTabs() {
      tabsEl.innerHTML = Object.keys(views)
        .map((name) => `<div class="tab ${name === active ? "active" : ""}" data-tab="${name}">${name}${tabCount(name)}</div>`).join("");
    }

    const numOr = (el, dflt) => { const v = parseFloat(el.value); return Number.isNaN(v) ? dflt : v; };

    function renderTable() {
      // Gear Builder is a custom panel, not a sortable table, hide the table + controls
      // and render the composer instead.
      const builderTab = active === BUILDER_TAB;
      const scannerTab = active === SCANNER_TAB;
      const checklistTab = active === CHECKLIST_TAB;
      const plannerTab = active === PLANNER_TAB;
      const damageTab = active === DAMAGE_TAB;
      const customPanel = builderTab || scannerTab || checklistTab || plannerTab || damageTab;
      controlsEl.style.display = customPanel ? "none" : "flex";
      builderPanel.style.display = builderTab ? "block" : "none";
      scannerPanel.style.display = scannerTab ? "block" : "none";
      checklistPanel.style.display = checklistTab ? "block" : "none";
      plannerPanel.style.display = plannerTab ? "block" : "none";
      damagePanel.style.display = damageTab ? "block" : "none";
      // The Planner's materials panel is position:sticky; `.main`'s overflow-x (for the wide
      // table) would otherwise become its containing block and break the pin. The table is
      // hidden on this tab, so relax `.main`'s overflow while the Planner is active.
      document.querySelector(".main")?.classList.toggle("plan-scroll", plannerTab);
      tableEl.style.display = customPanel ? "none" : "";
      if (builderTab) { thresholdPanel.style.display = "none"; renderBuilder(); renderSidebar(); return; }
      if (scannerTab) { thresholdPanel.style.display = "none"; renderScanner(); renderSidebar(); return; }
      if (checklistTab) { thresholdPanel.style.display = "none"; renderChecklist(); renderSidebar(); return; }
      if (plannerTab) { thresholdPanel.style.display = "none"; renderPlanner(); renderSidebar(); return; }
      if (damageTab) { thresholdPanel.style.display = "none"; renderDamage(); renderSidebar(); return; }

      // controls: stat-target + numeric filters apply to the move lists (Upgrades
      // ranked view + Threshold bundle); the threshold goal form shows only on its tab.
      const moveTab = active === UPGRADES_TAB || active === THRESHOLD_TAB;
      statTargetWrap.style.display = active === UPGRADES_TAB ? "inline-flex" : "none";
      // Hide group shows on both move lists (the "lossy" chip affects points view + threshold),
      // but the rebase/weaker chips only make sense on the ranked Upgrades list, those hints
      // aren't shown on the solved Threshold bundle, so hide them off the Upgrades tab.
      hideGroupWrap.style.display = moveTab ? "inline-flex" : "none";
      noRebaseChip.style.display = active === UPGRADES_TAB ? "inline-flex" : "none";
      noBetterChip.style.display = active === UPGRADES_TAB ? "inline-flex" : "none";
      thresholdPanel.style.display = active === THRESHOLD_TAB ? "block" : "none";
      const catalogTab = active === CATALOG_TAB;
      kindFilterWrap.style.display = catalogTab ? "inline-flex" : "none";

      const v = views[active];
      // Catalog: when scoped to one Kind, hide columns that are always blank for it.
      // `visCols` = the original column indices to render (null → show all); applied to
      // both the header and each row's cells so they stay aligned, and to the detail colspan.
      const visCols = (catalogTab && catalogKind !== "all") ? CATALOG_COLS[catalogKind] : null;
      const showCol = (i) => !visCols || visCols.includes(i);
      const colCount = visCols ? visCols.length : v.columns.length;
      theadEl.innerHTML = "<tr>" + v.columns.map((c, i) => [c, i]).filter(([, i]) => showCol(i)).map(([c, i]) =>
        `<th data-col="${i}">${c.label}${sort.col === i ? ` <span class="arrow">${sort.dir === "asc" ? "▲" : "▼"}</span>` : ""}</th>`).join("") + "</tr>";

      // Split the query on commas/whitespace → every term must match (AND), so "advance, helm"
      // finds helm advances regardless of word order. Empty query = no filter.
      const terms = searchEl.value.toLowerCase().split(/[\s,]+/).filter(Boolean);
      let rows = terms.length
        ? v.rows.filter((r) => { const t = (r.search || r.key).toLowerCase(); return terms.every((q) => t.includes(q)); })
        : v.rows.slice();
      if (catalogTab && catalogKind !== "all") rows = rows.filter((r) => r.kind === catalogKind);
      if (catalogTab && ownedOnly) rows = rows.filter((r) => r.owned > 0);
      // Legacy rows show ONLY under the Legacy kind scope; every other view hides them.
      if (catalogTab && catalogKind !== "legacy") rows = rows.filter((r) => !r.legacy);
      if (active === UPGRADES_TAB) {
        if (hideRebase) rows = rows.filter((r) => !r.rebase);
        if (hideBetter) rows = rows.filter((r) => !r.better);
      }
      // Catalog Item column (col 0) sorts group-aware: families cluster by base name (asc/desc
      // flips the GROUP order), and members hold strongest-first (`within`) regardless, so the
      // bracket stays contiguous and head-first under both A-Z and Z-A. Every other column is a
      // flat value sort that scatters families (bracket then drops, below).
      const catalogItemSort = catalogTab && sort.col === 0;
      if (catalogItemSort) {
        rows.sort((a, b) => {
          const g = compare(a.groupKey, b.groupKey, sort.dir);
          return g !== 0 ? g : a.within - b.within;
        });
      } else {
        rows.sort((r1, r2) => compare(r1.sort[sort.col], r2.sort[sort.col], sort.dir));
      }
      // Inventory edit: override the sort with the previously displayed order so the clicked
      // row doesn't jump as its cost changes (#2/#3). One-shot, consumed here, set fresh by
      // applyInventory on the next +/-; any other render sorts normally above.
      if (preserveRowOrder && lastRowOrder) {
        const pos = new Map(lastRowOrder.map((k, i) => [k, i]));
        rows.sort((a, b) => (pos.has(a.key) ? pos.get(a.key) : Infinity) - (pos.has(b.key) ? pos.get(b.key) : Infinity));
      }
      preserveRowOrder = false;
      rows = rows.slice(0, catalogTab ? Infinity : 250); // Catalog is bounded (~600 rows); the cap is for the open-ended move lists
      lastRowOrder = rows.map((r) => r.key); // remember for the next inventory-edit preserve

      // The dependency/family bracket is only meaningful where each group is contiguous and
      // head-first: the prereq-safe default order, or the Catalog's grouped Item sort (either
      // direction). Any other column sort reorders by a raw value, a child can land before its
      // head, or members scatter, so we drop the bracketing then to avoid misleading nesting.
      const ds = v.defaultSort || {};
      const inDefaultOrder = (sort.col === ds.col && sort.dir === ds.dir) || catalogItemSort;

      rowsEl.innerHTML = rows.map((r, idx) => {
        const open = expanded.has(r.key);
        const caret = r.detail ? `<span class="caret">${open ? "▾" : "▸"}</span>` : `<span class="caret"></span>`;
        // Bracket contiguous rows sharing a `group` (a base swap + its dependent enchants):
        // a child continues the previous group row; a head is a group's first row that has
        // a following child. Gated to default order so a re-sort never shows broken nesting.
        const prev = rows[idx - 1], next = rows[idx + 1];
        const isChild = inDefaultOrder && r.group != null && prev && prev.group === r.group;
        const isHead = inDefaultOrder && r.group != null && !isChild && next && next.group === r.group;
        const isLast = isChild && !(next && next.group === r.group); // last row of a group → inset rail bottom
        const grpCls = (isChild ? "grp-child" : (isHead ? "grp-head" : "")) + (isLast ? " grp-last" : "");
        const conn = isChild ? `<span class="gconn">↳</span>` : "";
        const main = `<tr class="mainrow ${grpCls} ${r.detail ? "expandable" : ""}" data-key="${r.key.replace(/"/g, "&quot;")}">` +
          r.cells.map((cell, i) => [cell, i]).filter(([, i]) => showCol(i)).map(([cell, i]) => {
            const [cls, html] = Array.isArray(cell) ? cell : ["", cell];
            return `<td class="${cls}">${i === 0 ? caret + " " + conn : ""}${html}</td>`;
          }).join("") + "</tr>";
        const det = open && r.detail
          ? `<tr class="detailrow"><td colspan="${colCount}">${r.detail}</td></tr>` : "";
        return main + det;
      }).join("");

      renderSidebar();
    }

    tabsEl.addEventListener("click", (e) => {
      const t = e.target.closest(".tab"); if (!t) return;
      active = t.dataset.tab; sort = { ...views[active].defaultSort };
      expanded.clear(); searchEl.value = "";
      renderTabs(); renderTable();
    });
    theadEl.addEventListener("click", (e) => {
      const th = e.target.closest("th"); if (!th) return;
      const col = +th.dataset.col;
      if (sort.col === col) sort.dir = sort.dir === "asc" ? "desc" : "asc";
      else sort = { col, dir: views[active].columns[col].num ? "desc" : "asc" };
      renderTable();
    });
    rowsEl.addEventListener("click", (e) => {
      if (e.target.closest(".invstep")) return; // a +/- inventory stepper → don't toggle the row
      const tr = e.target.closest("tr.mainrow.expandable"); if (!tr) return;
      const key = tr.dataset.key.replace(/&quot;/g, '"');
      expanded.has(key) ? expanded.delete(key) : expanded.add(key);
      renderTable();
    });
    searchEl.addEventListener("input", renderTable);
    noRebaseEl.addEventListener("change", () => { hideRebase = noRebaseEl.checked; renderTable(); });
    noBetterEl.addEventListener("change", () => { hideBetter = noBetterEl.checked; renderTable(); });
    // Catalog Kind toggle: scope the list to gear / enchant / material (or all).
    kindFilterEl.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-kind]"); if (!b) return;
      catalogKind = b.dataset.kind;
      [...kindFilterEl.children].forEach((c) => c.classList.toggle("on", c === b));
      // If the active sort column is hidden under the new kind, fall back to the default sort.
      const cols = catalogKind !== "all" ? CATALOG_COLS[catalogKind] : null;
      if (cols && !cols.includes(sort.col)) sort = { ...views[active].defaultSort };
      renderTable();
    });
    ownedFilterEl.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-owned]"); if (!b) return;
      ownedOnly = b.dataset.owned === "owned";
      [...ownedFilterEl.children].forEach((c) => c.classList.toggle("on", c === b));
      renderTable();
    });
    statTargetEl.addEventListener("change", () => {
      statTarget = statTargetEl.value;
      views[UPGRADES_TAB] = buildUpgradeView(statTarget);
      sort = { ...views[UPGRADES_TAB].defaultSort };
      expanded.clear();
      renderTable();
    });
    // "Hide lossy" chip (inverse of allowLossy): checked = hide lossy moves. Affects both
    // the points view (filter) and the threshold bundle. Default checked → allowLossy false.
    hideLossyEl.addEventListener("change", () => {
      allowLossy = !hideLossyEl.checked;
      views[UPGRADES_TAB] = buildUpgradeView(statTarget);
      recomputeThreshold();
      if (active === UPGRADES_TAB) sort = { ...views[UPGRADES_TAB].defaultSort };
      expanded.clear();
      renderTable();
    });
    // Free-item toggles (Enhancement Rune + raid essences): force the item's cost to
    // 0 (stockpile / weekly-raid drops) and re-price the cost graph in place. Both
    // feed tier-chain craftCost, so this rebuilds the Crafting + Items cost views AND
    // regenerates the move lists (tierStep costs depend on craftCost), then re-renders.
    // Re-derive everything that depends on the live `loadout` (after a gear edit or a
    // free-item re-price): the move catalog, the rebase/better hint maps, the ranked
    // Upgrades view, and the Threshold bundle, then re-render. The sidebar stat TOTALS
    // are adjusted by a slot's stat delta in commitSlot (before this runs); here we only
    // re-render them (recomputeThreshold → renderSidebar).
    function recomputeLoadout() {
      moves = generateMoves(loadout, moveCtx);
      rankedMoves = moves.filter(shownInPoints);
      rebaseSlots = slotsWithBaseSwap(loadout, moveCtx);
      bestBase = bestBaseSwapBySlot(loadout, moveCtx);
      bestEnchant = bestEnchantBySlotAffix(loadout, moveCtx);
      views[UPGRADES_TAB] = buildUpgradeView(statTarget);
      recomputeThreshold(true); // rebuilds the Threshold view + goal form (a gear edit shifts
      //                           currentStats, so the form's Current column must track) + sidebar
      renderTabs();             // live move count on the Upgrades tab label
      renderStatus();           // live move count on the status line
      renderTable();            // refresh the active tab (and the sidebar)
    }

    const applyFreeItems = () => {
      invalidate();
      catalogView = buildCatalogView();
      views[CATALOG_TAB] = catalogView;
      recomputeLoadout(); // re-prices feed all move costs → regenerate moves + threshold + render
    };
    // Re-derive the loot-box EV prices after a log change (SPEC §16.12), then rebuild what reads
    // them: the coster's cache + the catalog's RNG rows. No recomputeLoadout, a box is a drop,
    // not a crafting material, so move costs don't shift.
    function refreshBoxPrices() {
      applyBoxPrices();
      invalidate();
      catalogView = buildCatalogView();
      views[CATALOG_TAB] = catalogView;
    }
    // Flag/unflag ONE item as free (SPEC §17.9). From the Planner materials panel checkbox. Updates
    // both the persisted user set and the live `freeItems` the coster reads, then re-prices everywhere.
    const toggleFreeItem = (name, on) => {
      if (on) { userFreeItems.add(name); freeItems.add(name); }
      else { userFreeItems.delete(name); freeItems.delete(name); }
      persistUserFreeItems();
      applyFreeItems();
    };

    // Prep checklist tab (SPEC §14)
    // A pre-Upgrades list of things to do; INFUSION is the first (only) category so far. Infusion
    // has no published success rates, so it's not a costed move, just a per-slot goal tracker.
    // The player records what each piece currently rolls (folded into stat totals via slotStats);
    // the tab flags which slots still fall short of the usual target. Def is recordable but never
    // recommended. Other checklist categories (enchants, dyes, …) are a future addition.
    const infTargetLabel = (targets) =>
      targets.length
        ? targets.map((t) => `+${t.amount} ${INFUSION_STAT_LABEL[t.stat]}`).join(" or ")
        : `<span class="muted">—</span>`;
    // Read-only status view (editing lives in the sidebar gear editor). Three states:
    //   met → ✓; partial (has +1 of a goal stat) → chase +2 of it; none → a first-step suggestion.
    // For a non-armor "none" the first step is the FREE +1 Bal/Crit stone; armor points at +2 Crit Res.
    function infStatusBadge(s, inf) {
      const st = infusionStatus(s, inf);
      if (st.status === "met") return `<span class="chk-badge met">✓ met</span>`;
      if (st.status === "partial") return `<span class="chk-badge partial">partial: infuse ${infTargetLabel(st.suggested)}</span>`;
      const msg = infusionKind(s) === "armor" ? `infuse ${infTargetLabel(st.suggested)}` : `use a free +1 Bal or Crit stone`;
      return `<span class="chk-badge todo">${msg}</span>`;
    }
    function renderChecklist() {
      const slots = SIDEBAR_SLOT_ORDER.filter((s) => loadout[s] && infusionKind(s));
      const rows = slots.map((s) => {
        const inf = loadout[s]?.infusion || null;
        const curLabel = inf?.stat && inf.amount
          ? `+${inf.amount} ${INFUSION_STAT_LABEL[inf.stat]}`
          : `<span class="muted">—</span>`;
        return `<tr>
          <td class="chk-slot">${s}</td>
          <td>${curLabel}</td>
          <td class="chk-target">${infTargetLabel(infusionTargets(s))}</td>
          <td>${infStatusBadge(s, inf)}</td>
        </tr>`;
      }).join("");
      const done = slots.filter((s) => infusionStatus(s, loadout[s]?.infusion || null).met).length;
      const infusionSection = `<h4 style="margin:14px 0 6px">Infusion <span class="muted" style="font-weight:400">(${done}/${slots.length} at goal)</span></h4>
        <table class="chk-table"><thead><tr><th>Slot</th><th>Current infusion</th><th>Usual goal</th><th>Status</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="4" class="muted">No infusable gear in the loadout.</td></tr>`}</tbody></table>`;
      checklistPanel.innerHTML = `<h3>Prep checklist</h3>
        <p class="hint">Before optimization with other tabs, make sure these things are completed on the character. Prioritize redeemer completions as they give a large boost (4000 Att, 20 crit, 3000 HP, 900 Dest). If this is your first character, Ein Lacher will take longer, but the stats are free. If not your first character, Ein Lacher is likely already complete. A balance outfit can be found for relatively cheap on the marketplace right after the monthly gacha is released. Not a priority, but should be done at some point. Infusions are free for +1 to bal or crit on accessories with ardri seal stones. +2 is a longer term goal, as it random chance and costs gold. Infusions on weapon and armor aren't advised until you upgrade to Uaithne gear. Infusions are lost when advancing from the free Orna gear to Uaithne.</p>
        ${renderPrepGoals()}
        ${infusionSection}`;
    }
    // Manual goal sections (Redeemers, Ein Lacher, …). One-time done/not-done toggles with a
    // fixed stat reward. Checkbox state persists in checklistDone; rewards are display-only.
    function renderPrepGoals() {
      return PREP_GOALS.map((sec) => {
        const secDone = sec.items.filter((it) => checklistDone.has(it.id)).length;
        const rows = sec.items.map((it) => `<tr>
          <td class="chk-slot"><label style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <input type="checkbox" class="chk-goal" data-goal="${esc(it.id)}"${checklistDone.has(it.id) ? " checked" : ""}>
            ${it.label}</label></td>
          <td class="chk-target">${it.reward || `<span class="muted">—</span>`}</td>
          <td class="chk-target"><button class="planbtn" type="button" data-goal-plan="${esc(it.id)}" title="Add this goal to your Planner path as a step.">Add to plan</button></td>
        </tr>`).join("");
        return `<h4 style="margin:14px 0 6px">${sec.section} <span class="muted" style="font-weight:400">(${secDone}/${sec.items.length} done)</span></h4>
          <table class="chk-table chk-goals">
          <colgroup><col class="chk-col-goal"><col class="chk-col-reward"><col class="chk-col-action"></colgroup>
          <thead><tr><th>Goal</th><th>Reward</th><th></th></tr></thead>
          <tbody>${rows}</tbody></table>`;
      }).join("");
    }

    // Inventory edit (a +/- stepper on a material/catalog row): persist the new stock, then
    // re-net every move and rebuild the catalog (the Owned column / filter). Unlike the free
    // toggles this is NOT a per-unit cost change, so coster.invalidate() is unnecessary, the
    // netting happens per MOVE at generation time, so a moves rebuild is what re-prices.
    const applyInventory = () => {
      persistInventory();
      preserveRowOrder = true; // keep the clicked row where it is across the re-net (#2/#3)
      catalogView = buildCatalogView();
      views[CATALOG_TAB] = catalogView;
      recomputeLoadout();
    };

    // Veto edit (add/remove a rule): persist, then regenerate every move (the solver reads
    // the live by-reference `vetoes`), refresh the manage panel + its count, and re-render.
    // Vetoes don't touch the catalog, so no catalog rebuild, just the move lists.
    const applyVetoes = () => {
      persistVetoes();
      recomputeLoadout();
      renderVetoPanel();
    };
    // Raid mode panel: a raid picker (hardest→easiest, like the sheet) + a read-only
    // view of the resulting goals, each tagged floor (QB entry min) or cap (ceiling).
    function raidGoals() {
      if (!raids.length) return `<p class="warn">No raid data loaded.</p>`;
      const r = raidByName[thRaid] || raids[0];
      const opts = [...raids].reverse().map((x) =>
        `<option value="${esc(x.raid)}" ${x.raid === r.raid ? "selected" : ""}>${esc(x.raid)} (Lv ${x.level})</option>`).join("");
      const aimToggle = `<div class="modeToggle" style="margin:0 0 0 8px">
        <button data-aim="qb" class="${thRaidAim === "qb" ? "on" : ""}" title="Quick-Battle entry minimums">QB entry</button>
        <button data-aim="cap" class="${thRaidAim === "cap" ? "on" : ""}" title="Entry floors with Bal/Crit/Crit Res raised to the raid's caps">Caps</button></div>`;
      const tgts = raidTargets(r);
      const rows = Object.keys(STAT_LABEL).filter((k) => tgts[k] != null).map((k) => {
        const isCap = thRaidAim === "cap" && r.caps[k] != null && tgts[k] === r.caps[k];
        const cur = thCurrent[k] ?? 0, tgt = tgts[k], met = cur >= tgt;
        return `<tr><td>${STAT_LABEL[k]}</td><td>${fmt(cur)}</td>` +
          `<td class="need ${met ? "met" : "short"}">${fmt(tgt)} <span class="muted">${isCap ? "cap" : "floor"}</span></td></tr>`;
      }).join("");
      return `<table class="goals"><tbody><tr><td>Raid</td>` +
        `<td style="display:flex;align-items:center"><select data-raid style="width:160px">${opts}</select>${aimToggle}</td></tr></tbody></table>` +
        `<table class="goals"><thead><tr><th>Stat</th><th>Current</th><th>Target ≥</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    // A comma-formatted numeric input flanked by themed −/+ steppers, the Target tab's
    // take on the sidebar stat editor (no native spinner wheels). `dataAttr` is the raw
    // attribute the input handler keys on (e.g. `data-tgt="att"`); `step` sizes the nudge.
    const numField = (dataAttr, value, { step = 1, placeholder = "—" } = {}) =>
      `<span class="stepwrap">` +
      `<button class="numstep" data-step="${-step}" tabindex="-1">−</button>` +
      `<input class="numedit" type="text" inputmode="numeric" ${dataAttr} ` +
        `value="${value === "" || value == null ? "" : fmt(value)}" placeholder="${placeholder}">` +
      `<button class="numstep" data-step="${step}" tabindex="-1">+</button></span>`;

    // threshold goal form + live summary
    function renderThresholdForm() {
      const stats = Object.entries(STAT_LABEL);
      const toggle = `<div class="modeToggle">
        <button data-mode="target" class="${thMode === "target" ? "on" : ""}">Target ≥ N</button>
        <button data-mode="maximize" class="${thMode === "maximize" ? "on" : ""}">Maximize</button>
        <button data-mode="raid" class="${thMode === "raid" ? "on" : ""}">Raid</button></div>`;
      const goals = thMode === "raid"
        ? raidGoals()
        : thMode === "target"
        ? `<table class="goals"><thead><tr><th>Stat</th><th>Current</th><th>Target ≥ / floor</th></tr></thead><tbody>` +
          stats.map(([k, l]) => `<tr><td>${l}</td>` +
            `<td>${numField(`data-cur="${k}"`, thCurrent[k] ?? "")}</td>` +
            // Blank by default. YOU choose which stats to floor (issue 7). A value you type is a hard
            // MIN for that stat (and a goal if above current); leave it blank for no constraint.
            `<td>${numField(`data-tgt="${k}"`, thTarget[k] ?? "")}</td></tr>`).join("") +
          `</tbody></table>`
        : `<table class="goals"><thead><tr><th>Maximize</th><th></th></tr></thead><tbody>` +
          `<tr><td>Ranking points</td><td><input type="checkbox" data-max="points" ${thMaximize.has("points") ? "checked" : ""}></td></tr>` +
          stats.map(([k, l]) => `<tr><td>${l}</td>` +
            `<td><input type="checkbox" data-max="${k}" ${thMaximize.has(k) ? "checked" : ""}></td></tr>`).join("") +
          `</tbody></table>`;
      const hint = thMode === "raid"
        ? `Pick a raid. The app sets its goals (Quick-Battle entry <b>floors</b>, with Balance/Crit/Crit Res raised to the raid's <b>caps</b>) and assembles the cheapest bundle to reach them. Defaults to the easiest raid your current stats can't yet enter.`
        : thMode === "maximize"
        ? `Check <b>Ranking points</b> for the best overall gear, or check specific stats to push them as far as your gear allows (accepting tradeoffs on others, e.g. Att Spd at the cost of Balance). Points and stats are mutually exclusive.`
        : `Enter a <b>Target ≥</b> only for the stats you care about. Each is both a goal (if above your current) and a hard <b>floor</b> the bundle won't drop below. Leave a stat blank for no constraint. The app assembles the cheapest bundle to reach your goals without breaching a floor (greedy, SPEC §7.2). Current totals seed from your character. Edit if stale.`;
      thresholdPanel.innerHTML =
        `<h3>Target</h3><p class="hint">${hint}</p>` +
        toggle + goals + `<div class="tsummary" id="tsummary"></div>`;
      updateThresholdSummary();
    }

    // Planner tab (SPEC §17, user-built upgrade paths)
    // A numbered, plain-language step list the user assembles and follows one card at a time.
    // Completion is DERIVED (reconcilePath, re-run every render), never manually checked, so a
    // card flips to "done" the moment the real gear reaches it and re-flags if you edit gear
    // backward. Kept deliberately simple, this tab is for players the Upgrades tab overwhelms.
    const planSlotLabel = (s) => String(s).replace(/(\d+)/, " $1").replace(/^./, (c) => c.toUpperCase());
