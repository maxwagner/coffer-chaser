<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffer Chaser</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <meta name="theme-color" content="#111318" />
  <!-- Enable cross-origin isolation (SharedArrayBuffer → threaded wasm for the Scanner's PP-OCR)
       on GitHub Pages, which can't send COOP/COEP headers. No-op locally (serve.py sends them). -->
  <script src="coi-serviceworker.js"></script>
  <style>
    :root {
      --bg: #111318; --surface: #1c1f27; --surface2: #16181f; --border: #2a2d38;
      --fg: #d4d8e2; --fg-dim: #6b7180; --head: #8a9ab8; --gold: #c9a84c;
      --live: #3a8a50; --fallback: #c9a84c; --accent: #4d80b8;
      --good: #5fb87a; --bad: #c96a6a;
      --enchant: #9a7fd0; --enchant-border: #4a3f6a;
      --font-sans: "Segoe UI", system-ui, sans-serif;
      --font-mono: Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg);
      font: 14px/1.5 var(--font-sans); padding: 24px; }
    .apphdr { margin-bottom: 4px; }
    .pagerow { display: flex; gap: 24px; align-items: flex-start; }
    .leftcol { flex: 1 1 auto; min-width: 0; }
    .content { display: flex; gap: 24px; align-items: flex-start; }
    .main { flex: 1 1 auto; min-width: 0; overflow-x: auto; }
    .main.plan-scroll { overflow: visible; } /* let the Planner's sticky materials panel pin to the page */
    /* Inventory sidebar (read-only) */
    .sidebar { flex: 0 0 280px; position: sticky; top: 24px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; font-size: 13px;
      max-height: calc(100vh - 48px); overflow-y: auto; }
    .sidebar h3 { margin: 0 0 2px; font-size: 13px; color: var(--head); text-transform: uppercase; letter-spacing: .03em; }
    .sidebar h3.mt { margin-top: 14px; }
    .sidebar .pts { color: var(--gold); font-family: var(--font-mono); }
    .sidebar .gear { list-style: none; margin: 6px 0 0; padding: 0; font-size: 12px; }
    .sidebar .gear li { padding: 3px 0; border-bottom: 1px solid var(--border); }
    /* Two lines: name on top (full width, ellipsis only for the longest), scrolls below.
       Both share one size, hierarchy is color + weight, not a size jump. */
    .sidebar .gear .item { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); font-weight: 600; }
    .sidebar .gear .enh { color: var(--gold); font-family: var(--font-mono); }
    .sidebar .gear .affix { color: var(--fg-dim); margin-top: 1px; }
    .sidebar .statgrid { display: grid; grid-template-columns: auto auto auto; gap: 0 10px; margin-top: 4px; align-items: baseline; font-size: 12px; line-height: 1.35; }
    .sidebar .statgrid.proj-cols { grid-template-columns: auto auto auto auto; } /* +projected-total col */
    .sidebar .statgrid .sk { color: var(--fg-dim); }
    .sidebar .statgrid .sv { font-family: var(--font-mono); text-align: right; }
    .sidebar .statgrid .sd { font-family: var(--font-mono); text-align: right; font-size: 12px; }
    .sidebar .statgrid .st { font-family: var(--font-mono); text-align: right; font-weight: bold; }
    .sidebar .statgrid .st.nochange { color: var(--fg-dim); font-weight: normal; }
    .sidebar .statgrid .sd .nochange { color: var(--fg-dim); }
    .sidebar .proj { color: var(--head); font-size: 11px; margin-top: 8px; }
    .sidebar .projnote { margin: 4px 0 2px; }
    /* click-to-edit stat value (matches the gear-slot edit pattern) */
    .sidebar .statgrid .sv.editable-stat { cursor: pointer; border-radius: 3px; padding: 1px 4px;
      border: 1px solid transparent; transition: background .1s; }
    .sidebar .statgrid .sv.editable-stat:hover { background: var(--surface); border-color: var(--border); }
    /* editing: themed −/+ steppers flanking a borderless number field (no native white spinner) */
    .sidebar .statgrid .sv.editing-stat { display: inline-flex; align-items: center; gap: 3px; justify-content: flex-end; }
    .sidebar .statgrid .sv input.statedit { width: 58px; font-family: var(--font-mono); text-align: right;
      background: var(--surface); color: var(--fg); border: 1px solid var(--border); border-radius: 3px; padding: 1px 4px;
      -moz-appearance: textfield; appearance: textfield; }
    .sidebar .statgrid .sv input.statedit:focus { outline: none; border-color: var(--head); }
    .sidebar .statgrid .sv input.statedit::-webkit-outer-spin-button,
    .sidebar .statgrid .sv input.statedit::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .sidebar .statstep { width: 18px; height: 18px; flex: 0 0 auto; display: inline-flex; align-items: center;
      justify-content: center; background: var(--surface); color: var(--fg-dim); border: 1px solid var(--border);
      border-radius: 3px; cursor: pointer; font-size: 13px; line-height: 1; padding: 0; }
    .sidebar .statstep:hover { color: var(--fg); border-color: var(--head); }
    .sidebar .resetstats { background: none; border: none; color: var(--fg-dim); font-size: 11px; cursor: pointer;
      text-decoration: underline; padding: 0; float: right; }
    .sidebar .resetstats:hover { color: var(--fg); }
    /* Sidebar inline gear editor */
    .sidebar .gear li.editable { cursor: pointer; border-radius: 4px; transition: background .1s; }
    .sidebar .gear li.editable:hover { background: var(--surface); }
    .sidebar .edithint { color: var(--fg-dim); font-size: 10px; font-weight: 400; text-transform: none; letter-spacing: 0; }
    .sidebar .resetload { background: none; border: none; color: var(--fg-dim); font-size: 11px; cursor: pointer;
      text-decoration: underline; padding: 0; float: right; }
    .sidebar .resetload:hover { color: var(--fg); }
    /* Character save slots */
    .sidebar .profileblock { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .sidebar .profrow { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .sidebar .profrow select { flex: 1 1 auto; min-width: 0; padding: 5px 6px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 5px; color: var(--fg); font-size: 12px; }
    .sidebar .profrow .presetsel { flex: 1 1 100%; }
    .sidebar .profbtns button { background: var(--surface); border: 1px solid var(--border); border-radius: 5px;
      color: var(--fg); font-size: 11px; padding: 4px 8px; cursor: pointer; }
    .sidebar .profbtns button:hover { border-color: var(--head); color: var(--head); }
    .sidebar .profbtns button:disabled { opacity: .45; cursor: default; }
    .sidebar .profbtns button:disabled:hover { border-color: var(--border); color: var(--fg); }
    .sidebar .profbtns .prof-del:hover { border-color: var(--neg, #d66); color: var(--neg, #d66); }
    .sidebar .gear li.editing { padding: 8px 0; display: block; }
    .sidebar .efield { display: flex; flex-direction: column; gap: 2px; margin: 5px 0; }
    .sidebar .efield label { color: var(--fg-dim); font-size: 11px; }
    .sidebar .efield select, .sidebar .efield input { width: 100%; padding: 5px 6px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 5px; color: var(--fg); font-size: 12px; }
    .sidebar .etune .tunegrid { display: grid; grid-template-columns: 1fr 62px auto; gap: 3px 6px; align-items: center; margin-top: 3px; }
    .sidebar .etune .tlbl { font-size: 11px; color: var(--fg-dim); }
    .sidebar .etune .tunegrid input { width: 100%; padding: 3px 5px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 5px; color: var(--fg); font-size: 12px; }
    .sidebar .etune .tunegrid .muted { font-size: 11px; }
    .sidebar .einf .infgrid { display: grid; grid-template-columns: 1fr 62px; gap: 6px; align-items: center; margin-top: 3px; }
    .sidebar .einf .infgrid select { width: 100%; padding: 3px 5px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 5px; color: var(--fg); font-size: 12px; }
    .sidebar .ebtns { display: flex; gap: 6px; margin-top: 8px; }
    .sidebar .ebtns button { flex: 1; padding: 5px; border: 1px solid var(--border); border-radius: 5px;
      cursor: pointer; font-size: 12px; }
    .sidebar .ebtns .esave { background: var(--accent); color: #fff; border-color: var(--accent); }
    .sidebar .ebtns .ecancel { background: var(--surface); color: var(--fg-dim); }
    /* live stat-change preview inside the gear editor */
    .sidebar .epreview { margin-top: 8px; padding: 7px 8px; background: var(--surface); border-radius: 5px; font-size: 11px; }
    .sidebar .epreview .ptitle { color: var(--fg-dim); margin-bottom: 3px; }
    .sidebar .epreview .pdiff { line-height: 1.5; }
    .sidebar .epreview .pnet { margin-top: 4px; color: var(--fg-dim); }
    /* Baseline-align the tagline with the wordmark (they read as one run of text);
       the icon/badges are not text, so they stay optically centered. */
    h1 { font-size: 18px; margin: 0 0 4px; display: flex; align-items: baseline; gap: 8px; }
    h1 .app-icon { display: block; align-self: center; }
    h1 .hdr-ver, h1 .hdr-status { align-self: center; }
    h1 .tagline { color: var(--fg-dim); font-size: 13px; font-weight: 400; }
    h1 .hdr-status { margin-left: auto; }
    /* Version link (header) → changelog modal. */
    h1 .hdr-ver { margin-left: auto; background: none; border: 1px solid var(--border);
      color: var(--fg-dim); font: 600 11px var(--font-mono); padding: 2px 7px;
      border-radius: 4px; cursor: pointer; }
    h1 .hdr-ver:hover { color: var(--fg); border-color: var(--head); }
    h1 .hdr-ver + .hdr-status { margin-left: 8px; }
    /* Freshness badge sized to match the version button (11px, same box height). */
    h1 .hdr-status { display: inline-flex; align-items: center; }
    h1 .hdr-status .badge { font-size: 11px; padding: 2px 8px; line-height: normal; }
    .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 60;
      display: flex; align-items: flex-start; justify-content: center; padding: 60px 16px; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      width: 100%; max-width: 640px; max-height: 80vh; overflow: auto; }
    .modal .mhead { display: flex; align-items: center; gap: 8px; padding: 12px 16px;
      border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); }
    .modal .mhead h2 { margin: 0; font-size: 15px; }
    .modal .mclose { margin-left: auto; background: none; border: none; color: var(--fg-dim);
      font-size: 18px; line-height: 1; cursor: pointer; }
    .modal .mclose:hover { color: var(--fg); }
    .modal .mbody { padding: 4px 16px 16px; }
    .chg-rel { padding: 10px 0; border-bottom: 1px solid var(--border); }
    .chg-rel:last-child { border-bottom: none; }
    .chg-rel > summary { cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 8px; }
    .chg-rel > summary::-webkit-details-marker { display: none; }
    .chg-rel > summary::before { content: "▸"; color: var(--fg-dim); font-size: 11px; }
    .chg-rel[open] > summary::before { content: "▾"; }
    .chg-rel > summary:hover .chg-ver { color: var(--fg); }
    .chg-ver { font: 600 13px var(--font-mono); color: var(--gold); }
    .chg-date { color: var(--fg-dim); font-size: 12px; }
    .chg-count { color: var(--fg-dim); font-size: 11px; margin-left: auto; }
    .chg-rel[open] .chg-count { display: none; }
    .chg-notes { color: var(--fg-dim); font-size: 12px; margin: 4px 0 0; }
    .chg-title { color: var(--fg); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chg-count { margin-left: auto; }
    .chg-rel ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
    .chg-rel li { margin: 3px 0; }
    /* Preset explainer (same modal chrome, narrower + a "what to do next" list). */
    .preset-modal { max-width: 460px; }
    .preset-modal .mbody { padding-top: 10px; }
    /* Section labels read like the sidebar's h3 headers; the prose below them sits at
       full --fg so the two never blur together. */
    .preset-sec { margin: 14px 0 0; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--head); }
    .preset-sec:first-child { margin-top: 0; }
    .preset-goal { margin: 5px 0 0; font-size: 13px; line-height: 1.5; color: var(--fg); }
    .preset-modal ul { margin: 5px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.5; color: var(--fg); }
    .preset-modal li { margin: 4px 0; }
    .preset-acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;
      padding-top: 12px; border-top: 1px solid var(--border); }
    .preset-acts button { background: var(--surface); border: 1px solid var(--border); border-radius: 5px;
      color: var(--fg); font-size: 12px; padding: 6px 12px; cursor: pointer; }
    .preset-acts button:hover { border-color: var(--head); color: var(--head); }
    .preset-acts .preset-apply { border-color: var(--head); color: var(--head); font-weight: 600; }
    /* While booting: show only the header icon/title/subtitle + the spinner. Hide the tabs,
       controls, table, sidebar, and the freshness badge until the first render completes. */
    body.booting .tabs, body.booting #controls, body.booting #maintable,
    body.booting .sidebar, body.booting .hdr-status, body.booting .hdr-ver { display: none; }
    /* Boot spinner, shown until the first render (after the Sheet loaders resolve). */
    .boot-loading { display: flex; align-items: center; gap: 10px; padding: 40px 4px;
      color: var(--fg-dim); font-size: 13px; }
    .boot-spinner { width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid var(--border); border-top-color: var(--gold);
      animation: boot-spin 0.7s linear infinite; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    .sub { color: var(--fg-dim); margin: 0 0 12px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    .badge.live { background: var(--live); color: #fff; }
    .badge.fallback { background: var(--fallback); color: #111; }
    .tabs { display: flex; gap: 4px; margin: 12px 0; border-bottom: 1px solid var(--border); }
    .tab { padding: 8px 16px; cursor: pointer; color: var(--fg-dim); border-bottom: 2px solid transparent; user-select: none; }
    .tab.active { color: var(--fg); border-bottom-color: var(--accent); }
    input[type="search"] { width: 280px; max-width: 100%; padding: 7px 10px; margin: 0;
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--fg); font-size: 14px; }
    /* One clean toolbar row: everything vertically centered on a single baseline, even gaps,
       a hairline rule under it, and no individual control margins to throw off alignment. */
    .controls { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap;
      margin: 4px 0 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .controls > * { margin: 0; }
    .controls input[type="search"] { margin: 0; }
    /* tidy number inputs, drop the spinner arrows that make the bar look busy */
    .controls input[type="number"]::-webkit-inner-spin-button,
    .controls input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .controls input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
    label.target { color: var(--fg-dim); font-size: 13px; margin: 0; display: inline-flex; align-items: center; gap: 6px; }
    select#statTarget { padding: 7px 10px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; color: var(--fg); font-size: 14px; }
    table { border-collapse: collapse; width: 100%; max-width: 1040px; }
    th, td { text-align: left; padding: 6px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { color: var(--head); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; cursor: pointer; user-select: none; }
    th:hover { color: var(--fg); }
    th .arrow { opacity: .5; font-size: 10px; }
    td.num { text-align: right; font-family: var(--font-mono); color: var(--gold); }
    td.dim { color: var(--fg-dim); font-family: var(--font-mono); }
    tr.mainrow.expandable { cursor: pointer; }
    tr.mainrow.expandable:hover td { background: var(--surface2); }
    .caret { display: inline-block; width: 14px; color: var(--fg-dim); }
    .pill { font-size: 11px; padding: 1px 6px; border-radius: 3px; background: var(--surface); border: 1px solid var(--border); color: var(--fg-dim); }
    .pill.kgear { color: var(--accent); border-color: var(--accent); }
    .pill.kenchant { color: var(--enchant); border-color: var(--enchant-border); }
    .pill.kmaterial { color: var(--fg-dim); }
    .pill.ksealshop { color: var(--gold); border-color: var(--gold); }
    .pill.krng { color: #b48ce0; border-color: #b48ce0; } /* loot boxes valued at observed opening EV (SPEC §16.12) */
    .pill.klegacy { color: var(--fg-dim); border-style: dashed; } /* retired items, price-tracked only (SPEC §7.3) */
    .deal { font-size: 11px; font-weight: 600; color: var(--good); margin-left: 6px; }
    .srcicon { display: inline-flex; vertical-align: -2px; margin-right: 3px; }
    .srcicon svg { width: 12px; height: 12px; }
    .srcicon.mk.on { color: var(--accent); }
    .srcicon.cr.on { color: var(--fallback); }
    .srcicon.off { color: var(--fg-dim); opacity: .4; }
    .profit { font-size: 11px; font-weight: 600; color: var(--good); margin-left: 6px; border: 1px solid var(--good); border-radius: 3px; padding: 0 4px; }
    .up { color: var(--bad); } .down { color: var(--good); }
    .pos { color: var(--good); } .neg { color: var(--bad); }
    .detailrow td { background: var(--surface2); white-space: normal; padding: 12px 16px 14px 30px; }
    .detail h4 { margin: 0 0 6px; font-size: 12px; color: var(--head); text-transform: uppercase; letter-spacing: .03em; }
    .detail .grid { display: grid; grid-template-columns: auto auto; gap: 2px 18px; width: fit-content; margin-bottom: 10px; }
    .detail .k { color: var(--fg-dim); } .detail .v { font-family: var(--font-mono); }
    .detail .v.gold { color: var(--gold); }
    .detail .best { color: var(--good); font-weight: 600; }
    .detail table.shoptbl { border-collapse: collapse; font-size: 12px; margin-top: 8px; }
    .detail table.shoptbl th { color: var(--fg-dim); font-weight: 500; text-align: right; padding: 2px 10px 4px; }
    .detail table.shoptbl th:first-child { text-align: left; }
    .detail table.shoptbl td { padding: 2px 10px; font-family: var(--font-mono); }
    .detail table.shoptbl td:first-child { font-family: inherit; }
    .detail table.shoptbl tr.pos td { color: var(--good); }
    .detail .choiceopt { display: flex; justify-content: space-between; gap: 12px; padding: 1px 0; color: var(--fg-dim); }
    .detail .choiceopt.pos { color: var(--good); font-weight: 600; }
    .detail .reench-list { display: flex; flex-direction: column; gap: 4px; font-size: 11px; margin-top: 3px; }
    /* Per-scroll re-enchant line: name · gold · ignore + change (issue 3, ephemeral what-if). */
    .detail .reench-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .detail .reench-line .rn-gold { font-family: var(--font-mono); color: var(--gold); }
    .detail .reench-line .rn-gold.struck { text-decoration: line-through; color: var(--fg-dim); }
    .ignorebtn { background: var(--surface); color: var(--fg-dim); border: 1px solid var(--border);
      border-radius: 5px; padding: 1px 8px; cursor: pointer; font-size: 11px; }
    .ignorebtn:hover { border-color: var(--accent); color: var(--fg); }
    .ignorebtn.on { border-color: var(--accent); color: var(--accent); }
    /* "change" scroll picker: a <details> whose summary is the button; the <select> drops below. */
    details.reench-change { display: inline-block; }
    details.reench-change > summary { list-style: none; cursor: pointer; color: var(--fg-dim);
      border: 1px solid var(--border); border-radius: 5px; padding: 1px 8px; font-size: 11px; user-select: none; }
    details.reench-change > summary::-webkit-details-marker { display: none; }
    details.reench-change[open] > summary { border-color: var(--accent); color: var(--accent); }
    details.reench-change > summary:hover { border-color: var(--accent); color: var(--fg); }
    .reench-sel { margin-top: 4px; background: var(--surface); color: var(--fg); border: 1px solid var(--border);
      border-radius: 5px; padding: 2px 4px; font-size: 11px; max-width: 220px; }
    .muted { color: var(--fg-dim); }
    .detail .methods { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .detail .method .mname { color: var(--fg-dim); }
    .detail .method .mtotal { font-family: var(--font-mono); color: var(--gold); margin-left: 8px; }
    .detail .method .na { color: var(--fg-dim); margin-left: 8px; font-style: italic; }
    .detail .method .mbreak { display: block; font-size: 12px; color: var(--fg-dim); font-family: var(--font-mono); margin-top: 2px; }
    .detail .method.best .mname, .detail .method.best .mtotal { color: var(--good); font-weight: 600; }
    .detail ul { margin: 0; padding-left: 16px; }
    /* Recipe material list as an aligned grid (qty · name · unit ea · = line · trend) so the
       numeric columns line up the same way the Math grid's values do, instead of ragged inline
       text. Numbers right-aligned + monospace; name flexes so the gold columns share a right edge. */
    .mats { display: grid; grid-template-columns: auto auto auto auto auto auto; gap: 2px 14px;
      align-items: center; width: fit-content; max-width: 100%; margin: 0 0 10px; }
    .mats .mq { color: var(--fg-dim); white-space: nowrap; }
    .mats .mn { color: var(--fg); }
    .mats .mn[title] { cursor: help; border-bottom: 1px dotted var(--border); }
    .mats .mu, .mats .ml { font-family: var(--font-mono); color: var(--gold); text-align: right; white-space: nowrap; }
    .mats .mu { color: var(--fg-dim); }
    .mats .ml.owned { color: var(--accent); } /* line fully covered by owned stock */
    .mats .mt { font-size: 11px; text-align: right; white-space: nowrap; }
    .mats .mtag { color: var(--fg-dim); font-size: 11px; }
    /* Owned-inventory +/- stepper (SPEC §5.2): on each material row + the catalog Owned col */
    .invstep { display: inline-flex; align-items: center; gap: 4px; justify-self: end; white-space: nowrap; }
    .invstep .inv-n { min-width: 26px; text-align: center; font-family: var(--font-mono); color: var(--fg-dim); } /* fixed width so +/- don't jitter as the count grows */

    .tunerow { margin-top: 8px; }

    /* A nested crafted sub-recipe in a move detail: collapsed by default; the summary is styled

    details.subrecipe { margin-top: 8px; }
    details.subrecipe > summary { cursor: pointer; list-style: none; padding: 2px 0; user-select: none; }
    details.subrecipe > summary::-webkit-details-marker { display: none; }
    details.subrecipe > summary .srhead { font-size: 12px; color: var(--head); text-transform: uppercase; letter-spacing: .03em; }
    details.subrecipe > summary::before { content: "▸ "; color: var(--fg-dim); }

    /* Inline expand-in-place sub-recipes (issue 2/4): a CRAFTED material row is itself the toggle.

    .mats .mn.expandable { cursor: pointer; }

    details.wipe > summary::marker { color: var(--fg-dim); }

    .wipe-opt { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; }

    .wipe-opt-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 2px; }
    .wipe-opt-head .v { font-family: var(--font-mono); white-space: nowrap; }

    /* Multi-tier recipe carousel: ONE box, one slide at a time (combined buy list first);
       the ‹ / › buttons or a click on the body step through the tier chain. Compact, only
       the active slide takes vertical space. */
    .recipe-carousel { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--surface); }
    .rc-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .recipe-nav { cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--fg);
      border-radius: 6px; width: 24px; height: 24px; line-height: 1; font-size: 15px; padding: 0; }
    .recipe-nav:hover { border-color: var(--head); }
    .rc-count { font-size: 12px; color: var(--fg-dim); }
    .rc-title { font-size: 12px; color: var(--fg); }
    /* Stack every slide in ONE grid cell so the box height stays constant (= the tallest
       slide, the combined list) as you step through. A variable height would shrink the
       page and, near the bottom, clamp the scroll → the whole box jumps. Toggle visibility,
       not display, so the hidden slides still reserve the cell's height. */
    .rc-slides { display: grid; cursor: pointer; }
    .recipe-slide { grid-area: 1 / 1; visibility: hidden; }
    .recipe-slide.active { visibility: visible; }
    .recipe-slide ul { padding-left: 16px; }
    .recipe-slide .grid { display: grid; grid-template-columns: auto auto; gap: 2px 12px; width: fit-content; margin-bottom: 8px; }
    .numfilter { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-dim); font-size: 13px; margin: 0; }
    /* Only number/text inputs get the fixed width, a checkbox left in this rule would
       be stretched to 84px, leaving a big gap between the box and its label. */
    .numfilter input:not([type="checkbox"]) { width: 84px; padding: 7px 8px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; color: var(--fg); font-size: 13px; font-family: var(--font-mono); }
    .numfilter input[type="checkbox"] { margin: 0; }
    /* Boolean toggles ("Hide", "Free") styled to match the Kind .modeToggle segmented
       control: each chip is a <label> segment inside a .modeToggle container; the native
       checkbox is hidden and the whole label toggles it. Multi-select (unlike Kind, which
       is single-select via .on), so checked state highlights via :has(input:checked). */
    .modeToggle .chip { display: inline-flex; align-items: center; background: var(--surface);
      color: var(--fg-dim); padding: 6px 14px; cursor: pointer; font-size: 13px; user-select: none; }
    .modeToggle .chip input { display: none; }
    .modeToggle .chip:has(input:checked) { background: var(--accent); color: #fff; }
    /* Threshold mode */
    #thresholdPanel { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      padding: 14px 16px; margin: 0 0 14px; max-width: 1040px; }
    #thresholdPanel h3 { margin: 0 0 4px; font-size: 14px; color: var(--head); }
    #thresholdPanel .hint { color: var(--fg-dim); font-size: 12px; margin: 0 0 12px; }
    .modeToggle { display: inline-flex; gap: 2px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .modeToggle button { background: var(--surface); color: var(--fg-dim); border: none; padding: 6px 14px; cursor: pointer; font-size: 13px; }
    .modeToggle button.on { background: var(--accent); color: #fff; }
    table.goals { width: auto; max-width: none; margin: 0; }

    table.goals input { width: 88px; padding: 5px 7px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 5px; color: var(--fg); font-size: 13px; font-family: var(--font-mono); text-align: right; }
    table.goals .need.short { color: var(--bad); } table.goals .need.met { color: var(--good); }
    /* Comma-formatted numeric field flanked by themed −/+ steppers, the Target tab's take
       on the sidebar stat editor (no native spinner wheels). */
    .stepwrap { display: inline-flex; align-items: center; gap: 3px; }
    .stepwrap .numstep { width: 24px; height: 30px; flex: 0 0 auto; display: inline-flex; align-items: center;
      justify-content: center; background: var(--surface); color: var(--fg-dim); border: 1px solid var(--border);
      border-radius: 5px; cursor: pointer; font-size: 15px; line-height: 1; padding: 0; user-select: none; }
    .stepwrap .numstep:hover { color: var(--fg); border-color: var(--head); }
    table.goals input.numedit { width: 120px; }

    .goldrow { margin-top: 4px; }
    .goldrow input.numedit { width: 128px; padding: 5px 7px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 5px; color: var(--gold); font-size: 13px; font-family: var(--font-mono); text-align: right; }
    .tsummary { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }

    .tsummary .warn { color: var(--bad); }

    .movehint { color: var(--fg-dim); font-size: 11px; font-style: italic; cursor: help; margin-left: 6px; }
    .movehint b { font-style: normal; font-weight: 600; color: inherit; }
    /* Compact symbol hints (rebase / better). Width-minimizing badges; detail lives in the title tooltip. */
    .movehint.hint-sym { font-style: normal; font-size: 12px; font-weight: 700; margin-left: 5px; line-height: 1; }
    .movehint.hint-rebase { color: var(--gold); }
    .movehint.hint-better { color: var(--accent); }
    .movehint.hint-tune { color: var(--fg-dim); }   /* ⚙ tune marker (neutral) */
    .movehint.hint-reenh { color: var(--gold); }     /* ↻ re-enhance (extra work) */
    .movehint.hint-wipe { color: var(--bad); }       /* ⚠ enchants wiped on advance */
    .tiercount { cursor: help; }                     /* ×N tier count (has a data-tip) */
    /* Fast custom tooltip for [data-tip] hint badges, shows instantly (the native `title`
       delay can't be shortened). Fixed + body-attached so table overflow never clips it. */
    #hintTip { position: fixed; z-index: 1000; max-width: 320px; background: var(--surface2);
      color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px;
      font-size: 12px; line-height: 1.35; white-space: normal; pointer-events: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4); }
    /* Threshold + Catalog: bracket a group with an accent rail. The rail is a pseudo-element
       so it can be inset at the group's top (head) and bottom (last row). Consecutive
       groups then read as separate instead of blending into one continuous bar. */
    tr.grp-head td:first-child, tr.grp-child td:first-child { position: relative; }
    tr.grp-head td:first-child::before, tr.grp-child td:first-child::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
    tr.grp-head td:first-child::before { top: 5px; }
    tr.grp-last td:first-child::before { bottom: 5px; }
    tr.grp-head td { padding-top: 9px; }
    tr.grp-last td { padding-bottom: 9px; }
    tr.grp-child td:first-child { padding-left: 22px; }
    .gconn { color: var(--fg-dim); margin-right: 5px; }
    /* Gear Builder */

      padding: 14px 16px; margin: 0; max-width: 1040px; }

    #builderPanel .hint, #scannerPanel .hint, #checklistPanel .hint, #plannerPanel .hint { color: var(--fg-dim); font-size: 12px; margin: 0 0 12px; }

    /* Planner (SPEC §17) */
    .plan-toolbar { display: flex; gap: 8px; align-items: center; margin: 0 0 12px; flex-wrap: wrap; }
    .plan-ghost { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--fg); font-size: 12px; padding: 5px 10px; cursor: pointer; }
    .plan-ghost:hover { border-color: var(--accent); }

    .plan-consume { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; font-size: 12px; color: var(--fg-dim); cursor: pointer; user-select: none; }
    .plan-consume input { accent-color: var(--accent); cursor: pointer; margin: 0; }

    .plan-help:hover { border-color: var(--accent); color: var(--accent); }
    .plan-gold-edit { width: 110px; } /* the Total-gold click-to-type editor needs room for millions */

       it stays visible while you scroll a long path (SPEC §17.5). Collapses to one column narrow. */
    .plan-body { display: flex; gap: 16px; align-items: flex-start; }

       The face stays one line + status; click to reveal the rest. Warnings/gaps always show. */
    .plan-card .plan-btns, .plan-card .plan-diff { display: none; }

    .plan-card.sel .plan-diff { display: block; }

    /* Hover insertion line between cards: a slim hit strip that lights up with a + and opens
       the add chooser at that index (replaces the per-card "+ above / + below" buttons). */
    .plan-ins { position: relative; height: 12px; margin: -10px 0; z-index: 1; cursor: pointer; flex: 0 0 auto; }
    .plan-ins::before { content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 2px; border-radius: 1px; background: transparent; }
    .plan-ins:hover::before { background: var(--accent); }

    .plan-milestone-chip { flex: 0 0 auto; color: var(--good); border: 1px solid var(--good); border-radius: 10px; padding: 1px 9px; font-size: 12px; white-space: nowrap; }

    /* Completed steps read as "done": grayed label + faded card so they clearly recede

    .plan-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .plan-head .plan-label { flex: 1 1 auto; min-width: 0; }
    /* Right side of the head: live gold, the affordable flag, and the card's one primary action. */
    .plan-side { margin-left: auto; display: inline-flex; gap: 10px; align-items: center; flex: 0 0 auto; }
    .plan-side button { background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; color: var(--fg); font-size: 11px; padding: 2px 9px; cursor: pointer; }
    .plan-side button:hover { border-color: var(--accent); }
    .plan-handle { cursor: grab; color: var(--fg-dim); font-size: 13px; user-select: none; }
    .plan-num { color: var(--fg-dim); font-family: var(--font-mono); font-size: 12px; min-width: 18px; text-align: right; }
    .plan-chip { font-size: 10px; text-transform: uppercase; letter-spacing: .03em; padding: 1px 7px; border-radius: 10px; font-weight: 600; }
    .plan-chip-done { background: color-mix(in srgb, var(--good) 22%, transparent); color: var(--good); }
    .plan-chip-ready { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
    .plan-chip-blocked { background: color-mix(in srgb, var(--warn, #c90) 22%, transparent); color: var(--warn, #c90); }
    .plan-chip-impossible { background: color-mix(in srgb, var(--bad) 22%, transparent); color: var(--bad); }
    .plan-chip-note, .plan-chip-goal { background: var(--surface2); color: var(--fg-dim); border: 1px solid var(--border); }
    .plan-label { color: var(--fg); font-size: 13px; }
    .plan-meta { margin: 5px 0 0 26px; font-size: 12px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .plan-gold { color: var(--gold); font-family: var(--font-mono); }
    .plan-reason { color: var(--fg-dim); }
    /* Multi-tier fold hint: a lone tierStep card that re-prices as a whole multi-hop jump. */
    .plan-tierfold { margin: 5px 0 0 26px; font-size: 12px; color: var(--fg-dim); cursor: help; }
    .plan-tierfold b { color: var(--fg); font-weight: 600; }
    .plan-cover { color: var(--good); font-size: 11px; border: 1px solid var(--good); border-radius: 3px; padding: 0 5px; }
    /* Box-wait tag (SPEC §18): this step's materials partly arrive from FUTURE weekly boxes. */
    .plan-boxwait { color: var(--fg-dim); font-size: 11px; border: 1px dashed var(--border); border-radius: 3px; padding: 0 5px; white-space: nowrap; }
    /* Next-raid card controls (SPEC §17.13): the raid override select + QB/Caps aim toggle. */
    .plan-raid-ctl { display: flex; gap: 6px; align-items: center; margin: 2px 0 6px; }
    .plan-raid-ctl select { flex: 1 1 auto; min-width: 0; font-size: 11px; padding: 2px 4px;
      background: var(--surface); color: var(--fg); border: 1px solid var(--border); border-radius: 5px; }
    .plan-raid-aim { margin-bottom: 0; flex: 0 0 auto; }
    .plan-raid-aim button { font-size: 10px; padding: 2px 7px; background: transparent; border: none; color: var(--fg-dim); cursor: pointer; }
    .plan-raid-aim button.on { background: var(--surface2); color: var(--head); }
    .plan-diff { margin: 5px 0 0 26px; font-size: 12px; }
    .plan-warn { margin: 5px 0 0 26px; font-size: 12px; color: var(--warn, #c90); }
    .plan-gap { margin: 8px 0 0 26px; padding: 7px 9px; background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; font-size: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .plan-gap > span { color: var(--fg-dim); }
    .plan-gap button { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; color: var(--fg); font-size: 12px; padding: 3px 9px; cursor: pointer; }
    .plan-gap button:hover { border-color: var(--accent); }
    .plan-comment { margin: 6px 0 0 26px; padding: 6px 9px; background: var(--surface2); border: 1px solid var(--border);
      border-left: 3px solid var(--accent); border-radius: 5px; font-size: 12px; color: var(--fg); white-space: pre-wrap; word-break: break-word; }
    .plan-comment .plan-comment-h { display: inline-block; margin-right: 8px; font-size: 10px; text-transform: uppercase;
      letter-spacing: .04em; color: var(--fg-dim); }
    /* Tune-target stepper (SPEC §17.7): tick-adjust a tune step's target amount. */
    .plan-tunetarget { display: inline-flex; align-items: center; gap: 5px; color: var(--fg-dim);
      font-size: 12px; margin-right: 4px; }
    .plan-tunetarget b { color: var(--fg); font-family: var(--font-mono); font-weight: 600; }
    .plan-tunebtn { width: 20px; height: 20px; padding: 0; line-height: 1; background: var(--surface);
      border: 1px solid var(--border); border-radius: 5px; color: var(--fg); font-size: 13px; cursor: pointer; }
    .plan-tunebtn:hover { border-color: var(--accent); }
    .plan-comment-edit { margin: 6px 0 0 26px; display: flex; flex-direction: column; gap: 6px; }
    .plan-comment-input { width: 100%; max-width: 520px; background: var(--surface); color: var(--fg); border: 1px solid var(--border);
      border-radius: 5px; padding: 5px 8px; font: inherit; font-size: 12px; resize: vertical; }
    .plan-comment-input:focus { outline: none; border-color: var(--accent); }
    .plan-comment-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .plan-comment-actions button { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; color: var(--fg); font-size: 12px; padding: 4px 9px; cursor: pointer; }
    .plan-comment-actions button:hover { border-color: var(--accent); }
    .plan-comment-actions .plan-del:hover { border-color: var(--bad); color: var(--bad); }
    .plan-btns { margin: 8px 0 0 26px; display: flex; gap: 6px; flex-wrap: wrap; }
    .plan-btns button { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; color: var(--fg); font-size: 12px; padding: 4px 9px; cursor: pointer; }
    .plan-btns button:hover { border-color: var(--accent); }
    .plan-btns .plan-del:hover { border-color: var(--bad); color: var(--bad); }
    .plan-add { display: flex; flex-direction: column; gap: 6px; padding: 8px; border: 1px dashed var(--accent); border-radius: 6px; }
    .plan-add-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .plan-add input[type=text] { flex: 1 1 200px; min-width: 120px; padding: 5px 7px; background: var(--surface); border: 1px solid var(--border); border-radius: 5px; color: var(--fg); font-size: 12px; }
    .plan-add select { padding: 5px 7px; background: var(--surface); border: 1px solid var(--border); border-radius: 5px; color: var(--fg); font-size: 12px; max-width: 200px; }
    .plan-add button { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; color: var(--fg); font-size: 12px; padding: 5px 10px; cursor: pointer; }
    .plan-add button:hover { border-color: var(--accent); }
    .plan-add-or { color: var(--fg-dim); font-size: 11px; }
    /* Quick-add search (SPEC §17.7): a type-to-find box over every slot's candidate upgrades
       (+ checklist goals). Results are click-to-insert rows; already-planned ones are dimmed. */
    .plan-add input.plan-qa-input { flex: 0 0 auto; width: 100%; max-width: none; box-sizing: border-box; padding: 7px 9px; font-size: 13px; }
    .plan-qa-results { display: flex; flex-direction: column; max-height: 320px; overflow-y: auto; }
    .plan-qa-row { display: flex; gap: 10px; align-items: baseline; padding: 5px 8px; border-radius: 5px; cursor: pointer; font-size: 12px; }
    .plan-qa-row:hover { background: var(--surface); }
    .plan-qa-slot { color: var(--fg-dim); flex: 0 0 auto; min-width: 92px; }
    .plan-qa-label { color: var(--fg); flex: 1 1 auto; }
    .plan-qa-row.planned { opacity: 0.5; cursor: default; }
    .plan-qa-row.planned:hover { background: none; }
    .plan-qa-tag { font-size: 10px; text-transform: uppercase; color: var(--fg-dim); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; flex: 0 0 auto; }
    /* Toolbar ⋯ overflow menu (export / copy / import / select all). */
    .plan-more { position: relative; display: inline-block; }
    .plan-menu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 30; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 4px; display: flex; flex-direction: column; gap: 2px; min-width: 170px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35); }
    .plan-menu button { background: none; border: none; color: var(--fg); font-size: 12px; text-align: left; padding: 6px 10px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
    .plan-menu button:hover { background: var(--surface2); color: var(--head); }
    /* Keyboard-shortcuts reference: a toolbar "?" hover popover (SPEC §17.14). Its own
       affordance, no longer a footer squeezed into the ⋯ menu. Two aligned columns. */
    .plan-kbd-wrap { position: relative; display: inline-flex; align-items: center; }
    .plan-kbd-pop { display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; min-width: 300px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35); }
    .plan-kbd-wrap:hover .plan-kbd-pop, .plan-kbd-wrap:focus-within .plan-kbd-pop { display: block; }
    .plan-kbd-h { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--fg-dim); margin-bottom: 6px; }
    .plan-kbd-grid { display: grid; grid-template-columns: max-content 1fr; column-gap: 14px; row-gap: 6px; align-items: center; font-size: 11px; color: var(--fg-dim); }
    .plan-kbd-grid .keys { display: flex; gap: 4px; align-items: center; white-space: nowrap; }
    .plan-kbd-pop kbd { font: 10px/1.4 var(--font-mono); background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 1px 5px; color: var(--fg); }
    .plan-selcount { color: var(--fg-dim); font-size: 12px; }
    /* "Add to plan" / bundle-copy button, shared by the Upgrades detail footer, the Target
       summary, and the Checklist goal rows (SPEC §17 entry points). */
    .planbar { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); display: flex; }
    .planbtn { background: var(--surface); color: var(--accent); border: 1px solid var(--accent); border-radius: 5px; padding: 3px 11px; cursor: pointer; font-size: 12px; }
    .planbtn:hover { background: var(--accent); color: #fff; }
    .tplanbar { margin-top: 10px; }
    /* Inline import panel (file + paste) in the Planner toolbar. */
    .plan-import { margin: 0 0 12px; padding: 10px 12px; border: 1px dashed var(--accent); border-radius: 8px; display: flex; flex-direction: column; gap: 8px; max-width: 560px; }
    .plan-import-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .plan-import textarea { width: 100%; padding: 6px 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 5px; color: var(--fg); font-size: 12px; font-family: var(--font-mono); resize: vertical; box-sizing: border-box; }
    .plan-import-err { color: var(--bad); font-size: 12px; }
    /* No independent scroll, the whole panel moves as ONE with the page (a re-render must
       never leave a scrolled-away materials pile, and expanding a sub-recipe must not shift
       the clicked row out from under the cursor). align-self so it sizes to its content. */
    .plan-mats { flex: 0 0 clamp(360px, 46%, 560px); align-self: flex-start; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
    @media (max-width: 900px) { .plan-body { flex-direction: column; } .plan-mats { flex-basis: auto; width: 100%; } }
    .plan-mats h4 { margin: 0 0 6px; font-size: 13px; color: var(--head); }
    /* Sections read as blocks via a generous gap only, no divider rules. */
    .plan-mats > h4:not(:first-child), .plan-mats > .plan-mats-head:not(:first-child) { margin-top: 30px; }
    .plan-mats .plan-afford { color: var(--fg-dim); font-size: 12px; margin: 0 0 10px; }
    /* Rows are borderless (density stays); only the totals rows carry a hairline (top). */
    .plan-mat { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 12px; padding: 4px 0; }
    .plan-mat-name { color: var(--fg); flex: 1 1 auto; min-width: 0; }
    .plan-mat-name.expandable { cursor: pointer; }
    .plan-mat-name.expandable:hover { color: var(--head); }
    .plan-mat.plan-mat-sub .plan-mat-name { color: var(--fg-dim); }
    .plan-mat > span:last-child { flex: 0 0 auto; white-space: nowrap; text-align: right; font-family: var(--font-mono); }
    .plan-mat-ctl { display: flex; align-items: center; gap: 8px; } /* free flag + have/need text + the +/- owned stepper */
    /* Weekly boxes (SPEC §18): the per-row coverage tag and the schedule's week headers. */
    .plan-weekly-note { color: var(--fg-dim); font: 10px/1 var(--font-sans); border: 1px solid var(--border);
      border-radius: 9px; padding: 2px 7px; cursor: default; }
    .plan-weekly-week { font-size: 11px; margin-top: 6px; }
    /* "free" pill toggle: invisible until the row is hovered (no checkbox noise), always
       visible when active. Active = green tint, matching the row's "free" status text. */
    .plan-free-pill { background: transparent; border: 1px solid var(--border); border-radius: 9px;
      color: var(--fg-dim); font: 10px/1 var(--font-sans); padding: 2px 7px; cursor: pointer;
      opacity: 0; transition: opacity .12s; }
    .plan-mat:hover .plan-free-pill, .plan-free-pill:focus-visible { opacity: 1; }
    .plan-btns .plan-free-pill { opacity: 1; } /* in a selected card's action row it's always shown */
    .plan-free-pill:hover { border-color: var(--fg-dim); color: var(--fg); }
    .plan-free-pill.on { opacity: 1; border-color: var(--good); color: var(--good);
      background: rgba(95, 184, 122, .1); }
    .plan-mat.is-free .plan-mat-name { color: var(--fg-dim); }
    .plan-mat-gold { margin-top: 6px; border-top: 1px solid var(--border); font-weight: 600; }
    /* Projected-stats section (SPEC §17, phase 3): same row rhythm as materials. */
    .plan-stat { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 12px; padding: 4px 0; }
    .plan-stat-name { color: var(--fg); flex: 1 1 auto; min-width: 0; }
    .plan-stat-val { flex: 0 0 auto; white-space: nowrap; text-align: right; font-family: var(--font-mono); }
    .plan-stat.plan-stat-total { font-weight: 600; border-top: 1px solid var(--border); }
    .plan-stat.plan-stat-total + .plan-stat.plan-stat-total { border-top: none; } /* one rule above the totals block, not between them */
    /* Planner phase-5 sugar (SPEC §17.14) */
    /* Undo toast: floats bottom-center after a destructive path edit (delete / import-replace). */
    .plan-toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 60;
      display: flex; gap: 12px; align-items: center; padding: 9px 14px; font-size: 13px; color: var(--fg);
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4); }
    .plan-toast button { background: none; border: none; color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; padding: 0; }
    .plan-toast button:hover { text-decoration: underline; }
    /* Collapsed leading done-run header ("✓ N completed, click to expand"). */
    .plan-done-collapse { padding: 7px 11px; font-size: 12px; border: 1px dashed var(--border); border-radius: 6px; cursor: pointer; user-select: none; }
    .plan-done-collapse:hover { border-color: var(--good); }
    /* Materials-panel header row: the h4 + the shortfall-only / copy-list tool pills. */
    .plan-mats-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .plan-mats-head h4 { flex: 1 1 auto; }
    .plan-mat-tool { background: transparent; border: 1px solid var(--border); border-radius: 9px;
      color: var(--fg-dim); font: 10px/1 var(--font-sans); padding: 2px 7px; cursor: pointer; }
    .plan-mat-tool:hover { border-color: var(--fg-dim); color: var(--fg); }
    .plan-mat-tool.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
    /* Seeded empty state: the top cheapest-per-point moves as one-click add cards. */
    .plan-seed { display: flex; align-items: center; gap: 10px; padding: 9px 11px; margin-top: 8px;
      background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 6px; cursor: pointer; font-size: 13px; }
    .plan-seed:hover { border-color: var(--accent); }
    .plan-seed-label { flex: 1 1 auto; min-width: 0; }
    .plan-seed-side { margin-left: auto; display: inline-flex; gap: 10px; align-items: center; flex: 0 0 auto; font-size: 12px; }
    .plan-seed-side button { background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; color: var(--fg); font-size: 11px; padding: 2px 9px; cursor: pointer; }
    .plan-seed-side button:hover { border-color: var(--accent); }
    .plan-seed-h { font-size: 12px; margin-top: 4px; }
    .scan-drop { border: 1px dashed var(--border); border-radius: 8px; background: var(--surface);
      color: var(--fg-dim); text-align: center; padding: 22px 12px; cursor: pointer; font-size: 13px; user-select: none; }
    .scan-drop:hover { color: var(--fg); border-color: var(--accent); }
    .scan-drop-spaced { margin-top: 18px; }
    .scan-actions { display: flex; gap: 8px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
    .scan-actions button { padding: 7px 12px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; color: var(--fg); font-size: 13px; cursor: pointer; }
    .scan-actions button:hover:not(:disabled) { border-color: var(--accent); }
    .scan-actions button:disabled { opacity: 0.45; cursor: default; }
    .scan-actions button.danger:hover:not(:disabled) { border-color: #8a4f4f; }
    .scan-status { color: var(--fg-dim); font-size: 12px; margin-left: auto; }
    .scan-table { border-collapse: collapse; width: 100%; max-width: 720px; font-size: 13px; }
    .scan-table th { text-align: left; color: var(--head); font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--border); }
    .scan-table td { padding: 5px 10px; border-bottom: 1px solid var(--border); }
    .scan-table .num { text-align: right; font-family: var(--font-mono); }
    .scan-table .gold { color: var(--gold, #c9a84c); }
    .scan-table tr.scan-unknown td { background: rgba(201, 168, 76, 0.06); }
    .scan-newbadge { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 10px;
      font-size: 11px; color: #c9a84c; border: 1px solid rgba(201, 168, 76, 0.5); vertical-align: middle; cursor: help; }
    .scan-skips { margin-top: 12px; color: var(--fg-dim); font-size: 12px; }
    .scan-skips summary { cursor: pointer; }
    /* Raid-drops subtab */
    .scan-modes { margin-bottom: 14px; }
    .scan-charname { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 13px; color: var(--fg-dim); }
    .scan-field-lbl { flex: 0 0 auto; width: 104px; }
    .scan-charname input, .scan-charname select { padding: 6px 10px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; color: var(--fg); font-size: 13px; flex: 0 0 240px; box-sizing: border-box; }
    .scan-charname .hint { flex: 1 1 auto; min-width: 0; }
    .scan-charname input:focus, .scan-charname select:focus { outline: none; border-color: var(--accent); }
    .scan-charname .hint { margin: 0; }
    .help-icon { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--border); color: var(--fg-dim);
      font-size: 11px; line-height: 1; cursor: help; user-select: none; }
    .help-icon:hover, .help-icon:focus { color: var(--accent); border-color: var(--accent); outline: none; }
    .scan-runmode { display: inline-flex; }
    .scan-mode-pill { display: inline-block; min-width: 15px; padding: 0 5px; border-radius: 4px; font-size: 10px; font-weight: 600;
      text-align: center; text-transform: uppercase; letter-spacing: 0.04em; color: var(--gold); border: 1px solid color-mix(in srgb, var(--gold) 50%, transparent); vertical-align: middle; }
    .scan-mode-pill.scan-core-pill { color: var(--good); border-color: color-mix(in srgb, var(--good) 50%, transparent); }
    .scan-mode-pill.scan-hero-pill { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, transparent); }
    /* Core-source chips + breakdowns (SPEC §16.9) */
    .src-chip { display: inline-block; margin-left: 6px; min-width: 15px; padding: 0 5px; border-radius: 4px;
      font-size: 10px; font-weight: 600; font-family: var(--font-mono); text-align: center; letter-spacing: 0.04em;
      color: var(--fg-dim); border: 1px solid var(--border); vertical-align: middle; cursor: help; }
    .src-chip.src-campfire { color: #c98a4c; border-color: color-mix(in srgb, #c98a4c 50%, transparent); }
    .src-chip.src-plus { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, transparent); }
    .src-chip.src-vvip { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 50%, transparent); }
    .src-chip.src-pet { color: var(--good); border-color: color-mix(in srgb, var(--good) 50%, transparent); }
    .src-chip.src-guild { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
    .src-chip.src-luck { color: #8ac98a; border-color: color-mix(in srgb, #8ac98a 50%, transparent); }
    .scan-buff-sub { font-size: 12px; color: var(--fg-dim); margin: 10px 0 4px; }
    .scan-buff-panel summary.scan-run-h4 { cursor: pointer; user-select: none; }
    .scan-buff-panel summary.scan-run-h4:hover { color: var(--fg); }
    .scan-raid-detail td { background: var(--surface); }
    .scan-raid-mode { padding: 6px 4px; font-size: 12px; color: var(--fg-dim); }
    .scan-raid-mode > b { color: var(--head); }
    .scan-src-line { padding: 1px 0 1px 12px; }
    .scan-src-line .src-chip { margin-left: 0; margin-right: 4px; }
    .scan-src-verdict { padding: 3px 0 1px 12px; }
    .scan-good { color: var(--good); }
    .scan-bad { color: var(--bad); }
    .scan-buff-row { display: flex; gap: 12px; align-items: baseline; font-size: 13px; color: var(--fg-dim); padding: 3px 0; }
    .scan-buff-lbl { flex: 0 0 130px; color: var(--fg); }
    .scan-charname .scan-luck-input { flex: 0 0 80px; }
    .scan-mode-fixed { font-size: 13px; color: var(--fg); }
    .scan-time-set { display: inline-flex; align-items: center; gap: 5px; color: var(--fg-dim); font-size: 12px; margin-left: 6px; }
    .scan-time-set input { width: 68px; padding: 4px 7px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; color: var(--fg); font-size: 12px; }
    .scan-time-set input:focus { outline: none; border-color: var(--accent); }

    /* Drops-subtab setup header (SPEC §16.8). Planner-style side-by-side Character / Run cards,

    .scan-timer-readout.editable { cursor: pointer; border-bottom: 1px dashed var(--border); }

    .modeToggle.mini { margin-bottom: 0; border-radius: 6px; }

    .scan-review-line button[data-review-act]:hover { border-color: var(--accent); }

    .scan-aliases { margin-top: 12px; color: var(--fg-dim); font-size: 12px; max-width: 720px; }

      border: 1px solid var(--border); border-radius: 6px; color: var(--fg); cursor: pointer; }
    .scan-alias-row { padding: 3px 0 3px 14px; }

    .scan-alias-x { margin-left: 6px; background: none; border: none; color: var(--fg-dim); cursor: pointer; font-size: 14px; }
    .scan-alias-x:hover { color: #c96f6f; }
    .bform { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; max-width: 560px; }
    .bform label { color: var(--fg-dim); font-size: 13px; }

    /* Damage tab (SPEC §19). Planner-style layout: marginal cards on the left, a
       .plan-mats-style right rail holding the Boss + what-if stat controls. */
    #damagePanel { max-width: 1100px; }
    #damagePanel h3 { margin: 0 0 4px; font-size: 14px; color: var(--head); }
    #damagePanel .hint { color: var(--fg-dim); font-size: 12px; margin: 0 0 12px; max-width: 760px; }
    .dmg-body { display: flex; gap: 16px; align-items: flex-start; }
    .dmg-main { flex: 1 1 auto; min-width: 0; }
    /* Left-column section cards, same chrome as the Appraiser/Tracker panels. */
    .dmg-sec { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
    .dmg-sec + .dmg-sec { margin-top: 16px; }
    /* Right rail reuses the .plan-mats panel look; narrower, it holds controls, not a pile. */
    .plan-mats.dmg-side { flex: 0 0 330px; }
    @media (max-width: 900px) { .dmg-body { flex-direction: column; } .plan-mats.dmg-side { flex-basis: auto; width: 100%; order: -1; } }
    /* Rail section headers: title left, its control (raid picker / reset pill) right. */
    .dmg-rail-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 8px; }

    .dmg-rail-h.stats { margin-top: 20px; }

    .dmg-tile-grid { display: grid; gap: 8px; }

    .dmg-tile:focus-within { border-color: var(--head); }

    /* Boss-tile states: manual override (accent), no sheet value yet (dashed). */
    .dmg-tile.override { border-color: var(--accent); }
    .dmg-tile.override .dmg-tile-l { color: var(--accent); }

    .dmg-tile input.tweaked { color: var(--accent); }
    .dmg-tile-ctl { display: flex; align-items: center; gap: 6px; }
    /* Square ±1 steppers, hold to repeat (accelerating), so no per-stat step sizes. */
    .dmg-step { width: 20px; height: 20px; flex: 0 0 auto; text-align: center; background: var(--surface); border: 1px solid var(--border);
      border-radius: 5px; color: var(--fg-dim); cursor: pointer; font-size: 13px;
      padding: 0; line-height: 1; user-select: none; touch-action: none; }
    .dmg-step:hover { color: var(--fg); border-color: var(--head); }
    /* Live tweak delta ("+9") in the tile's label row; grows leftward so nothing shifts. */
    .dmg-delta { font-family: var(--font-mono); font-size: 11px; white-space: nowrap; }

    .dmg-capflag { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
      padding: 1px 7px; border-radius: 8px; white-space: nowrap;
      background: rgba(95,184,122,0.12); color: var(--good); }
    /* Left column: section headers in the app's uppercase table-head voice. */

    .dmg-sec-h .muted { font-weight: 400; text-transform: none; letter-spacing: 0; }
    /* Marginals as planner-style cards: stat | value | bar | %/+1, ranked best-first. */
    .dmg-list { display: flex; flex-direction: column; gap: 8px; }
    /* Fixed-width % column (not max-content) so every row's bar track ends at the
       same edge regardless of how long the % text is. */
    .dmg-mcard { display: grid; grid-template-columns: 96px 76px 1fr 110px; gap: 14px; align-items: center;
      background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent);
      border-radius: 6px; padding: 8px 12px; }
    .dmg-mcard.capped { border-left-color: var(--border); }

    .dmg-mcard .mval { font-family: var(--font-mono); font-size: 12px; color: var(--fg-dim); text-align: right; }

    .dmg-mcard .mmarg .muted { font-size: 10px; font-family: var(--font-sans); }
    .dmg-bar { position: relative; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
    .dmg-bar > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; }
    /* What-if banner: overall % damage change of the tweaked stats vs the character's
       real stats, only rendered while tweaks exist. Planner-seed card chrome. */
    .dmg-whatif { margin: 0 0 14px; padding: 8px 12px;

       numbers plugged in, then the vertical summary equation. */
    .dmg-pipe { margin-top: 4px; }

    .dmg-pipe summary:hover { color: var(--fg); }

    .dmg-tldr { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin: 0 0 10px; font-size: 12px; }

    .dmg-hit { display: flex; align-items: baseline; gap: 8px; margin: 8px 0 10px; padding: 8px 12px;

    .dmg-hit-pct { font-family: var(--font-mono); font-size: 12px; }
    /* Stage explainer blocks: numbered header (name + value, base → what-if when tweaked),

    .dmg-stage:last-of-type { border-bottom: none; }

    .dmg-stage-h .num { flex: 0 0 auto; width: 18px; height: 18px; border-radius: 50%; align-self: center;

    .dmg-stage-h .sval { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--gold); white-space: nowrap; }

    .dmg-stage-x { margin: 4px 0 0 27px; font-size: 12px; color: var(--fg-dim); max-width: 680px; }
    .dmg-stage-x p { margin: 3px 0; }

    .dmg-math { display: grid; grid-template-columns: max-content 1fr max-content; gap: 1px 10px; align-items: baseline;

  </style>

    // js/ppocr.js pulls the ~10MB OCR bundle, load it lazily on first scan, not at page load.

    import { PRICE_BASIS, DEAL_DISCOUNT_THRESHOLD, EXQUISITE_RUNE_NAME, EXTRACTION_RUNE_NAME, SCRAP_SALE_FEE, LOADOUT, LOADOUT_STORAGE_KEY, CURRENT_STATS, CURRENT_STATS_STORAGE_KEY, INVENTORY_STORAGE_KEY, VETO_STORAGE_KEY, SCAN_ALIASES_STORAGE_KEY, CHARACTER_NAME, CHARACTER_NAME_STORAGE_KEY, RUNS, RUNS_STORAGE_KEY, SCAN_JUNK, SCAN_JUNK_STORAGE_KEY, BOX_LOG_STORAGE_KEY, PARTY_TRACK_KEY, RUN_PREFS_KEY, MAXLEVEL_STORAGE_KEY, LEVEL_CAP_GOLD_BONUS, LUCK_STORAGE_KEY, CAMPFIRE_CORE_COST, VVIP_COST_30D, VVIP_PRICE_MATCH, CADET_COST_30D, CADET_PRICE_MATCH, CORE_BOOST_PLUS_USD, PROFILES_STORAGE_KEY, CHECKLIST_STORAGE_KEY, GOLD_STORAGE_KEY, PLANNER_STORAGE_KEY, PLANNER_CONSUME_KEY, PLANNER_RAID_KEY, DAMAGE_STORAGE_KEY, PREP_GOALS, GEAR_PRESETS, ENHANCEABLE_SLOT_IDS, ENHANCEMENT_RUNE_NAME, FREE_ENHANCEMENT_RUNE_DEFAULT, FREE_RAID_ESSENCES, FREE_RAID_ESSENCES_DEFAULT, FREE_ITEMS_STORAGE_KEY, WEEKLY_BOX_STORAGE_KEY, WEEKLY_BOX_MAX_WEEKS, ITEM_TIER_WORDS, TIER_SLOT_IDS, TUNING_STAT_TO_KEY, tuneStatCanon } from "./js/config.js";

    // Strip grouping commas/spaces from a typed numeric field → number | null (blank).
    const parseNum = (s) => { const t = String(s).replace(/[,\s]/g, ""); return t === "" ? null : (Number.isFinite(+t) ? +t : null); };
    const STAT_LABEL = { att:"Att", def:"Def", crit:"Crit", critRes:"Crit Res",

    const statLine = (stats) => Object.keys(STAT_LABEL)
      .filter((k) => stats[k]).map((k) => `${STAT_LABEL[k]} ${stats[k] > 0 ? "+" : ""}${stats[k]}`)
      .join(", ") || "—";
    // Per-stat delta vs equipped (SPEC §14), gains green / losses red. The
    // decomposition of a move's pointGain so the user sees WHY it scores.
    const diffLine = (diff) => {
      const keys = Object.keys(STAT_LABEL).filter((k) => diff?.[k]);
      if (!keys.length) return "—";
      return keys.map((k) => `<span class="${diff[k] > 0 ? "pos" : "neg"}">${STAT_LABEL[k]} ${diff[k] > 0 ? "+" : ""}${diff[k]}</span>`).join(", ");
    };

    const [{ prices }, { enchants }, { recipes }, { items, bySlot }, { accessories }, { bonuses: setBonuses }, { tuning }, { enhancement }, { raids }, { raidDrops }, { sealShop, totals: sealTotals }, { weeklyBoxes }, { legacy }] =
      await Promise.all([loadPrices(), loadEnchants(), loadRecipes(), loadItems(), loadAccessories(), loadSetBonuses(), loadTuning(), loadEnhancement(), loadRaids(), loadRaidDrops(), loadSealShop(), loadWeeklyBoxes(), loadLegacy()]);
    // Legacy names still used as recipe ingredients are probably tagged by mistake

    {

    }
    // Crafting now includes the weapon/armor tier-chain recipes (SPEC §4), so the
    // recursive craftCost rolls up the whole chain straight from one recipe map.
    // `freeItems` backs the user's per-item "free" flags (SPEC §17.9): a live set the coster
    // reads on every cost() call; flipping it + invalidate() re-prices in place. Seeded from the
    // config free-by-default lists (both currently empty) plus the persisted user-marked items.
    const loadUserFreeItems = () => {
      try { const s = JSON.parse(localStorage.getItem(FREE_ITEMS_STORAGE_KEY) || "null"); return Array.isArray(s) ? s.filter((x) => typeof x === "string") : []; }

    };
    // Weekly raid essences, DERIVED from the Raid Info + Raid Drops tabs (a new raid needs no

    const derivedEssences = deriveRaidEssences(raidDrops, raids);

    const persistUserFreeItems = () => { try { localStorage.setItem(FREE_ITEMS_STORAGE_KEY, JSON.stringify([...userFreeItems])); } catch { /* storage blocked */ } };
    const freeItems = new Set([
      ...(FREE_ENHANCEMENT_RUNE_DEFAULT ? [ENHANCEMENT_RUNE_NAME] : []),
      ...(FREE_RAID_ESSENCES_DEFAULT ? raidEssences : []),
      ...userFreeItems,
    ]);
    const { cost, craftCost, netCost, invalidate } = makeCoster(prices, recipes, { freeItems });
    const priceOf = (n) => prices[n]?.[PRICE_BASIS] ?? null;

    // Seal Shop (SPEC §16.10): value each untradeable redemption currency at its BEST
    // use, then inject that as a synthetic market price so the drop tracker + catalog
    // treat a seal like any other priced drop (dropUnitValue → prices[name].avg). Only
    // inject when the seal isn't already in the real feed (never clobber market data).
    // Contents value at min(market, craft) so a craftable redemption prices off its recipe
    // even with no market listing (SPEC §5). But via a FREE-AGNOSTIC coster (no freeItems).
    // A redemption's intrinsic gold worth must NOT collapse just because the player toggles
    // base runes/essences to free: with the free toggle, e.g. Premium Armor Enhancement Rune
    // craft-costs only its 700k fee (base runes → 0) and would read 700k instead of its ~45M
    // market/real-craft worth. The free toggles are a planner concern, not a drop's value.
    const { cost: intrinsicCost } = makeCoster(prices, recipes);
    const sealValues = sealShopValues(sealShop, prices, PRICE_BASIS, intrinsicCost, sealTotals);
    for (const [name, v] of Object.entries(sealValues)) {
      if (v.unit != null && prices[name] == null) {
        prices[name] = { avg: v.unit, min: null, date: null, trend: null, ath: null, atl: null, snapshots: null, derived: "sealshop" };

    }

    // Loot-box EV injection (SPEC §16.12): value each box in the opening log at its OBSERVED
    // average payout per open, and inject that as a synthetic price, same pattern as the seal
    // values above, so a box dropping from a boss values in the drop tracker (dropUnitValue →
    // prices[name].avg) and lists in the catalog under the RNG kind. Only injected when the box
    // has no real market listing (never clobber market data); recomputed whenever the log

    function loadBoxLog() { try { const s = JSON.parse(localStorage.getItem(BOX_LOG_STORAGE_KEY) || "null"); return Array.isArray(s) ? s : []; } catch { return []; } }
    let boxLog = loadBoxLog();
    const persistBoxLog = () => { try { localStorage.setItem(BOX_LOG_STORAGE_KEY, JSON.stringify(boxLog)); } catch { /* storage blocked */ } };
    let boxLogId = boxLog.reduce((m, r) => Math.max(m, r.id || 0), 0);

    function applyBoxPrices() {
      for (const [n, p] of Object.entries(prices)) if (p?.derived === "boxlog") delete prices[n];

      for (const v of boxValues) {

    // The imported LOADOUT is the DEFAULT SEED; the live `loadout` is a deep mutable

    // edits it in-browser (sidebar inline editor); saves persist + re-derive moves.
    function loadStoredLoadout() {
      const lo = structuredClone(LOADOUT); // structuredClone drops the frozen-ness → mutable
      try {
        const saved = JSON.parse(localStorage.getItem(LOADOUT_STORAGE_KEY) || "null");
        if (saved) for (const s of Object.keys(lo)) if (saved[s]) lo[s] = saved[s];

    }
    let loadout = loadStoredLoadout();
    // Heal a persisted loadout whose tuning was saved under an OLDER destruction label

    healTuning(loadout, tuning);
    // BASELINE = the loadout as it was when the app opened OR when a character was last
    // saved/switched. Reset reverts to THIS; saving/switching a profile re-snapshots it.
    // Re-snapshot happens ONLY on an explicit save-set / switch action, not on every edit,
    // so `loadoutDirty()` means "unsaved changes vs the loaded character (or startup)."
    let loadoutBaseline = structuredClone(loadout);
    const loadoutDirty = () => { try { return JSON.stringify(loadout) !== JSON.stringify(loadoutBaseline); } catch { return false; } };
    const persistLoadout = () => { try { localStorage.setItem(LOADOUT_STORAGE_KEY, JSON.stringify(loadout)); } catch { /* storage blocked → edits stay session-only */ } };

    // Named snapshots of the SWAP UNIT (loadout + stat totals). The working loadout/stats
    // keys stay the live state the rest of the app reads; `profiles` is a side store of

    function loadProfiles() {

    function loadWorkingState(snap) {

      for (const k of Object.keys(currentStats)) delete currentStats[k];

      persistStats();

      persistChecklist();

      // field; a legacy profile lacking it KEEPS the current working value (never wipe real
      // player data). Inventory is restored IN PLACE (delete-all + Object.assign) because
      // moveCtx.inventory holds it by reference, same reason currentStats is mutated in place.

      if (snap.inventory && typeof snap.inventory === "object") {

        persistInventory();
      }
      if (snap.gold != null) { goldTracker = snap.gold; persistGold(); }
      if (snap.path && Array.isArray(snap.path.steps)) { plannerPath = { v: 1, steps: structuredClone(snap.path.steps) }; persistPlannerPath(); }
      planUndoStack.length = planRedoStack.length = 0; // undo must never cross a character switch
      loadoutBaseline = structuredClone(loadout);
      statsBaseline = { ...currentStats };
      checklistBaseline = new Set(checklistDone);
      inventoryBaseline = structuredClone(inventory);
      goldBaseline = goldTracker;
      pathBaseline = structuredClone(plannerPath);
      editingSlot = null; editingStat = null;
      recomputeLoadout();
      renderChecklist();
    }
    // Re-snapshot the current working state into the active profile (Save). No-op with no
    // active slot (the Save button is hidden then).
    function saveActiveProfile() {
      const p = activeProfile();
      if (!p) return;
      const rec = makeProfileRecord({ id: p.id, name: p.name, loadout, stats: currentStats, checklist: [...checklistDone], inventory, gold: goldTracker, path: plannerPath });
      profiles.list = upsertProfile(profiles.list, rec);
      persistProfiles();
      loadoutBaseline = structuredClone(loadout);
      statsBaseline = { ...currentStats };
      checklistBaseline = new Set(checklistDone);
      inventoryBaseline = structuredClone(inventory);
      goldBaseline = goldTracker;
      pathBaseline = structuredClone(plannerPath);
      renderSidebar();
    }
    // Save the current working state as a NEW character and make it active.
    function saveAsProfile(name) {
      const rec = makeProfileRecord({ name, loadout, stats: currentStats, checklist: [...checklistDone], inventory, gold: goldTracker, path: plannerPath });
      profiles.list = upsertProfile(profiles.list, rec);
      profiles.active = rec.id;
      persistProfiles();
      loadoutBaseline = structuredClone(loadout);
      statsBaseline = { ...currentStats };
      checklistBaseline = new Set(checklistDone);
      inventoryBaseline = structuredClone(inventory);
      goldBaseline = goldTracker;
      pathBaseline = structuredClone(plannerPath);
      renderSidebar();
    }
    // Switch to a saved character: load its snapshot into the working state.
    function switchProfile(id) {
      const p = profiles.list.find((x) => x.id === id);
      if (!p) return;
      profiles.active = id;
      persistProfiles();
      loadWorkingState({ loadout: p.loadout, stats: p.stats, checklist: p.checklist, inventory: p.inventory, gold: p.gold, path: p.path });
    }
    // Apply a built-in base-gear preset (overwrites the loadout + stats; unsaved until Save-as).
    // The preset snapshot carries no inventory/gold/path, so loadWorkingState KEEPS the current
    // working inventory, gold, and planner path (a gear template shouldn't erase your materials).
    function applyPreset(name) {
      const preset = GEAR_PRESETS.find((x) => x.name === name);
      if (!preset) return;
      profiles.active = null;
      persistProfiles();
      loadWorkingState({ loadout: preset.loadout, stats: preset.stats });
    }
    // Picking a preset opens an explainer FIRST (what it does + what's left to do by hand);
    // it only lands on Apply. Presets without a `blurb` apply straight away.
    function requestPreset(name) {
      const preset = GEAR_PRESETS.find((x) => x.name === name);
      if (!preset) return;
      if (!preset.blurb) { applyPreset(name); return; }
      openPresetInfo(preset, () => applyPreset(name));
    }
    function deleteProfile(id) {
      profiles.list = removeProfile(profiles.list, id);
      if (profiles.active === id) profiles.active = null;
      persistProfiles();
      renderSidebar();
    }
    function renameActiveProfile(name) {
      if (!profiles.active) return;
      profiles.list = renameProfile(profiles.list, profiles.active, name);
      persistProfiles();
      renderSidebar();
    }

    // Owned-items inventory (SPEC §5.2)
    // { itemName: count } of priced materials the player HOLDS (untradeable raid/event
    // give-outs). Netted out of every craft/upgrade BOM via the coster's netCost so a move
    // is cheaper when part of it is already owned. Persisted under its own storage key; a
    // count drops to 0 → the entry is deleted so the map only ever holds real stock.
    function loadInventory() {
      try { const s = JSON.parse(localStorage.getItem(INVENTORY_STORAGE_KEY) || "null"); return s && typeof s === "object" ? s : {}; }
      catch { return {}; }
    }
    let inventory = loadInventory();
    const persistInventory = () => { try { localStorage.setItem(INVENTORY_STORAGE_KEY, JSON.stringify(inventory)); } catch { /* storage blocked */ } };
    const ownedOf = (name) => inventory[name] || 0;
    const setOwned = (name, n) => { if (n > 0) inventory[name] = n; else delete inventory[name]; };
    const esc = (s) => String(s).replace(/"/g, "&quot;");

    // Gold on hand (SPEC §17.5)
    // A manual per-character gold total feeding the Planner's affordability projection.
    // Working number persisted under GOLD_STORAGE_KEY and snapshotted into the character
    // profile (`gold`), like the stat totals. Edited via a sidebar numField stepper.
    function loadGold() {
      try { const n = JSON.parse(localStorage.getItem(GOLD_STORAGE_KEY) || "null"); return Number.isFinite(n) ? n : 0; }
      catch { return 0; }
    }
    let goldTracker = loadGold();
    const persistGold = () => { try { localStorage.setItem(GOLD_STORAGE_KEY, JSON.stringify(goldTracker)); } catch { /* storage blocked */ } };

    // Weekly boxes (SPEC §18)
    // ACCOUNT state, not per-character: boxes ship account-wide via shared storage, so the
    // unopened bank + farming-alt count are global (never profile-snapshotted). `onHand` =
    // claimed-but-unopened boxes; `alts` = characters claiming one per week.
    function loadWeeklyBox() {
      try {
        const s = JSON.parse(localStorage.getItem(WEEKLY_BOX_STORAGE_KEY) || "null");
        if (s && typeof s === "object")
          return { onHand: Math.max(0, Math.floor(s.onHand) || 0), alts: Math.max(0, Math.floor(s.alts ?? 1) || 0) };
      } catch { /* corrupt/blocked → defaults */ }
      return { onHand: 0, alts: 1 };
    }
    let weeklyBox = loadWeeklyBox();
    const persistWeeklyBox = () => { try { localStorage.setItem(WEEKLY_BOX_STORAGE_KEY, JSON.stringify(weeklyBox)); } catch { /* storage blocked */ } };

    // Working planner path (SPEC §17)
    // The user-built upgrade path { v: 1, steps: [] }. Persisted like the loadout and
    // snapshotted into the profile (`path`). The tab UI + reconcile land in a later phase;
    // here we just hold, persist, and profile-swap it. Reassigned (not held by reference)
    // on profile switch, renderPlanner will read the live binding each render.
    function loadPlannerPath() {
      try { const p = JSON.parse(localStorage.getItem(PLANNER_STORAGE_KEY) || "null"); if (p && Array.isArray(p.steps)) return { v: 1, steps: p.steps }; }
      catch { /* corrupt/blocked → empty */ }
      return { v: 1, steps: [] };
    }
    let plannerPath = loadPlannerPath();
    const persistPlannerPath = () => { try { localStorage.setItem(PLANNER_STORAGE_KEY, JSON.stringify(plannerPath)); } catch { /* storage blocked */ } };

    // Planner tab UI state (SPEC §17.5). Ephemeral, never persisted
    // The materials panel aggregates over the selection (whole path when empty); shift-click
    // extends from the anchor. `plannerAddAt` = the insertion index where the add note/goal
    // chooser is open (null = closed). `plannerDragId` = the card being HTML5-dragged.
    let plannerSel = new Set();      // selected step ids
    let plannerSelAnchor = null;     // last-clicked id, for shift-click ranges
    let plannerAddAt = null;         // open add-chooser insertion index, or null
    let planBuildSlot = null;        // in-chooser upgrade builder: chosen slot (null = none)
    let planBuildPart = null;        // in-chooser upgrade builder: chosen part (base/prefix/suffix/tuning/infusion)
    let plannerCommentEdit = new Set(); // step ids whose comment editor is open (ephemeral, SPEC §17.8)
    let plannerDragId = null;        // id of the card currently being dragged
    let plannerImportOpen = false;   // the import panel (file + paste) is showing
    let plannerImportErr = null;     // last parsePath error string, shown in the panel
    const planOpenSubs = new Set();  // expanded sub-recipe rows in the materials panel, keyed "parent>child" path
    let plannerAddMode = "upgrade";  // what the open add-chooser offers: "upgrade" (quick-add search) | "note"
    let planQuery = "";              // quick-add search text (SPEC §17.7)
    let planQABrowse = false;        // quick-add: the slot→part→change browse cascade is expanded
    let planQACands = [];            // quick-add candidates, rebuilt each render while the chooser is open
    let planQAShown = [];            // the currently-listed (filtered) candidates, indexed by data-plan-qa
