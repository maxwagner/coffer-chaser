          persistChecklist(); persistStats();
          recomputeLoadout(); // re-derives totals + re-renders the planner AND sidebar
          return;
        }
        if (act === "delete" || act === "skip") {
          snapPlan();
          plannerPath = removeStep(plannerPath, id); plannerSel.delete(id);
          persistPlannerPath(); renderPlanner();
          showUndoToast("Deleted 1 step", true); return;
        }
        if (act === "gap-insert") {
          const { entries } = reconcilePath(plannerPath, loadout, checklistDone, moveCtx);
          const entry = entries.find((en) => en.step.id === id);
          const idx = plannerPath.steps.findIndex((s) => s.id === id);
          if (entry?.gap?.steps?.length && idx >= 0) {
            snapPlan();
            plannerPath = insertSteps(plannerPath, idx, entry.gap.steps);
            persistPlannerPath(); renderPlanner();
          }
          return;
        }
        if (act === "complete") {
          const { entries } = reconcilePath(plannerPath, loadout, checklistDone, moveCtx);
          const entry = entries.find((en) => en.step.id === id);
          if (!entry || entry.status !== "ready" || !entry.move) return;
          if (entry.warnings?.length && !confirm(`${entry.warnings.join("\n")}\n\nApply this step to your loadout anyway?`)) return;
          const consumed = plannerConsume ? consumeStep(entry) : null; // before apply, entry still holds this step's live costs
          applyStepToLoadout(entry, true, consumed); // recomputeLoadout re-renders the planner
          return;
        }
        if (act === "uncomplete") {
          // Reverse a completion (SPEC §17.14): restore the recorded prior slot shape, fold
          // the stat delta back out, refund the recorded consume-on-complete draw, and drop
          // the record, reconcile then flips the step back to ready. Guarded on the live
          // slot still matching the completion's result (the card hides the button otherwise,
          // but re-check here, the loadout can change between render and click).
          const step = plannerPath.steps.find((x) => x.id === id);
          const rec = step?.completed;
          if (!rec || step.kind !== "move" || !slotShapeEq(loadout[step.slot], rec.next)) return;
          const s = step.slot;
          const before = slotStats(loadout[s] || {}), after = slotStats(rec.prev || {});
          for (const k of Object.keys(STAT_LABEL)) {
            const d = (after[k] || 0) - (before[k] || 0);
            if (d) currentStats[k] = (currentStats[k] || 0) + d;
          }
          persistStats();
          loadout[s] = structuredClone(rec.prev || {});
          persistLoadout();
          if (rec.consumed) {
            for (const [n, q] of Object.entries(rec.consumed.mats || {})) setOwned(n, ownedOf(n) + q);
            goldTracker += rec.consumed.gold || 0;
            persistGold(); persistInventory();
            catalogView = buildCatalogView();
            views[CATALOG_TAB] = catalogView;
          }
          delete step.completed;
          persistPlannerPath();
          recomputeLoadout(); // re-derives moves/stats + re-renders sidebar AND this tab
          return;
        }
        if (act === "complete-through") {
          // Complete every READY step up to and including this card, in path order (SPEC
          // §17.14). The reconcile pass forward-simulated the entries in exactly this order,
          // so applying them sequentially matches their displayed costs; goals complete like
          // the Checklist checkbox; recompute once at the end.
          const { entries } = reconcilePath(plannerPath, loadout, checklistDone, moveCtx);
          const idx = entries.findIndex((en) => en.step.id === id);
          if (idx < 0) return;
          const todo = entries.slice(0, idx + 1)
            .filter((en) => en.status === "ready" && (en.step.kind === "move" ? !!en.move : en.step.kind === "goal"));
          if (!todo.length) return;
          const warned = todo.filter((en) => en.warnings?.length).length;
          const msg = `Mark ${todo.length} step${todo.length !== 1 ? "s" : ""} complete (through step ${idx + 1})?` +
            (plannerConsume ? "\nTheir expected materials + gold will be consumed." : "") +
            (warned ? `\n${warned} step${warned !== 1 ? "s carry" : " carries"} a may-be-redone warning.` : "");
          if (!confirm(msg)) return;
          let goals = false;
          for (const en of todo) {
            if (en.step.kind === "goal") {
              if (!checklistDone.has(en.step.goalId)) { checklistDone.add(en.step.goalId); applyGoalStats(en.step.goalId, +1); goals = true; }
              continue;
            }
            const drew = plannerConsume ? consumeStep(en) : null;
            applyStepToLoadout(en, false, drew); // defer the recompute to the end of the sweep
          }
          if (goals) { persistChecklist(); persistStats(); }
          recomputeLoadout(); // re-derives everything once; the swept steps flip to done
          return;
        }
        if (act === "done-toggle") { planDoneOpen = !planDoneOpen; renderPlanner(); return; }
        if (act === "short-toggle") { planShortOnly = !planShortOnly; renderPlanner(); return; }
        if (act === "copy-shop") {
          // Shopping list (SPEC §17.14): the CURRENT scope's pile as a mats-only TSV.
          const { entries } = reconcilePath(plannerPath, loadout, checklistDone, moveCtx);
          const agg = aggregateMaterials(entries, plannerSel.size ? plannerSel : null);
          navigator.clipboard.writeText(shoppingListTSV(agg.materials, ownedOf, (n) => freeItems.has(n) ? 0 : cost(n)));
          doBtn.textContent = "copied!"; setTimeout(() => { if (active === PLANNER_TAB) renderPlanner(); }, 1200);
          return;
        }
        // Note-text editor (SPEC §17.14). Save writes step.text (kept non-empty), cancel closes.
        if (act === "note-save") {
          const ta = plannerPanel.querySelector(`textarea[data-plan-note-edit-id="${CSS.escape(id)}"]`);
          const text = (ta?.value || "").trim();
          const step = plannerPath.steps.find((s) => s.id === id);
          if (step && text && text !== step.text) snapPlan();
          if (step && text) step.text = text; // empty save = keep the old text (delete removes the card)
          plannerNoteEdit.delete(id);
          persistPlannerPath(); renderPlanner(); return;
        }
        if (act === "note-cancel") { plannerNoteEdit.delete(id); renderPlanner(); return; }
        if (act === "clear-sel") { plannerSel.clear(); plannerSelAnchor = null; renderPlanner(); return; }
        if (act === "select-all") { plannerSel = new Set(plannerPath.steps.map((s) => s.id)); plannerSelAnchor = null; renderPlanner(); return; }
        if (act === "del-sel") { deleteSelectedSteps(); return; }
        if (act === "plan-gap") {
          // Mirror the Target tab's raid mode + "Copy bundle to Planner" (SPEC §7.2, §17.13),
          // without touching the Target tab, but solve the REMAINING gap from the PLAN-END
          // state: goals = what the card's raid still asks beyond the plan's projected stats
          // (aim-aware, QB floors or caps), solved against a pseudo-loadout rebuilt from
          // reconcile's simulated end states so the bundle composes with (never duplicates)
          // the steps already planned. Floors = the projected stats (no silent regressions).
          const { entries, states } = reconcilePath(plannerPath, loadout, checklistDone, moveCtx);
          const proj = entries.length ? projectedStatsAt(entries, currentStats)[entries.length - 1] : currentStats;
          const r = planRaidPick ? raidByName[planRaidPick] : nextUnmetRaid(raids, proj, planRaidAim);
          if (!r) return;
          const needs = raidShortfall(r, proj, planRaidAim);
          if (!Object.keys(needs).length) return;
          // Simulated slot state → the loadout shape solveThreshold expects.
          const endLoadout = {};
          for (const [slot, st] of Object.entries(states)) {
            endLoadout[slot] = {
              base: st.base?.name ?? null,
              prefix: st.prefix?.scroll ?? null,
              suffix: st.suffix?.scroll ?? null,
              ...(st.enhance ? { enhance: { level: st.enhance.level, bracket: st.enhance.bracket } } : {}),
              ...(Object.keys(st.tuning || {}).length ? { tuning: { ...st.tuning } } : {}),
            };
          }
          const floors = {};
          for (const k of Object.keys(STAT_LABEL)) if (proj[k] != null) floors[k] = proj[k];
          const solved = solveThreshold(needs, endLoadout, moveCtx, { floors, current: proj });
          const steps = (solved.chosen || []).flatMap((m) => moveToSteps(m, moveCtx, endLoadout[m.slot]?.base ?? null));
          const n = addStepsToPlan(steps); // re-renders when steps land (milestone chip appears if reached)
          if (!n) {
            doBtn.textContent = "No new steps found";
            setTimeout(() => { if (active === PLANNER_TAB) renderPlanner(); }, 1500);
          }
          return;
        }
        if (act === "export") { exportPath(); return; }
        if (act === "copy-text") {
          const { entries } = reconcilePath(plannerPath, loadout, checklistDone, moveCtx);
          navigator.clipboard.writeText(pathToTSV(entries, planSlotLabel));
          doBtn.textContent = "Copied!"; setTimeout(() => { if (active === PLANNER_TAB) renderPlanner(); }, 1200);
          return;
        }
        if (act === "import-toggle") { plannerImportOpen = !plannerImportOpen; plannerImportErr = null; renderPlanner(); return; }
        if (act === "import-cancel") { plannerImportOpen = false; plannerImportErr = null; renderPlanner(); return; }
        if (act === "import-paste") {
          const ta = plannerPanel.querySelector("[data-plan-import-text]");
          const text = (ta?.value || "").trim();
          if (!text) { plannerImportErr = "Paste an exported path first."; renderPlanner(); return; }
          importPathText(text);
          return;
        }
        return;
      }
      // Card selection (ignore clicks on interactive controls or the drag handle).
      const card = e.target.closest(".plan-card");
      if (card && !e.target.closest("button, input, select, textarea, .plan-handle")) {
        const id = card.dataset.planId;
        // Click-to-edit note text (SPEC §17.14): the label of an ALREADY-SELECTED note card
        // opens the inline text editor instead of toggling the selection off.
        if (plannerSel.has(id) && e.target.closest(".plan-label")
            && plannerPath.steps.find((s) => s.id === id)?.kind === "note" && !plannerNoteEdit.has(id)) {
          plannerNoteEdit.add(id);
          renderPlanner();
          plannerPanel.querySelector(`textarea[data-plan-note-edit-id="${CSS.escape(id)}"]`)?.focus();
          return;
        }
        const ids = plannerPath.steps.map((s) => s.id);
        if (e.shiftKey && plannerSelAnchor && ids.includes(plannerSelAnchor)) {
          const a = ids.indexOf(plannerSelAnchor), b = ids.indexOf(id);
          const [lo, hi] = [Math.min(a, b), Math.max(a, b)];
          plannerSel = new Set(ids.slice(lo, hi + 1));
        } else {
          if (plannerSel.has(id)) plannerSel.delete(id); else plannerSel.add(id);
          plannerSelAnchor = id;
        }
        renderPlanner();
      }
    });
    // Quick-add search: re-filter on each keystroke, re-rendering ONLY the results list, a
    // full renderPlanner would destroy the input mid-typing and drop the focus/caret.
    plannerPanel.addEventListener("input", (e) => {
      const qa = e.target.closest("[data-plan-qa-input]");
      if (!qa) return;
      planQuery = qa.value;
      const res = document.getElementById("planQaResults");
      if (res) res.innerHTML = planQAResults();
    });
    // Enter in the search = add the top match; Escape = close the chooser. Enter in the
    // note input = add the note (same as its button).
    plannerPanel.addEventListener("keydown", (e) => {
      const qa = e.target.closest("[data-plan-qa-input]");
      if (qa) {
        if (e.key === "Enter") {
          e.preventDefault();
          const c = planQAShown.find((x) => !x.planned);
          if (c) planQAInsert(c);
        } else if (e.key === "Escape") {
          e.preventDefault();
          plannerAddAt = null; planQuery = ""; planQABrowse = false; planBuildSlot = planBuildPart = null;
          renderPlanner();
        }
        return;
      }
      const note = e.target.closest("[data-plan-note-text]");
      if (note && e.key === "Enter") {
        e.preventDefault();
        plannerPanel.querySelector('[data-plan-do="add-note"]')?.click();
      }
    });
    // Import from a chosen JSON file (FileReader → parsePath, same path as the paste box).
    // Also home of the "Consume resources on complete" toggle (a checkbox, so change not click).
    plannerPanel.addEventListener("change", (e) => {
      const consume = e.target.closest("[data-plan-consume]");
      if (consume) { plannerConsume = consume.checked; persistPlannerConsume(); renderPlanner(); return; }
      // Next-raid card: the raid override <select> ("" = auto, SPEC §17.13).
      const rpick = e.target.closest("[data-plan-raid-pick]");
      if (rpick) { planRaidPick = rpick.value || null; persistPlanRaid(); renderPlanner(); return; }
      // Upgrade builder cascade: picking a slot resets the part; picking a part reveals the
      // change dropdown. Both re-render (the next dropdown is derived from the selection).
      const bslot = e.target.closest("[data-plan-build-slot]");
      if (bslot) { planBuildSlot = bslot.value || null; planBuildPart = null; renderPlanner(); return; }
      const bpart = e.target.closest("[data-plan-build-part]");
      if (bpart) { planBuildPart = bpart.value || null; renderPlanner(); return; }
      const inp = e.target.closest("[data-plan-import-file]"); if (!inp) return;
      const file = inp.files?.[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = () => importPathText(String(reader.result || ""));
      reader.onerror = () => { plannerImportErr = "Couldn't read that file."; renderPlanner(); };
      reader.readAsText(file);
      inp.value = ""; // allow re-picking the same file after a failed parse
    });
    // HTML5 drag reorder.
    plannerPanel.addEventListener("dragstart", (e) => {
      // Don't let selecting text in a comment/note field drag the whole card.
      if (e.target.closest("textarea, input")) { e.preventDefault(); return; }
      const card = e.target.closest(".plan-card");
      if (!card) return;
      plannerDragId = card.dataset.planId;
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", plannerDragId); } catch { /* some browsers require a payload */ }
      card.classList.add("dragging");
    });
    plannerPanel.addEventListener("dragend", (e) => {
      const card = e.target.closest(".plan-card"); if (card) card.classList.remove("dragging");
      plannerDragId = null;
    });
    plannerPanel.addEventListener("dragover", (e) => {
      if (plannerDragId && e.target.closest(".plan-list")) e.preventDefault(); // allow the drop
    });
    plannerPanel.addEventListener("drop", (e) => {
      if (!plannerDragId) return;
      const listEl = e.target.closest(".plan-list"); if (!listEl) return;
      e.preventDefault();
      const ids = plannerPath.steps.map((s) => s.id);
      const from = ids.indexOf(plannerDragId);
      const dragId = plannerDragId; plannerDragId = null;
      if (from < 0) return;
      // Insertion point: before the first card whose vertical midpoint is below the cursor.
      const cards = [...listEl.querySelectorAll(".plan-card")];
      let insertBefore = cards.length;
      for (let i = 0; i < cards.length; i++) {
        const r = cards[i].getBoundingClientRect();
        if (e.clientY < r.top + r.height / 2) { insertBefore = i; break; }
      }
      let target = from < insertBefore ? insertBefore - 1 : insertBefore; // account for the removal shift
      if (target === from) return;
      snapPlan();
      plannerPath = moveStep(plannerPath, dragId, target);
      persistPlannerPath(); renderPlanner();
    });
    // Planner keyboard shortcuts (SPEC §17.14). Only while the tab is active AND no field
    // has focus (typing in the quick-add / a note / an inventory editor must never trigger
    // these): "/" opens quick-add at the end, Delete removes the selection (same confirm +
    // undo toast as the button), Alt+↑/↓ nudges a single selected card, Escape clears the
    // selection. Document-level: the shortcuts work without clicking into the panel first.
    document.addEventListener("keydown", (e) => {
      if (active !== PLANNER_TAB) return;
      const t = document.activeElement;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
      if (e.ctrlKey || e.metaKey) {
        // Undo/redo path edits (SPEC §17.14): Ctrl+Z / Ctrl+Shift+Z / Ctrl+Y (Cmd on Mac).
        const k = e.key.toLowerCase();
        if (!e.altKey && k === "z") { e.preventDefault(); if (e.shiftKey) planRedo(); else planUndo(); return; }
        if (!e.altKey && !e.shiftKey && k === "y") { e.preventDefault(); planRedo(); return; }
        return; // leave other browser shortcuts alone
      }
      if (e.key === "/" && !e.altKey) {
        e.preventDefault();
        openAddChooser(plannerPath.steps.length, "upgrade");
        return;
      }
      if (e.key === "Delete" && !e.altKey && plannerSel.size) { e.preventDefault(); deleteSelectedSteps(); return; }
      if (e.key === "Escape" && plannerSel.size) { plannerSel.clear(); plannerSelAnchor = null; renderPlanner(); return; }
      if (e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown") && plannerSel.size === 1) {
        e.preventDefault();
        const id = [...plannerSel][0];
        const from = plannerPath.steps.findIndex((s) => s.id === id);
        const to = e.key === "ArrowUp" ? from - 1 : from + 1;
        if (from < 0 || to < 0 || to >= plannerPath.steps.length) return;
        snapPlan();
        plannerPath = moveStep(plannerPath, id, to);
        persistPlannerPath(); renderPlanner();
      }
    });

    function updateThresholdSummary() {
      const el = document.getElementById("tsummary");
      if (!el) return;
      // `remaining` defaults to {} so a summary render against a stale/foreign thResult (e.g.
      // a maximize-points result, which has no `remaining` map) can't throw on remaining[s].
      const { needs, chosen, remaining = {}, gained, budgetLimited, lossyLimited, floorLimited, floorStats = [] } = thResult;
      // When a hard floor blocked an otherwise-useful move, tell the user they can go higher by
      // sacrificing those stats (lower the floor or allow tradeoffs). Issue 6/7 warning.
      const floorWarn = floorLimited
        ? `<p class="warn" style="margin:8px 0 0">Floors are holding${floorStats.length ? ` <b>${floorStats.map((s) => STAT_LABEL[s]).join(", ")}</b>` : " some stats"} at their minimum, you could push further by lowering ${floorStats.length > 1 ? "those targets" : "that target"}${thMode === "target" ? "" : ` or unchecking <b>Tradeoffs</b>`}.</p>`
        : "";
      const keys = Object.keys(needs);
      if (!keys.length) {
        el.innerHTML = `<span class="muted">${thMode === "maximize" ? "Check Ranking points or a stat to maximize." : "No goals set, enter a target above."}</span>`;
        return;
      }
      const totalGold = chosen.reduce((a, m) => a + m.goldCost, 0);
      const totalPts = chosen.reduce((a, m) => a + m.pointGain, 0);
      const maxMode = thMode === "maximize";
      // "Copy bundle to Planner": splice this whole bundle onto the working path as atomic steps
      // (raw unmerged `chosen` → moveToSteps each). Per-move adds come free via the shared detail
      // footer; this button captures the entire solved bundle at once.
      const planBundle = chosen.length
        ? `<div class="tplanbar"><button type="button" data-th-plan class="planbtn">Copy bundle to Planner (${chosen.length} move${chosen.length !== 1 ? "s" : ""})</button></div>`
        : "";
      if (maxMode && needs.points) { // maximize ranking points (routes through solveBudget)
        const sl = Object.keys(STAT_LABEL).filter((s) => (gained[s] || 0) !== 0)
          .map((s) => `<div class="k">${STAT_LABEL[s]}</div><div class="v">${sfmt(gained[s])}</div>`).join("");
        el.innerHTML = `<div class="grid">` +
          `<div class="k">Ranking points</div><div class="v">+${fmt(totalPts)}</div>` +
          `<div class="k">Bundle</div><div class="v">${chosen.length} moves · ${fmt(totalGold)} gold</div>` +
          sl + `</div>` + planBundle;
        return;
      }
      const short = maxMode ? [] : keys.filter((s) => (remaining[s] ?? 0) > 0);
      const lines = keys.map((s) => {
        const got = gained[s] ?? 0;
        if (maxMode) return `<div class="k">${STAT_LABEL[s]}</div><div class="v">max reachable ${sfmt(got)}</div>`;
        const met = (remaining[s] ?? 0) <= 0;
        return `<div class="k">${STAT_LABEL[s]}</div><div class="v ${met ? "" : "warn"}">need +${fmt(needs[s])} · got ${sfmt(got)} ${met ? "✓" : `✗ short ${fmt(remaining[s])}`}</div>`;
      }).join("");
      el.innerHTML = `<div class="grid">${lines}` +
        `<div class="k">Bundle</div><div class="v">${chosen.length} moves · ${sfmt(totalPts)} pts</div>` +
        `<div class="k">Total gold</div><div class="v">${fmt(totalGold)}</div></div>` +
        (short.length ? `<p class="warn" style="margin:8px 0 0">Can't fully reach: ${short.map((s) => STAT_LABEL[s]).join(", ")}: ${budgetLimited ? "the next useful move exceeds your budget" : lossyLimited ? `the only remaining moves are net-loss tradeoffs: uncheck <b>Tradeoffs</b> to use them` : `no remaining move improves ${short.length > 1 ? "them" : "it"} (move catalog may be incomplete)`}.</p>` : ``) +
        // Only surface the floor warning when a goal is actually short (or in maximize). If every
        // goal was met, a floor merely capping FURTHER gains isn't worth nagging about.
        ((short.length || maxMode) ? floorWarn : "") + planBundle;
    }

    // `refreshForm`: pass true when the CURRENT stat totals changed OUTSIDE the Target panel
    // (a sidebar stat/gear edit). The goal form's Current column and the raid table's
    // floor-met coloring read them, so the form is rebuilt to track. In-panel edits pass
    // false (default): rebuilding the form mid-keystroke would replace the input under the
    // cursor. renderThresholdForm runs updateThresholdSummary itself.
    function recomputeThreshold(refreshForm = false) {
      views[THRESHOLD_TAB] = buildThresholdView();
      if (active === THRESHOLD_TAB) { sort = { ...views[THRESHOLD_TAB].defaultSort }; renderTable(); }
      if (refreshForm) renderThresholdForm(); else updateThresholdSummary();
      // The Upgrades DPS columns + Damage tab read currentStats live, refresh both
      // on any stat change (this fn is the funnel every stat edit goes through).
      views[UPGRADES_TAB] = buildUpgradeView(statTarget);
      if (active === UPGRADES_TAB) renderTable();
      if (active === DAMAGE_TAB) renderDamage();
      renderSidebar(); // projected totals depend on the bundle
    }

    // Damage tab (SPEC §19)
    // Per-stat damage marginals vs a reference boss. Stats seed live from
    // currentStats with a what-if tweak overlay (deltas, the real stats are never
    // touched); the boss comes from the raid picker (sheet `Def` + caps) with
    // per-field overrides. The picked boss also drives the Upgrades DPS columns.
    let dmgPipeOpen = false; // pipeline expandable, survives the per-edit re-renders
    const dmgEffStats = () => {
      const s = { ...currentStats };
      for (const [k, v] of Object.entries(damagePrefs.tweaks)) s[k] = (s[k] || 0) + v;
      return s;
    };
    // Boss/raid changes also invalidate the Upgrades DPS columns, rebuild that view.
    function damageChanged() {
      persistDamagePrefs();
      views[UPGRADES_TAB] = buildUpgradeView(statTarget);
      renderDamage();
    }
    function renderDamage() {
      const b = damageBoss();
      const eff = dmgEffStats();
      const list = damageRaids();
      const raidSel = damagePrefs.raid ?? b.raid; // effective selection shown in the picker
      const raidOpts = [`<option value="">Custom boss</option>`]
        .concat(list.map((r) => `<option value="${esc(r.raid)}"${r.raid === raidSel ? " selected" : ""}>${esc(r.raid)}</option>`)).join("");
      // Boss fields as labeled tiles. Override state = accent border (hover explains),
      // missing sheet value = dashed border, instead of the old text pills.
      const bossField = (key, label, val, fromSheet) => {
        const over = damagePrefs.custom[key] != null;
        const title = over ? "Manual override. Re-pick the raid to restore sheet values"
          : !fromSheet ? "No sheet value for this raid. Type one here to fill it in" : "";
        return `<div class="dmg-tile${over ? " override" : fromSheet ? "" : " nosheet"}"${title ? ` title="${title}"` : ""}>
            <span class="dmg-tile-l">${label}</span>
            <input type="text" data-dmg-boss="${key}" value="${val ?? ""}" placeholder="—"></div>`;
      };
      const capFlag = (k) => {
        const cap = k === "bal" ? b.balCap : k === "crit" ? b.critCap : null;
        return cap && eff[k] >= cap ? `<span class="dmg-capflag">capped</span>` : "";
      };
      const statRow = (k) => {
        const tweak = damagePrefs.tweaks[k] || 0;
        // The delta span always renders (empty at 0) so the hold-to-repeat loop can
        // update it in place without a re-render. It sits in the tile's label row.
        return `<div class="dmg-tile stat">
          <span class="dmg-tile-l">${STAT_LABEL[k]}${capFlag(k)}<span class="dmg-delta${tweak > 0 ? " pos" : tweak < 0 ? " neg" : ""}" data-dmg-delta="${k}">${tweak ? `${tweak > 0 ? "+" : ""}${fmt(tweak)}` : ""}</span></span>
          <span class="dmg-tile-ctl">
            <button type="button" class="dmg-step" data-dmg-step="${k}" data-dir="-1" title="−1 (hold to repeat)">−</button>
            <input type="text"${tweak ? ` class="tweaked"` : ""} data-dmg-stat="${k}" value="${eff[k] ?? 0}">
            <button type="button" class="dmg-step" data-dmg-step="${k}" data-dir="1" title="+1 (hold to repeat)">+</button>
          </span></div>`;
      };
      const brk = damageBreakdown(eff, b);
      // Marginals table: % damage per +1 of each stat, best first.
      let margRows = "";
      if (brk) {
        const marg = statMarginals(eff, b);
        const entries = DAMAGE_STAT_KEYS.map((k) => ({ k, g: marg[k] })).sort((a, x) => (x.g ?? -1) - (a.g ?? -1));
        const maxG = Math.max(1e-9, ...entries.map((e) => e.g ?? 0));
        margRows = entries.map(({ k, g }) => {
          const capped = (k === "bal" || k === "crit") && g != null && g <= 0 && (k === "bal" ? b.balCap : b.critCap) && eff[k] >= (k === "bal" ? b.balCap : b.critCap);
          return `<div class="dmg-mcard${capped ? " capped" : ""}">
            <span class="mname">${STAT_LABEL[k]}</span>
            <span class="mval">${fmt(eff[k] || 0)}</span>
            <div class="dmg-bar"><i style="width:${Math.max(0, ((g ?? 0) / maxG) * 100)}%"></i></div>
            <span class="mmarg">${capped ? `<span class="dmg-capflag">capped</span>` : `${marginFmt(g)} <span class="muted">/ +1</span>`}</span>
          </div>`;
        }).join("");
      }
      const bossName = b.raid ? esc(b.raid) : "custom boss";
      // Pipeline (SPEC §19.4): a collapsed expandable section card. A 100k example hit
      // (real stats → what-if stats), per-stage explainers with this character's numbers
      // substituted into the actual formulas (coefficients mirror js/damage.js), then the
      // vertical summary equation. Stage values show "real → what-if" while tweaks exist.
      let chain = "";
      if (brk) {
        const brkBase = damageBreakdown(currentStats, b);
        const tweaked = Object.keys(damagePrefs.tweaks).length > 0 && !!brkBase;
        // Math blocks: one equation per row (name | = expression | result), prose kept out.
        const mrow = (k, e, v) => `<span class="mk">${k}</span><span class="me">${e}</span><span class="mv">${v}</span>`;
        const mnote = (t) => `<span class="mnote">${t}</span>`;
        const math = (...rows) => `<div class="dmg-math">${rows.filter(Boolean).join("")}</div>`;
        const sv = (get, f = (n) => fmt(Math.round(n))) => {
          const now = f(get(brk));
          if (!tweaked) return now;
          const was = f(get(brkBase));
          return was !== now ? `<span class="old">${was}</span> → ${now}` : now;
        };
        const stage = (n, name, val, body) =>
          `<div class="dmg-stage"><div class="dmg-stage-h"><span class="num">${n}</span><span class="sname">${name}</span><span class="sval">${val}</span></div>
            <div class="dmg-stage-x">${body}</div></div>`;
        // Example hit: anchor 100,000 to the real-stats rating, scale by the what-if rating.
        const hitAfter = tweaked && brkBase.rating > 0 ? 100000 * brk.rating / brkBase.rating : null;
        const hitRow = `<div class="dmg-hit${hitAfter == null ? "" : hitAfter >= 100000 ? " up" : " down"}">
            <span class="dmg-hit-n">100,000</span>
            ${hitAfter != null ? `<span class="dmg-hit-arrow">→</span><span class="dmg-hit-n new">${fmt(Math.round(hitAfter))}</span>
              <span class="dmg-hit-pct ${hitAfter >= 100000 ? "pos" : "neg"}">${hitAfter >= 100000 ? "+" : ""}${Number((hitAfter / 1000 - 100).toPrecision(3))}%</span>` : ""}
          </div>`;
        // Stage 1: the in-game Applied-ATT curve, piecewise on gap = ATT − boss DEF.
        const att = eff.att || 0, gap = att - b.def;
        const s1prose = gap <= 4000
          ? "Below DEF + 4,000 there is no falloff: ATT counts in full."
          : gap <= 22000
            ? "This gap is in the falloff band (DEF + 4,000 to DEF + 22,000), where each extra ATT point applies at less than 1 and keeps shrinking."
            : "This gap is past DEF + 22,000: the curve is spent, every further ATT point applies at 0.1.";
        // The seam rows show why the constants exist: the quadratic evaluates to exactly
        // 4,000 and 13,900 at the two breakpoints, so the three pieces join with no jump.
        const s1 = `<p>The in-game Applied ATT curve, piecewise on the gap between raw ATT and the boss's DEF. ${s1prose}</p>` + math(
          mrow("gap", `= ATT − DEF = ${fmt(att)} − ${fmt(b.def)}`, fmt(gap)),
          gap <= 4000 ? mrow("applied", "= ATT", fmt(brk.applied))
            : gap <= 22000 ? mrow("applied", "= DEF + floor(1.2·gap − 0.000025·gap² − 400)", fmt(brk.applied))
            : mrow("applied", "= DEF + 13,900 + 0.1 × (gap − 22,000)", fmt(brk.applied)),
          gap > 4000 && gap <= 22000
            ? mrow("per +1 ATT", `= 1.2 − 0.00005 × gap = 1.2 − 0.00005 × ${fmt(gap)}`, (1.2 - 0.00005 * gap).toFixed(2))
            : "",
          mrow("seam 4,000", "= 1.2·4,000 − 0.000025·4,000² − 400 = 4,800 − 400 − 400", "4,000"),
          mrow("seam 22,000", "= 1.2·22,000 − 0.000025·22,000² − 400 = 26,400 − 12,100 − 400", "13,900"),
          mnote("the −400 stitches the pieces: the quadratic meets the 1:1 line at gap 4,000 and hands off to the 13,900 + 0.1 tail at 22,000"));
        // Stage 2: DEF Pen, then the legacy pre-rework polynomial on the applied ATT.
        const x2 = (brk.applied - brk.endDef + 900) / (brk.endDef + 900);
        const s2 = `<p>DEF Pen ignores 8 DEF per point, then the legacy pre-rework formula runs on the applied ATT. An x under 1 takes the quintic branch; 1 or over is flat 1:1.</p>` + math(
          mrow("endDEF", `= DEF − 8 × DEF Pen = ${fmt(b.def)} − 8 × ${fmt(eff.defPen || 0)}`, fmt(brk.endDef)),
          mrow("x", "= (applied − endDEF + 900) / (endDEF + 900)", x2.toFixed(3)),
          x2 >= 1 ? "" : mrow("f(x)", "= 0.1856 + 0.5525x + 0.4214x² − 0.3094x³ + 0.3643x⁴ − 0.2144x⁵", (brk.endATT / (brk.endDef + 900)).toFixed(4)),
          x2 >= 1
            ? mrow("effective", "= applied − endDEF + 900", fmt(brk.endATT))
            : mrow("effective", `= (endDEF + 900) × f(x) = ${fmt(brk.endDef + 900)} × ${(brk.endATT / (brk.endDef + 900)).toFixed(4)}`, fmt(brk.endATT)));
        // Stage 3: Additional Damage multiplier, keyed on applied − endDEF.
        const diff = brk.applied - brk.endDef;
        const s3 = `<p>Additional Damage rides a multiplier keyed on how far the applied ATT clears the effective DEF, then lands on top of the effective ATT.</p>` + math(
          mrow("diff", "= applied − endDEF", fmt(diff)),
          diff <= 3000 ? mrow("mult", "= 1.875 (the floor: diff ≤ 3,000)", brk.adm.toFixed(3))
            : diff <= 10000 ? mrow("mult", `= diff / 1,600 = ${fmt(diff)} / 1,600`, brk.adm.toFixed(3))
            : mrow("mult", `= 6.25 + (diff − 10,000) / 2,400 = 6.25 + ${fmt(diff - 10000)} / 2,400`, brk.adm.toFixed(3)),
          mnote("mult bands: diff ≤ 3,000 → 1.875 · up to 10,000 → diff / 1,600 · past 10,000 → 6.25 + (diff − 10,000) / 2,400"),
          mrow("AD term", `= Add Dmg × mult = ${fmt(eff.addDmg || 0)} × ${brk.adm.toFixed(3)}`, fmt(Math.round(brk.adTerm))),
          mrow("final ATT", `= effective + AD term = ${fmt(brk.endATT)} + ${fmt(Math.round(brk.adTerm))}`, fmt(Math.round(brk.finalATT))));
        // Stage 4: the three final multipliers.
        const effBal = b.balCap > 0 ? Math.min(eff.bal || 0, b.balCap) : (eff.bal || 0);
        const critChance = b.critCap > 0 ? Math.min(eff.crit || 0, b.critCap) / b.critCap * 0.5 : 0;
        const s4 = `<p>Three independent multipliers finish the hit: Balance sets the average roll between your minimum and the max, Critical folds the 1.95× crit bonus in by chance, and Destruction adds 0.0022% per point.</p>` + math(
          b.balCap > 0
            ? mrow("balance", `= (100 × min(Bal, cap) / cap + 100) / 200 = (100 × ${fmt(effBal)} / ${fmt(b.balCap)} + 100) / 200`,
                `${brk.balFac.toFixed(3)}×${(eff.bal || 0) >= b.balCap ? " (capped)" : ""}`)
            : mrow("balance", "= 1 (no cap value for this boss)", "1.000×"),
          b.critCap > 0
            ? mrow("chance", `= min(Crit, cap) / cap × 50% = min(${fmt(eff.crit || 0)}, ${fmt(b.critCap)}) / ${fmt(b.critCap)} × 50%`,
                `${(critChance * 100).toFixed(1)}%`)
            : "",
          b.critCap > 0
            ? mrow("critical", `= 1 + chance × 0.95 = 1 + ${critChance.toFixed(3)} × 0.95`,
                `${brk.critFac.toFixed(3)}×${(eff.crit || 0) >= b.critCap ? " (capped)" : ""}`)
            : mrow("critical", "= 1 (no cap value: chance treated as 0%)", "1.000×"),
          mrow("destruction", `= 1 + Dest × 0.0022% = 1 + ${fmt(eff.destruction || 0)} × 0.0022%`, `${brk.destFac.toFixed(4)}×`));
        // Always-visible TLDR: one line per stat, what it does to the formula, with the
        // live values against this boss. The stage-by-stage math hides in the expandable.
        const tn = (s) => `<span class="n">${s}</span>`;
        const trow = (k, txt) => `<span class="tk">${STAT_LABEL[k]}</span><span class="tv">${txt}</span>`;
        const tldr = `<div class="dmg-tldr">
          ${trow("att", `raw attack vs boss DEF: full value up to DEF + 4,000 over, curving down to ${tn("0.1")} per point past DEF + 22,000.`)}
          ${trow("addDmg", `skips the DEF curve, lands at a multiplier that grows with applied ATT: ${tn(`× ${brk.adm.toFixed(2)}`)} vs this boss right now.`)}
          ${trow("bal", b.balCap > 0
            ? `raises the average roll between your min and max hit: ${tn(`×${brk.balFac.toFixed(3)}`)} now, maxing at the boss's ${tn(fmt(b.balCap))} cap.`
            : `no cap value for this boss: ${tn("×1")}.`)}
          ${trow("crit", b.critCap > 0
            ? `crit chance scales to 50% at the boss's ${tn(fmt(b.critCap))} cap; crits deal ${tn("1.95×")}: ${tn(`×${brk.critFac.toFixed(3)}`)} on average now.`
            : `no cap value for this boss: treated as 0% crit chance.`)}
          ${trow("destruction", `flat ${tn("+0.0022%")} final damage per point: ${tn(`×${brk.destFac.toFixed(3)}`)} now.`)}
          ${trow("defPen", `each point ignores ${tn("8")} boss DEF before anything else runs: ${tn(fmt((eff.defPen || 0) * 8))} DEF ignored now.`)}
        </div>`;
        chain = `<div class="dmg-sec">
          <h4 class="dmg-sec-h">Damage pipeline<span class="muted">, one hit vs ${bossName}</span></h4>
          ${hitRow}
          ${tldr}
          <details class="dmg-pipe"${dmgPipeOpen ? " open" : ""}>
            <summary>Full math, stage by stage</summary>
            ${stage(1, "Applied ATT", sv((r) => r.applied), s1)}
            ${stage(2, "Effective ATT", sv((r) => r.endATT), s2)}
            ${stage(3, "Final ATT", sv((r) => r.finalATT), s3)}
            ${stage(4, "Final multipliers", sv((r) => r.balFac * r.critFac * r.destFac, (n) => `${n.toFixed(3)}×`), s4)}
          </details>
        </div>`;
      }
      // What-if banner: overall damage of the tweaked stats vs the character's REAL stats,
      // then a per-stat contribution breakdown, each line is that ONE stat's tweak applied
      // alone (isolated), so "+X% from Crit" reads as a standalone truth. They combine
      // multiplicatively, so the lines needn't sum exactly to the headline.
      let whatif = "";
      if (brk && Object.keys(damagePrefs.tweaks).length) {
        const base = damageRating(currentStats, b);
        if (base > 0) {
          const pct = (brk.rating / base - 1) * 100;
          const wpct = (p) => `${p >= 0 ? "+" : ""}${Number(p.toPrecision(3))}%`;
          const contribs = Object.keys(damagePrefs.tweaks).map((k) => {
            const solo = { ...currentStats, [k]: (currentStats[k] || 0) + damagePrefs.tweaks[k] };
            const p = (damageRating(solo, b) / base - 1) * 100;
            return { k, p, tw: damagePrefs.tweaks[k] };
          }).sort((a, x) => Math.abs(x.p) - Math.abs(a.p));
          const breakRows = contribs.map(({ k, p, tw }) =>
            `<div class="dmg-wb-row"><span class="dmg-wb-name">${STAT_LABEL[k]} <span class="muted">${tw > 0 ? "+" : "−"}${fmt(Math.abs(tw))}</span></span>` +
            `<span class="dmg-wb-pct ${p > 0 ? "pos" : p < 0 ? "neg" : "muted"}">${wpct(p)}</span></div>`).join("");
          whatif = `<div class="dmg-whatif${pct < 0 ? " down" : ""}">
            <div class="dmg-whatif-top">
              <span class="dmg-whatif-pct">${wpct(pct)}</span>
              <span class="dmg-whatif-txt">damage with new stats <span class="muted">vs ${bossName}</span></span>
            </div>
            ${contribs.length > 1 ? `<div class="dmg-whatif-break">${breakRows}</div>` : ""}
          </div>`;
        }
      }
      damagePanel.innerHTML = `
        <h3>Damage</h3>
        <p class="hint">How much each stat point is worth against a specific boss. Stats seed from your character.
          Tweak them freely in the panel (your real stats don't change). The picked boss also prices the Upgrades tab's DPS columns.</p>
        <div class="dmg-body">
          <div class="dmg-main">
          ${brk ? `<div class="dmg-sec">${whatif}<h4 class="dmg-sec-h">Damage per stat point<span class="muted">, vs ${bossName}</span></h4>
            <div class="dmg-list">${margRows}</div></div>
            ${chain}`
          : `<div class="dmg-sec"><p class="dmg-hint" style="margin:0">Pick a raid with a Def value (or enter a custom Boss DEF) to compute damage.</p></div>`}
          </div>
          <div class="plan-mats dmg-side">
            <div class="dmg-rail-h"><h4>Boss</h4><select class="dmg-raid-sel" data-dmg-raid>${raidOpts}</select></div>
            <div class="dmg-tile-grid boss">
              ${bossField("def", "Boss DEF", b.def, damagePrefs.custom.def == null && b.def != null)}
              ${bossField("balCap", "Bal cap", b.balCap, damagePrefs.custom.balCap == null && b.balCap != null)}
              ${bossField("critCap", "Crit cap", b.critCap, damagePrefs.custom.critCap == null && b.critCap != null)}
            </div>
            ${b.def == null ? `<p class="dmg-hint" style="margin:8px 0 0">No Def for this raid yet. Fill the sheet's bare <b>Def</b> column (from the in-game Battle (N) window) or type one here.</p>` : ""}
            <div class="dmg-rail-h stats"><h4>Your stats</h4>
              ${Object.keys(damagePrefs.tweaks).length ? `<button type="button" class="plan-mat-tool" data-dmg-reset title="Clear every what-if tweak, back to your character's real stats">reset to character</button>` : ""}
            </div>
            <div class="dmg-tile-grid stats">${DAMAGE_STAT_KEYS.map(statRow).join("")}</div>
          </div>
        </div>`;
    }
    // Delegated events: raid pick, boss-field override, stat tweak (typed / stepped), reset.
    damagePanel.addEventListener("change", (e) => {
      const raidEl = e.target.closest("select[data-dmg-raid]");
      if (raidEl) { damagePrefs.raid = raidEl.value || null; damagePrefs.custom = {}; damageChanged(); return; }
      const bossEl = e.target.closest("input[data-dmg-boss]");
      if (bossEl) {
        const k = bossEl.dataset.dmgBoss, v = parseNum(bossEl.value);
        if (v == null) delete damagePrefs.custom[k]; else damagePrefs.custom[k] = v;
        damageChanged(); return;
      }
      const statEl = e.target.closest("input[data-dmg-stat]");
      if (statEl) {
        const k = statEl.dataset.dmgStat, v = parseNum(statEl.value);
        const tweak = (v ?? (currentStats[k] || 0)) - (currentStats[k] || 0);
        if (tweak) damagePrefs.tweaks[k] = tweak; else delete damagePrefs.tweaks[k];
        persistDamagePrefs(); renderDamage(); return;
      }
    });
    damagePanel.addEventListener("click", (e) => {
      if (e.target.closest("button[data-dmg-reset]")) {
        damagePrefs.tweaks = {}; persistDamagePrefs(); renderDamage(); return;
      }
    });
    // Remember the pipeline expandable's state across re-renders (toggle doesn't bubble).
    damagePanel.addEventListener("toggle", (e) => {
      if (e.target.classList?.contains("dmg-pipe")) dmgPipeOpen = e.target.open;
    }, true);
    // Steppers: ±1 per press, hold to repeat with acceleration. While held, only the
    // input + delta badge update in place (a re-render would destroy the held button);
    // the full render + persist land on release.
    let dmgHold = null;
    function dmgStepTick(h) {
      const next = (damagePrefs.tweaks[h.k] || 0) + h.dir;
      const effV = (currentStats[h.k] || 0) + next;
      if (effV < 0) return; // never push the effective stat negative
      if (next) damagePrefs.tweaks[h.k] = next; else delete damagePrefs.tweaks[h.k];
      if (h.input) {
        h.input.value = effV;
        h.input.classList.toggle("tweaked", !!next);
      }
      if (h.delta) {
        h.delta.textContent = next ? `${next > 0 ? "+" : ""}${fmt(next)}` : "";
        h.delta.className = `dmg-delta${next > 0 ? " pos" : next < 0 ? " neg" : ""}`;
      }
    }
    damagePanel.addEventListener("pointerdown", (e) => {
      const step = e.target.closest("button[data-dmg-step]");
      if (!step || e.button > 0) return;
      e.preventDefault();
      const k = step.dataset.dmgStep;
      const h = dmgHold = {
        k, dir: Number(step.dataset.dir), timer: null,
        input: damagePanel.querySelector(`input[data-dmg-stat="${CSS.escape(k)}"]`),
        delta: damagePanel.querySelector(`[data-dmg-delta="${CSS.escape(k)}"]`),
      };
      dmgStepTick(h); // the press itself is one ±1
      let interval = 90;
      const loop = () => { dmgStepTick(h); interval = Math.max(12, interval * 0.9); h.timer = setTimeout(loop, interval); };
      h.timer = setTimeout(loop, 350);
    });
    const dmgHoldEnd = () => {
      if (!dmgHold) return;
      clearTimeout(dmgHold.timer); dmgHold = null;
      persistDamagePrefs(); renderDamage();
    };
    window.addEventListener("pointerup", dmgHoldEnd);
    window.addEventListener("pointercancel", dmgHoldEnd);

    // Inventory sidebar (read-only, SPEC §12)
    // Always shows the equipped loadout + current scored totals. On the Threshold tab it
    // also shows the PROJECTED totals after the current bundle (its `gained` map).
    const SIDEBAR_SLOT_ORDER = ["weapon", "helm", "chest", "pant", "hand", "feet",
      "necklace", "totem", "brooch", "ring1", "ring2", "belt", "earrings", "artifact", "rhod"];
    const shortScroll = (s) => (s ? s.replace(/\s*Enchant Scroll\s*$/i, "") : null);

    // Which slot (if any) is currently open for inline editing in the sidebar.
    let editingSlot = null;
    // Which stat total (if any) is open for inline editing (click-to-edit, like a slot).
    let editingStat = null;

    // Per-stat delta between two loadout entries (new − old) over the scored stats.
    // Drives the live "if you save" preview in the gear editor; zero deltas omitted.
    function slotStatDiff(next, prev) {
      const a = slotStats(next), b = slotStats(prev), diff = {};
      for (const k of Object.keys(STAT_LABEL)) { const d = (a[k] || 0) - (b[k] || 0); if (d) diff[k] = d; }
      return diff;
    }

    // Constrained inline editor for one slot, the "quick edit" path (SPEC §9/§12):
    // dropdowns offer ONLY bases valid for the slot (bySlot) and enchants whose affix
    // + appliesTo match it (never-invent-data: an item not in the sheet can't be picked,
    // it's a data gap to fill in the Sheet). Enhanceable accessory slots add a +level
    // field; the bracket is derived from the chosen base's item level on save.
    // Signed ranking-point delta as a compact option suffix (ASCII minus for <option>).
    const ptDelta = (n) => (n > 0 ? "+" : n < 0 ? "−" : "±") + fmt(Math.abs(Math.round(n)));

    function slotEditForm(s) {
      const g = loadout[s] || {};
      const baseScore = g.base ? score(itemByName[g.base]?.stats || {}) : 0; // current base, for option deltas
      const cands = (bySlot[s] || []).slice().sort((a, b) => score(b.stats) - score(a.stats));
      const names = cands.map((it) => it.name);
      if (g.base && !names.includes(g.base)) names.unshift(g.base); // keep current even if off-list
      // Leading "(none)" clears the slot (empty gear). Its delta is the loss of the
      // current base's points, mirroring the enchant "(none)" option below.
      const noneOpt = `<option value=""${!g.base ? " selected" : ""}>(none${g.base ? ` ${ptDelta(-baseScore)} pt` : ""})</option>`;
      const baseOpts = noneOpt + names.map((n) => {
        const d = score(itemByName[n]?.stats || {}) - baseScore;
        const tag = n === g.base ? " (current)" : ` (${ptDelta(d)} pt)`;
        return `<option value="${esc(n)}" ${n === g.base ? "selected" : ""}>${esc(n)}${tag}</option>`;
      }).join("");
      const baseLevel = g.base ? (itemByName[g.base]?.level ?? null) : null;
      const enchSel = (affix, cur) => {
        const curScore = cur ? score(enchants[cur]?.stats || {}) : 0; // current affix, for option deltas
        const opts = Object.values(enchants).filter((e) => e.affix === affix && e.appliesTo.includes(s)
            && !(e.minLevel && baseLevel != null && baseLevel < e.minLevel)) // item too low-level for this scroll
          .sort((a, b) => score(b.stats) - score(a.stats));
        return `<option value="">(none${cur ? ` ${ptDelta(-curScore)} pt` : ""})</option>` + opts.map((e) => {
          const tag = e.scroll === cur ? " (current)" : ` (${ptDelta(score(e.stats) - curScore)} pt)`;
          return `<option value="${esc(e.scroll)}" ${e.scroll === cur ? "selected" : ""}>${shortScroll(e.scroll)}${tag}</option>`;
        }).join("");
      };
      const enhanceable = ENHANCEABLE_SLOT_IDS.includes(s);
      // Tuning inputs (SPEC §12): for a weapon/armor slot, one numeric field per tunable
      // stat of the CURRENT base, holding the amount already tuned (0..cap). Drives the
      // live totals + the tuneStep moves' starting point. Keyed by the sheet stat label.
      const tuneRows = TIER_SLOT_IDS.includes(s) && g.base ? (tuning[tuningKey(g.base)] || []) : [];
      const tuneFields = tuneRows.length ? `<div class="efield etune"><label>Tuning</label><div class="tunegrid">${
        tuneRows.map((r) => `<span class="tlbl">${r.stat}</span><input type="number" data-tune="${esc(r.stat)}" min="0" max="${r.maxTune}" step="${r.step}" value="${g.tuning?.[r.stat] ?? 0}"><span class="muted">/ ${fmt(r.maxTune)}</span>`).join("")
      }</div></div>` : "";
      // Infusion (SPEC §14): one recorded stat line for infusable slots (weapon/armor/accessory).
      // Same data as the Checklist tab (entry.infusion), edited here too; folds into slotStats.
      const infOpts = infusionKind(s) ? infusionOptions(s) : null;
      const infCur = g.infusion || null;
      const infAmtOpts = (stat) => (infOpts[stat] || []).map((a) => `<option value="${a}"${infCur?.amount === a ? " selected" : ""}>+${a}</option>`).join("");
      const infFields = infOpts ? `<div class="efield einf"><label>Infusion</label><div class="infgrid">` +
        `<select data-inf="stat"><option value="">None</option>${Object.keys(infOpts).map((k) => `<option value="${k}"${infCur?.stat === k ? " selected" : ""}>${INFUSION_STAT_LABEL[k]}</option>`).join("")}</select>` +
        `<select data-inf="amt"${infCur?.stat ? "" : " disabled"}>${infCur?.stat ? infAmtOpts(infCur.stat) : `<option>—</option>`}</select>` +
        `</div></div>` : "";
      return `<li class="editing" data-slot="${s}">
        <div class="slot">${s}</div>
        <div class="efield"><label>Base</label><select data-f="base">${baseOpts}</select></div>
        <div class="efield"><label>Prefix</label><select data-f="prefix">${enchSel("prefix", g.prefix)}</select></div>
        <div class="efield"><label>Suffix</label><select data-f="suffix">${enchSel("suffix", g.suffix)}</select></div>
        ${enhanceable ? `<div class="efield"><label>Enhance +</label><input type="number" data-f="level" min="0" max="20" value="${g.enhance?.level ?? 0}"></div>` : ""}
        ${tuneFields}
        ${infFields}
        <div class="epreview">${slotPreviewHTML(g, s)}</div>
        <div class="ebtns"><button class="esave" data-slot="${s}">Save</button><button class="ecancel">Cancel</button></div>
      </li>`;
    }

    // Read the open editor's current selections into a pending loadout entry (does NOT
    // commit). Shared by the live preview and commitSlot so parsing stays in one place.
    function pendingFromForm(s) {
      const li = sidebarEl.querySelector(`li.editing[data-slot="${s}"]`);
      if (!li) return loadout[s];
      const val = (f) => li.querySelector(`[data-f="${f}"]`)?.value;
      const base = val("base") || null;
      const slot = { prefix: val("prefix") || null, suffix: val("suffix") || null, base };
      if (ENHANCEABLE_SLOT_IDS.includes(s)) {
        const level = Math.max(0, Math.min(20, parseInt(val("level")) || 0));
        if (level > 0 && base) slot.enhance = { level, bracket: itemByName[base]?.level ?? loadout[s]?.enhance?.bracket };
      }
      // Tuning amounts (SPEC §12): clamp each to [0, cap] and keep only nonzero entries.
      if (TIER_SLOT_IDS.includes(s) && base) {
        const rows = tuning[tuningKey(base)] || [];
        const t = {};
        for (const r of rows) {
          const el = li.querySelector(`[data-tune="${CSS.escape(r.stat)}"]`);
          if (!el) continue;
          const amt = Math.max(0, Math.min(r.maxTune, parseInt(el.value) || 0));
          if (amt > 0) t[r.stat] = amt;
        }
        if (Object.keys(t).length) slot.tuning = t;
      }
      // Infusion (SPEC §14): the recorded stat line; clamp the amount to the stat's allowed set.
      if (infusionKind(s)) {
        const stat = li.querySelector('[data-inf="stat"]')?.value || "";
        if (stat) {
          const amts = infusionOptions(s)[stat] || [1];
          let amt = parseInt(li.querySelector('[data-inf="amt"]')?.value) || amts[0];
          if (!amts.includes(amt)) amt = amts[0];
          slot.infusion = { stat, amount: amt };
        }
      }
      return slot;
    }

    // "If you save" preview: per-stat change (green/red) + net ranking-point delta of the
    // pending config vs what's equipped. Answers the user's "show how stats will change".
    function slotPreviewHTML(pending, s) {
      const diff = slotStatDiff(pending, loadout[s]);
      const keys = Object.keys(STAT_LABEL).filter((k) => diff[k]);
      const net = score(slotStats(pending)) - score(slotStats(loadout[s]));
      const title = `<div class="ptitle">Change if saved</div>`;
      if (!keys.length) return title + `<div class="pdiff muted">no change yet</div>`;
      const body = keys.map((k) => `<span class="${diff[k] > 0 ? "pos" : "neg"}">${STAT_LABEL[k]} ${diff[k] > 0 ? "+" : "−"}${fmt(Math.abs(diff[k]))}</span>`).join(", ");
      return title + `<div class="pdiff">${body}</div><div class="pnet">Ranking pts ${ptDelta(net)}</div>`;
    }

    // Refresh the live preview from the form's current selections.
    function renderSlotPreview(s) {
      const el = sidebarEl.querySelector(`li.editing[data-slot="${s}"] .epreview`);
      if (el) el.innerHTML = slotPreviewHTML(pendingFromForm(s), s);
    }

    // Commit the open editor → write the slot, persist, re-derive moves.
    function commitSlot(s) {
      const li = sidebarEl.querySelector(`li.editing[data-slot="${s}"]`);
      if (!li) return;
      const slot = pendingFromForm(s);
      // Apply this slot's stat DELTA (old config → new config) to the live totals so
      // the sidebar stats track the edit (e.g. Uaithne → Beginner Uaithne weapon).
      const before = slotStats(loadout[s]), after = slotStats(slot);
      for (const k of Object.keys(STAT_LABEL)) {
        const d = (after[k] || 0) - (before[k] || 0);
        if (d) currentStats[k] = (currentStats[k] || 0) + d;
      }
      persistStats();
      loadout[s] = slot;
      persistLoadout();
      editingSlot = null;
      recomputeLoadout(); // regenerates moves + threshold + re-renders the sidebar read-only
    }

    // Discard local edits and fall back to the config.js seed.
    // Revert the working loadout to the startup BASELINE (last-saved state), re-persist,
    // and re-derive. NOT a wipe-to-seed, it restores whatever you had when the app opened.
    function resetLoadout() {
      loadout = structuredClone(loadoutBaseline);
      persistLoadout();
      // Gear edits apply stat deltas to the totals, so reverting the loadout must also
      // revert those totals to baseline (in place, thCurrent aliases currentStats).
      for (const k of Object.keys(currentStats)) delete currentStats[k];
      Object.assign(currentStats, statsBaseline);
      persistStats();
      editingSlot = null;
      recomputeLoadout();
    }

    // Character save-slot bar at the top of the sidebar: a select of saved characters
    // (+ an "Unsaved" option), a preset picker, and Save / Save-as / Rename / Delete.
    // A ✎ marker + enabled Save show when the working state diverges from the loaded slot.
    function profileBar() {
      const ph = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      const dirty = loadoutDirty() || statsDirty() || checklistDirty() || inventoryDirty() || goldDirty() || pathDirty();
      const active = profiles.active;
      const opts = profiles.list.map((p) =>
        `<option value="${ph(p.id)}"${p.id === active ? " selected" : ""}>${ph(p.name)}${p.id === active && dirty ? " ✎" : ""}</option>`).join("");
      const presetOpts = GEAR_PRESETS.map((p) => `<option value="${ph(p.name)}">${ph(p.name)}</option>`).join("");
      return `<div class="profileblock">` +
        `<h3>Character <span class="edithint">save slots</span></h3>` +
        `<div class="profrow">` +
          `<select class="profsel" title="Switch between saved characters">` +
            `<option value=""${!active ? " selected" : ""}>. Unsaved${!active && dirty ? " ✎" : ""} —</option>` +
            opts +
          `</select>` +
        `</div>` +
        `<div class="profrow profbtns">` +
          `<select class="presetsel" title="Apply a base-gear template, then Save as a new character"><option value="">Preset…</option>${presetOpts}</select>` +
          (active ? `<button class="prof-save"${dirty ? "" : " disabled"} title="Save changes to this character">Save</button>` : ``) +
          `<button class="prof-saveas" title="Save the current gear + stats as a new character">Save as…</button>` +
          (active ? `<button class="prof-rename" title="Rename this character">Rename</button><button class="prof-del" title="Delete this character">Delete</button>` : ``) +
        `</div>` +
      `</div>`;
    }

    function renderSidebar() {
      const cur = currentStats, curPts = score(cur);
      const proj = active === THRESHOLD_TAB ? (thResult.gained || {}) : null;
      const hasProj = proj && Object.keys(proj).some((s) => proj[s]);
      const projPts = hasProj ? (thResult.chosen || []).reduce((a, m) => a + m.pointGain, 0) : 0;

      const gear = SIDEBAR_SLOT_ORDER.filter((s) => loadout[s]).map((s) => {
        if (s === editingSlot) return slotEditForm(s);
        const g = loadout[s];
        const enh = g.enhance ? `<span class="enh">+${g.enhance.level}</span> ` : "";
        const base = g.base ? `${enh}<span class="base">${g.base}</span>` : `<span class="base muted">— ${s} —</span>`;
        const affixes = [shortScroll(g.prefix), shortScroll(g.suffix)].filter(Boolean).join(" · ");
        // Two-line row: +N item name on top (full width → rarely truncates), the two scrolls
        // below. No slot label. The item name identifies the slot (empty slots show ". Slot —").
        // The name line ellipsizes only for the longest names; title recovers the full text.
        const affixLine = affixes ? `<div class="affix">${affixes}</div>` : "";
        const titleText = [s, g.base || `— ${s} —`, affixes].filter(Boolean).join("  ·  ");
        return `<li class="editable" data-slot="${s}" title="${titleText}"><div class="item">${base}</div>${affixLine}</li>`;
      }).join("");

      // Stat totals are click-to-edit (like a gear slot): the value cell shows the
      // number; clicking it swaps in an input (the open one is `editingStat`). The
      // projection delta (if any) shows beside it.
      // When a bundle is projected: render three aligned columns, current value
      // (editable) · delta · projected total. The total bolds, with a muted dash for
      // stats the bundle doesn't touch. Without a bundle it's just label · value.
      const statRows = Object.keys(STAT_LABEL).map((s) => {
        const c = cur[s] ?? 0;
        const d = hasProj ? (proj[s] || 0) : 0;
        const dcell = d ? `<span class="${d > 0 ? "pos" : "neg"}">${sfmt(d)}</span>`
          : (hasProj ? `<span class="nochange">—</span>` : "");
        const vcell = s === editingStat
          ? `<button class="statstep" data-step="-1" tabindex="-1">−</button>` +
            `<input class="statedit" type="number" data-stat="${s}" value="${c}">` +
            `<button class="statstep" data-step="1" tabindex="-1">+</button>`
          : `<span class="editable-stat-text">${fmt(c)}</span>`;
        return `<div class="sk">${STAT_LABEL[s]}</div>` +
          `<div class="sv ${s === editingStat ? "editing-stat" : "editable-stat"}" data-stat="${s}">${vcell}</div>` +
          `<div class="sd">${dcell}</div>` +
          (hasProj ? `<div class="st ${d ? "" : "nochange"}">${fmt(c + d)}</div>` : "");
      }).join("");

      sidebarEl.innerHTML =
        profileBar() +
        `<h3 class="mt">Equipped <span class="edithint">click a slot to edit</span>` +
        (loadoutDirty() ? ` <button class="resetload" title="Discard this session's edits and restore the last-saved loadout">reset</button>` : ``) +
        `</h3><ul class="gear">${gear}</ul>` +
        `<h3 class="mt">Stats <span class="edithint">click a value to edit</span>` +
        (statsDirty() ? ` <button class="resetstats" title="Discard this session's stat edits and restore the last-saved totals">reset</button>` : ``) +
        `</h3>` +
        (hasProj ? `<div class="proj projnote">→ projected (current + bundle)</div>` : ``) +
        `<div class="statgrid${hasProj ? " proj-cols" : ""}">${statRows}</div>` +
        `<h3 class="mt">Ranking points</h3>` +
        // Gold on hand (SPEC §17.5) is edited in the Planner tab's materials panel, not here.
        `<div class="pts">${fmt(hasProj ? curPts + projPts : curPts)}${hasProj && projPts ? ` <span class="pos">${sfmt(projPts)}</span>` : ``}</div>`;

      // Auto-focus the open stat input (click-to-edit just re-rendered the grid).
      if (editingStat) {
        const inp = sidebarEl.querySelector(`.statedit[data-stat="${editingStat}"]`);
        if (inp) { inp.focus(); inp.select(); }
      }
    }

    // Revert stat totals to the startup BASELINE (last-saved snapshot), re-persist, and
    // re-run the gap math. NOT a wipe-to-fixture. Mutated in place because thCurrent
    // aliases this same object.
    function resetStats() {
      for (const k of Object.keys(currentStats)) delete currentStats[k];
      Object.assign(currentStats, statsBaseline);
      persistStats();
      recomputeThreshold(true); // gap math depends on current; refresh the Target form's
      //                           Current column too; also re-renders the sidebar
    }

    // Sidebar editing: click a slot → open its inline editor; Save commits, Cancel
    // closes, reset restores the seed. (Selects inside the open editor don't re-open it
    //, the open row carries class "editing", which the open-guard checks.)
    sidebarEl.addEventListener("click", (e) => {
      if (e.target.closest("button.esave")) { commitSlot(e.target.closest("button.esave").dataset.slot); return; }
      if (e.target.closest("button.ecancel")) { editingSlot = null; renderSidebar(); return; }
      if (e.target.closest("button.resetload")) { resetLoadout(); return; }
      if (e.target.closest("button.resetstats")) { resetStats(); return; }
      // Gold-on-hand stepper (SPEC §17.5): the sidebar's only numField. Nudge, clamp ≥ 0,
      // persist, re-render (refreshes the profile ✎ dirty marker + reformats the field).
      const gstep = e.target.closest(".numstep");
      if (gstep) {
        const inp = gstep.parentElement.querySelector(".numedit"); if (!inp) return;
        goldTracker = Math.max(0, (parseNum(inp.value) ?? 0) + Number(gstep.dataset.step));
        persistGold(); renderSidebar();
        if (active === PLANNER_TAB) renderPlanner(); // gold on hand feeds the affordability projection
        return;
      }
      // Character save slots (SPEC §9.1)
      if (e.target.closest("button.prof-save")) { saveActiveProfile(); return; }
      if (e.target.closest("button.prof-saveas")) {
        const n = prompt("Save current gear + stats as a new character:", "");
        if (n && n.trim()) saveAsProfile(n.trim());
        return;
      }
      if (e.target.closest("button.prof-rename")) {
        const p = activeProfile();
        const n = prompt("Rename character:", p ? p.name : "");
        if (n && n.trim()) renameActiveProfile(n.trim());
        return;
      }
      if (e.target.closest("button.prof-del")) {
        const p = activeProfile();
        if (p && confirm(`Delete character "${p.name}"? (Your current gear/stats stay loaded.)`)) deleteProfile(p.id);
        return;
      }
      const step = e.target.closest(".statstep"); // themed −/+ nudges the open stat field
      if (step) { stepStat(parseInt(step.dataset.step, 10)); return; }
      // Opening a stat cell / gear slot is handled on mousedown (see below) so it runs
      // before the focus-out commit re-renders and detaches the click target.
    });
    // Open a stat cell or gear slot on MOUSEDOWN, before the currently-edited input blurs
    // and re-renders the grid (which would detach this target and break the click). We
    // preventDefault so the open input doesn't blur underneath us, commit it ourselves,
    // then open the new target. (Switching directly from one open stat to another now works.)
    sidebarEl.addEventListener("mousedown", (e) => {
      if (e.target.closest(".statstep")) { e.preventDefault(); return; } // keep input focused; click→stepStat
      if (e.target.closest(".statedit")) return;                          // clicking inside the open field
      const sv = e.target.closest(".sv.editable-stat[data-stat]");
      const li = e.target.closest("li.editable[data-slot]");
      if (!sv && !li) return;
      e.preventDefault(); // don't let the open input blur-commit + re-render underneath us
      let committed = false;
      if (editingStat) { // lock in the stat we're leaving (no separate render)
        const inp = sidebarEl.querySelector(".statedit");
        if (inp) { currentStats[inp.dataset.stat] = inp.value === "" ? 0 : (parseFloat(inp.value) || 0); persistStats(); committed = true; }
        editingStat = null;
      }
      if (sv) { editingStat = sv.dataset.stat; editingSlot = null; } // opening a stat closes any open slot editor
      else { editingSlot = li.dataset.slot; editingStat = null; }
      if (committed) recomputeThreshold(true); else renderSidebar(); // recompute (+ refresh the Target form's Current column) only if a value changed
    });
    // Nudge the open stat field by ±1 in place (no commit yet. Enter / click-away locks it in).
    function stepStat(delta) {
      const inp = sidebarEl.querySelector(".statedit");
      if (!inp) return;
      inp.value = String((parseFloat(inp.value) || 0) + delta);
    }
    // Commit a manual stat-total edit: persist the override and re-run the gap math.
    // Idempotent, only the first call per edit does work (editingStat clears).
    function commitStat(inp) {
      if (editingStat == null) return;
      currentStats[inp.dataset.stat] = inp.value === "" ? 0 : (parseFloat(inp.value) || 0);
      editingStat = null;
      persistStats();
      recomputeThreshold(true); // gap math depends on current; refresh the Target form's
      //                           Current column too; also re-renders the sidebar
    }
    // Click away from the open stat field (anywhere it loses focus) → lock the value in.
    // Pressing a stepper preventDefaults its mousedown, so it doesn't trigger this. Only
    // commit if the blurred input is STILL the open one, when switching directly to
    // another stat/slot, the mousedown handler already committed + re-targeted editingStat,
    // so this fires on the now-detached old input and must be a no-op (else it clobbers).
    sidebarEl.addEventListener("focusout", (e) => {
      const inp = e.target.closest(".statedit");
      if (inp && inp.dataset.stat === editingStat) commitStat(inp);
    });
    // Gold on hand is no longer edited in the sidebar (moved to the Planner materials panel).
    sidebarEl.addEventListener("change", (e) => {
      // Character save-slot picker: switch to a saved character, or detach to "Unsaved".
      const psel = e.target.closest(".profsel");
      if (psel) { psel.value ? switchProfile(psel.value) : (profiles.active = null, persistProfiles(), renderSidebar()); return; }
      // Preset picker: apply a base-gear template (working state overwritten, unsaved).
      const preset = e.target.closest(".presetsel");
      // Reset the picker back to the "Preset…" placeholder immediately: the confirm modal
      // owns the decision, and a re-render (on Apply) rebuilds the select anyway.
      if (preset) { const v = preset.value; preset.value = ""; if (v) requestPreset(v); return; }
      // Infusion stat change: repopulate the amount select for the new stat (or blank it
      // when cleared to None), then refresh the preview like the other fields.
      const infStat = editingSlot && e.target.closest(`li.editing[data-slot="${editingSlot}"] [data-inf="stat"]`);
      if (infStat) {
        const amtEl = infStat.closest(".infgrid").querySelector('[data-inf="amt"]');
        const stat = infStat.value;
        if (stat) {
          const amts = infusionOptions(editingSlot)[stat] || [1];
          amtEl.innerHTML = amts.map((a) => `<option value="${a}">+${a}</option>`).join("");
          amtEl.disabled = false;
        } else { amtEl.innerHTML = `<option>—</option>`; amtEl.disabled = true; }
        renderSlotPreview(editingSlot);
        return;
      }
      // Live "if you save" preview: any change to the open gear editor refreshes it
      // (base/affix/enhance via [data-f], tuning amounts via [data-tune], infusion amount).
      if (editingSlot && e.target.closest(`li.editing[data-slot="${editingSlot}"] [data-f], li.editing[data-slot="${editingSlot}"] [data-tune], li.editing[data-slot="${editingSlot}"] [data-inf]`)) renderSlotPreview(editingSlot);
    });
    // Enter commits a stat edit, Escape cancels (matches the click-to-edit pattern).
    sidebarEl.addEventListener("keydown", (e) => {
      const inp = e.target.closest(".statedit");
      if (!inp) return;
      if (e.key === "Enter") { e.preventDefault(); commitStat(inp); }
      else if (e.key === "Escape") { e.preventDefault(); editingStat = null; renderSidebar(); }
    });
    // Esc closes the open GEAR-slot editor (discard. Save is the only commit path).
    // Document-level so it works even when focus isn't on a field inside the editor.
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && editingSlot) { editingSlot = null; renderSidebar(); }
    });
    // Click anywhere OUTSIDE the sidebar closes the open slot editor (discard). Clicks
    // INSIDE the sidebar are left to its own handlers (open/switch/save/cancel); the stat
    // field commits itself on focusout, so only the slot editor needs closing here.
    // CAPTURE phase so this runs BEFORE the sidebar's bubble handler re-renders (which
    // would detach the click target and make an inside-click look "outside").
    document.addEventListener("mousedown", (e) => {
      if (editingSlot && !e.target.closest(".sidebar")) { editingSlot = null; renderSidebar(); }
    }, true);

    // Gear Builder tab (SPEC §12)
    // Compose a market piece (base → its applicable enchants/enhance) and show what it
    // would cost to BUILD yourself (base + enchants + re-enhance) plus its point value.
    // Optionally enter the listing price to compare buying pre-built vs DIY.
    const addStats2 = (a, b) => { const o = { ...a }; for (const k in b) o[k] = (o[k] || 0) + (b[k] || 0); return o; };
    const enhAt = (bracket, level) => {
      if (!level) return {};
      const row = accessories?.brackets?.[bracket]?.find((e) => e.level === level);
      return row ? { att: row.att || 0, defPen: row.defPen || 0 } : {};
    };
    let bState = { base: "", prefix: "", suffix: "", level: 0, market: "", cmpSlot: "" };
    let bQuery = "";       // composer base-item search text
    let bShown = [];       // currently-listed search matches, indexed by data-appr-pick
    let bActive = -1;      // keyboard-highlighted row in the search list (−1 = none)
    let bQueryFocus = false; // one-shot: refocus the search input after the next full render

    // Candidate loadout slots this item could replace (its slotIds, in sidebar order).
    const apprCmpSlots = (item) => SIDEBAR_SLOT_ORDER.filter((s) => item.slotIds.includes(s));

    function builderOutput(item, enhanceable) {
      const pe = bState.prefix ? enchants[bState.prefix] : null;
      const se = bState.suffix ? enchants[bState.suffix] : null;
      const enhStats = enhanceable ? enhAt(item.level, bState.level) : {};
      const total = addStats2(addStats2(addStats2(item.stats, enhStats), pe ? pe.stats : {}), se ? se.stats : {});
      const pts = score(total);

      // Compare against YOUR equipped piece in the matching slot (SPEC §2 scored stats):
      // the interesting number is the DELTA, not the item's raw line. Items that fit two
      // slots (rings) get a picker; default = the weaker equipped slot (the one you'd replace).
      // Infusion is excluded from the comparison: it lives on YOUR item and isn't part of a
      // marketplace listing, so an identical piece must read as an even trade. Noted when present.
      const cmpSlots = apprCmpSlots(item);
      const eqCmpStats = (s) => { const e = loadout[s] ? { ...loadout[s], infusion: null } : null; return slotStats(e); };
      if (!cmpSlots.includes(bState.cmpSlot))
        bState.cmpSlot = cmpSlots.slice().sort((a, b) => score(eqCmpStats(a)) - score(eqCmpStats(b)))[0] || "";
      const eq = bState.cmpSlot ? loadout[bState.cmpSlot] : null;
      const eqStats = eqCmpStats(bState.cmpSlot);
      const eqPts = score(eqStats);
      const delta = statDelta(total, eqStats);
      const dPts = pts - eqPts;
      const eqLabel = eq?.base ? `${eq.enhance?.level ? `+${eq.enhance.level} ` : ""}${eq.base}` : "(empty slot)";
      const slotPick = cmpSlots.length > 1
        ? `<select data-b="cmpslot" class="appr-slot-sel">${cmpSlots.map((s) =>
            `<option value="${s}" ${s === bState.cmpSlot ? "selected" : ""}>${planSlotLabel(s)}</option>`).join("")}</select>`
        : "";
      const infNote = eq?.infusion?.stat && eq.infusion.amount
        ? `<div class="muted" style="font-size:11px;margin-top:2px">Your +${eq.infusion.amount} ${STAT_LABEL[eq.infusion.stat] || eq.infusion.stat} infusion is excluded</div>`
        : "";
      const baseCost = cost(item.name);
      const pc = pe ? enchantCost(pe, prices) : { gold: 0 };
      const sc = se ? enchantCost(se, prices) : { gold: 0 };
      const enhCost = (enhanceable && bState.level) ? reEnhanceCost(accessories, item.level, 0, bState.level, prices, PRICE_BASIS, freeItems) : 0;
      const terms = [
        [`Base · ${item.name}`, baseCost],
        pe ? [`Prefix · ${shortScroll(bState.prefix)}`, pc ? pc.gold : null] : null,
        se ? [`Suffix · ${shortScroll(bState.suffix)}`, sc ? sc.gold : null] : null,
        (enhanceable && bState.level) ? [`Enhance → +${bState.level}`, enhCost] : null,
      ].filter(Boolean);
      const anyNull = baseCost == null || (pe && !pc) || (se && !sc) || enhCost == null;
      const diy = anyNull ? null : terms.reduce((a, [, v]) => a + (v || 0), 0);

      const termRows = terms.map(([k, v]) =>
        `<div class="k">${k}</div><div class="v gold">${v == null ? `<span class="muted">unpriced</span>` : fmt(v)}</div>`).join("");

      const market = bState.market === "" ? null : parseFloat(bState.market);

      // Gold per point gained, at the CHEAPER acquisition price (listing vs DIY). The same
      // gold-per-point currency the Upgrades tab ranks by. Only meaningful on a point GAIN.
      const acq = Math.min(market != null && !Number.isNaN(market) ? market : Infinity, diy ?? Infinity);
      const goldPerPt = Number.isFinite(acq) && dPts > 0 ? acq / dPts : null;
      const vsRows = bState.cmpSlot ? `
        <h4 style="margin:12px 0 4px;font-size:12px;color:var(--head)">Vs your ${planSlotLabel(bState.cmpSlot)}, ${escTxt(eqLabel)}${slotPick}</h4>
        <div class="row">
          <div class="k">Stat change</div><div class="v pts">${diffLine(delta)}</div>
          <div class="k">Point change</div><div class="v pts"><span class="${dPts >= 0 ? "pos" : "neg"}">${sfmt(dPts)}</span> <span class="muted">(${fmt(eqPts)} → ${fmt(pts)})</span></div>
          <div class="k">Gold / point</div><div class="v gold">${goldPerPt != null ? fmt(goldPerPt) : `<span class="muted">${dPts > 0 ? ". Unpriced —" : ". No point gain —"}</span>`}</div>
        </div>${infNote}` : "";

      let cmp = "";
      if (market != null && !Number.isNaN(market) && diy != null) {
        cmp = market < diy
          ? `<div class="cmp"><span class="win">Buy pre-built</span>, cheaper by ${fmt(diy - market)} (listing ${fmt(market)} vs DIY ${fmt(diy)}).</div>`
          : market > diy
          ? `<div class="cmp"><span class="win">Build it yourself</span>, cheaper by ${fmt(market - diy)} (DIY ${fmt(diy)} vs listing ${fmt(market)}).</div>`
          : `<div class="cmp">Same price either way (${fmt(diy)}).</div>`;
      }

      // The raw item stat line + points duplicate the vs-equipped block (its delta + the
      // "old → new" points already carry them). Show the absolutes only when there's no
      // equipped piece to compare against.
      return `<div class="boutput">
        ${vsRows || `
        <div class="row"><div class="k">Stats</div><div class="v pts">${statLine(total)}</div></div>
        <div class="row"><div class="k">Ranking points</div><div class="v pts">${fmt(pts)}</div></div>`}
        <h4 style="margin:12px 0 4px;font-size:12px;color:var(--head)">DIY cost</h4>
        <div class="row">${termRows}
          <div class="k" style="border-top:1px solid var(--border);padding-top:3px;margin-top:3px">Total (build yourself)</div>
          <div class="v gold" style="border-top:1px solid var(--border);padding-top:3px;margin-top:3px">${diy == null ? `<span class="muted">some component unpriced</span>` : fmt(diy)}</div>
        </div>${cmp}</div>`;
    }

    // Extraction rune comparator (SPEC §3/§4/§12)
    // At a system jump (orna→uaithne, uaithne→eriu) a piece becomes a fundamentally NEW item:
    // its base-stat tuning is WIPED to 0 (only Destruction carries) AND its enchants are lost.
    // Tuning is UNPRESERVABLE. A rune cannot carry it. So it drops out of this decision
    // entirely (its stat loss is shown in the Upgrades/Target tier diff, and re-tuning the new
    // piece is a separate tuneStep). The rune's ONLY job is to preserve the ENCHANTS, so the
    // comparison reduces to: re-enchant the prefix + suffix vs one rune. Weapon/armor slots.
    const XTUNE_SLOTS = ["weapon", "helm", "chest", "pant", "hand", "feet"];
    // The verdict depends entirely on HOW MUCH tuning + WHICH enchants are on the piece, so
    // those are editable here (seeded from the loadout slot, then overridable for what-ifs).
    // `seededFor` tracks the slot the current tuning/prefix/suffix were seeded from → reseed
    // on slot switch, keep edits sticky otherwise.
    // No default slot, the tool stays neutral (no pre-highlighted verdict) until the user picks.
    let xState = { slot: "", tuning: {}, prefix: "", suffix: "", seededFor: null };

    // Seed the editable tuning amounts + enchants from a loadout slot, defaulting each of the
    // DESTINATION's tunable stats to whatever that slot is tuned to today (you re-tune to the
    // same amounts on the new system).
    function xSeed(slotKey, destKey) {
      const lo = loadout[slotKey] || {};
      const rows = tuning[destKey] || [];
      const t = {};
      for (const r of rows) t[r.stat] = lo.tuning?.[r.stat] ?? 0;
      xState.tuning = t; xState.prefix = lo.prefix || ""; xState.suffix = lo.suffix || "";
      xState.seededFor = slotKey;
    }

    // System order, a tuning wipe happens on each forward jump. The comparator is a
    // PER-JUMP decision (one rune per jump), so only the IMMEDIATE next system is a valid
    // destination, a 2-jump climb (Orna→Eriu) would need two runes, not one.
    const XSYSTEMS = ["Orna", "Uaithne", "Eriu"];
    function xSystemOf(baseName) {
      const w = tuningKey(baseName)?.split(/\s+/)[0];         // strip "+15"/tier → leading system word
      return XSYSTEMS.indexOf(w);
    }
    // The next system's same-slot tuning key (e.g. "Uaithne Helm" → "Eriu Helm"), or [] if
    // already at the top system / no such tuning data.
    function xDestOptions(slotKey) {
      const lo = loadout[slotKey];
