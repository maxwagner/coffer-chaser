      if (!lo || !lo.base) return [];
      const noun = lo.base.trim().split(/\s+/).pop();        // Weapon/Helm/Mail/Greaves/…
      const rank = xSystemOf(lo.base);
      if (rank < 0 || rank + 1 >= XSYSTEMS.length) return [];
      const next = `${XSYSTEMS[rank + 1]} ${noun}`;
      return tuning[next] ? [next] : [];
    }

    // The extraction-rune decision at a system jump. Base-stat tuning is WIPED either way (SPEC §12)
    // and can't be preserved, a rune only preserves the ENCHANTS. So the comparison is simply
    // re-enchant the slot's prefix + suffix vs one rune. Null terms when a scroll / the rune can't
    // be priced.
    function xCompute() {
      const pe = xState.prefix ? enchants[xState.prefix] : null;
      const se = xState.suffix ? enchants[xState.suffix] : null;
      const pc = pe ? enchantCost(pe, prices) : null;
      const sc = se ? enchantCost(se, prices) : null;
      const reEnchant = (pc ? pc.gold : 0) + (sc ? sc.gold : 0);
      const unpriced = [];
      if (pe && !pc) unpriced.push(xState.prefix);
      if (se && !sc) unpriced.push(xState.suffix);
      const affixes = [pe && { scroll: xState.prefix, gold: pc ? pc.gold : 0 }, se && { scroll: xState.suffix, gold: sc ? sc.gold : 0 }].filter(Boolean);
      const runeCost = cost(EXTRACTION_RUNE_NAME);
      return { reEnchant, affixes, runeCost, hasAffix: affixes.length > 0, reEnchant0: reEnchant === 0, unpriced };
    }

    function extractionToolHTML() {
      // No preselected slot: a "Choose a slot…" placeholder leads until the user commits,
      // so no verdict/highlight shows by default.
      const slotOpts = `<option value="" ${!xState.slot ? "selected" : ""}>Choose a slot…</option>` +
        XTUNE_SLOTS.filter((s) => loadout[s])
          .map((s) => `<option value="${s}" ${s === xState.slot ? "selected" : ""}>${planSlotLabel(s)}</option>`).join("");
      const dests = xState.slot ? xDestOptions(xState.slot) : [];
      const dest = dests[0] || "";   // single immediate-next-system jump (per-rune scope)
      const lo = loadout[xState.slot] || {};

      const head = `<h3>Extraction Rune</h3>
        <p class="hint">When jumping systems aka uaithne→eriu, your enchants are wiped. This calculates
          if it is cheaper to buy an extraction rune or reenchant. Enchant price is the min of spamming
          until success, using 4 scraps, or using a exquisite enchant rune.</p>`;

      if (!xState.slot) return head + `<div class="bform"><label>Slot</label><select data-x="slot">${slotOpts}</select></div>`;

      if (!dest) return head + `<div class="bform"><label>Slot</label><select data-x="slot">${slotOpts}</select></div>
        <p class="hint muted">No further upgrades for this slot until further game updates.</p>`;

      // Seed enchants from the loadout when the slot changes (tuning no longer affects the verdict).
      if (xState.seededFor !== xState.slot) xSeed(xState.slot, dest);

      const enchSel = (affix, cur) => {
        const opts = Object.values(enchants).filter((e) => e.affix === affix && e.appliesTo.includes(xState.slot))
          .sort((a, b) => score(b.stats) - score(a.stats));
        return `<select data-x="${affix}"><option value="">(none)</option>` + opts.map((e) =>
          `<option value="${esc(e.scroll)}" ${e.scroll === cur ? "selected" : ""}>${shortScroll(e.scroll)}</option>`).join("") + `</select>`;
      };
      const form = `<div class="bform">
          <label>Slot</label><select data-x="slot">${slotOpts}</select>
          <label>Jump into</label><div class="muted" style="align-self:center">${dest}</div>
          <label>Prefix</label>${enchSel("prefix", xState.prefix)}
          <label>Suffix</label>${enchSel("suffix", xState.suffix)}
        </div>`;

      const r = xCompute();
      if (!r.hasAffix)
        return head + form + `<p class="hint muted">No enchants on this piece to preserve. A rune only saves enchants (tuning is wiped either way), so it does nothing here.</p>`;

      const cell = (v) => v == null ? `<span class="muted">—</span>` : fmt(v);
      const enchLine = r.reEnchant === 0
        ? `<div class="statline muted">${r.affixes.map((a) => a.scroll).join(" + ")}, ~0 (cheap scrolls)</div>`
        : r.affixes.map((a) => `<div class="statline">${a.scroll}, <span class="v gold">${fmt(a.gold)}</span></div>`).join("");

      const runeWon = r.runeCost != null && r.runeCost < r.reEnchant;
      const verdict = r.runeCost == null
        ? `<div class="cmp muted">Extraction rune is unpriced, can't compare.</div>`
        : r.runeCost < r.reEnchant
          ? `<div class="cmp"><span class="win">Use the rune</span>, cheaper by ${fmt(r.reEnchant - r.runeCost)} (rune ${fmt(r.runeCost)} vs re-enchant ${fmt(r.reEnchant)}).</div>`
          : r.runeCost > r.reEnchant
            ? `<div class="cmp"><span class="win">Skip the rune, re-enchant</span>, cheaper by ${fmt(r.runeCost - r.reEnchant)} (re-enchant ${fmt(r.reEnchant)} vs rune ${fmt(r.runeCost)}).</div>`
            : `<div class="cmp">Break-even, both ${fmt(r.reEnchant)}.</div>`;

      const enchBox = `<div class="wipe-opt${!runeWon ? " wipe-win" : ""}">
        <div class="wipe-opt-head"><span><b>Re-enchant the prefix + suffix</b>${!runeWon ? `<span class="wipe-opt-tag">✓ cheaper</span>` : ""}</span><span class="v gold${!runeWon ? " best" : ""}">${cell(r.reEnchant)}</span></div>
        ${enchLine}
      </div>`;
      const runeBox = `<div class="wipe-opt${runeWon ? " wipe-win" : ""}">
        <div class="wipe-opt-head"><span><b>Buy Extraction Rune</b>${runeWon ? `<span class="wipe-opt-tag">✓ cheaper</span>` : ""}</span><span class="v gold${runeWon ? " best" : ""}">${cell(r.runeCost)}</span></div>
        ${r.runeCost != null ? `<div class="mats">${matLi(EXTRACTION_RUNE_NAME, 1)}</div>` : ""}
      </div>`;

      const notes = [];
      if (r.reEnchant0) notes.push(`<span class="muted">Re-enchant is ~0, these scrolls are cheap/high-success, so a rune rarely pays off.</span>`);
      if (r.unpriced.length) notes.push(`<span class="muted">Unpriced (treated as 0): ${[...new Set(r.unpriced)].join(", ")}.</span>`);

      return head + form + `<div class="boutput">${verdict}${enchBox}${runeBox}
        ${notes.length ? `<p class="hint" style="margin-top:8px">${notes.join("<br>")}</p>` : ""}
      </div>`;
    }

    // The filtered base-item search rows (re-rendered alone on each keystroke so the input
    // keeps focus/caret, same trick as the Planner quick-add). Clicking a row composes it
    // IMMEDIATELY; no Enter needed.
    function apprSearchResults() {
      if (!bQuery.trim()) { bShown = []; return ""; }
      const cands = items.filter((it) => !it.legacy).map((it) => ({
        name: it.name, label: it.name,
        slots: it.slotIds.map(planSlotLabel).join(", "),
        search: `${it.name} ${it.slotIds.map(planSlotLabel).join(" ")}`,
        value: score(it.stats),
      }));
      bShown = quickAddFilter(cands, bQuery, 14);
      if (!bShown.length) return `<div class="muted" style="font-size:12px;padding:6px 2px">No matches. Try another word.</div>`;
      if (bActive >= bShown.length) bActive = bShown.length - 1; // list shrank under the cursor
      return bShown.map((c, i) =>
        `<div class="appr-qa-row${i === bActive ? " active" : ""}" data-appr-pick="${i}" title="Appraise this item"><span class="appr-qa-name">${escTxt(c.name)}</span><span class="appr-qa-slot">${escTxt(c.slots)}</span></div>`).join("");
    }

    function renderBuilder() {
      const item = bState.base ? itemByName[bState.base] : null;
      const slotIds = item ? item.slotIds : [];
      const enhanceable = !!(item && slotIds.some((s) => ENHANCEABLE_SLOT_IDS.includes(s)) && accessories?.brackets?.[item.level]);
      const applies = (e, affix) => e.affix === affix && e.appliesTo.some((s) => slotIds.includes(s))
        && !(e.minLevel && item && item.level != null && item.level < e.minLevel); // item too low-level for this scroll
      const prefixOpts = item ? Object.values(enchants).filter((e) => applies(e, "prefix")) : [];
      const suffixOpts = item ? Object.values(enchants).filter((e) => applies(e, "suffix")) : [];
      if (bState.prefix && !prefixOpts.some((e) => e.scroll === bState.prefix)) bState.prefix = "";
      if (bState.suffix && !suffixOpts.some((e) => e.scroll === bState.suffix)) bState.suffix = "";
      if (!enhanceable) bState.level = 0;

      const esc = (s) => s.replace(/"/g, "&quot;");
      const enchOpt = (list, curScroll) => `<option value="">(none)</option>` +
        list.slice().sort((a, b) => score(b.stats) - score(a.stats))
          .map((e) => `<option value="${esc(e.scroll)}" ${e.scroll === curScroll ? "selected" : ""}>${shortScroll(e.scroll)} (${fmt(score(e.stats))} pts)</option>`).join("");

      // Base picked → a chip with a "change" button; not picked → the type-to-find search.
      const picker = item
        ? `<div class="appr-pick"><b>${escTxt(item.name)}</b><span class="muted" style="font-size:12px">${item.slotIds.map(planSlotLabel).join(", ")}</span><button class="plan-ghost" data-appr-change>Change item…</button></div>`
        : `<div class="appr-search">
            <input type="text" data-appr-q placeholder="Search a marketplace item: name or slot…" value="${esc(bQuery)}" autocomplete="off" spellcheck="false">
            <div class="appr-qa-results" id="apprQaResults">${apprSearchResults()}</div>
          </div>`;

      const form = item ? `<div class="bform">
        <label>Prefix</label><select data-b="prefix">${enchOpt(prefixOpts, bState.prefix)}</select>
        <label>Suffix</label><select data-b="suffix">${enchOpt(suffixOpts, bState.suffix)}</select>
        ${enhanceable ? `<label>Enhance +</label><input type="number" data-b="level" min="0" max="20" value="${bState.level}">` : ""}
        <label>Market price</label><input type="number" data-b="market" placeholder="optional to compare" value="${bState.market}">
      </div>` : "";

      // Search keyboard shortcuts, a "?" hover popover next to the heading, styled like the
      // Planner's (SPEC §17.14).
      const kbdRow = (keys, desc) =>
        `<span class="keys">${keys.map((k) => `<kbd>${k}</kbd>`).join("")}</span><span>${desc}</span>`;
      const kbdHelp = `<span class="plan-kbd-wrap"><span class="help-icon" tabindex="0" title="Keyboard shortcuts">?</span>` +
        `<div class="plan-kbd-pop"><div class="plan-kbd-h">Search (this tab)</div><div class="plan-kbd-grid">` +
        kbdRow(["↑", "↓"], "move through the results") +
        kbdRow(["Tab"], "next result (Shift+Tab: previous)") +
        kbdRow(["Enter"], "appraise the highlighted item") +
        kbdRow(["Esc"], "clear the highlight") +
        `</div></div></span>`;

      builderPanel.innerHTML = `<div class="appr-section">
        <h3 style="display:inline-flex;align-items:center;gap:7px">Appraiser${kbdHelp}</h3>
        <p class="hint">This calculator compares the price of a marketplace item to the cost of building it yourself.</p>
        ${picker}${form}${item ? builderOutput(item, enhanceable) : ""}
      </div>
      <div class="appr-section">
        ${extractionToolHTML()}
      </div>`;
      // One-shot focus: keep typing after a keystroke-triggered full render (e.g. Change item…).
      if (!item && bQueryFocus) { const q = builderPanel.querySelector("[data-appr-q]"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } bQueryFocus = false; }
    }

    builderPanel.addEventListener("change", (e) => {
      const t = e.target;
      if (t.dataset.xtune != null) {                     // a tuning amount field
        const v = Math.max(0, parseInt(t.value) || 0);
        xState.tuning[t.dataset.xtune] = v;
        renderBuilder(); return;
      }
      if (t.dataset.x) {                                 // extraction comparator selects
        if (t.dataset.x === "slot") { xState.slot = t.value; xState.seededFor = null; } // reseed on slot switch
        else xState[t.dataset.x] = t.value;              // prefix / suffix override
        renderBuilder(); return;
      }
      const k = t.dataset.b; if (!k) return;
      if (k === "level") bState.level = Math.max(0, Math.min(20, parseInt(t.value) || 0));
      else if (k === "market") bState.market = t.value;
      else if (k === "cmpslot") bState.cmpSlot = t.value; // vs-equipped slot picker (rings)
      else bState[k] = t.value;
      renderBuilder();
    });
    // Base-item search: filter on every keystroke (results list re-rendered ALONE so the
    // input keeps focus/caret, a full renderBuilder would destroy it mid-word).
    builderPanel.addEventListener("input", (e) => {
      if (!e.target.closest("[data-appr-q]")) return;
      bQuery = e.target.value;
      bActive = -1;                                    // new query → clear the highlight
      const box = builderPanel.querySelector("#apprQaResults");
      if (box) box.innerHTML = apprSearchResults();
    });
    // Keyboard nav in the search box: ↓/↑ (or Tab/Shift+Tab) move the highlight through the
    // list, Enter composes the highlighted row (or the top match if none), Escape clears it.
    builderPanel.addEventListener("keydown", (e) => {
      if (!e.target.closest("[data-appr-q]")) return;
      if (e.key === "ArrowDown" || (e.key === "Tab" && !e.shiftKey && bShown.length)) {
        e.preventDefault();
        bActive = bShown.length ? (bActive + 1) % bShown.length : -1;
        refreshApprResults();
      } else if (e.key === "ArrowUp" || (e.key === "Tab" && e.shiftKey && bShown.length)) {
        e.preventDefault();
        bActive = bShown.length ? (bActive <= 0 ? bShown.length - 1 : bActive - 1) : -1;
        refreshApprResults();
      } else if (e.key === "Enter") {
        e.preventDefault();
        const pick = bShown[bActive >= 0 ? bActive : 0];
        if (pick) apprPick(pick.name);
      } else if (e.key === "Escape" && bActive >= 0) {
        e.preventDefault();
        bActive = -1;
        refreshApprResults();
      }
    });
    // Re-render just the results list + scroll the highlighted row into view (a full
    // renderBuilder would blur the search input mid-keystroke).
    function refreshApprResults() {
      const box = builderPanel.querySelector("#apprQaResults");
      if (!box) return;
      box.innerHTML = apprSearchResults();
      box.querySelector(".appr-qa-row.active")?.scrollIntoView({ block: "nearest" });
    }
    // Compose a picked item immediately: seed a fresh composition + default compare slot.
    function apprPick(name) {
      bState = { base: name, prefix: "", suffix: "", level: 0, market: "", cmpSlot: "" };
      bQuery = ""; bActive = -1;
      renderBuilder();
    }
    builderPanel.addEventListener("click", (e) => {
      const row = e.target.closest("[data-appr-pick]");
      if (row) { const c = bShown[Number(row.dataset.apprPick)]; if (c) apprPick(c.name); return; }
      if (e.target.closest("[data-appr-change]")) {       // back to the search
        bState = { base: "", prefix: "", suffix: "", level: 0, market: "", cmpSlot: "" };
        bQuery = ""; bActive = -1; bQueryFocus = true;
        renderBuilder();
      }
    });

    // Scanner tab (SPEC §16): in-browser OCR of auction screenshots
    // OCR (PP-OCRv4 / PaddleOCR on onnxruntime-web, self-hosted, js/ppocr.js) runs client-side;
    // output is a Date/Item/Min TSV copied to the clipboard for pasting into the PriceInfo Sheet
    // tab, same flow as the old desktop scanner, no install. Nothing here persists to storage.
    const scanStore = makeStore();
    let scanMode = "prices";   // "prices" (auction OCR) | "drops" (raid chat-log OCR). Scanner subtabs
    const scanSkips = [];      // {file, reason} for images that yielded nothing
    const scanReview = [];     // {id, name, price, cropUrl, candidates} rows the app couldn't match → review UI
    let scanReviewId = 0;

    // raid-drop tracker (SPEC §16.8). OCR the SYSTEM chat log, sum the run's farm value
    // Session-only (like the price store): nothing persists but the character name. `items` maps a
    // read drop name → total qty across scans; `gold` sums literal gold lines; `foreign` collects
    // other players' actor names seen (so the user can confirm the name filter caught them).
    // `items` keys by name + core source (SPEC §16.9) so the same item dropped as a base core and
    // as e.g. a Luck core tallies separately: key = `${name}\x1f${source}`.
    // `party` (SPEC §16.11): actor → Map(dropKey → qty), filled only when party tracking is on.
    const dropStore = { items: new Map(), gold: 0, foreign: new Set(), party: new Map() };
    // Party-tracking toggle, a global UI pref like the planner consume toggle ("1"/"0").
    let partyTrack = (() => { try { return localStorage.getItem(PARTY_TRACK_KEY) === "1"; } catch { return false; } })();
    const persistPartyTrack = () => { try { localStorage.setItem(PARTY_TRACK_KEY, partyTrack ? "1" : "0"); } catch { /* storage blocked */ } };
    const dropKey = (name, source) => `${name}\x1f${CORE_SOURCES.includes(source) ? source : "base"}`;
    const parseDropKey = (k) => { const i = k.indexOf("\x1f"); return i < 0 ? { name: k, source: "base" } : { name: k.slice(0, i), source: k.slice(i + 1) }; };
    // Core-boost detection (SPEC §16.9): a Core Boost Plus (`plus`) drop only appears on a core-boosted
    // battle, so a `plus` drop in the log is PROOF of a boost, it FORCES the flag on (a forgotten toggle
    // can't then drop the Core Gold), and the checkbox locks. `runCoreBoost` is the MANUAL toggle, only
    // meaningful when there's no chat signal (a boost WITHOUT the Plus sub leaves no trace).
    const isCoreBoosted = () => [...dropStore.items.keys()].some((k) => parseDropKey(k).source === "plus");
    const coreBoosted = () => isCoreBoosted() || runCoreBoost; // detection wins; else the manual toggle
    let dropSort = "value"; // drops table sort: "value" (high→low, default) | "name" (A–Z)
    function dropAdd({ drops, gold, foreign, party }) {
      for (const d of drops) { const k = dropKey(d.name, d.source); dropStore.items.set(k, (dropStore.items.get(k) || 0) + d.qty); }
      dropStore.gold += gold;
      for (const f of foreign) dropStore.foreign.add(f);
      // Merge party members across scans: fuzzy-match an incoming actor against the actors already
      // in the store (same tolerance as the character-name filter) so OCR jitter between scans
      // doesn't split one player into two rosters.
      for (const m of party || []) {
        const existing = [...dropStore.party.keys()].find((a) => a === m.actor || makeActorMatcher(a)(m.actor));
        const who = existing || m.actor;
        const bucket = dropStore.party.get(who) || new Map();
        for (const d of m.drops) { const k = dropKey(d.name, d.source); bucket.set(k, (bucket.get(k) || 0) + d.qty); }
        dropStore.party.set(who, bucket);
      }
    }
    function dropClear() { dropStore.items.clear(); dropStore.gold = 0; dropStore.foreign.clear(); dropStore.party.clear(); scanDropDebug.length = 0; } // core-boost toggle is sticky. NOT reset here (SPEC §16.8)
    // Debug trace of the LAST drop scan: every raw OCR line + how it classified (mine/foreign/gold/
    // skip). Shown in a collapsed panel so a missed drop can be traced to OCR vs parse vs filter.
    const scanDropDebug = [];
    // The player's character name, only chat lines whose actor matches it (fuzzily) are counted.
    function loadCharName() { try { return localStorage.getItem(CHARACTER_NAME_STORAGE_KEY) ?? CHARACTER_NAME; } catch { return CHARACTER_NAME; } }
    let charName = loadCharName();
    const persistCharName = () => { try { localStorage.setItem(CHARACTER_NAME_STORAGE_KEY, charName); } catch { /* storage blocked */ } };

    // Per-character max-level flag (SPEC §16.8). The 10th allowed localStorage key. A character at the
    // level cap earns +20% (LEVEL_CAP_GOLD_BONUS) on raid gold; this is a CHARACTER property (not per-run/
    // per-raid), so it's stored as { charNameLower: true } and applies to all of that character's runs.
    function loadMaxLevelChars() { try { const s = JSON.parse(localStorage.getItem(MAXLEVEL_STORAGE_KEY) || "null"); return s && typeof s === "object" ? s : {}; } catch { return {}; } }
    const maxLevelChars = loadMaxLevelChars();
    const persistMaxLevelChars = () => { try { localStorage.setItem(MAXLEVEL_STORAGE_KEY, JSON.stringify(maxLevelChars)); } catch { /* storage blocked */ } };
    const isMaxLevel = (name) => !!maxLevelChars[String(name || "").trim().toLowerCase()];
    const setMaxLevel = (name, on) => {
      const k = String(name || "").trim().toLowerCase(); if (!k) return;
      if (on) maxLevelChars[k] = true; else delete maxLevelChars[k];
      persistMaxLevelChars();
    };

    // Per-character Luck stat (SPEC §16.9). The 11th allowed localStorage key. STICKY: edited only
    // when the player's luck actually changes (blessing stones, Cadet Badge, luck gear); each saved
    // run freezes the value so luck-core yield can be tallied per luck level. { charNameLower: n }.
    function loadLuckChars() { try { const s = JSON.parse(localStorage.getItem(LUCK_STORAGE_KEY) || "null"); return s && typeof s === "object" ? s : {}; } catch { return {}; } }
    const luckChars = loadLuckChars();
    const persistLuckChars = () => { try { localStorage.setItem(LUCK_STORAGE_KEY, JSON.stringify(luckChars)); } catch { /* storage blocked */ } };
    const charLuck = (name) => { const v = luckChars[String(name || "").trim().toLowerCase()]; return Number.isFinite(v) ? v : null; };
    const setCharLuck = (name, v) => {
      const k = String(name || "").trim().toLowerCase(); if (!k) return;
      const n = parseNum(v);
      if (n == null) delete luckChars[k]; else luckChars[k] = n;
      persistLuckChars();
    };

    // Core-source display: letter chip + label per source key (SPEC §16.9). Base cores get no chip.
    const SRC_CHIP = { campfire: "CF", plus: "CB+", vvip: "VIP", pet: "PET", guild: "GLD", luck: "LCK" };
    const SRC_LABEL = { base: "Base cores", campfire: "Campfire", plus: "Core Boost Plus", vvip: "VVIP", pet: "Pet", guild: "Guild skill", luck: "Luck" };
    const srcChip = (source) => (source && source !== "base" ? ` <span class="src-chip src-${source}" title="${escTxt(SRC_LABEL[source])} core">${SRC_CHIP[source]}</span>` : "");
    // 30-day buff costs: a PriceInfo row whose name contains the match substring overrides the
    // config fallback, so tracker price updates flow through automatically.
    function priceByMatch(match, fallback) {
      const m = String(match).toLowerCase();
      for (const [name, p] of Object.entries(prices || {})) if (name.toLowerCase().includes(m) && p?.avg) return p.avg;
      return fallback;
    }

    // saved run history (SPEC §16.8). The 7th allowed localStorage key
    // Each completed run is snapshotted from `dropStore` (value frozen at save time) with its
    // name, character, raid, and timer duration; persisted so profit can be tracked long-term.
    let runsMigrated = false;    // set by loadRuns when a legacy name-date suffix was stripped → persist once
    function loadRuns() {
      let s;
      try { const j = JSON.parse(localStorage.getItem(RUNS_STORAGE_KEY) || "null"); s = Array.isArray(j) ? j : RUNS.slice(); }
      catch { s = RUNS.slice(); }
      // Legacy run names embedded the save date (e.g. "Morgant. 2026-07-02"). That's now its own
      // column, so strip a trailing "—<date>" (ISO or locale) from every saved name once.
      const DATE_SUFFIX = /\s*—\s*\d{1,4}[-/]\d{1,2}[-/]\d{1,4}\s*$/;
      for (const r of s) if (r && typeof r.name === "string" && DATE_SUFFIX.test(r.name)) { r.name = r.name.replace(DATE_SUFFIX, "").trim() || (r.raid || "Run"); runsMigrated = true; }
      return s;
    }
    let runs = loadRuns();
    const persistRuns = () => { try { localStorage.setItem(RUNS_STORAGE_KEY, JSON.stringify(runs)); } catch { /* storage blocked */ } };
    if (runsMigrated) persistRuns();
    const applyRuns = () => { persistRuns(); scanCanonRaw = null; renderScanner(); }; // vocab cache: saved runs' drop names feed the next scan (rebuilt lazily)

    // junk-drop filter (SPEC §16.8). The 8th allowed localStorage key
    // User-curated substrings; a drop whose name contains any is hidden from the tally + value
    // (untradeable buff drops, seals, etc.). Held lowercased. Restorable per-row / editable list.
    function loadScanJunk() {
      try { const s = JSON.parse(localStorage.getItem(SCAN_JUNK_STORAGE_KEY) || "null"); return Array.isArray(s) ? s : SCAN_JUNK.slice(); }
      catch { return SCAN_JUNK.slice(); }
    }
    let scanJunk = loadScanJunk();
    const persistScanJunk = () => { try { localStorage.setItem(SCAN_JUNK_STORAGE_KEY, JSON.stringify(scanJunk)); } catch { /* storage blocked */ } };
    const addJunk = (s) => { const p = String(s || "").trim().toLowerCase(); if (p && !scanJunk.includes(p)) { scanJunk.push(p); persistScanJunk(); renderScanner(); } };
    const removeJunk = (p) => { const i = scanJunk.indexOf(p); if (i >= 0) { scanJunk.splice(i, 1); persistScanJunk(); renderScanner(); } };
    // Remove the first junk pattern that hides `name` (per-row "restore").
    const unhideDrop = (name) => { const n = String(name || "").toLowerCase(); const p = scanJunk.find((j) => n.includes(j)); if (p) removeJunk(p); };

    // loot-box opening tracker (SPEC §16.12). The Boxes subtab
    // Scanned openings land in `boxPending` (session-only) for a look-over; "Add to log" commits
    // them to `boxLog` (loaded at boot, next to its EV price injection), the persisted
    // account-wide record every aggregate is computed from. Values are never frozen, priced
    // live via dropUnitValue, like the Drops tally.
    const boxPending = [];         // [{box, items:[{name,qty}]}] awaiting "Add to log"
    const boxExpanded = new Set(); // aggregate rows whose per-item drop table is open (keyed by box name)
    const scanBoxDebug = [];       // last box scan's raw lines + classification (used/obtained/end/skip)
    // Commit the pending openings to the persisted log. Logged names join the scan vocabulary
    // (like saved runs' drops), so re-reads of the same box snap clean next time.
    function commitBoxPending() {
      if (!boxPending.length) return;
      const at = new Date().toISOString();
      for (const o of boxPending) boxLog.push({ id: ++boxLogId, at, box: o.box, items: o.items });
      boxPending.length = 0;
      persistBoxLog(); scanCanonRaw = null; refreshBoxPrices(); renderScanner();
    }
    // Unit value for a box payout: the Gold pseudo-item is worth 1/unit; everything else prices
    // like a drop (rolling avg, sealed-bottle EV, or seal-shop redemption value).
    const boxUnitValue = (name) => (name === "Gold" ? 1 : dropUnitValue(name, prices));
    const boxOpeningValue = (items) => {
      let v = 0, unpriced = 0;
      for (const it of items || []) { const u = boxUnitValue(it.name); if (u == null) unpriced++; else v += u * it.qty; }
      return { value: v, unpriced };
    };
    // Rename a box or payout item the OCR misread, same persistent alias store as the drops
    // rename, but ALSO relabels the committed log: box values are live-priced (never frozen),
    // so a garbled name in the log would stay unpriced forever otherwise.
    function renameBoxName(from) {
      const to = (prompt(`Rename "${from}" to:`, from) || "").trim();
      if (!to || to.toLowerCase() === from.toLowerCase()) return;
      const canon = scanCanonRaw && isKnownName(to) ? scanCanonRaw(to) : to; // snap casing to the real item when known
      scanAliases[from.toLowerCase()] = canon;
      persistScanAliases();
      const relabel = (o) => {
        if (o.box.toLowerCase() === from.toLowerCase()) o.box = canon;
        for (const it of o.items || []) if (it.name.toLowerCase() === from.toLowerCase()) it.name = canon;
      };
      boxPending.forEach(relabel); boxLog.forEach(relabel);
      persistBoxLog(); refreshBoxPrices();
      renderScanner();
    }

    let runSort = "date";        // history table sort: date | value | character | raid
    let byRaidSort = "perrun";   // By-raid table sort: raid | runs | time | total | perrun | normalhr | herohr (default per-run, highest first)
    let dropDataView = "mine";   // Drop Data value scope: "mine" (self-only) | "pooled" (party-pooled per-player, SPEC §16.11)
    let runFilterChar = "";      // "" = all characters
    const runExpanded = new Set(); // run ids whose drop breakdown is open
    const raidExpanded = new Set(); // By-raid rows whose core-source breakdown is open (keyed by raid name)
    let runModeSel = "Normal";   // Normal | Hero, the mode the next saved run is tagged with
    let runCoreBoost = false;    // MANUAL core-boost toggle (for a boost with no Plus chat signal); a `plus` drop forces on regardless
    // Sticky run options (SPEC §16.8): raid, mode, and the manual core-boost checkbox survive
    // reloads and saved runs under RUN_PREFS_KEY (+ the Drop Data buff panel's open state).
    // The setup you used yesterday is still selected today; restored below once the raid list exists.
    const runPrefs = (() => { try { const s = JSON.parse(localStorage.getItem(RUN_PREFS_KEY) || "null"); return s && typeof s === "object" ? s : {}; } catch { return {}; } })();
    const persistRunPrefs = () => { try { localStorage.setItem(RUN_PREFS_KEY, JSON.stringify(runPrefs)); } catch { /* storage blocked */ } };
    const rememberRunPrefs = () => { runPrefs.raid = selectedRaid; runPrefs.mode = runModeSel; runPrefs.coreBoost = runCoreBoost; persistRunPrefs(); };
    let editingRunId = null;     // when set, the drops subtab is EDITING that saved run (Save → Update)

    // in-app run timer (drops subtab). Measures a run's duration for gold/hour
    // `elapsedSec` accumulates while running; `startedAt` is the wall clock at the last Start
    // (null when paused). A 1s tick re-renders only the timer readout so the whole view doesn't
    // thrash. `runElapsed()` is the live total (accumulated + since-start).
    const runTimer = { elapsedSec: 0, startedAt: null };
    let runTimerTick = null;
    let timerEditing = false;    // readout clicked while paused → inline time input (SPEC §16.8)
    function runElapsed() { return runTimer.elapsedSec + (runTimer.startedAt ? (Date.now() - runTimer.startedAt) / 1000 : 0); }
    function fmtDuration(sec) {
      const s = Math.max(0, Math.round(sec));
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
      const pad = (n) => String(n).padStart(2, "0");
      return h ? `${h}:${pad(m)}:${pad(ss)}` : `${m}:${pad(ss)}`;
    }
    function timerStart() {
      if (runTimer.startedAt) return;
      runTimer.startedAt = Date.now();
      runTimerTick = setInterval(() => { const el = document.getElementById("runTimerReadout"); if (el) el.textContent = fmtDuration(runElapsed()); }, 1000);
    }
    function timerPause() {
      if (!runTimer.startedAt) return;
      runTimer.elapsedSec = runElapsed(); runTimer.startedAt = null;
      if (runTimerTick) { clearInterval(runTimerTick); runTimerTick = null; }
    }
    function timerReset() { timerPause(); runTimer.elapsedSec = 0; }
    // Parse a manual time entry → seconds. Accepts "mm:ss", "h:mm:ss", or a plain (decimal)
    // number of MINUTES. Blank/garbage → null (leave the timer unchanged).
    function parseTimeInput(str) {
      const s = String(str || "").trim();
      if (!s) return null;
      if (s.includes(":")) {
        const parts = s.split(":").map((p) => parseInt(p, 10));
        if (parts.some(Number.isNaN)) return null;
        return parts.reduce((acc, n) => acc * 60 + n, 0);
      }
      const min = parseFloat(s);
      return Number.isNaN(min) ? null : Math.round(min * 60);
    }
    // Optional raid selection (transient, not persisted). Picking a raid scopes OCR drop-name
    // matching to that raid's KNOWN drop table (a tiny exact vocabulary via the Raid Drops sheet),
    // which is far more reliable than snapping a garbled name against the whole app vocabulary.
    let selectedRaid = "";
    let raidCanon = null, raidDropSet = null;
    // The drops tool COLLAPSES a "<Base> Hero"/"<Base> Normal" pair (e.g. RME) into ONE "<Base>"
    // entry with a Hero/Normal mode toggle, instead of two name-locked rows: the drop table is the
    // UNION of both variants and the meta advertises `hero` so `raidModeOptions` offers the toggle.
    // Scoped to this tool, the Target tab/raids stay unmerged. Saved runs then key by the base name
    // (raid:"RME"), so the By-raid view's Normal/Hero split does the per-mode comparison.
    const [dRaids, dRaidDrops, dRaidMeta] = (function buildDropsRaids() {
      const drops = { ...raidDrops }, meta = { ...raidByName }, variants = {};
      for (const r of raids || []) {
        const m = /^(.+?)\s+(Hero|Normal)$/i.exec(r.raid);
        if (m) (variants[m[1]] ||= {})[m[2].toLowerCase()] = r;
      }
      const paired = Object.keys(variants).filter((b) => variants[b].hero && variants[b].normal);
      const hidden = new Set();
      for (const base of paired) {
        const v = variants[base];
        hidden.add(v.hero.raid); hidden.add(v.normal.raid);
        drops[base] = [...new Set([...(raidDrops[v.hero.raid] || []), ...(raidDrops[v.normal.raid] || [])])];
        // base off Normal, but Hero-capable; pull Hero base gold from the Hero variant's row.
        meta[base] = { ...v.normal, raid: base, hero: true, goldHero: v.hero.goldHero || 0 };
      }
      const pick = (raids || []).filter((r) => !hidden.has(r.raid)).concat(paired.map((b) => meta[b]));
      return [pick, drops, meta];
    })();
    function setSelectedRaid(name) {
      selectedRaid = name || "";
      const list = dRaidDrops[selectedRaid];
      if (list && list.length) { raidCanon = makeCanonicalizer(list); raidDropSet = new Set(list.map((n) => n.toLowerCase())); }
      else { raidCanon = null; raidDropSet = null; }
      // Re-default the run mode for the newly picked raid (Hero when it has a hero version).
      runModeSel = currentRaidModes().default;
    }
    // Mode options for the currently-selected raid (Hero availability from its `hero` flag; a
    // name-locked "… Hero"/"… Normal" raid is a single fixed mode). See `raidModeOptions`.
    function currentRaidModes() { return raidModeOptions(selectedRaid, dRaidMeta[selectedRaid]?.hero); }
    // Restore the sticky run options now that the raid list exists: the raid must still be known
    // (a renamed/removed sheet row falls back to none) and the mode must be one the raid offers.
    if (runPrefs.raid && dRaidMeta[runPrefs.raid]) {
      setSelectedRaid(runPrefs.raid);
      if (currentRaidModes().options.includes(runPrefs.mode)) runModeSel = runPrefs.mode;
    }
    runCoreBoost = !!runPrefs.coreBoost;
    // Flat base gold reward for a raid+mode, looked up LIVE from the raid data (dRaidMeta keys by
    // the same base name a run is saved under, incl. merged Hero/Normal pairs). Blank/unknown → 0.
    // Applied to saved runs at display time (NOT frozen), so filling a value in the Sheet later
    // auto-updates every past run of that raid+mode.
    function raidBaseGold(raidName, mode) {
      const m = dRaidMeta[raidName];
      if (!m) return 0;
      return (mode === "Hero" ? m.goldHero : m.goldNormal) || 0;
    }
    // Extra gold if the run was CORE BOOSTED (mode-independent), looked up live from the raid data.
    function raidCoreGold(raidName) { return dRaidMeta[raidName]?.coreGold || 0; }
    // A saved run with its live base gold (+ core-boost gold when flagged) folded into the total, each
    // kept as a separate field so the breakdown can show them; `gold` stays the literal chat-log gold.
    function withBaseGold(r) {
      const baseGold = raidBaseGold(r.raid, r.mode);
      const coreGold = r.coreBoost ? raidCoreGold(r.raid) : 0;
      // Level-cap bonus: a max-level character earns +20% on the raid gold reward (run reward + core gold),
      // not the chat-log gold. Applied LIVE off the run's frozen `maxLevel` flag, like base/core gold.
      const levelBonus = r.maxLevel ? Math.round((baseGold + coreGold) * LEVEL_CAP_GOLD_BONUS) : 0;
      return { ...r, baseGold, coreGold, levelBonus, total: (r.total || 0) + baseGold + coreGold + levelBonus };
    }
    // Resolve an OCR'd drop name to a canonical item, global vocab first (so a known item is never
    // force-merged into a similar raid drop), raid table only as a fallback for names it can't place.
    function resolveDropName(raw) {
      const r = resolveDropNamePure(raw, { globalCanon: scanCanon, isKnown: isKnownName, raidCanon, raidSet: raidDropSet });
      return normalizeBottleName(r); // clean a garbled bottle level (Lv.10o → Lv. 100) so it stores + merges cleanly
    }
    let scanCanonRaw = null;    // canonicalizer over the app's full item vocabulary (built once)
    let scanVocab = null;       // the vocabulary list (for suggestNames)
    let scanKnown = null;       // Set of lowercased known names, to flag scans the app doesn't recognize
    let scanBusy = false;
    let ocrError = null;        // engine load / run failure message
    const escTxt = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    // user name aliases (SPEC §16.5). The persisted, per-user replacement for the old
    // hardcoded SCAN_OVERRIDES. { readNameLower: canonicalName }; applied in the canonicalize path
    // so a confirmed correction silently resolves that garble on every future scan.
    function loadScanAliases() {
      try { const s = JSON.parse(localStorage.getItem(SCAN_ALIASES_STORAGE_KEY) || "null"); return s && typeof s === "object" ? s : {}; }
      catch { return {}; }
    }
    let scanAliases = loadScanAliases();
    const persistScanAliases = () => { try { localStorage.setItem(SCAN_ALIASES_STORAGE_KEY, JSON.stringify(scanAliases)); } catch { /* storage blocked */ } };
    // Alias-aware canonicalize: a user alias wins outright; otherwise fall through to the fuzzy
    // canonicalizer. Rebuilt lazily alongside the vocab.
    const scanCanon = (name) => scanAliases[String(name || "").toLowerCase()] || scanCanonRaw(name);
    const isKnownName = (n) => scanKnown.has(String(n || "").toLowerCase());

    // Crop a full-width horizontal strip around row-center `y` from an image blob → a data URL, so
    // the review UI can show the user exactly which listing a guess is for. Band scales with height.
    async function cropRowStrip(blob, bounds, h) {
      const bmp = await createImageBitmap(blob);
      // Prefer the row's true token extent (top..bottom, spanning a wrapped 2nd line); fall back
      // to a fixed band around the reference cy when the extent is missing/degenerate.
      let top = bounds.top, bottom = bounds.bottom;
      if (top == null || bottom == null || !(bottom > top)) {
        const band = Math.max(Math.min(h * 0.03, 26), 14);
        top = bounds.y - band; bottom = bounds.y + band;
      }
      // Small pad so the (token-less) item icon. Which overhangs the text by a few px. Shows,
      // WITHOUT reaching the tightly-packed neighbor rows (icons are taller than the text, so a
      // big pad reveals adjacent icons and the crop looks like two listings).
      const pad = Math.max((bottom - top) * 0.3, 6);
      const y0 = Math.max(0, Math.round(top - pad));
      const y1 = Math.min(bmp.height, Math.round(bottom + pad));
      const ht = Math.max(1, y1 - y0);
      const cv = document.createElement("canvas");
      cv.width = bmp.width; cv.height = ht;
      cv.getContext("2d").drawImage(bmp, 0, y0, bmp.width, ht, 0, 0, bmp.width, ht);
      bmp.close?.();
      return cv.toDataURL("image/png");
    }

    // Ranked candidate matches for a review row: text similarity (suggestNames) re-ranked by price
    // proximity to each candidate's rolling avg (SPEC §16.5, idea 1/2). A candidate whose known
    // price is close to the scanned one is boosted; with no scanned price it's pure text similarity.
    function reviewCandidates(read, price) {
      const cands = suggestNames(scanVocab, read, 8);
      return cands.map((c) => {
        const cp = prices[c.name]?.avg ?? prices[c.name]?.min ?? null;
        let score = c.ratio;
        if (price && cp) { const pp = Math.min(price, cp) / Math.max(price, cp); score = 0.7 * c.ratio + 0.3 * pp; }
        return { name: c.name, ratio: c.ratio, cp, score };
      }).sort((a, b) => b.score - a.score).slice(0, 5);
    }

    // Every item name the app knows, so OCR output is verified/snapped against the full
    // vocabulary, not a separate items.txt. Priced items are the master list; the rest add
    // catalog/enchant/recipe/tuning nodes that may not (yet) carry a price. Saved runs' drop
    // names (yours AND party members') join too, anything you've confirmed once becomes a snap
    // target for future scans even with no raid selected (SPEC §16.8; applyRuns invalidates the
    // cache so new saves feed the next scan).
    function buildScanVocab() {
      const names = new Set();
      const add = (n) => { const s = (n || "").trim(); if (s) names.add(s); };
      Object.keys(prices).forEach(add);
      for (const e of Object.values(enchants || {})) { add(e?.scroll); add(e?.scrap); }
      Object.keys(enchants || {}).forEach(add);
      for (const it of items || []) add(it?.name);
      for (const [out, rec] of Object.entries(recipes || {})) { add(out); for (const m of rec?.materials || []) add(m.material); }
      Object.keys(accessories || {}).forEach(add);
      for (const [item, rows] of Object.entries(tuning || {})) { add(item); for (const r of rows || []) for (const m of r?.materials || []) add(m.material); }
      for (const r of runs || []) {
        for (const d of r.drops || []) add(d.name);
        for (const m of r.party || []) for (const d of m.drops || []) add(d.name);
      }
      // Logged box openings (SPEC §16.12): box names + payouts already confirmed once become snap
      // targets for future box scans (commitBoxPending invalidates the cache like applyRuns).
      for (const r of boxLog || []) { add(r.box); for (const it of r.items || []) add(it.name); }
      return [...names];
    }

    function ensureScanVocab() {
      if (!scanCanonRaw) { scanVocab = buildScanVocab(); scanCanonRaw = makeCanonicalizer(scanVocab); scanKnown = new Set(scanVocab.map((n) => n.toLowerCase())); }
    }

    // One review card per row the app couldn't match. Laid out as a plain question, "here's the row
    // we scanned (crop + text), which real item is it?", with three ways to answer: click a
    // suggested match, type the name, or keep-as-new / discard.
    function reviewCard(it) {
      const cands = it.candidates.map((c) =>
        `<button class="scan-cand" data-review-pick="${it.id}" data-name="${escTxt(c.name)}" title="Use this item · ${Math.round(c.score * 100)}% text match${c.cp ? " · usual price " + fmt(c.cp) : ""}">${escTxt(c.name)} <span class="scan-cand-pct">${Math.round(c.score * 100)}%</span></button>`
      ).join("");
      return `<div class="scan-review-item" data-review="${it.id}">
        <div class="scan-review-shot">
          ${it.cropUrl ? `<img class="scan-crop" src="${it.cropUrl}" alt="scanned row">` : ""}
          <div class="scan-review-caption">scanned as “${escTxt(it.name)}”${it.price != null ? ` · <span class="gold">${fmt(it.price)}</span>` : " · <i>no price read</i>"}</div>
        </div>
        <div class="scan-review-body">
          <div class="scan-review-ask">Which item is this?${cands ? ` <span class="scan-review-sub">closest matches:</span>` : ""}</div>
          ${cands ? `<div class="scan-review-line scan-review-cands">${cands}</div>` : ""}
          <div class="scan-review-line"><span class="scan-review-lbl">${cands ? "or type it:" : "Type the item:"}</span>
            <input class="scan-review-input" data-review-input="${it.id}" list="scanVocabList" placeholder="start typing the item name…"></div>
          <div class="scan-review-line"><span class="scan-review-lbl">Not a misread?</span>
            <button data-review-act="new" data-review="${it.id}" title="It's a real item the app doesn't know yet. Keep this name and add it to the sheet">Keep as new item</button>
            <button class="danger" data-review-act="discard" data-review="${it.id}" title="Garbled/unusable read. Drop this row">Discard</button></div>
        </div>
      </div>`;
    }

    function renderScanner() {
      ensureScanVocab();
      const toggle = `<div class="modeToggle scan-modes">
        <button data-scanmode="prices" class="${scanMode === "prices" ? "on" : ""}">Marketplace</button>
        <button data-scanmode="drops" class="${scanMode === "drops" ? "on" : ""}">Drops</button>
        <button data-scanmode="history" class="${scanMode === "history" ? "on" : ""}">Drop Data${runs.length ? ` (${runs.length})` : ""}</button>
        <button data-scanmode="boxes" class="${scanMode === "boxes" ? "on" : ""}">Boxes${boxLog.length ? ` (${boxLog.length})` : ""}</button></div>`;
      const skips = scanMode === "history" ? "" : (scanSkips.length ? `<details class="scan-skips"><summary>${scanSkips.length} skipped</summary>${scanSkips.map((s) => `<div>${escTxt(s.file)}, ${escTxt(s.reason)}</div>`).join("")}</details>` : "");
      const body = scanMode === "history" ? renderScanHistory() : scanMode === "drops" ? renderScanDrops() : scanMode === "boxes" ? renderScanBoxes() : renderScanPrices();
      scannerPanel.innerHTML = `<h3>Tracker</h3>${toggle}${body}${skips}`;
    }

    // Prices subtab: auction-house OCR → Date/Item/Min TSV for the PriceInfo Sheet tab.
    function renderScanPrices() {
      const rows = scanStore.summary();
      // Flag any scanned item whose name doesn't match a known app item, either a genuinely new
      // item to add to the sheet, or an OCR misread worth checking before pasting.
      const unknown = rows.filter((r) => !isKnownName(r.name)).length;
      const status = ocrError ? ocrError
        : scanBusy ? "Scanning…"
        : `${scanStore.itemCount} item${scanStore.itemCount !== 1 ? "s" : ""} · ${scanStore.listingCount} listing${scanStore.listingCount !== 1 ? "s" : ""}${unknown ? ` · ${unknown} not in app` : ""}${scanReview.length ? ` · ${scanReview.length} to review` : ""}${scanSkips.length ? ` · ${scanSkips.length} skipped` : ""}`;
      const badge = `<span class="scan-newbadge" title="No matching item in the app, a new item, or an OCR misread to check before pasting">not in app</span>`;
      const table = rows.length
        ? `<table class="scan-table"><thead><tr><th>Item</th><th class="num">Min</th></tr></thead><tbody>${
            rows.map((r) => { const ok = isKnownName(r.name); return `<tr${ok ? "" : ' class="scan-unknown"'}><td>${escTxt(r.name)}${ok ? "" : " " + badge}</td><td class="num gold">${fmt(r.min)}</td></tr>`; }).join("")}</tbody></table>`
        : `<p class="hint">No items scanned yet. Drop a screenshot above.</p>`;
      const has = rows.length > 0;
      const review = scanReview.length
        ? `<details class="scan-review" open><summary>${scanReview.length} ${scanReview.length === 1 ? "row needs" : "rows need"} your help, the OCR read didn't match any known item ${scanReview.length > 1 ? `<button class="scan-review-allnew" data-review-act="allnew" title="Treat every row below as a real new item">Keep all as new</button>` : ""}</summary>
            <p class="scan-review-intro">For each row: tell the app which item it really is (pick a match or type it). Your answer is remembered, so the same misread fixes itself next time.</p>
            ${scanReview.map(reviewCard).join("")}</details>`
        : "";
      const aliasCount = Object.keys(scanAliases).length;
      return `<p class="hint">OCR auction-house screenshots into prices. Drop or paste (Ctrl+V) images, review the table, then <b>Copy for Sheets</b> and paste the Date/Item/Min rows into the PriceInfo Sheet tab. OCR runs entirely in your browser (PP-OCR, self-hosted, the first scan loads the model once, then works offline).</p>
        <div class="scan-drop" id="scanDrop">Drop screenshots here · or click to browse
          <input type="file" id="scanFiles" accept="image/*" multiple hidden></div>
        <div class="scan-actions">
          <button data-scan="copy"${has ? "" : " disabled"}>Copy for Sheets</button>
          <button data-scan="csv"${has ? "" : " disabled"}>Export CSV</button>
          <button data-scan="clear" class="danger"${has || scanSkips.length || scanReview.length ? "" : " disabled"}>Clear</button>
          <span class="scan-status">${escTxt(status)}</span>
        </div>
        ${review}
        ${table}
        <datalist id="scanVocabList">${scanVocab.map((n) => `<option value="${escTxt(n)}">`).join("")}</datalist>
        ${aliasCount ? `<details class="scan-aliases"><summary>${aliasCount} saved name ${aliasCount === 1 ? "alias" : "aliases"}
            <button data-scan="alias-copy" title="Copy as SCAN_OVERRIDES lines to paste into the code">Copy for code</button>
            <button class="danger" data-scan="alias-clear">Clear aliases</button></summary>
            ${Object.entries(scanAliases).map(([read, canon]) => `<div class="scan-alias-row"><code>${escTxt(read)}</code> → ${escTxt(canon)} <button class="scan-alias-x" data-alias-remove="${escTxt(read)}" title="Forget this alias">×</button></div>`).join("")}</details>` : ""}`;
    }

    // Raid picker options for the drops subtab, every battle from the Raid Info sheet, grouped by
    // Type (Raid/Special/RAR/RME). Members are REVERSED to hardest→easiest, the SAME order the Target tab
    // shows (`[...raids].reverse()`). A raid with no drop table still lists (it won't scope OCR).
    function raidPickerOptions() {
      const groups = {};
      for (const r of dRaids || []) (groups[r.type || "Other"] ||= []).push(r);
      let html = `<option value=""${selectedRaid ? "" : " selected"}>Not Specified</option>`;
      for (const g of Object.keys(groups).sort()) {
        const rs = groups[g].slice().reverse(); // planner order = hardest first
        html += `<optgroup label="${escTxt(g)}">${rs.map((r) => `<option value="${escTxt(r.raid)}"${r.raid === selectedRaid ? " selected" : ""}>${escTxt(r.raid)} (Lv ${r.level})</option>`).join("")}</optgroup>`;
      }
      return html;
    }

    // Raid-drops subtab: OCR the SYSTEM chat log, keep only YOUR character's drops, and sum the
    // run's farm value (qty × rolling-avg market price + literal gold). Standalone session log.
    function renderScanDrops() {
      const allItems = [...dropStore.items.entries()].map(([key, qty]) => {
        const { name, source } = parseDropKey(key);
        const avg = dropUnitValue(name, prices);  // rolling avg, sealed-bottle EV, seal-shop redemption, or box-opening EV
        const bottle = bottleContentsLabel(name), seal = bottle ? "" : sealShopLabel(name), rng = bottle || seal ? "" : boxEVLabel(name);
        // badge: "EV" for a sealed bottle (stochastic contents), "SHOP" for a seal (fixed
        // redemption), "RNG" for a loot box valued at its observed opening EV (SPEC §16.12).
        return { name, source, display: normalizeBottleName(name), qty, avg, value: avg != null ? avg * qty : null, contents: bottle || seal || rng, badge: bottle ? "ev" : seal ? "shop" : rng ? "rng" : null };
      });
      // Split off user-marked JUNK, excluded from the tally + value, listed in a collapsed section.
      const items = allItems.filter((i) => !isJunk(i.name, scanJunk));
      const junkItems = allItems.filter((i) => isJunk(i.name, scanJunk));
      const byName = (a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase());
      const sortFn = dropSort === "name" ? byName : (a, b) => (b.value ?? -1) - (a.value ?? -1) || byName(a, b);
      items.sort(sortFn); junkItems.sort(sortFn);
      const itemsValue = items.reduce((s, i) => s + (i.value || 0), 0);
      const liveMode = currentRaidModes().locked || runModeSel;
      const baseGold = raidBaseGold(selectedRaid, liveMode); // flat run reward for the picked raid+mode
      const coreAvail = raidCoreGold(selectedRaid);          // Core Gold the picked raid offers (0 = none)
      const coreGold = coreBoosted() ? coreAvail : 0;        // boosted: inferred from a Plus drop, or the manual override
      const maxLevel = isMaxLevel(charName);                  // this character is at the level cap → +20% raid gold
      const levelBonus = maxLevel ? Math.round((baseGold + coreGold) * LEVEL_CAP_GOLD_BONUS) : 0;
      const total = itemsValue + dropStore.gold + baseGold + coreGold + levelBonus;
      const pricedN = items.filter((i) => i.value != null).length;
      const junkValue = junkItems.reduce((s, i) => s + (i.value || 0), 0);
      const hasName = charName.trim().length > 0;
      const has = items.length > 0 || junkItems.length > 0 || dropStore.gold > 0 || dropStore.party.size > 0;
      const editing = editingRunId ? runs.find((r) => r.id === editingRunId) : null;
      const partyNote = partyTrack
        ? (dropStore.party.size ? ` · party: ${dropStore.party.size} player${dropStore.party.size !== 1 ? "s" : ""}` : "")
        : (dropStore.foreign.size ? ` · ${dropStore.foreign.size} other player${dropStore.foreign.size !== 1 ? "s" : ""} filtered` : "");
      const status = ocrError ? ocrError
        : scanBusy ? "Scanning…"
        : !hasName ? "Enter your character name to start"
        : `${items.length} item${items.length !== 1 ? "s" : ""}${dropStore.gold ? ` · ${fmt(dropStore.gold)} gold` : ""}${items.length - pricedN > 0 ? ` · ${items.length - pricedN} unpriced` : ""}${junkItems.length ? ` · ${junkItems.length} junk hidden` : ""}${partyNote}${scanSkips.length ? ` · ${scanSkips.length} skipped` : ""}`;
      const table = items.length
        ? `<table class="scan-table"><thead><tr><th class="scan-sort${dropSort === "name" ? " on" : ""}" data-dropsort="name" title="Sort A–Z">Drop${dropSort === "name" ? " ▲" : ""}</th><th class="num">Qty</th><th class="num">Avg ea</th><th class="num scan-sort${dropSort === "value" ? " on" : ""}" data-dropsort="value" title="Sort by value, high→low">Value${dropSort === "value" ? " ▼" : ""}</th><th></th></tr></thead><tbody>${
            items.map((i) => `<tr${i.value == null ? ' class="scan-unknown"' : ""}><td>${i.contents ? `<span title="${escTxt(i.contents)}">${escTxt(i.display)}</span>` : escTxt(i.display)}${srcChip(i.source)}${i.badge === "ev" ? ` <span class="scan-newbadge" title="${escTxt(i.contents)}. Valued at the expected value of its contents">EV</span>` : i.badge === "shop" ? ` <span class="scan-newbadge" title="${escTxt(i.contents)}. Valued at its best Seal Shop redemption">SHOP</span>` : i.badge === "rng" ? ` <span class="scan-newbadge" title="${escTxt(i.contents)}. Valued at its observed average payout per open">RNG</span>` : ""}${i.value == null ? ` <span class="scan-newbadge" title="No market price in the app. Not counted in the run value">unpriced</span> <button class="scan-junk-btn scan-rename-btn" data-drop-rename="${escTxt(i.name)}" title="Rename. Fix an OCR misread; remembered for every future scan">✎</button>` : ""}</td><td class="num">${i.qty}</td><td class="num gold">${i.avg == null ? "—" : fmt(i.avg)}</td><td class="num gold">${i.value == null ? "—" : fmt(i.value)}</td><td class="num"><button class="scan-junk-btn" data-junk-add="${escTxt(i.name)}" title="Mark as junk. Hide this from the tally on every scan">✕</button></td></tr>`).join("")}${
            dropStore.gold ? `<tr><td>Gold</td><td class="num"></td><td class="num"></td><td class="num gold">${fmt(dropStore.gold)}</td><td></td></tr>` : ""
          }${
            baseGold ? `<tr><td>Run reward${liveMode === "Hero" ? " (Hero)" : ""}</td><td class="num"></td><td class="num"></td><td class="num gold">${fmt(baseGold)}</td><td></td></tr>` : ""
          }${
            coreGold ? `<tr><td>Core boost</td><td class="num"></td><td class="num"></td><td class="num gold">${fmt(coreGold)}</td><td></td></tr>` : ""
          }${
            levelBonus ? `<tr><td>Level cap bonus (+20%)</td><td class="num"></td><td class="num"></td><td class="num gold">${fmt(levelBonus)}</td><td></td></tr>` : ""
          }<tr class="scan-drop-total"><td><b>Run value</b></td><td class="num"></td><td class="num"></td><td class="num gold"><b>${fmt(total)}</b></td><td></td></tr></tbody></table>`
        : `<p class="hint">${hasName ? "No drops yet, paste or drop a screenshot of the SYSTEM chat log." : ""}</p>`;
      // Junk section, hidden drops (this scan) + the persistent pattern list, both editable.
      const junkRows = junkItems.map((i) => `<div class="scan-junk-row"><span>${escTxt(i.name)}${i.qty > 1 ? ` ×${i.qty}` : ""}</span><span class="scan-junk-val">${i.value == null ? "" : fmt(i.value) + " withheld"}</span><button class="scan-junk-restore" data-junk-restore="${escTxt(i.name)}" title="Restore this drop">↩ restore</button></div>`).join("");
      const junkPatterns = scanJunk.length ? `<div class="scan-junk-patterns">Patterns: ${scanJunk.map((p) => `<span class="scan-junk-chip">${escTxt(p)}<button class="scan-junk-x" data-junk-del="${escTxt(p)}" title="Remove this junk pattern">×</button></span>`).join("")}</div>` : "";
      const junk = (junkItems.length || scanJunk.length)
        ? `<details class="scan-skips scan-junk-panel"${junkItems.length ? "" : ""}><summary>Junk filter, ${junkItems.length} hidden${junkValue ? ` · ${fmt(junkValue)} withheld` : ""}${scanJunk.length ? ` · ${scanJunk.length} pattern${scanJunk.length !== 1 ? "s" : ""}` : ""}</summary>
            <p class="hint">Marked as junk, excluded from the tally + run value on every scan. Matching is by name substring, so a pattern like <code>Waking Stone</code> hides all its variants.</p>
            ${junkRows}${junkPatterns}
            <div class="scan-junk-add">Add pattern: <input type="text" id="junkAdd" placeholder="e.g. Waking Stone" autocomplete="off"> <button data-scan="junk-add-btn">Add</button>${scanJunk.length ? ` <button class="danger" data-scan="junk-clear">Clear all</button>` : ""}</div></details>`
        : "";
      const foreign = !partyTrack && dropStore.foreign.size
        ? `<details class="scan-skips"><summary>${dropStore.foreign.size} other player${dropStore.foreign.size !== 1 ? "s" : ""} filtered out</summary>${[...dropStore.foreign].map((f) => `<div>${escTxt(f)}</div>`).join("")}</details>`
        : "";
      // Party tally (SPEC §16.11): each tracked member's drops with the same pricing as your own.
      // Junk-filtered like the main table. Per-player value = pooled items ÷ party size + YOUR
      // run gold. Nexon doesn't broadcast other players' gold, so we assume everyone earned what
      // you did (design decision), which makes the per-player gold term just your own gold.
      const partySection = (() => {
        if (!dropStore.party.size) return "";
        let partyValue = 0;
        const groups = [...dropStore.party.entries()].map(([actor, bucket]) => {
          const rows = [...bucket.entries()].map(([key, qty]) => {
            const { name, source } = parseDropKey(key);
            if (isJunk(name, scanJunk)) return null;
            const avg = dropUnitValue(name, prices);
            const value = avg != null ? avg * qty : null;
            return { name, source, qty, avg, value };
          }).filter(Boolean).sort(sortFn);
          const sub = rows.reduce((s, i) => s + (i.value || 0), 0);
          partyValue += sub;
          return { actor, rows, sub };
        }).sort((a, b) => b.sub - a.sub);
        const size = dropStore.party.size + 1;
        const yourGold = total - itemsValue;                       // all gold: chat + reward + core + level bonus
        const pooledItems = (itemsValue + partyValue) / size;      // party-wide items split evenly
        const perPlayer = pooledItems + yourGold;                  // + the same gold, assumed for everyone
        const goldNote = yourGold ? ` (pooled items ${fmt(pooledItems)} + ${fmt(yourGold)} gold)` : ` (pooled items ÷ ${size})`;
        return `<details class="scan-skips scan-party" open><summary>Party drops, ${dropStore.party.size} other player${dropStore.party.size !== 1 ? "s" : ""} · ${fmt(partyValue)} in items · ~${fmt(perPlayer)}/player</summary>
          <p class="hint">Other party members' drops, valued like yours. Estimated haul per player = the party's pooled items split ${size} ways${goldNote}, plus the same run gold you earned. Nexon doesn't broadcast others' gold, so we assume everyone got what you did. Saving the run stores these for the pooled per-raid stats.</p>
          ${groups.map((g) => `<div class="scan-party-actor"><b>${escTxt(g.actor)}</b> — ${fmt(g.sub)} <button class="scan-junk-btn scan-rename-btn" data-party-rename="${escTxt(g.actor)}" title="Rename this player. Fix an OCR misread; renaming onto another listed player merges their drops">✎</button><button class="scan-junk-btn" data-party-del="${escTxt(g.actor)}" title="Remove this player and their drops from the run. E.g. a stray OCR-invented name">✕</button></div>
            ${g.rows.map((i) => `<div class="scan-party-row"><span>${escTxt(normalizeBottleName(i.name))}${srcChip(i.source)}${i.value == null ? ` <span class="scan-newbadge" title="No market price in the app. Not counted">unpriced</span> <button class="scan-junk-btn scan-rename-btn" data-drop-rename="${escTxt(i.name)}" title="Rename. Fix an OCR misread; remembered for every future scan">✎</button>` : ""} <button class="scan-junk-btn" data-junk-add="${escTxt(i.name)}" title="Mark as junk. Hide this from the tally on every scan">✕</button></span><span class="num">×${i.qty}</span><span class="num gold">${i.value == null ? "—" : fmt(i.value)}</span></div>`).join("")}`).join("")}</details>`;
      })();
      const KIND_LABEL = { mine: "✓ yours", foreign: "other player", party: "✓ party", gold: "✓ gold", skip: "not a drop" };
      const debug = scanDropDebug.length
        ? `<details class="scan-skips scan-debug"><summary>OCR debug, last scan (${scanDropDebug.length} lines read)</summary>
            <p class="hint">Every raw line the OCR read, and how it was classified. If a drop is missing, find its line here: not listed = OCR never read it; <b>other player</b> = the character-name filter dropped it (check your name / OCR of the actor); <b>not a drop</b> = the line didn't parse.</p>
            ${scanDropDebug.map((d) => `<div class="scan-dbg-${d.kind}"><span class="scan-dbg-tag">${KIND_LABEL[d.kind]}</span> ${escTxt(d.line)}</div>`).join("")}</details>`
        : "";
      // Setup header (SPEC §16.8): two side-by-side planner-style cards, everything about the
      // CHARACTER on the left, everything about this RUN on the right. All run options are sticky.
      const charCard = `<div class="scan-card">
        <h5 class="scan-card-h">Character</h5>
        <div class="scan-charname"><span class="scan-field-lbl">IGN</span>
          ${(() => {
            const cur = charName.trim(), curL = cur.toLowerCase();
            const list = distinctCharacters(runs);
            const inList = list.some((c) => c.toLowerCase() === curL);
            return `<select id="scanCharName">
              ${!cur ? `<option value="" selected>. Select character —</option>` : ""}
              ${cur && !inList ? `<option value="${escTxt(cur)}" selected>${escTxt(cur)}</option>` : ""}
              ${list.map((c) => `<option value="${escTxt(c)}"${c.toLowerCase() === curL ? " selected" : ""}>${escTxt(c)}</option>`).join("")}
              <option value="__new__">＋ New character…</option>
            </select>`;
          })()}
          <span class="help-icon" tabindex="0" title="${partyTrack ? "Your drops are tallied in the run value; party members' drops are tracked separately below." : "Only your drops are kept, party members are filtered out."} Pick a saved character, or choose “New character…” to add one.">?</span></div>
        ${hasName ? `<div class="scan-charname"><span class="scan-field-lbl">Luck</span>
          <input type="text" id="scanLuck" class="scan-luck-input" inputmode="numeric" value="${charLuck(charName) ?? ""}" placeholder="e.g. 104" autocomplete="off">
          <span class="help-icon" tabindex="0" title="${escTxt(charName.trim())}'s current Luck stat (base 100). Sticky per character, update it when your luck changes (blessing stones, Cadet Badge, luck gear). Each saved run freezes the value, so the Drop Data tab can tally Luck-core yield per luck level.">?</span></div>` : ""}
        ${hasName ? `<div class="scan-charname"><span class="scan-field-lbl">Max level</span>
          <div class="modeToggle mini"><label class="chip"><input type="checkbox" id="scanMaxLevel"${maxLevel ? " checked" : ""}>+20% raid gold</label></div>
          <span class="help-icon" tabindex="0" title="A character at the level cap earns +20% on raid gold (run reward + core gold). Saved per character, so it applies to all of ${escTxt(charName.trim())}'s runs.">?</span></div>` : ""}
      </div>`;
      const partyChip = dropStore.party.size ? ` <span class="scan-mode-pill scan-party-pill" title="Party members detected in this scan's chat log (including you)">party of ${dropStore.party.size + 1}</span>` : "";
      const runCard = `<div class="scan-card">
        <h5 class="scan-card-h">Run${partyChip}</h5>
        <div class="scan-charname"><span class="scan-field-lbl">Raid</span>
          <select id="scanRaid">${raidPickerOptions()}</select>
          <span class="help-icon" tabindex="0" title="Optional, improves drop-name accuracy by matching against the raid's known drop list. Sticky: stays picked for your next run.">?</span></div>
        <div class="scan-charname"><span class="scan-field-lbl">Mode</span>
          ${(() => { const m = currentRaidModes(); return m.options.length > 1
            ? `<div class="modeToggle mini scan-runmode">${m.options.map((o) => `<button type="button" data-runmode="${o}" class="${runModeSel === o ? "on" : ""}">${o}</button>`).join("")}</div>`
            : `<span class="scan-mode-fixed">${escTxt(m.options[0])}${m.locked ? "" : `<span class="hint">, no hero version</span>`}</span>`; })()}
          <span class="help-icon" tabindex="0" title="Hero doubles the boss HP and the drops. It's logged as ONE run, the By-raid value/hour tells you whether hero beats normal. Raids where hero changes the requirements are listed separately (name says Hero or Normal).">?</span></div>
        ${coreAvail ? `<div class="scan-charname"><span class="scan-field-lbl">Core boost</span>
          <div class="modeToggle mini"><label class="chip"><input type="checkbox" id="scanCoreBoost"${coreBoosted() ? " checked" : ""}${isCoreBoosted() ? " disabled" : ""}>Boosted</label></div>${isCoreBoosted() ? ' <span class="hint">(auto. Plus drop in log)</span>' : ""}
          <span class="help-icon" tabindex="0" title="Adds the raid's Core Gold to the run value. Auto-ticks when a Core Boost Plus drop is in the log (that only happens on a boosted run); tick it manually if you boosted WITHOUT the Plus sub. Sticky: stays checked for your next run.">?</span></div>` : ""}
        <div class="scan-charname"><span class="scan-field-lbl">Party</span>
          <div class="modeToggle mini"><label class="chip"><input type="checkbox" id="scanPartyTrack"${partyTrack ? " checked" : ""}>Track drops</label></div>
          <span class="help-icon" tabindex="0" title="Also tally the OTHER party members' drops (grouped per player) instead of filtering them out. One run then samples the raid's drop table once per player, so the By-raid pooled value converges much faster. Their gold isn't tracked, the pooled math assumes everyone earned what you did.">?</span></div>
      </div>`;
      // Timer: ONE Start/Pause/Resume button; click the readout while paused to type a time.
      const timerLabel = runTimer.startedAt ? "Pause" : (runTimer.elapsedSec ? "Resume" : "Start");
      const readout = timerEditing
        ? `<input type="text" id="runTimeEdit" class="scan-timer-edit" value="${runTimer.elapsedSec ? fmtDuration(runTimer.elapsedSec) : ""}" placeholder="mm:ss" autocomplete="off" title="mm:ss, h:mm:ss, or minutes. Enter to apply, Esc to cancel">`
        : `<span id="runTimerReadout" class="scan-timer-readout${runTimer.startedAt ? "" : " editable"}"${runTimer.startedAt ? "" : ' title="Click to set the time (mm:ss, h:mm:ss, or minutes)"'}>${fmtDuration(runElapsed())}</span>`;
      return `<p class="hint">Scan a run's chat log to automatically log the drops. Can use screenshots or a GIF of the chat window. Use a program like ShareX to capture GIFs quickly. </p>
        <div class="scan-setup">${charCard}${runCard}</div>
        <div class="scan-drop scan-drop-spaced" id="scanDrop">Drop chat-log screenshots or a GIF here · click to browse · or Ctrl+V
          <input type="file" id="scanFiles" accept="image/*,image/gif" multiple hidden></div>
        <div class="scan-run">
          ${editing ? `<div class="scan-editing">Editing <b>${escTxt(editing.name)}</b>, change the time, re-scan drops, then Update. <button data-scan="runcancel">Cancel</button></div>` : ""}
          <div class="scan-timer">Run timer: ${readout}
            <button data-timer="toggle">${timerLabel}</button>
            <button data-timer="reset" class="danger"${runTimer.elapsedSec || runTimer.startedAt ? "" : " disabled"}>Reset</button>
            <button data-scan="runsave"${canSaveRun() ? "" : " disabled"} title="${editing ? "Update this run" : "Save this drop tally as a run, freezing its value"}">${editing ? "Update run" : "Save run"}</button></div>
          <span class="scan-status">${escTxt(status)}</span>
          <button data-scan="dropclear" class="danger"${has ? "" : " disabled"}>Clear</button>
        </div>
        ${table}
        ${partySection}
        ${junk}
        ${foreign}
        ${debug}`;
    }

    // Boxes subtab (SPEC §16.12): OCR the SYSTEM chat log of opening loot boxes ("You used [Box]"
    // → "You obtained [Item] ×N"), review the pending openings, commit them to the persisted
    // account-wide log, and show per-box drop-rate + value aggregates over everything logged.
    function renderScanBoxes() {
      const pendVal = boxPending.reduce((s, o) => s + boxOpeningValue(o.items).value, 0);
      const status = ocrError ? ocrError
        : scanBusy ? "Scanning…"
        : `${boxPending.length ? `${boxPending.length} opening${boxPending.length !== 1 ? "s" : ""} scanned (${fmt(pendVal)}). Review below, then Add to log · ` : ""}${boxLog.length} logged`;
      const unpricedBadge = (name) => ` <span class="scan-newbadge" title="No market price in the app. Not counted in the value">unpriced</span> <button class="scan-junk-btn scan-rename-btn" data-box-rename="${escTxt(name)}" title="Rename. Fix an OCR misread; remembered for every future scan, and relabels the log">✎</button>`;
      const itemLabel = (name) => (name === "Gold" ? "Gold" : escTxt(normalizeBottleName(name)));
      // Pending openings, one row each, so a misread can be fixed or tossed before it's logged.
      const pending = boxPending.length
        ? `<div class="scan-box-pending"><h4 class="scan-run-h4">Scanned openings, not logged yet</h4>
            ${boxPending.map((o, i) => {
              const items = o.items.length
                ? o.items.map((it) => { const u = boxUnitValue(it.name); return `${itemLabel(it.name)} ×${it.qty}${u == null ? unpricedBadge(it.name) : ` <span class="gold">(${fmt(u * it.qty)})</span>`}`; }).join(" · ")
                : `<span class="hint">nothing obtained (OCR missed the payout line?)</span>`;
              return `<div class="scan-box-row"><span><b>${escTxt(o.box)}</b>${isKnownName(o.box) ? "" : ` <button class="scan-junk-btn scan-rename-btn" data-box-rename="${escTxt(o.box)}" title="Rename this box, fix an OCR misread; remembered for every future scan">✎</button>`} → ${items}</span><button class="scan-junk-btn" data-boxpend-del="${i}" title="Discard this opening">✕</button></div>`;
            }).join("")}</div>`
        : "";
      // Per-box aggregates over the COMMITTED log, live-priced. Row click → the drop-rate table.
      const summary = summarizeBoxes(boxLog);
      const agg = summary.length
        ? `<section class="scan-run-section"><h4 class="scan-run-h4">By box</h4>
            <table class="scan-table"><thead><tr><th>Box</th><th class="num">Opens</th><th class="num" title="Average payout value per opening, at today's prices">Per open</th><th class="num">Total</th></tr></thead><tbody>${
            summary.map((b) => {
              let total = 0, anyUnpriced = false;
              const rows = b.items.map((e) => {
                const u = boxUnitValue(e.name);
                const val = u == null ? null : u * e.totalQty;
                if (val == null) anyUnpriced = true; else total += val;
                return { ...e, u, val };
              });
              const open = boxExpanded.has(b.box);
              const head = `<tr class="scan-run-row${open ? " on" : ""}" data-box-toggle="${escTxt(b.box)}" title="Click for this box's drop-rate table"><td>${escTxt(b.box)}${anyUnpriced ? ` <span class="scan-newbadge" title="Some payouts are unpriced, the value undercounts">unpriced</span>` : ""}</td><td class="num">${b.opens}</td><td class="num gold">${fmt(total / b.opens)}</td><td class="num gold">${fmt(total)}</td></tr>`;
              if (!open) return head;
              const detail = rows.length
                ? `<table class="scan-table scan-box-detail"><thead><tr><th>Item</th><th class="num" title="Openings that contained this item">Seen</th><th class="num" title="Observed drop rate, openings containing it ÷ opens">Rate</th><th class="num" title="Average quantity when it drops">Avg qty</th><th class="num">Unit</th><th class="num" title="This item's contribution to the per-open value">Per open</th></tr></thead><tbody>${
                    rows.map((e) => `<tr><td>${itemLabel(e.name)}${e.u == null ? unpricedBadge(e.name) : ""}</td><td class="num">${e.times}</td><td class="num">${Math.round((e.times / b.opens) * 100)}%</td><td class="num">${(e.totalQty / e.times).toFixed(e.totalQty % e.times ? 1 : 0)}</td><td class="num gold">${e.u == null ? "—" : fmt(e.u)}</td><td class="num gold">${e.val == null ? "—" : fmt(e.val / b.opens)}</td></tr>`).join("")}</tbody></table>`
                : `<div class="hint">No payouts recorded for this box yet.</div>`;
              return head + `<tr class="scan-run-drop scan-raid-detail"><td colspan="4">${detail}</td></tr>`;
            }).join("")}</tbody></table></section>`
        : "";
      // The opening log, every committed opening, newest first, individually deletable.
      const log = boxLog.length
        ? `<section class="scan-run-section"><h4 class="scan-run-h4">Opening log</h4>
            <table class="scan-table scan-run-table"><thead><tr><th>Date</th><th>Box</th><th>Obtained</th><th class="num">Value</th><th></th></tr></thead><tbody>${
            boxLog.slice().reverse().map((r) => {
              const { value, unpriced } = boxOpeningValue(r.items);
              const items = (r.items || []).length
                ? r.items.map((it) => `${itemLabel(it.name)}${it.qty !== 1 ? ` ×${it.qty}` : ""}`).join(", ")
                : "—";
              return `<tr><td>${new Date(r.at).toLocaleDateString()}</td><td>${escTxt(r.box)}</td><td>${items}${unpriced ? ` <span class="scan-newbadge" title="${unpriced} payout${unpriced !== 1 ? "s" : ""} unpriced, not counted in the value">unpriced</span>` : ""}</td><td class="num gold">${fmt(value)}</td><td class="num scan-run-actions"><button class="scan-run-del" data-boxlog-del="${r.id}" title="Delete this opening">×</button></td></tr>`;
            }).join("")}</tbody></table></section>`
        : "";
      const KIND_LABEL = { used: "✓ used", obtained: "✓ obtained", end: "✓ delimiter", skip: "not a box line" };
      const debug = scanBoxDebug.length
        ? `<details class="scan-skips scan-debug"><summary>OCR debug, last scan (${scanBoxDebug.length} lines read)</summary>
            <p class="hint">Every raw line the OCR read, and how it was classified. Missing opening? Find its "You used" line here: not listed = OCR never read it; <b>not a box line</b> = the line didn't parse.</p>
            ${scanBoxDebug.map((d) => `<div class="scan-dbg-${d.kind === "skip" ? "skip" : "mine"}"><span class="scan-dbg-tag">${KIND_LABEL[d.kind]}</span> ${escTxt(d.line)}</div>`).join("")}</details>`
        : "";
      return `<p class="hint">Track what your loot boxes actually pay out. Scan the SYSTEM chat log of opening them ("You used [Box] → You obtained [Item]"). Screenshots or a GIF, like the Drops subtab. Review the openings, then <b>Add to log</b>. Every opening is kept, so the By-box table converges on each box's real drop rates and value per open (at today's prices).</p>
        <div class="scan-drop" id="scanDrop">Drop chat-log screenshots or a GIF here · click to browse · or Ctrl+V
          <input type="file" id="scanFiles" accept="image/*,image/gif" multiple hidden></div>
        <div class="scan-actions">
          <button data-scan="boxadd"${boxPending.length ? "" : " disabled"} title="Commit the scanned openings to the log">Add${boxPending.length ? ` ${boxPending.length}` : ""} to log</button>
          <button data-scan="boxpendclear" class="danger"${boxPending.length || scanSkips.length ? "" : " disabled"}>Clear scan</button>
          <span class="scan-status">${escTxt(status)}</span>
          ${boxLog.length ? `<button data-scan="boxlogclear" class="danger" title="Delete the whole opening log">Clear log</button>` : ""}
        </div>
        ${pending}
        ${agg}
        ${log}
        ${!boxPending.length && !boxLog.length ? `<p class="hint">No openings logged yet, open some boxes, screenshot the chat log, and drop it above.</p>` : ""}
        ${debug}`;
    }

    // Runs subtab: the saved run history, a documented log of every raid run, with snapshot value,
    // duration, and character, plus aggregate profit stats. Filter/sort by character; export to TSV.
    // Rename a character across every saved run (e.g. fix an OCR-mis-cased "droooo" → "Droooo").
    // Renaming onto an existing name MERGES the two into one character. Also updates the active
    // filter selection so the view doesn't jump to an empty set.
    function renameCharacter() {
      const chars = distinctCharacters(runs);
      if (!chars.length) return;
      const from = (prompt(`Rename which character?\n\n${chars.join("\n")}`, runFilterChar || chars[0]) || "").trim();
      if (!from) return;
      if (!runs.some((r) => (r.character || "").trim() === from)) { alert(`No runs found for "${from}".`); return; }
      const to = (prompt(`Rename "${from}" to:`, from) || "").trim();
      if (!to || to === from) return;
      for (const r of runs) if ((r.character || "").trim() === from) r.character = to;
      if (runFilterChar === from) runFilterChar = to;
      applyRuns();
    }

    function renderScanHistory() {
      if (!runs.length) return `<p class="hint">No saved runs yet. On the <b>Drops</b> subtab, scan a run's chat log, optionally time it, then <b>Save run</b>, it lands here with its value frozen for long-term profit tracking.</p>`;
      // Fold each run's LIVE base gold into its total so summaries/sorts/rows reflect current values.
      const filtered = (runFilterChar ? runs.filter((r) => (r.character || "") === runFilterChar) : runs.slice()).map(withBaseGold);
      const cmp = {
        date: (a, b) => new Date(b.savedAt) - new Date(a.savedAt),
        value: (a, b) => (b.total || 0) - (a.total || 0),
