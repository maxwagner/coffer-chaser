    let planQAFocus = false;         // one-shot: focus the quick-add input after the next render
    let plannerMenuOpen = false;     // the toolbar ⋯ overflow menu is showing
    let plannerSortOpen = false;     // the toolbar Sort dropdown is showing (SPEC §17.15)
    let plannerTailStates = null;    // simulated slot states at the open insertion point (plan-tail aware adds)
    // Phase-5 sugar (SPEC §17.14). All ephemeral:
    let plannerNoteEdit = new Set(); // note-step ids whose inline text editor is open (click the label of a selected note)
    let planDoneOpen = false;        // the leading done-run is expanded (collapses to "✓ N completed" by default)
    let planShortOnly = false;       // materials panel: hide fully-covered rows
    let plannerImportMode = "replace"; // import panel: "replace" the working path vs "append" (de-duped) to it
    let planSeedMoves = [];          // empty-state seed cards: the top cheapest-per-point moves, indexed by data-plan-seed

    // "Consume resources on complete" toggle (SPEC §17.5): when on, Mark complete also
    // subtracts the step's expected materials from inventory + its gold from the tracker.
    // A GLOBAL UI preference (not per-character) persisted under PLANNER_CONSUME_KEY.
    let plannerConsume = (() => { try { return localStorage.getItem(PLANNER_CONSUME_KEY) === "1"; } catch { return false; } })();
    const persistPlannerConsume = () => { try { localStorage.setItem(PLANNER_CONSUME_KEY, plannerConsume ? "1" : "0"); } catch { /* storage blocked */ } };

    // "Next raid" card preferences (SPEC §17.13): a manual raid override (null = auto,
    // the easiest raid the plan's PROJECTED stats don't reach) and the QB entry / Caps aim
    // toggle. GLOBAL UI prefs like the consume toggle, persisted under PLANNER_RAID_KEY.
    let planRaidPick = null, planRaidAim = "qb";
    try {
      const p = JSON.parse(localStorage.getItem(PLANNER_RAID_KEY) || "null");
      if (p && typeof p === "object") {
        if (typeof p.raid === "string") planRaidPick = p.raid;
        if (p.aim === "cap") planRaidAim = "cap";
      }
    } catch { /* corrupt/blocked → defaults */ }
    const persistPlanRaid = () => { try { localStorage.setItem(PLANNER_RAID_KEY, JSON.stringify({ raid: planRaidPick, aim: planRaidAim })); } catch { /* storage blocked */ } };

    // Planner undo/redo (SPEC §17.14). Multi-level, ephemeral
    // Every PATH mutation (add/delete/reorder/import/comment/note edits) snapshots the prior
    // path (deep clonePath, comment edits mutate steps in place) before applying; Ctrl+Z /
    // Ctrl+Y (or Ctrl+Shift+Z) walk the stacks. Completions are NOT path edits, they change
    // the loadout, and get the per-card "Mark incomplete" button instead.
    const PLAN_UNDO_MAX = 50;
    let planUndoStack = [], planRedoStack = [];
    function snapPlan() {
      planUndoStack.push(clonePath(plannerPath));
      if (planUndoStack.length > PLAN_UNDO_MAX) planUndoStack.shift();
      planRedoStack.length = 0;
    }
    function planTimeTravel(fromStack, toStack) {
      if (!fromStack.length) return;
      toStack.push(clonePath(plannerPath));
      plannerPath = fromStack.pop();
      plannerSel.clear(); plannerSelAnchor = null; plannerAddAt = null;
      persistPlannerPath();
      if (active === PLANNER_TAB) renderPlanner();
    }
    const planUndo = () => planTimeTravel(planUndoStack, planRedoStack);
    const planRedo = () => planTimeTravel(planRedoStack, planUndoStack);

    // Smart reorder (SPEC §17.15): reorder the working path by `mode`. Value modes (everything
    // but "deps") first run a dependency fix + re-reconcile so a currently-blocked step gets
    // priced before it's ranked; "smart" additionally credits each step's weekly-box savings.
    // No-ops (same id order) don't push an undo frame.
    function applyReorder(mode) {
      plannerSortOpen = false;
      if (plannerPath.steps.length < 2) { renderPlanner(); return; }
      let working = plannerPath;
      let { entries } = reconcilePath(working, loadout, checklistDone, moveCtx);
      const opts = {};
      if (mode !== "deps") {
        if (entries.some((e) => e.status === "blocked")) {
          working = reorderPath(working, entries, "deps");
          entries = reconcilePath(working, loadout, checklistDone, moveCtx).entries;
        }
        if (mode === "smart" && weeklyBoxes.length) {
          const bopts = weeklyBoxOptions(weeklyBoxes, prices, PRICE_BASIS, cost);
          if (bopts.length) {
            const targets = new Set(bopts.map((o) => o.item));
            const plan = weeklyBoxPlan(bopts,
              weeklyDemand(aggregateMaterials(entries, null).materials, targets, moveCtx),
              { onHand: weeklyBox.onHand, alts: weeklyBox.alts, maxWeeks: WEEKLY_BOX_MAX_WEEKS });
            opts.boxSavings = stepBoxSavings(entries, plan.picks, targets, moveCtx);
          }
        }
      }
      const next = reorderPath(working, entries, mode, opts);
      const before = plannerPath.steps.map((s) => s.id).join("|");
      const after = next.steps.map((s) => s.id).join("|");
      if (before === after) { renderPlanner(); return; }   // nothing moved, no undo frame
      snapPlan();
      plannerPath = next;
      persistPlannerPath(); renderPlanner();
    }

    // Shared entry point for every "Add to plan" source (Upgrades/Target/Checklist): append
    // `steps` to the working path, DE-DUPED by stepKey (a step already naming the same action
    //. Even after an earlier add. Is skipped). Returns the count actually added. Re-renders
    // the Planner only when it's the active tab (the button flashes its own confirmation).
    function addStepsToPlan(steps) {
      const have = new Set(plannerPath.steps.map(stepKey));
      const fresh = [];
      for (const s of steps) { const k = stepKey(s); if (have.has(k)) continue; have.add(k); fresh.push(s); }
      if (fresh.length) {
        snapPlan();
        plannerPath = insertSteps(plannerPath, plannerPath.steps.length, fresh);
        persistPlannerPath();
        if (active === PLANNER_TAB) renderPlanner();
      }
      return fresh.length;
    }

    // Baselines + dirty checks for the three per-profile Planner fields (mirrors
    // loadoutBaseline/statsBaseline). Re-snapshotted on save + on loadWorkingState; folded
    // into profileBar()'s dirty flag so editing inventory/gold/path marks the character unsaved.
    let inventoryBaseline = structuredClone(inventory);
    const inventoryDirty = () => { try { return JSON.stringify(inventory) !== JSON.stringify(inventoryBaseline); } catch { return false; } };
    let goldBaseline = goldTracker;
    const goldDirty = () => goldTracker !== goldBaseline;
    let pathBaseline = structuredClone(plannerPath);
    const pathDirty = () => { try { return JSON.stringify(plannerPath) !== JSON.stringify(pathBaseline); } catch { return false; } };

    // Vetoed upgrades (SPEC §7.4)
    // A list of veto RULES (see moveVetoed in utils.js); any move a rule matches is hidden
    // app-wide (ranked list, stat-target views, Target solver, hints). Each rule carries a
    // display `label` for the manage panel. Held by reference in moveCtx so a veto edit +
    // recomputeLoadout re-filters with no ctx rebuild. The FOURTH allowed storage key.
    function loadVetoes() {
      try { const s = JSON.parse(localStorage.getItem(VETO_STORAGE_KEY) || "null"); return Array.isArray(s) ? s : []; }
      catch { return []; }
    }
    let vetoes = loadVetoes();
    const persistVetoes = () => { try { localStorage.setItem(VETO_STORAGE_KEY, JSON.stringify(vetoes)); } catch { /* storage blocked */ } };

    // Prep-checklist manual goals (SPEC §14.2)
    // The Checklist tab's non-infusion sections (Redeemers, Ein Lacher, Balance Outfit, Buffs)
    // are one-time done/not-done toggles. Checking one FOLDS its `stats` reward into currentStats
    // (like a gear/stat edit); unchecking removes exactly that delta. Only the set of checked goal
    // ids persists here (TWELFTH storage key); the folded totals live in currentStats and ride with
    // the character profile. `checklistDone` + `currentStats` are always swapped together so the
    // folded rewards never double-count.
    function loadChecklist() {
      try { const s = JSON.parse(localStorage.getItem(CHECKLIST_STORAGE_KEY) || "null"); return new Set(Array.isArray(s) ? s : []); }
      catch { return new Set(); }
    }
    let checklistDone = loadChecklist();
    const persistChecklist = () => { try { localStorage.setItem(CHECKLIST_STORAGE_KEY, JSON.stringify([...checklistDone])); } catch { /* storage blocked */ } };
    // BASELINE = the checked set as of the last save/load, so the profile's Save button lights up
    // when goals change (mirrors statsBaseline). Re-baselined on save + on loadWorkingState.
    let checklistBaseline = new Set(checklistDone);
    const checklistDirty = () => checklistDone.size !== checklistBaseline.size || [...checklistDone].some((id) => !checklistBaseline.has(id));
    const goalById = Object.fromEntries(PREP_GOALS.flatMap((sec) => sec.items.map((it) => [it.id, it])));
    // Apply a goal's scored-stat reward to currentStats (sign = +1 check / −1 uncheck). Mutates in
    // place (thCurrent aliases currentStats) so the sidebar totals + solver "current" stay in sync.
    function applyGoalStats(id, sign) {
      const stats = goalById[id]?.stats;
      if (!stats) return;
      for (const [k, v] of Object.entries(stats)) currentStats[k] = (currentStats[k] || 0) + sign * v;
    }
    // Rule identity for de-dupe: a rule's kind + its discriminating fields.
    const vetoId = (v) => v.kind === "move" ? `move:${v.key}` : v.kind === "target" ? `target:${v.to}` : `slotType:${v.slot}:${v.type}`;
    // Mutate the array IN PLACE (push/splice, never reassign) so moveCtx's by-reference
    // `vetoes` stays the same object, the solver reads the live list each generation.
    const addVeto = (rule) => { if (!vetoes.some((v) => vetoId(v) === vetoId(rule))) vetoes.push(rule); };
    const removeVeto = (id) => { const i = vetoes.findIndex((v) => vetoId(v) === id); if (i >= 0) vetoes.splice(i, 1); };

    // deal flag: latest min sits notably below the rolling avg
    const dealPct = (p) => (p && p.avg ? (p.avg - p.min) / p.avg : 0);
    const dealBadge = (p) => dealPct(p) >= DEAL_DISCOUNT_THRESHOLD
      ? `<span class="deal" title="Latest min is below the rolling average">▼ ${Math.round(dealPct(p) * 100)}%</span>` : "";

    // Marketplace freshness/volatility for one priced name, folded into a Catalog row's
    // detail (the former Prices tab). "" when the name carries no price feed.
    const priceDetail = (name) => {
      const p = prices[name];
      if (!p) return "";
      const trend = p.trend == null ? "—"
        : `<span class="${p.trend < 0 ? "down" : p.trend > 0 ? "up" : ""}">${p.trend}%</span>`;
      return `<h4 style="margin-top:10px">Price detail</h4><div class="grid">
          <div class="k">Rolling avg (cost basis)</div><div class="v gold">${fmt(p.avg)}</div>
          <div class="k">Latest min</div><div class="v gold">${fmt(p.min)}${dealBadge(p)}</div>
          <div class="k">Trend</div><div class="v">${trend}</div>
          <div class="k">Updated</div><div class="v">${p.date ?? "—"}</div>
          <div class="k">All-time high / low</div><div class="v">${fmt(p.ath)} / ${fmt(p.atl)}</div>
          <div class="k">Snapshots</div><div class="v">${p.snapshots ?? "—"}</div>
        </div>`;
    };

    // Seal Shop breakdown for a redemption currency (SPEC §16.10): its implied value =
    // the BEST redemption, with the full option list ranked below (best row highlighted).
    // "" when the name isn't a shop currency. Drives the catalog detail for seal rows.
    const sealShopDetail = (name) => {
      const v = sealValues[name];
      if (!v) return "";
      const cap = (o) => o.stock == null ? "∞" : `${o.stock}/period`;
      const money = (p) => p == null ? '<span class="hint">unpriced</span>' : fmt(p);
      const pct = (r) => `${+(r * 100).toFixed(r * 100 % 1 ? 1 : 0)}%`;
      // Quantity tag for a pick: a random range (×2–4), a fixed multiple (×3), or nothing.
      const qtyTag = (p) => p.random ? `<span class="hint">×${p.lo}–${p.hi}</span> `
        : p.qty > 1 ? `<span class="hint">×${p.qty}</span> ` : "";
      // Multi-item box: list every alternative + its price vertically. Choice (A | B) stars the
      // best pick ("Choose one"); gamble (A & B) shows each outcome's rate and values at EV
      // ("Random"); bundle (A + B) shows every part's qty and values at the sum ("All of"). A
      // single item shows the box name, noting a fixed/random quantity when present.
      const HEADS = { choice: "Choose one:", gamble: "Random (avg):", bundle: "All of:" };
      const optLabel = (o) => {
        const one = o.picks && o.picks.length === 1 ? o.picks[0] : null;
        if (!(o.alts && o.alts.length > 1) || !o.picks) {
          if (one && one.random) return `${o.name} <span class="hint">(random ×${one.lo}–${one.hi})</span>`;
          if (one && one.qty > 1) return `${o.name} <span class="hint">(×${one.qty})</span>`;
          return o.name;
        }
        const list = o.picks.map((p) => {
          const pick = o.kind === "choice" && p.item === o.chosen;
          const rate = o.kind === "gamble" ? `<span class="hint">${pct(p.rate)}</span> ` : "";
          return `<div class="choiceopt${pick ? " pos" : ""}">${pick ? "★ " : ""}${rate}${qtyTag(p)}${p.item}
            <span class="v gold">${money(p.price)}</span></div>`;
        }).join("");
        // Lead with the box's own name so the row is identifiable (e.g. "Rune Rune! Box"),
        // then the kind label + its contents.
        return `<div style="font-weight:600">${o.name}</div><div class="hint" style="margin-bottom:2px">${HEADS[o.kind] || "Choose one:"}</div>${list}`;
      };
      const rows = v.options.map((o) => {
        const best = v.best && o === v.best;
        return `<tr${best ? ' class="pos"' : ""}>
          <td>${best ? "★ " : ""}${optLabel(o)}</td>
          <td>${o.cost ?? "—"}${o.count > 1 ? ` → ×${o.count}` : ""}</td>
          <td class="v gold">${money(o.price)}</td>
          <td class="v gold">${o.perUnit == null ? "—" : fmt(o.perUnit)}</td>
          <td>${cap(o)}</td></tr>`;
      }).join("");
      // Best-value basket: how to spend a known coupon budget (sheet's "Total Coupons") for
      // the most gold, respecting each row's purchase limit. Shown only when a total is set.
      const basketHtml = (() => {
        if (!v.basket || v.total == null) return "";
        const b = v.basket;
        if (!b.picks.length) return `<h4 style="margin-top:12px">Best value for ${fmt(v.total)} coupons</h4>
          <div class="statline hint">Nothing priceable to buy with these coupons.</div>`;
        const items = b.picks.map((p) => `<tr>
          <td>${p.option.name}${p.buys > 1 ? ` <span class="hint">×${p.buys}</span>` : ""}</td>
          <td>${p.coupons}</td>
          <td class="v gold">${fmt(p.gold)}</td></tr>`).join("");
        const leftNote = b.left > 0 ? ` · <span class="hint">${b.left} coupons left over</span>` : "";
        return `<h4 style="margin-top:12px">Best value for ${fmt(v.total)} coupons</h4>
          <div class="statline">Spend <b>${b.spent}</b> → <span class="gold">${fmt(b.gold)}</span> total${leftNote}</div>
          <table class="shoptbl"><thead><tr><th>Buy</th><th>Coupons</th><th>Gold</th></tr></thead>
          <tbody>${items}</tbody></table>`;
      })();
      return `<h4 style="margin-top:10px">Seal Shop value</h4>
        <div class="statline">Best use: <b>${v.best ? v.best.name : "—"}</b>, worth <span class="gold">${fmt(v.unit)}</span> per unit</div>
        <table class="shoptbl"><thead><tr><th>Redeem for</th><th>Cost</th><th>Item price</th><th>Per unit</th><th>Stock</th></tr></thead>
        <tbody>${rows}</tbody></table>${basketHtml}`;
    };
    // Short tooltip label for a seal drop (best redemption). "" when not a shop currency.
    const sealShopLabel = (name) => {
      const v = sealValues[name];
      if (!v || !v.best) return "";
      return `Seal Shop: best use: ${v.best.name}${v.best.count > 1 ? ` ×${v.best.count}` : ""} for ${v.best.cost} → ${fmt(v.unit)} ea`;
    };

    // loot-box RNG value (SPEC §16.12). The Boxes log's per-box detail + drop badge
    // Detail block for a LOGGED box (the catalog's RNG rows): the observed payout table over
    // every logged opening, live-priced, the same math as the Boxes subtab's expansion.
    // "" when the name isn't in the opening log.
    const boxEVDetail = (name) => {
      const v = boxValues.find((b) => b.box === name);
      if (!v) return "";
      const sum = summarizeBoxes(boxLog).find((b) => b.box === name);
      const unitOf = (n) => (n === "Gold" ? 1 : dropUnitValue(n, prices));
      const rows = sum.items.map((e) => {
        const u = unitOf(e.name);
        return `<tr><td>${e.name === "Gold" ? "Gold" : normalizeBottleName(e.name)}${u == null ? ' <span class="hint">(unpriced)</span>' : ""}</td>
          <td>${Math.round((e.times / sum.opens) * 100)}%</td>
          <td>${(e.totalQty / e.times).toFixed(e.totalQty % e.times ? 1 : 0)}</td>
          <td class="v gold">${u == null ? "—" : fmt(u)}</td>
          <td class="v gold">${u == null ? "—" : fmt((u * e.totalQty) / sum.opens)}</td></tr>`;
      }).join("");
      const skipNote = v.unpricedItems ? ` · <span class="hint">${v.unpricedItems} payout${v.unpricedItems !== 1 ? "s" : ""} unpriced, the value undercounts</span>` : "";
      return `<h4 style="margin-top:10px">RNG box value: observed payouts</h4>
        <div class="statline">Worth <span class="gold">${v.ev == null ? "—" : fmt(v.ev)}</span> per open, over <b>${v.opens}</b> logged open${v.opens !== 1 ? "s" : ""} (Tracker → Boxes)${skipNote}</div>
        <table class="shoptbl"><thead><tr><th>Payout</th><th>Rate</th><th>Avg qty</th><th>Unit</th><th>Per open</th></tr></thead>
        <tbody>${rows}</tbody></table>`;
    };
    // Short tooltip label for a box drop (observed EV). "" when the name isn't a logged box.
    const boxEVLabel = (name) => {
      const v = boxValues.find((b) => b.box === name);
      if (!v || v.ev == null) return "";
      return `RNG box: avg payout ${fmt(v.ev)} over ${v.opens} logged open${v.opens !== 1 ? "s" : ""} (Tracker → Boxes)`;
    };

    // Plain-text price tooltip for a material name (avg/min/trend/date), "" when unpriced.
    const priceTip = (name) => {
      const p = prices[name];
      if (!p) return "";
      const parts = [];
      if (p.avg != null) parts.push(`Avg ${fmt(p.avg)}`);
      if (p.min != null) parts.push(`Min ${fmt(p.min)}`);
      if (p.trend != null) parts.push(`Trend ${p.trend > 0 ? "+" : ""}${p.trend}%`);
      if (p.date) parts.push(`as of ${p.date}`);
      return parts.join("  ·  ");
    };
    // Small trend cell: ▲ up (red/bad), ▼ down (green/good), • flat; "—" when no trend feed.
    const trendCell = (name) => {
      const p = prices[name];
      if (!p || p.trend == null) return `<span class="mt muted">—</span>`;
      const cls = p.trend < 0 ? "down" : p.trend > 0 ? "up" : "";
      const arrow = p.trend < 0 ? "▼" : p.trend > 0 ? "▲" : "•";
      return `<span class="mt ${cls}">${arrow} ${Math.abs(p.trend)}%</span>`;
    };

    // One material row as five aligned grid cells (qty · name · unit ea · line · trend), with a
    // crafted/free/unpriced tag and a hover-for-price tooltip on the name. Lives inside a `.mats`
    // grid so the numeric columns line up the way the Math grid's values do.
    // Inventory +/- stepper for a priced item name (SPEC §5.2): shows how many you OWN,
    // with buttons to adjust. A delegated document handler applies the change. Returns "" for
    // a nameless cell. Used on every material row + the catalog Owned column.
    const invStepper = (name) => {
      if (!name) return `<span class="invstep"></span>`;
      const n = ownedOf(name);
      return `<span class="invstep${n > 0 ? " has" : ""}" title="How many of ${esc(name)} you own. Netted out of upgrade costs">`
        + `<button class="inv-btn" data-inv="${esc(name)}" data-inv-dir="-1" type="button"${n <= 0 ? " disabled" : ""}>−</button>`
        + `<span class="inv-n" data-inv="${esc(name)}" title="Click to type an exact amount">${n}</span>`
        + `<button class="inv-btn" data-inv="${esc(name)}" data-inv-dir="1" type="button">+</button>`
        + `</span>`;
    };

    // Which sub-recipe <details> are expanded, keyed by item name, so an inventory edit's re-render
    // (applyInventory rebuilds the whole move detail) restores them open instead of snapping shut.
    // Maintained by a capture-phase `toggle` listener (added once, below); render reads it.
    const openSubrecipes = new Set();
    // Which carousel slide is showing, keyed by move, so an inventory edit's re-render doesn't snap
    // a multi-tier tierStep's carousel back to slide 1 (hiding the sub-recipe you were editing).
    const openCarouselSlide = new Map();

    // `pool` (optional {name:count}, MUTATED): a shared owned-inventory clone drawn down across the
    // material rows of one recipe render, so a line's total reflects the stock you own, for a LEAF
    // you own, or (via netCost's recursion) a CRAFTED intermediate whose own leaves you own. Passing
    // it makes the line NETTED (and the parent recipe's total = fee + Σ these lines stays consistent);
    // omit it (catalog / reference sub-recipes) for the gross per-unit line.
    // `seen` (optional Set, deep move-detail views only): when passed AND the material is itself
    // crafted, its own recipe is expanded INLINE as a collapsed <details> placed directly under this
    // row, the one, uniform "main recipe with expand-in-place sub-recipes" model (issue 2/4). The
    // set guards cycles/dupes (recipes already shown up the tree, owned-tier rows). Omit it (catalog,
    // combined buy list, reference rows) for a flat, non-expanding row.
    const matLi = (material, qty, pool = null, seen = null) => {
      const unit = cost(material);
      const gross = unit == null ? null : qty * unit;
      const line = pool ? (unit == null ? null : netCost(material, qty, pool, {})) : gross;
      const reduced = line != null && gross != null && line < gross; // owned stock cut this line
      // `isCraftedItem` is a per-unit market check (craft ≤ buy). But owned ingredients can flip a
      // buy→craft even when the market price is below the nominal craft cost, netCost already priced
      // this line via that cheaper craft path (so it came in `reduced`). Treat such a row as crafted
      // HERE too, so it gets the "(crafted)" tag + drill-in and the player can see/edit the owned
      // leaves that cut it (otherwise the discount would show with no way to inspect its source).
      const crafted = isCraftedItem(material)
        || (reduced && !!recipes[material] && craftCost(material) != null);
      const tag = unit == null ? ` <span class="mtag">(unpriced)</span>`
        : unit === 0 ? ` <span class="mtag">(free)</span>`
        : crafted ? ` <span class="mtag">(crafted)</span>` : "";
      // Owned stock is shown by the colored line total + the stepper count. NOT an inline text
      // tag, which would shift the +/- buttons as the count changes (SPEC §5.2). The line total
      // tooltip names how many of this line you hold.
      const tip = priceTip(material);
      const owned = ownedOf(material);
      const ownTip = reduced ? ` title="netted with your inventory${owned > 0 ? `, ${Math.min(owned, qty)} of ${qty} ${esc(material)} owned` : ""}"`
        : owned > 0 ? ` title="${Math.min(owned, qty)} of ${qty} owned"` : "";
      // Inline expand: the crafted material row IS the toggle, click its NAME to reveal its recipe
      // in a full-width `.submats` block indented under the row (no separate "Recipe:" line, issue 2/4).
      const expandable = seen && crafted && !seen.has(material);
      const open = expandable && openSubrecipes.has(material);
      const mn = expandable
        ? `<span class="mn expandable" data-expand="${esc(material)}"${tip ? ` title="${esc(tip)}"` : ""}><span class="exp-caret">${open ? "▾" : "▸"}</span> ${material}${tag}</span>`
        : `<span class="mn"${tip ? ` title="${esc(tip)}"` : ""}>${material}${tag}</span>`;
      const cells = `<span class="mq">${qty} ×</span>${mn}`
        + `<span class="mu">${fmt(unit)} ea</span><span class="ml${reduced ? " owned" : ""}"${ownTip}>${fmt(line)}</span>${trendCell(material)}`
        + invStepper(material);
      if (!expandable) return cells;
      // recipeBlock(title="__inline__") returns just the body (craft-price grid + its own `.mats`, whose
      // crafted materials expand the same way); `seen` guards cycles (recipeBlock adds `material` itself).
      return cells + `<div class="submats" data-submats="${esc(material)}"${open ? "" : " hidden"}>${recipeBlock(material, true, seen, "__inline__")}</div>`;
    };

    // Is `name` a thing you'd CRAFT (has a recipe, not free, and crafting beats buying)? Same
    // test matLi uses for its "(crafted)" tag and expandBOM uses to decide whether to expand.
    const isCraftedItem = (n) => !!recipes[n] && cost(n) !== 0
      && craftCost(n) != null && craftCost(n) <= (priceOf(n) ?? Infinity);

    // Recipe block for a craftable name: a "Craft price (total)" top row followed by the
    // per-material breakdown. Returns "" when the name has no recipe. Shared by the Catalog
    // detail AND the Upgrades move math so a craft cost always shows what it's made of.
    // `deep` (move details): recurse into each CRAFTED material so its own sub-materials get
    // their own owned-stock steppers, you can net the Advancement Stone's leaves (SPEC §5.2)
    // straight from the Upgrades tab, not just the top recipe. `seen` guards recipe cycles.
    // `netted` (move details only): the "Craft price (total)" draws owned stock down so it tracks
    // the +/- steppers, matching the move's gold, with a "from inventory" credit sub-line. The
    // catalog leaves it gross (its Price column is gross). `baseOwned` (optional, with netted):
    // net against THIS stock snapshot instead of the full inventory, a jump tierStep passes the
    // inventory left after its enhancement/tuning draws (invLeft), so shared stock isn't
    // re-credited here after the Math grid already credited it there.
    const recipeBlock = (name, deep = false, seen = new Set(), title = null, netted = false, baseOwned = null) => {
      const r = recipes[name];
      if (!r) return "";
      // Netted render: draw ONE owned clone down across the material lines (in recipe order) so each
      // line reflects your stock, a crafted intermediate's line drops when you own its leaves, not
      // just the total. fee + Σ(these lines) == the netted total below. Sub-recipes stay gross
      // reference recipes (their own steppers still re-net THIS parent line on edit via re-render).
      // OWNED-TIER rows (the incoming `seen`, e.g. the move's `from`—"1 × Beginner Uaithne Weapon")
      // get NO pool: you own that piece, so its row must not expand its BOM and eat the stock the
      // OTHER rows (the Advancement Stone) should be credited with. Snapshot `seen` now, the deep
      // recursion below mutates it with every sub-recipe name.
      const ownedRows = new Set(seen);
      const pool = netted ? { ...(baseOwned || inventory) } : null;
      // Deep move-detail views expand each crafted material's own recipe INLINE, under its row
      // (matLi does it when handed `childSeen`). `childSeen` = the incoming guard set PLUS this
      // recipe's name, so a recipe never re-expands itself or a tier already shown up the tree.
      // Owned-tier rows (the move's `from`, pre-seeded in `seen`) neither net nor expand, you own
      // that piece. Non-deep (catalog) renders flat, no expanders. The incoming `seen` is never
      // mutated (a fresh set is threaded down), so sibling renders don't leak state into each other.
      const childSeen = deep ? new Set([...seen, name]) : null;
      const mats = r.materials.map(({ material, qty }) => {
        const isOwned = ownedRows.has(material);
        return matLi(material, qty, isOwned ? null : pool, isOwned ? null : childSeen);
      }).join("");
      const feeTxt = r.fee ? ` · flat fee ${fmt(r.fee)}` : "";
      const gross = craftCost(name);
      // Netted total, consistent BY CONSTRUCTION with the lines above: fee + Σ(the displayed
      // line values), each recomputed on a parallel clone drawn in the same order as the
      // display pool. Never nets the OUTPUT node itself, netCost at the root would buy a
      // market-cheaper item at its market price (mislabeling "Craft price" and inventing a
      // phantom "from inventory" credit = craft − market with an EMPTY inventory), or consume
      // an owned unit of the output while the material lines stay gross. Owned-tier rows
      // (`ownedRows`) stay gross, matching their pool-less matLi line.
      let totalGold = gross;
      if (netted) {
        const tpool = { ...(baseOwned || inventory) };
        let sum = r.fee || 0, ok = true;
        for (const { material, qty } of r.materials) {
          const unit = cost(material);
          const line = unit == null ? null
            : ownedRows.has(material) ? qty * unit
            : netCost(material, qty, tpool, {});
          if (line == null) { ok = false; break; }
          sum += line;
        }
        totalGold = ok ? sum : null;
      }
      const credit = netted && gross != null && totalGold != null ? gross - totalGold : 0;
      const body = `<div class="grid"><div class="k">Craft price (total)</div><div class="v gold best">${fmt(totalGold)}</div>`
        + `${credit > 0 ? `<div class="k">from inventory</div><div class="v gold">− ${fmt(credit)} <span class="muted">(owned, netted above)</span></div>` : ""}</div>
        <div class="mats">${mats}</div>`;
      // Inline sub-recipe (matLi passes title="__inline__"): return JUST the body, the crafted
      // material's own row is the toggle, so there's no wrapper/summary line here (issue 2/4).
      // Its `.mats` crafted materials expand the same way, recursively (via matLi + childSeen).
      if (title === "__inline__") return body;
      return `<h4 style="margin-top:10px">Recipe${feeTxt}</h4>${body}`;
    };

    // Per-stat cost breakdown for a tuneStep: one block per tuned stat (Dest II, the base
    // stats it bundles, …) showing ticks · stat gain · gold, the flat per-tick fee total, and
    // a `.mats` grid of that stat's TOTAL materials (qty already × ticks). Any craftable tuning
    // material (e.g. Mysterious/Abyssal Crystal) gets its own recipe appended so the Crystal →
    // Uaithne Crystal cost is visible inline. "" when the move carries no breakdown.
    const tuneBreakdown = (m) => {
      if (!m.breakdown || !m.breakdown.length) return "";
      const block = (b) => {
        // A crafted tuning material (the Crystal) expands INLINE on its row, same as any recipe;
        // no separate "X is crafted" list appended below (issue 2). Fresh guard set per block.
        const mats = b.materials.map((x) => matLi(x.material, x.qty, null, new Set())).join("");
        const fee = b.feeGold ? `<span class="muted"> · fee ${fmt(b.feeGold)}</span>` : "";
        const tag = b.prereq ? ` <span class="mtag">(prerequisite)</span>` : "";
        return `<div class="tunerow"><div class="statline"><b>${tuneStatDisplay(b.stat)}</b>${tag} <span class="muted">+${fmt(b.gain)} over ${fmt(b.ticks)}× ticks</span> = <span class="v gold">${fmt(b.rowGold)}</span>${fee}</div><div class="mats">${mats}</div></div>`;
      };
      const blocks = m.breakdown.map(block).join("");
      // A capstone (Dest I/II) is gated behind its base stats being maxed, so it BUNDLES them.
      // Call that out + subtotal the prereq gold, so "Dest I" isn't mistaken for cheaper than the
      // separate base-stat tunes it actually includes.
      const prereqGold = m.breakdown.filter((b) => b.prereq).reduce((s, b) => s + b.rowGold, 0);
      const note = prereqGold > 0
        ? `<div class="statline muted">Includes the base-stat tuning this capstone requires first (${fmt(prereqGold)} of the total). You can't tune ${tuneStatDisplay(m.stat)} without it.</div>` : "";
      return `<h4 style="margin-top:10px">Cost breakdown</h4>${note}${blocks}`;
    };

    // The +12→+15 enhancement EV, step by step: each row shows expected attempts (failure keeps
    // the level so it's a finite EV) × the per-attempt materials + gold fee = that step's gold.
    // So the reader sees WHERE the enhancement total comes from, not just a lump. "" when absent.
    const enhanceStepsBlock = (m) => {
      if (!m.enhanceSteps || !m.enhanceSteps.length) return "";
      const row = (s) => {
        const mats = Object.entries(s.materials).map(([n, q]) => matLi(n, q, null, new Set())).join("");
        const fee = s.fee ? `<span class="muted"> · fee ${fmt(s.fee)}/try</span>` : "";
        return `<div class="tunerow"><div class="statline"><b>+${s.from}→+${s.to}</b> <span class="muted">${s.tries.toFixed(2)}× expected tries · ${fmt(Math.round(s.perAttempt))}/try${""}</span> = <span class="v gold">${fmt(Math.round(s.stepGold))}</span>${fee}</div><div class="mats">${mats}</div><div class="statline muted">per-attempt materials (× the tries above):</div></div>`;
      };
      const to = m.enhanceSteps[m.enhanceSteps.length - 1].to; // last step's target (+15 for a jump, +N+1 for a single gear step)
      return `<h4 style="margin-top:10px">Enhancement +${m.enhanceFrom}→+${to} (per step)</h4>${m.enhanceSteps.map(row).join("")}`;
    };

    // The Orna base-tuning prerequisite breakdown (reuses the tuneStep block shape): one row per
    // non-Destruction base stat that must be maxed to advance, with its ticks/gain/gold + the total
    // materials, plus each craftable tuning material's own recipe once. "" when nothing to tune.
    const tunePrereqBlock = (m) => {
      const bd = m.tunePrereqBreakdown;
      if (!bd || !bd.length) return "";
      const block = (b) => {
        const mats = b.materials.map((x) => matLi(x.material, x.qty, null, new Set())).join("");
        const fee = b.feeGold ? `<span class="muted"> · fee ${fmt(b.feeGold)}</span>` : "";
        return `<div class="tunerow"><div class="statline"><b>${tuneStatDisplay(b.stat)}</b> <span class="muted">+${fmt(b.gain)} over ${fmt(b.ticks)}× ticks</span> = <span class="v gold">${fmt(b.rowGold)}</span>${fee}</div><div class="mats">${mats}</div></div>`;
      };
      return `<h4 style="margin-top:10px">Max base tuning (required to advance)</h4>${bd.map(block).join("")}`;
    };

    // The extraction-rune CHOICE on a wipe (system-jump) tierStep, as a COLLAPSED expander. Crossing
    // a system jump WIPES this slot's tuning + enchants; there are two ways to end up with the same
    // fully-tuned, enchanted piece on the new system, and the move already picked the cheaper one.
    // The <summary> (always visible) states the choice in plain language. Expanded: the two options,
    // each in its own box (cheaper one outlined green + ✓), spelling out what it DOES and listing
    // its materials, "buy a rune" (1 rune carries everything) vs "let it wipe, redo it" (re-tune +
    // re-enchant from scratch; the destruction shards come back free, listed apart). Per jump.
    // The extraction-rune CHOICE on a wipe (system-jump) tierStep. A jump wipes enchants AND base-stat
    // tuning; the rune can only preserve ENCHANTS (tuning is unpreservable, its loss is already in the
    // stat diff). So this is just "re-enchant the kept affixes vs one rune that carries them."
    // Collapsed `<details>`: summary states the cheaper path; expanded shows both boxes. "" when the
    // move has no kept affixes to preserve.
    const wipeDecision = (m) => {
      const w = m.wipeMath;
      if (!w || !w.keptAffixes) return "";
      const rune = w.rune, reEnch = w.reEnchant;
      const runeWon = w.chose === "rune";
      const cell = (v) => v == null ? `<span class="muted">—</span>` : fmt(v);
      const perJump = w.jumps > 1 ? ` <span class="muted">(per jump, ×${w.jumps})</span>` : "";
      const affixes = w.affixes || [];
      const enchLine = affixes.reduce((s, a) => s + a.gold, 0) === 0
        ? `<div class="statline muted">${affixes.map((a) => a.scroll).join(" + ")} · ~0 (cheap scrolls)</div>`
        : affixes.map((a) => `<div class="statline">${a.scroll} · <span class="v gold">${fmt(a.gold)}</span></div>`).join("");

      const summary = `<summary>Crossing the jump wipes your enchants <span class="muted">(and base-stat tuning. Only the enchants can be saved)</span> — ${runeWon ? `<b>buy a rune</b> (${cell(rune)})` : `<b>re-enchant</b> (${cell(reEnch)})`} is cheaper than ${runeWon ? `re-enchanting (${cell(reEnch)})` : `a rune (${cell(rune)})`}.</summary>`;
      const enchBox = `<div class="wipe-opt${!runeWon ? " wipe-win" : ""}">
        <div class="wipe-opt-head"><span><b>Re-enchant the kept affixes</b>${!runeWon ? `<span class="wipe-opt-tag">✓ cheaper</span>` : ""}</span><span class="v gold${!runeWon ? " best" : ""}">${cell(reEnch)}${perJump}</span></div>
        ${enchLine}
      </div>`;
      const runeBox = `<div class="wipe-opt${runeWon ? " wipe-win" : ""}">
        <div class="wipe-opt-head"><span><b>Buy an extraction rune</b>${runeWon ? `<span class="wipe-opt-tag">✓ cheaper</span>` : ""}</span><span class="v gold${runeWon ? " best" : ""}">${cell(rune)}${perJump}</span></div>
        <div class="sub">Carries your prefix + suffix across the jump. (Base-stat tuning is wiped either way. The rune only saves the enchants.)</div>
        ${rune != null ? `<div class="mats">${matLi(EXTRACTION_RUNE_NAME, 1)}</div>` : ""}
      </div>`;
      return `<details class="wipe">${summary}${enchBox}${runeBox}</details>`;
    };

    // tierPath / expandBOM / moveBuys are the ctx-parameterized pure versions in
    // js/planner.js (relocated there for the Planner + its tests, SPEC §17); these
    // wrappers keep the original local signatures. They close over `tierChain`/`moveCtx`
    // (declared below). Fine, they're only CALLED after module init completes.
    const tierPath = (from, to) => tierPathPure(tierChain, from, to);
    const expandBOM = (toName, fromName) => expandBOMPure(moveCtx, toName, fromName);
    // Move-level price trend (SPEC §5 trend feed)
    // Decompose a move's gold into the leaf items you actually buy, then average each
    // leaf's market trend % weighted by its gold share. Lets an Upgrades row say whether
    // it's cheaper to upgrade THIS than usual right now (▼ good) or pricier (▲ bad).
    // null when nothing priced-with-trend drives the cost (accessory enhance mats, free).
    const moveBuys = (m) => moveBuysPure(moveCtx, m);
    // Gold-weighted average trend across a map of {item:qty} buys; null if none carry a
    // trend. Shared by the Upgrades move list and the Enchants catalog rows.
    const weightedTrend = (buys) => {
      if (!buys) return null;
      let wsum = 0, tsum = 0;
      for (const [n, q] of Object.entries(buys)) {
        const u = cost(n), p = prices[n];
        if (u == null || u === 0 || !p || p.trend == null) continue;
        const w = u * q;
        wsum += w; tsum += w * p.trend;
      }
      return wsum > 0 ? tsum / wsum : null;
    };
    const moveTrend = (m) => weightedTrend(moveBuys(m));
    // Trend cell for an Upgrades row's own Trend column: ▼ down (cheaper than usual now =
    // good/green), ▲ up (pricier = bad/red), muted "—" when no trend / it rounds to flat.
    const moveTrendChip = (m) => {
      const t = moveTrend(m), r = t == null ? null : Math.round(t);
      if (r == null || r === 0) return `<span class="mt muted">—</span>`;
      const cls = r < 0 ? "down" : "up", arrow = r < 0 ? "▼" : "▲";
      const tip = r < 0
        ? `Materials trending down ${Math.abs(r)}%, cheaper to upgrade than usual right now (vs rolling avg).`
        : `Materials trending up ${r}%, pricier to upgrade than usual right now (vs rolling avg).`;
      return `<span class="mt ${cls}" title="${esc(tip)}">${arrow}${Math.abs(r)}%</span>`;
    };

    // Inventory remaining AFTER a move's enhancement-EV + tuning-prereq draws (the solver's
    // exact, unrounded `preCraftUsed` from its ONE shared clone). The move detail's recipe /
    // carousel totals net from THIS, not a fresh full clone, otherwise stock shared between
    // the enhancement and the craft BOM (e.g. Superior Enhancement Elixir) would be credited
    // here a second time and the box total couldn't reconcile with the Math grid.
    const invLeft = (m) => {
      const p = { ...inventory };
      for (const [n, q] of Object.entries(m?.preCraftUsed || {})) {
        const left = (p[n] || 0) - q;
        if (left > 0) p[n] = left; else delete p[n];
      }
      return p;
    };

    // Inner of the COMBINED slide: the raw buy list (summed across every tier) + a total. The
    // total is INVENTORY-NETTED (draws each leaf from an owned clone, `baseOwned` when the
    // move pre-drew stock, see invLeft) so it tracks the +/- steppers, matching the move's
    // overall gold, not a gross figure that ignores your stock. A "from inventory" sub-line
    // names the credit when you own any of the leaves.
    const combinedSlideBody = (toName, fromName, baseOwned = null) => {
      const { buys, fee } = expandBOM(toName, fromName);
      const entries = Object.entries(buys)
        .sort((a, b) => ((cost(b[0]) ?? 0) * b[1]) - ((cost(a[0]) ?? 0) * a[1]));
      const owned = { ...(baseOwned || inventory) };
      let total = fee, gross = fee;
      for (const [n, q] of entries) {
        const u = cost(n); if (u != null) gross += u * q;
        const g = netCost(n, q, owned, {}); if (g != null) total += g;
      }
      const credit = gross - total;
      // Net each displayed leaf line too (parallel pool; leaves are unique after expandBOM, so
      // Σ lines == total) so an owned leaf visibly cuts its own row, not just the header total.
      const linePool = { ...(baseOwned || inventory) };
      const lis = entries.map(([n, q]) => matLi(n, q, linePool)).join("");
      return `<div class="grid"><div class="k">Materials total</div><div class="v gold best">${fmt(total)}</div>`
        + `${credit > 0 ? `<div class="k">from inventory</div><div class="v gold">− ${fmt(credit)} <span class="muted">(owned, netted above)</span></div>` : ""}`
        + `${fee ? `<div class="k">incl. flat fees</div><div class="v gold">${fmt(fee)}</div>` : ""}</div><div class="mats">${lis}</div>`;
    };

    // Inner of a per-tier step slide: that tier's own recipe materials, PLUS each crafted material's
    // collapsed sub-recipe (e.g. the Uaithne Advancement Stone) so you can drill in + net its leaves
    // right here, same as the single-tier recipeBlock. `seen` (seeded with the chain's tier nodes)
    // keeps intermediate tiers from re-expanding, they're their own slides.
    const stepSlideBody = (step, seen, baseOwned = null) => {
      const r = recipes[step];
      if (!r) return `<div class="mats"></div>`;
      // Net each line against a shared owned clone (from `baseOwned` when the move pre-drew
      // stock, see invLeft) so a crafted material's line (the Advancement Stone) reflects owned
      // leaves, matching the sub-recipe drill-in below. TIER-NODE rows (the previous tier,
      // always in `seen`) get NO pool: you own or separately build that piece, so its row must
      // not expand its BOM and eat the stock the other rows should be credited with.
      const pool = { ...(baseOwned || inventory) };
      // `seen` already holds the chain's tier nodes (so neighbouring tiers don't re-expand); pass it
      // as the inline-expand guard so a crafted material (the Advancement Stone) drills in on its own
      // row instead of stacking a separate block below.
      const mats = r.materials.map(({ material, qty }) => matLi(material, qty, seen.has(material) ? null : pool, seen.has(material) ? null : seen)).join("");
      return `<div class="mats">${mats}</div>`;
    };

    // One-box, click-to-advance carousel for a multi-tier tierStep: the combined buy list
    // first, then each tier's recipe, only ONE slide is shown at a time (click the box, or
    // the ‹ / › buttons, to step through the chain), keeping the detail vertically compact.
    // Slide nav is a single delegated document handler (see below). Single-tier steps fall
    // back to the plain recipe block.
    const tierRecipeCarousel = (m) => {
      const path = tierPath(m.from, m.to);
      // Net against the stock the move's enhancement/tuning components LEFT (invLeft), so these
      // totals reconcile with the Math grid's shared-clone netting.
      const baseOwned = invLeft(m);
      // Pre-seed `seen` with the owned current tier so its (owned → won't-craft) recipe is hidden.
      if (path.length <= 1) return recipeBlock(m.to, true, new Set([m.from]), null, true, baseOwned);
      // Tier nodes (the from + every step) seed each slide's `seen` so a tier's own recipe never shows
      // as a sub-recipe (it's the neighbouring slide). But a fresh clone per slide, so a shared
      // crafted material (the Advancement Stone) still expands on EVERY step that uses it.
      const tierSeen = [m.from, ...path];
      const slides = [{ label: `Combined buy list: to ${m.to}`, body: combinedSlideBody(m.to, m.from, baseOwned) }];
      path.forEach((step, i) => slides.push({ label: `${i === 0 ? m.from : path[i - 1]} → ${step}`, body: stepSlideBody(step, new Set(tierSeen), baseOwned) }));
      const n = slides.length;
      // Restore the slide the user was on (survives an inventory-edit re-render); clamp in range.
      const key = moveKey(m);
      const activeIdx = Math.min(Math.max(0, openCarouselSlide.get(key) ?? 0), n - 1);
      const slideEls = slides.map((s, i) =>
        `<div class="recipe-slide${i === activeIdx ? " active" : ""}" data-i="${i}" data-label="${esc(s.label)}">${s.body}</div>`).join("");
      return `<h4 style="margin-top:10px">Materials <span class="muted">(click to step through the ${n - 1} tiers)</span></h4>
        <div class="recipe-carousel" data-carousel data-carousel-key="${esc(key)}" data-n="${n}">
          <div class="rc-nav">
            <button class="recipe-nav" data-dir="-1" type="button" title="Previous">‹</button>
            <span class="rc-count">${activeIdx + 1} / ${n}</span>
            <button class="recipe-nav" data-dir="1" type="button" title="Next">›</button>
            <span class="rc-title">${esc(slides[activeIdx].label)}</span>
          </div>
          <div class="rc-slides">${slideEls}</div>
        </div>`;
    };

    // Fast custom tooltip for any [data-tip] element (the ⇄/▲ hint badges): the native
    // `title` attribute has a fixed ~0.5s browser delay we can't shorten, so we render our
    // own fixed-position tip that shows instantly on hover. Fixed + body-attached so the
    // moves table's overflow clipping never cuts it off.
    let hintTipEl = null;
    const showHintTip = (el) => {
      const text = el.getAttribute("data-tip");
      if (!text) return;
      if (!hintTipEl) { hintTipEl = document.createElement("div"); hintTipEl.id = "hintTip"; document.body.appendChild(hintTipEl); }
      hintTipEl.textContent = text;
      hintTipEl.style.display = "block";
      const r = el.getBoundingClientRect();
      const tip = hintTipEl.getBoundingClientRect();
      // Prefer above the badge; flip below if it would clip the viewport top. Clamp horizontally.
      let top = r.top - tip.height - 6;
      if (top < 4) top = r.bottom + 6;
      let left = r.left + r.width / 2 - tip.width / 2;
      left = Math.max(4, Math.min(left, window.innerWidth - tip.width - 4));
      hintTipEl.style.top = `${Math.round(top)}px`;
      hintTipEl.style.left = `${Math.round(left)}px`;
    };
    const hideHintTip = () => { if (hintTipEl) hintTipEl.style.display = "none"; };
    document.addEventListener("mouseover", (e) => {
      const el = e.target.closest?.("[data-tip]");
      if (el) showHintTip(el);
    });
    document.addEventListener("mouseout", (e) => {
      if (e.target.closest?.("[data-tip]")) hideHintTip();
    });

    // Delegated nav for every recipe carousel (added once): ONLY the ‹ / › arrows step the chain
    // (issue 6). A click anywhere else in the box, the slide body, a material's +/- stepper, an
    // inline sub-recipe expander, never advances; you interact with the recipe without the slide
    // moving under you. (Earlier a bare slide-body click advanced too, which fought the steppers.)
    document.addEventListener("click", (e) => {
      const car = e.target.closest("[data-carousel]");
      if (!car) return;
      const navBtn = e.target.closest(".recipe-nav");
      if (!navBtn) return; // only the arrows advance
      const n = +car.dataset.n;
      const cur = car.querySelector(".recipe-slide.active");
      const i = (((+cur.dataset.i) + (navBtn ? +navBtn.dataset.dir : 1)) % n + n) % n;
      const next = car.querySelectorAll(".recipe-slide")[i];
      cur.classList.remove("active"); next.classList.add("active");
      car.querySelector(".rc-count").textContent = `${i + 1} / ${n}`;
      car.querySelector(".rc-title").textContent = next.dataset.label;
      if (car.dataset.carouselKey) openCarouselSlide.set(car.dataset.carouselKey, i); // survive re-render
    });

    // Inline sub-recipe toggle (issue 2/4): a crafted material row IS the expander, clicking its
    // name (`[data-expand]`) shows/hides its recipe (the `.submats` block that follows it in the same
    // `.mats` grid). Toggled directly in the DOM (no re-render), with the open-state recorded in
    // openSubrecipes (keyed by material name) so an inventory-edit re-render restores it, and the
    // caret flipped to match. `:scope >` keeps the lookup to THIS grid's direct child, so a nested
    // sub-recipe sharing a name doesn't get caught.
    document.addEventListener("click", (e) => {
      const trg = e.target.closest("[data-expand]");
      if (!trg) return;
      const name = trg.getAttribute("data-expand");
      const grid = trg.parentElement; // the `.mats` holding this row's cells + the `.submats` sibling
      const sub = grid.querySelector(`:scope > .submats[data-submats="${CSS.escape(name)}"]`);
      if (!sub) return;
      const nowOpen = sub.hasAttribute("hidden");
      if (nowOpen) { sub.removeAttribute("hidden"); openSubrecipes.add(name); }
      else { sub.setAttribute("hidden", ""); openSubrecipes.delete(name); }
      const caret = trg.querySelector(".exp-caret");
      if (caret) caret.textContent = nowOpen ? "▾" : "▸";
    });

    // Delegated inventory +/- (added once): adjust the owned count for the clicked item, then
    // persist + re-net every move and re-render. stopPropagation so a stepper inside an expanded
    // detail row doesn't also toggle the row. Shift-click steps by 10 for fast entry.
    document.addEventListener("click", (e) => {
      const btn = e.target.closest(".inv-btn");
      if (!btn) return;
      e.stopPropagation();
      const name = btn.dataset.inv, dir = +btn.dataset.invDir, step = e.shiftKey ? 10 : 1;
      setOwned(name, Math.max(0, ownedOf(name) + dir * step));
      applyInventory();
    });

    // Click the inventory count to type an exact amount (like the sidebar stat fields). Swaps the
    // number for a small input in place; commit on Enter/blur, cancel on Escape. Re-rendering on
    // commit (applyInventory) replaces the row, so we only restore the text on cancel/no-change.
    document.addEventListener("click", (e) => {
      const span = e.target.closest(".inv-n");
      if (!span || span.querySelector("input")) return;
      e.stopPropagation();
      const name = span.dataset.inv;
      if (!name) return;
      const cur = ownedOf(name);
      const input = document.createElement("input");
      input.className = "inv-edit"; input.type = "text"; input.inputMode = "numeric"; input.value = cur;
      span.textContent = ""; span.appendChild(input);
      input.focus(); input.select();
      let done = false;
      const commit = (save) => {
        if (done) return; done = true;
        const v = Math.max(0, Math.floor(+String(input.value).replace(/[^0-9]/g, "") || 0));
        if (save && v !== cur) { setOwned(name, v); applyInventory(); return; }
        span.textContent = cur; // cancel / unchanged → restore the original count
      };
      input.addEventListener("keydown", (ev) => {
        ev.stopPropagation();
        if (ev.key === "Enter") { ev.preventDefault(); commit(true); }
        else if (ev.key === "Escape") { ev.preventDefault(); commit(false); }
      });
      input.addEventListener("blur", () => commit(true));
      input.addEventListener("click", (ev) => ev.stopPropagation());
    });

    // Delegated "Craft" (added once): consume the owned materials this move uses (encoded on the
    // button as [[name,qty],…] = m.inventoryUsed), each floored at 0 so stock never goes negative
    // and partial crafts are fine. A manual clear-stock helper (SPEC §5.2 side goal). It does not
    // add the crafted output. stopPropagation so it doesn't bubble to the row-expand handler.
    document.addEventListener("click", (e) => {
      const btn = e.target.closest(".craftbtn"); if (!btn) return;
      e.stopPropagation();
      let used;
      try { used = JSON.parse(btn.dataset.craft); } catch { return; }
      for (const [name, qty] of used) setOwned(name, Math.max(0, ownedOf(name) - qty));
      applyInventory();
    });

    // ENCHANTS (folded into the Catalog)
    // Cost + detail for one enchant. The Method column is gone (now in the detail's
    // "Acquisition methods" block); returns the cheapest method, its pts, gold/pt, and
    // the expand panel (stats + component prices + all methods + applies-to).
    const enchantInfo = (e) => {
      const methods = enchantMethods(e, prices);
      const best = methods[0] ?? null;
      const pts = score(e.stats);
      const gpp = best && pts > 0 ? best.gold / pts : null;
      const p = successRate(e.rank);
      const sc = priceOf(e.scroll), scr = e.scrap ? priceOf(e.scrap) : null, exq = priceOf(EXQUISITE_RUNE_NAME);

      const triesN = 1 / p, failsN = (1 - p) / p;        // expected scrolls / failures
      const resale = scr != null ? Math.round(scr * (1 - SCRAP_SALE_FEE)) : null;
      const breakOf = (m) => {
        if (m.method === "scroll") return `applied directly`;
        if (m.method === "scraps") return `4 × scrap ${fmt(scr)}`;
        if (m.method === "exquisite") return `scroll ${fmt(sc)} + rune ${fmt(exq)}`;
        if (m.method === "spam") {
          let s = `${triesN.toFixed(1)} scrolls ${fmt(triesN * sc)}`;
          if (resale != null) s += ` − ${failsN.toFixed(1)} scraps ${fmt(failsN * resale)} (resale −${SCRAP_SALE_FEE * 100}%)`;
          if (m.floored) s += ` → EV ${fmt(m.raw)}, floored to 1 scroll ${fmt(sc)}`;
          s += ` · burns ${failsN.toFixed(1)} enchant runes (valued 0)`;
          return s;
        }
        return "";
      };
      // Gold-weighted trend over the items the WINNING method actually buys, so the chip
      // tracks the Price column (cheapest method), not just the scroll's raw market line.
      // spam's scrap resale is a credit, not a buy → only the scrolls drive its trend.
      const methodBuys = (m) => {
        if (!m) return null;
        if (m.method === "scroll") return { [e.scroll]: 1 };
        if (m.method === "scraps") return e.scrap ? { [e.scrap]: 4 } : null;
        if (m.method === "spam") return { [e.scroll]: triesN };
        if (m.method === "exquisite") return { [e.scroll]: 1, [EXQUISITE_RUNE_NAME]: 1 };
        return null;
      };
      const t = weightedTrend(methodBuys(best));
      const trend = t == null ? null : Math.round(t);

      const byName = Object.fromEntries(methods.map((m) => [m.method, m]));
      const order = p >= 1 ? ["scroll"] : ["scraps", "spam", "exquisite"];
      const reasonFor = {
        scraps: e.scrap == null ? "no scrap for this enchant" : scr == null ? "scrap not priced" : null,
        exquisite: exq == null ? "exquisite rune not priced" : sc == null ? "scroll not priced" : null,
        spam: sc == null ? "scroll not priced" : null,
        scroll: sc == null ? "scroll not priced" : null,
      };
      const methodRows = order.map((name) => {
        const m = byName[name];
        if (!m) return `<div class="method"><span class="mname">${name}</span>` +
          `<span class="na">not available${reasonFor[name] ? `: ${reasonFor[name]}` : ""}</span></div>`;
        const isBest = best && name === best.method;
        return `<div class="method ${isBest ? "best" : ""}">` +
          `<span class="mname">${name}${isBest ? " ✓" : ""}</span>` +
          `<span class="mtotal">${fmt(m.gold)}</span>` +
          (m.floored ? ` <span class="profit">scraps → floor</span>` : "") +
          `<span class="mbreak">${breakOf(m)}</span></div>`;
      }).join("");

      const compRows =
        `<div class="k">scroll · ${e.scroll} <span class="muted">· ${Math.round(p * 100)}% success</span></div><div class="v gold">${fmt(sc)}</div>` +
        (scr != null ? `<div class="k">scrap · ${e.scrap}</div><div class="v gold">${fmt(scr)}</div>` : "") +
        (exq != null ? `<div class="k">exquisite rune</div><div class="v gold">${fmt(exq)}</div>` : "");

      return {
        best, pts, gpp, trend,
        detail: `<div class="detail">
          <h4>Stats (vs no enchant)</h4><div class="statline">${statLine(e.stats)}${e.effect ? ` · <span class="muted">${e.effect}</span>` : ""}</div>
          <h4 style="margin-top:10px">Component prices</h4><div class="grid">${compRows}</div>
          <h4>Acquisition methods (cheapest = Price column)</h4><div class="methods">${methodRows}</div>
          <h4>Applies to</h4><div><b>${e.tag}</b>${e.family ? ` · ${e.family}` : ""} <span class="muted">(${e.appliesTo.join(", ")})</span></div>
          ${priceDetail(e.scroll)}
        </div>`,
      };
    };

    // Tier-family grouping (shared by Crafting + Items)
    // A weapon/armor tier item's chain family = its name minus a leading tier adjective
    // (ITEM_TIER_WORDS) or a leading "+N" enhancement token, so "Uaithne Helm" gathers its
    // five advances and "Orna Helm" gathers +12…+15 (an Orna piece is likewise a CHAIN: +15
    // is reached only by enhancing through +13 and +14, orna.csv, so it reads like the
    // craft chains rather than four independent items). Items without either prefix, e.g.
    // "The Cursed Belt", key on their full name → no over-grouping. Multi-member families
    // render as a contiguous bracketed group.
    const ITEM_TIER_SET = new Set(ITEM_TIER_WORDS);
    const itemFamilyKey = (name) => {
      let w = name.trim().split(/\s+/);
      if (w.length > 1 && /^\+?\d+$/.test(w[0])) w = w.slice(1);          // "+15 Orna Helm" → "Orna Helm"
      if (w.length > 1 && ITEM_TIER_SET.has(w[0].toLowerCase())) w = w.slice(1);
      return w.join(" ");
    };
    // Gear names (have a stat line on the Items tab). Only these form crafting families,
    // so raw materials / consumables stay ungrouped.
    const gearNames = new Set(items.map((it) => it.name));

    // CATALOG (Items + Crafting + Enchants, merged)
    // One table for every priceable thing, tagged by Kind. Folds three former dev tabs
    // into one: gear (stat line + recipe-in-detail), recipe-only materials/runes/
    // consumables (cost only), and enchant scrolls (affix→Slot, rank→Lvl, cheapest method
    // → Cheapest; the method breakdown lives in the detail). The shared spine is
    // Pts / Cheapest / Gold-Pt, so one sort can rank cost-efficiency across all kinds.
    // A function (not a literal) so the free-item toggles can rebuild re-priced rows.
    //
    // Gear tier families ("Uaithne Helm" gathers Beginner…Legendary) render as a
    // contiguous bracketed group (strongest tier first); enchants/materials are
    // singletons. Units order by best pts so strong gear leads, materials (no pts) sink.
    // Re-sorting any column drops the bracket (renderTable's inDefaultOrder gate).
    const KIND_PILL = {
      gear: `<span class="pill kgear">Gear</span>`,
      enchant: `<span class="pill kenchant">Enchant</span>`,
      material: `<span class="pill kmaterial">Material</span>`,
      sealshop: `<span class="pill ksealshop">Seal Shop</span>`,
      rng: `<span class="pill krng">RNG</span>`,
      legacy: `<span class="pill klegacy">Legacy</span>`,
    };
    // Cheapest-source glyphs (Lucide, currentColor). Bag = marketplace, hammer = craft.
    const ICON_BAG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>`;
    const ICON_HAMMER = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 12-8.5 8.5a2.12 2.12 0 1 1-3-3L12 9"/><path d="M17.64 15 22 10.64"/><path d="m20.91 11.7-1.25-1.25c-.6-.6-.93-1.4-.93-2.25v-.86L16.01 4.6a5.56 5.56 0 0 0-3.94-1.64H9l.92.82A6.18 6.18 0 0 1 12 8.4v1.56l2 2h.86c.85 0 1.65.33 2.25.93l1.25 1.25"/></svg>`;
    const buildCatalogView = () => {
      const entries = [];

      // GEAR, has a stat line; its recipe (if any) folds into the detail.
      // Legacy gear (Slot=Legacy in the sheet) renders like legacy enchants: name +
      // Legacy pill + level, numeric columns blank; prices keep logging unseen.
      for (const it of items) {
        const pts = score(it.stats);
        const mk = priceOf(it.name), cr = craftCost(it.name), ch = cost(it.name);
        const r = recipes[it.name];
        const slotPills = it.slotIds.map((s) => `<span class="pill">${s}</span>`).join(" ");
        const recipeHtml = r
          ? recipeBlock(it.name)
          : `<div class="muted" style="margin-top:10px">No crafting recipe. Marketplace only.</div>`;
        entries.push({
          kind: "gear", legacy: it.legacy,
          name: it.name, famKey: it.legacy ? ` ${it.name}` : itemFamilyKey(it.name),
          slotHtml: it.legacy ? `<span class="pill">Legacy</span>` : slotPills,
          slotText: it.legacy ? "legacy" : it.slotIds.join(", "),
          lvlNum: it.level ?? null, lvlText: it.level ?? "—",
          pts: it.legacy ? null : pts,
          mk: it.legacy ? null : mk, cr: it.legacy ? null : cr, ch: it.legacy ? null : ch,
          trend: it.legacy ? null : prices[it.name]?.trend ?? null,
          gpp: !it.legacy && ch != null && pts > 0 ? ch / pts : null,
          detail: `<div class="detail">
            <h4>Stats</h4><div class="statline">${statLine(it.stats)}${it.effect ? ` · <span class="muted">${it.effect}</span>` : ""}</div>
            ${it.legacy ? "" : `<h4 style="margin-top:10px">Slots</h4><div class="muted">${it.slotIds.join(", ")}</div>`}
            ${recipeHtml}
            ${priceDetail(it.name)}
          </div>`,
        });
      }

      // MATERIALS, every non-gear, non-enchant priced thing (runes, mats, essences,
      // consumables): cost only. Craftable ones (have a recipe) show a Craft cost + recipe
      // breakdown in the detail; bought-only ones (no recipe, the old Prices-tab leaves)
      // just carry a market price. One bucket, distinguished only by recipe presence.
      const enchantScrolls = new Set(Object.values(enchants).map((e) => e.scroll));
      const matNames = new Set([...Object.keys(recipes), ...Object.keys(prices)]);
      for (const v of boxValues) matNames.add(v.box); // a logged box lists even before its EV prices (all payouts unpriced)
      for (const n of matNames) {
        if (gearNames.has(n) || enchantScrolls.has(n) || legacy[n]) continue;
        const cr = craftCost(n), mk = priceOf(n), ch = cost(n);
        const recipeHtml = recipeBlock(n);
        // Seals carry a derived Seal-Shop value, not a real market listing → show the
        // redemption breakdown instead of the (misleading) market price-detail block.
        const sealHtml = sealShopDetail(n);
        // A box in the opening log is an RNG kind (SPEC §16.12): its detail shows the observed
        // payout table. An injected (derived) price hides the market price-detail block like
        // seals do; a box with a REAL listing keeps it, market price vs opening EV, side by side.
        const boxHtml = sealHtml ? "" : boxEVDetail(n);
        entries.push({
          kind: sealHtml ? "sealshop" : boxHtml ? "rng" : "material", name: n, famKey: ` ${n}`,
          slotHtml: "", slotText: "", lvlNum: null, lvlText: "—",
          pts: null, mk, cr, ch, trend: prices[n]?.trend ?? null, gpp: null,
          detail: `<div class="detail">${recipeHtml}${sealHtml || (boxHtml ? boxHtml + (prices[n]?.derived === "boxlog" ? "" : priceDetail(n)) : priceDetail(n))}</div>`,
        });
      }

      // ENCHANTS, affix pill + the scroll's Tag (slot-group), rank→Lvl.
      // The Tag stands in for the slot list (e.g. "Accessory" instead of 8 slot pills); the full
      // slot list still feeds slotText so per-slot filtering keeps working.
      // The Items catalog is item-centric, so an enchant row's Price is the SCROLL's own
      // min(market,craft). One scroll. NOT the multi-attempt application EV (that lives in the
      // detail's Acquisition-methods block, keyed off enchantInfo's `best`). SPEC §7.3.
      for (const e of Object.values(enchants)) {
        const { pts, detail } = enchantInfo(e);
        const tagPill = e.tag ? ` <span class="pill">${e.tag}</span>` : "";
        const sch = cost(e.scroll);
        // Legacy scrolls (appliesTo empty) are catalog-only: name + rank + the Legacy
        // pill, every numeric column blank. Prices keep logging in the sheet; the row
        // just doesn't display them (and no affix pill, it can't be applied anyway).
        const legacy = e.appliesTo.length === 0;
        entries.push({
          kind: "enchant", name: e.scroll, famKey: ` ${e.scroll}`,
          slotHtml: legacy ? tagPill.trim() : `<span class="pill">${e.affix}</span>${tagPill}`,
          slotText: `${e.affix} ${e.tag} ${e.appliesTo.join(", ")}`,
          lvlNum: typeof e.rank === "number" ? e.rank : null, lvlText: e.rank ?? "—",
          legacy,
          pts: legacy ? null : pts, mk: null, cr: null, ch: legacy ? null : sch,
          trend: legacy ? null : prices[e.scroll]?.trend ?? null,
          gpp: !legacy && sch != null && pts > 0 ? sch / pts : null, detail,
        });
      }

      // LEGACY (SPEC §7.3): retired gear/materials/scrolls from the Legacy tab. Name +
      // rank/level only, every numeric column blank; the old stat line is display text in
      // the detail. Price tracking continues unseen; rows hide behind the Legacy chip.
      for (const l of Object.values(legacy)) {
        const affixLabel = l.affix === "P" ? "prefix" : l.affix === "S" ? "suffix" : "";
        entries.push({
          kind: "legacy", legacy: true, name: l.name, famKey: ` ${l.name}`,
          slotHtml: l.type ? `<span class="pill">${esc(l.type)}</span>` : "",
          slotText: `legacy ${l.type.toLowerCase()} ${affixLabel}`,
          lvlNum: /^\d+$/.test(l.rank) ? +l.rank : null, lvlText: l.rank || "—",
          pts: null, mk: null, cr: null, ch: null, trend: null, gpp: null,
          detail: `<div class="detail">
            <h4>Old stats</h4><div class="statline">${l.stats ? esc(l.stats) : "—"}${affixLabel ? ` · <span class="muted">${affixLabel}</span>` : ""}</div>
            <div class="muted" style="margin-top:10px">Legacy item: no longer in circulation. Tracked for pricing only, never offered as an upgrade.</div>
            ${priceDetail(l.name)}
          </div>`,
        });
      }

      // Grouping bookkeeping. `famCount` decides which gear gets bracketed; `groupKey` is the
      // alphabetical sort key that keeps a family contiguous (its base name) while singletons
      // sort on their own name; `within` orders members strongest-first INSIDE a family so the
      // member order is stable regardless of the A-Z/Z-A direction (only the group order flips).
      const famCount = {};
      for (const en of entries) famCount[en.famKey] = (famCount[en.famKey] || 0) + 1;
      const byFam = new Map();
      for (const en of entries) {
        en.grouped = en.kind === "gear" && famCount[en.famKey] > 1;
        en.groupKey = en.grouped ? itemFamilyKey(en.name) : en.name;
        if (!byFam.has(en.famKey)) byFam.set(en.famKey, []);
        byFam.get(en.famKey).push(en);
      }
      for (const arr of byFam.values()) {
        arr.sort((a, b) => (b.pts ?? -Infinity) - (a.pts ?? -Infinity)); // strongest tier = group head
        arr.forEach((en, i) => { en.within = i; });
      }

      // Cheapest-source icons (market first, then craft, fixed order). The path that wins the
      // min() is highlighted; the other is shown faint when it also exists, and dropped entirely
      // when unavailable (buy-only → store only, craft-only → hammer only). Enchants have neither
      // (their cost is an acquisition method) → no icon.
      const sourceIcons = (en) => {
        const mkAvail = en.mk != null, crAvail = en.cr != null;
        if (!mkAvail && !crAvail) return "";
        const usedMk = en.ch != null && mkAvail && (!crAvail || en.mk <= en.cr);
        return (mkAvail ? `<span class="srcicon mk ${usedMk ? "on" : "off"}" title="buy ${fmt(en.mk)}">${ICON_BAG}</span>` : "")
             + (crAvail ? `<span class="srcicon cr ${usedMk ? "off" : "on"}" title="craft ${fmt(en.cr)}">${ICON_HAMMER}</span>` : "");
      };

      return {
        columns: [{ label: "Item" }, { label: "Kind" }, { label: "Slot / Affix" }, { label: "Lvl/R", num: true },
                  { label: "Pts", num: true }, { label: "Trend", num: true }, { label: "Price", num: true },
                  { label: "Gold / Pt", num: true }, { label: "Owned", num: true }],
        defaultSort: { col: 0, dir: "asc" }, // Item A-Z, families grouped by base name
        rows: entries.map((en) => ({
          key: en.name,
          kind: en.kind,
          legacy: en.legacy || false, // hidden unless the Legacy chip is on
          owned: ownedOf(en.name), // drives the Owned filter + most-owned-first sort (SPEC §5.2)
          group: en.grouped ? en.famKey : null,
          groupKey: en.groupKey, within: en.within, // drive the grouped Item-column sort
          sort: [en.name, en.kind, en.slotText, en.lvlNum ?? NaN, en.pts ?? NaN,
                 en.trend ?? NaN, en.ch ?? NaN, en.gpp ?? NaN, ownedOf(en.name)],
          cells: [en.name, ["", KIND_PILL[en.kind]], ["", en.slotHtml || "—"], ["dim", en.lvlText],
            ["num", en.pts == null ? "—" : en.pts.toLocaleString()],
            ["num", en.trend == null ? "—" : `<span class="${en.trend < 0 ? "down" : en.trend > 0 ? "up" : ""}">${en.trend}%</span>`],
            ["num", sourceIcons(en) + fmt(en.ch)], ["num", en.gpp == null ? "—" : fmt(en.gpp)],
            ["num", invStepper(en.name)]],
          detail: en.detail,
        })),
      };
    };
    let catalogView = buildCatalogView();

    // UPGRADES (the ranked action list, the actual product, SPEC §7.1)
    // Every available move merged and sorted cheapest gold-per-point first. This
    // is the anti-overload default view; the sanity tabs below are dev tooling.
    const itemByName = Object.fromEntries(items.map((it) => [it.name, it]));

    // Live stat totals (sidebar-editable, persisted)
    // CURRENT_STATS can't be fully derived (character base / set bonuses / infusions
    // aren't in the data), so it's a hand-entered snapshot. We keep a LIVE mutable copy
    // and (a) let the user edit it directly in the sidebar, (b) auto-apply a slot's stat
    // DELTA when its gear is edited, so swapping e.g. Uaithne→Beginner Uaithne weapon
    // shifts the totals by exactly that piece's stat change. Persisted as a partial
    // override merged over the seed (key CURRENT_STATS_STORAGE_KEY).
    function loadStoredStats() {
      const s = { ...CURRENT_STATS };
      try {
        const saved = JSON.parse(localStorage.getItem(CURRENT_STATS_STORAGE_KEY) || "null");
        if (saved) for (const k of Object.keys(STAT_LABEL)) if (saved[k] != null) s[k] = saved[k];
      } catch { /* corrupt/blocked storage → fall back to the seed */ }
      return s;
    }
    let currentStats = loadStoredStats();
    // BASELINE snapshot at startup (= last-saved stats). Reset reverts to THIS, not the
    // hardcoded fixture, see the loadout baseline note above.
    let statsBaseline = { ...currentStats };
    const statsDirty = () => { try { return JSON.stringify(currentStats) !== JSON.stringify(statsBaseline); } catch { return false; } };
    const persistStats = () => { try { localStorage.setItem(CURRENT_STATS_STORAGE_KEY, JSON.stringify(currentStats)); } catch { /* storage blocked → session-only */ } };

    // The scored-stat contribution of ONE loadout slot = base item line + both affixes
    // + enhance (att/defPen) for enhanceable accessories. Mirrors the solver's state
    // model; used to compute the delta when a slot is edited so the totals stay in sync.
    function slotStats(entry) {
      const out = {};
      const add = (st) => { if (st) for (const k of Object.keys(STAT_LABEL)) if (st[k]) out[k] = (out[k] || 0) + st[k]; };
      if (!entry) return out;
      if (entry.base) add(itemByName[entry.base]?.stats);
      add(enchants[entry.prefix]?.stats);
      add(enchants[entry.suffix]?.stats);
      if (entry.enhance?.bracket != null && entry.enhance.level) {
        const row = accessories?.brackets?.[entry.enhance.bracket]?.find((e) => e.level === entry.enhance.level);
        if (row) add({ att: row.att || 0, defPen: row.defPen || 0 });
      }
      // Tuning (SPEC §12): the per-stat tuned AMOUNT layers on top of the untuned base
      // line. Stat labels map to scored keys (ATT Surplus → destruction).
      if (entry.tuning) for (const [stat, amt] of Object.entries(entry.tuning)) {
        const k = TUNING_STAT_TO_KEY[stat];
        if (k && amt) out[k] = (out[k] || 0) + amt;
      }
      // Infusion (SPEC §14): one recorded stat line (bal/crit/critRes/attSpd/def) folds in directly.
      if (entry.infusion?.stat && entry.infusion.amount)
        out[entry.infusion.stat] = (out[entry.infusion.stat] || 0) + entry.infusion.amount;
      return out;
    }

    // Weapon/armor tier-chain graph (SPEC §4) → drives `tierStep` moves: each tier
    // item maps to the one above it (recipe + stat data permitting).
    const tierChain = buildTierChain(recipes, items);
    // `inventory` is passed by REFERENCE so a +/- edit + recomputeLoadout re-nets every move
    // without rebuilding moveCtx (the solver reads the live object each generation, SPEC §5.2).
    // `recipes` + `priceOf` ride along for the planner.js helpers (expandBOM/moveBuys, SPEC §17).
    const moveCtx = { enchants, prices, recipes, priceOf, bySlot, cost, craftCost, netCost, inventory, vetoes, accessories, tierChain, setBonuses, tuning, enhancement, freeItems };
    // `moves` now includes net-negative-point moves that still improve SOME stat
    // (e.g. +Att Spd / −Bal). Kept for stat-target & threshold. The default ranked
    // (gold-per-point) view shows the genuine point gains PLUS every tier advance: a
    // fully-tuned piece's jump to a bare higher-system base is often an immediate stat
    // wash (the base-stat tuning resets, only Destruction carries) yet it's required
    // forward progress that unlocks a much higher tuning ceiling, so it's always shown
    // (ranked last via Infinity gold/point when pointGain ≤ 0). SPEC §12.
    // `let` (not const): marking an item free re-prices craftCost, which feeds tierStep
    // move costs, so the move lists are regenerated on toggle (see applyFreeItems).
    const shownInPoints = (m) => m.pointGain > 0 || m.type === "tierStep";
    let moves = generateMoves(loadout, moveCtx);
    let rankedMoves = moves.filter(shownInPoints);

    // Solver controls (SPEC §7.2/§7.3). `allowLossy` is genuinely solver-wide, it
    // gates both the threshold solver and the lossy filter on the points view.
    let allowLossy = false;
    // Upgrades-tab row filters: drop moves carrying a "rebase? →" / "better:" hint.
    let hideRebase = false, hideBetter = false;

    // Slots with a strictly-better base available → flag enchant/enhance moves on
    // them ("rebase?"): upgrading that item may be wasted if you swap its base.
    // `let` (not const): these depend on the live `loadout`, so they are recomputed
    // whenever the user edits gear (recomputeLoadout). The rebase/better hints read
    // them by reference from their closures.
    let rebaseSlots = slotsWithBaseSwap(loadout, moveCtx);
    // Strongest base per slot, and strongest scroll per (slot|affix) → "better"/"rebase"
    // hints naming the item you'd move to.
    let bestBase = bestBaseSwapBySlot(loadout, moveCtx);
    let bestEnchant = bestEnchantBySlotAffix(loadout, moveCtx);
    // Compact symbol hint: a single glyph carrying ALL its detail in the hover tooltip
    // (SPEC §7.3). Keeps the Upgrades label column narrow, the named target + rationale
    // live in the tooltip, not inline. `sym` is the glyph, `cls` the color class. Uses
    // `data-tip` (not `title`) so the fast custom tooltip fires instantly, the native
    // `title` has a ~0.5s browser delay we can't shorten.
    const hintChip = (sym, cls, title) =>
      ` <span class="movehint hint-sym ${cls}" data-tip="${esc(title)}">${sym}</span>`;
    // `rebasedSlots` (optional) = slots already base-swapped earlier in a bundle, so
    // the rebase hint is suppressed for them (it's already been actioned. SPEC §7.3).
    // ⇄ glyph; the tooltip names the better base you'd rebase to.
    const rebaseBadge = (m, rebasedSlots) => {
      if (!(m.type === "enchantSwap" || m.type === "enhanceStep")) return "";
      if (!rebaseSlots.has(m.slot) || rebasedSlots?.has(m.slot)) return "";
      const best = bestBase[m.slot];
      const to = best?.to || "a better base";
      return hintChip("⇄", "hint-rebase",
        `Rebase available → ${to}${best?.pointGain ? ` (+${fmt(best.pointGain)} pts)` : ""}. `
        + `A better base exists for this slot. Upgrading this item may be wasted before you swap to ${best?.to || "it"}.`);
    };
    // On a base/enchant move that isn't the strongest option for its slot, the ▲ glyph;
    // the tooltip names the stronger option (base swap → strongest base; enchant →
    // strongest scroll in the family chain, e.g. Passion → Wish → Irate).
    const betterHint = (m) => {
      const best = m.type === "baseSwap" ? bestBase[m.slot]
        : m.type === "enchantSwap" && m.family ? bestEnchant[`${m.slot}|${m.affix}|${m.tag}|${m.family}`] : null;
      return best && best.to !== m.to && best.pointGain > m.pointGain
        ? hintChip("▲", "hint-better",
            `Better ${m.type === "baseSwap" ? "base" : "scroll"} available → ${best.to}`
            + ` (+${fmt(best.pointGain)} pts, usually pricier).`)
        : "";
    };
    // Boolean mirrors of the two hint chips, so the Upgrades-tab filters can hide moves
    // that carry a "rebase? →" or "better:" badge (SPEC §7.3).
    const moveNeedsRebase = (m) => (m.type === "enchantSwap" || m.type === "enhanceStep") && rebaseSlots.has(m.slot);
    const moveHasBetter = (m) => !!betterHint(m);
