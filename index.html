    const goalStepLabel = (step) => `Complete: ${goalById[step.goalId]?.label ?? step.goalId}`;

    // Inline add chooser rendered at insertion index `idx` (toolbar buttons / insertion lines).
    // Two modes (plannerAddMode): "note" = a plain text input; "upgrade" = the quick-add SEARCH
    // (SPEC §17.7). Type-to-find over every slot's candidate upgrades + the checklist goals,
    // with the old slot → part → change cascade behind a "Browse by slot" toggle. Both build
    // their options from plannerTailStates (the plan simulated up to `idx`), so adding "+13"
    // then searching again offers "+14", sequential adds compose.
    function planAddChooser(idx) {
      if (plannerAddMode === "note") {
        return `<div class="plan-add" data-plan-add-at="${idx}">
          <div class="plan-add-row">
            <input type="text" data-plan-note-text placeholder="Note (e.g. farm Neamhain until the belt drops)" autocomplete="off">
            <button data-plan-do="add-note">Add note</button>
            <button data-plan-do="add-cancel" class="plan-ghost">Cancel</button>
          </div>
        </div>`;
      }
      return `<div class="plan-add" data-plan-add-at="${idx}">
        <input type="text" class="plan-qa-input" data-plan-qa-input placeholder="Search upgrades: try an enchant (“tragic”), a tier (“eriu”), a level (“+15”), a slot, or a goal…" value="${esc(planQuery)}" autocomplete="off" spellcheck="false">
        <div class="plan-qa-results" id="planQaResults">${planQAResults()}</div>
        <div class="plan-add-row">
          <button data-plan-do="qa-browse" class="plan-ghost">${planQABrowse ? "Hide browse" : "Browse by slot…"}</button>
          <button data-plan-do="add-cancel" class="plan-ghost">Cancel</button>
        </div>
        ${planQABrowse ? planUpgradeBuilder() : ""}
      </div>`;
    }

    // The filtered quick-add rows (also re-rendered alone on each keystroke, see the panel's
    // input listener; a full renderPlanner would destroy the input and drop focus/caret).
    function planQAResults() {
      planQAShown = quickAddFilter(planQACands, planQuery, 14);
      if (!planQAShown.length)
        return `<div class="muted" style="font-size:12px;padding:6px 2px">No matches. Try another word, or Browse by slot below.</div>`;
      return planQAShown.map((c, i) => c.planned
        ? `<div class="plan-qa-row planned" title="Every step of this change is already in the plan"><span class="plan-qa-slot">${escTxt(c.slotLabel)}</span><span class="plan-qa-label">${escTxt(c.label)}</span><span class="plan-qa-tag">planned</span></div>`
        : `<div class="plan-qa-row" data-plan-qa="${i}" title="Add to the plan"><span class="plan-qa-slot">${escTxt(c.slotLabel)}</span><span class="plan-qa-label">${escTxt(c.label)}</span></div>`).join("");
    }

    // Search haystack for one step (item / scroll / stat / +level words, so "tragic" or "+15" hit).
    const stepSearchText = (s) => s.kind !== "move"
      ? (s.text || s.goalId || "")
      : [s.item, s.scroll, s.stat, s.toLevel != null ? `+${s.toLevel}` : "", s.type].filter(Boolean).join(" ");

    // Every quick-add candidate: each slot's upgrade options across all applicable parts
    // (from the plan-tail `states`), plus the not-yet-earned checklist goals. `planned` marks
    // candidates whose every step is already in the path (shown dimmed, not clickable).
    function buildQuickAddCands(states) {
      const cands = [];
      for (const slot of SIDEBAR_SLOT_ORDER) {
        const groups = slotUpgradeOptions(loadout, slot, moveCtx, states);
        if (!groups) continue;
        const app = groups.applicable || {};
        const parts = ["base"];
        if (app.prefix) parts.push("prefix");
        if (app.suffix) parts.push("suffix");
        if (app.tuning) parts.push("tuning");
        if (infusionKind(slot) && infusionTargets(slot).length) parts.push("infusion");
        for (const part of parts) {
          for (const o of planChangeOptions(slot, part, groups, states)) {
            cands.push({
              slotLabel: `${planSlotLabel(slot)} · ${part}`,
              label: o.label, steps: o.steps, value: o.value ?? null,
              search: `${planSlotLabel(slot)} ${part} ${o.label} ${o.steps.map(stepSearchText).join(" ")}`,
            });
          }
        }
      }
      for (const sec of PREP_GOALS) for (const it of sec.items) {
        if (checklistDone.has(it.id)) continue; // already earned, nothing left to plan
        cands.push({ slotLabel: "Checklist", label: it.label, steps: [newGoalStep(it.id)], value: null,
          search: `checklist goal ${it.label}` });
      }
      const have = new Set(plannerPath.steps.map(stepKey));
      for (const c of cands) c.planned = c.steps.every((s) => have.has(stepKey(s)));
      return cands;
    }

    // Insert a picked quick-add candidate at the open insertion point (de-duped by stepKey,
    // fresh ids so re-picking a candidate can't collide). The chooser STAYS OPEN with the
    // index advanced past the insert, rebuild-on-render then offers the follow-ups (+14
    // after +13), so a whole enhance run composes without reopening.
    function planQAInsert(c) {
      const have = new Set(plannerPath.steps.map(stepKey));
      const fresh = c.steps.map((s) => ({ ...s, id: newStepId() }))
        .filter((s) => { const k = stepKey(s); if (have.has(k)) return false; have.add(k); return true; });
      if (!fresh.length) return;
      snapPlan();
      const at = plannerAddAt ?? plannerPath.steps.length;
      plannerPath = insertSteps(plannerPath, at, fresh);
      plannerAddAt = at + fresh.length;
      planQuery = ""; planQAFocus = true;
      persistPlannerPath(); renderPlanner();
    }

    // Open the add chooser at insertion index `idx` in the given mode, resetting its state.
    function openAddChooser(idx, mode) {
      plannerAddAt = idx; plannerAddMode = mode;
      planQuery = ""; planQABrowse = false; planBuildSlot = planBuildPart = null;
      planQAFocus = mode === "upgrade";
      renderPlanner();
      if (mode === "note") plannerPanel.querySelector("[data-plan-note-text]")?.focus();
    }

    // Short option label for one candidate move in the upgrade builder's Change dropdown:
    // "<target>—<gold> gold, +N pts". Enchants show the trimmed scroll name.
    function planMoveOptionLabel(m) {
      let head;
      switch (m.type) {
        case "tierStep": case "baseSwap": case "gearEnhance": head = m.to; break;
        case "enhanceStep": head = `+${m.apply.level}`; break;
        case "enchantSwap": head = shortScroll(m.to); break;
        case "tuneStep": head = `${m.stat} to cap`; break;
        default: head = m.type;
      }
      const cost = m.goldCost != null ? ` · ${fmt(m.goldCost)} gold` : "";
      // Signed point gain: a tradeoff enchant (single-stat focus) can be a net LOSS, so keep the
      // sign explicit ("−2,000 pts", not "+-2000") instead of always prefixing "+".
      const g = Math.round(m.pointGain || 0);
      const pts = g ? `, ${g > 0 ? "+" : "−"}${fmt(Math.abs(g))} pts` : "";
      return `${head}${cost}${cost ? pts : ""}`;
    }

    // The concrete "changes" available for a (slot, part): each is { label, steps, value }
    // ready to insert (`value` = points per gold, the empty-query quick-add rank). Move parts
    // explode through moveToSteps (a cumulative tier → per-hop steps); infusion is not a
    // costed move (SPEC §14) so it becomes a plain note goal. `states` (optional) = the
    // plan-tail slot states, options build on what's already planned, not just the live gear.
    function planChangeOptions(slot, part, groups, states = null) {
      if (part === "infusion") {
        // What the slot's infusion line reads RIGHT NOW from the picker's point of view:
        // the plan-tail simulated value (an earlier queued infuse step on this slot) if we have
        // one, else the live loadout. Shown in every option's label so picking a new infusion
        // doesn't silently clobber one the item already carries.
        const cur = states?.[slot]?.infusion ?? loadout[slot]?.infusion ?? null;
        const curLabel = cur ? `+${cur.amount} ${INFUSION_STAT_LABEL[cur.stat] || cur.stat}` : null;
        const note = (t) => !curLabel ? ""
          : cur.stat === t.stat && cur.amount >= t.amount ? ` (already has this)`
          : ` (replaces current ${curLabel})`;
        // Accessories can take a FREE +1 Bal or Crit infusion stone (SPEC §14). Offer those as
        // REAL zero-gold infuse steps that fold the stat like the Checklist's +1 (SPEC §17.7).
        // Weapon/armor keep the note-only suggestion toward their +2 target (no free-stone action).
        if (infusionKind(slot) === "accessory")
          return [{ stat: "bal", amount: 1 }, { stat: "crit", amount: 1 }].map((t) => ({
            label: `+${t.amount} ${INFUSION_STAT_LABEL[t.stat]} (free stone)${note(t)}`,
            steps: [newInfuseStep(slot, t.stat, t.amount)],
          }));
        return infusionTargets(slot).map((t) => {
          const label = `+${t.amount} ${INFUSION_STAT_LABEL[t.stat] || t.stat}`;
          return { label: `${label}${note(t)}`, steps: [newNoteStep(`Infuse your ${planSlotLabel(slot)} to ${label}`)] };
        });
      }
      // Best-first: highest point gain on top, so a tradeoff enchant (possible net loss) sinks
      // to the bottom instead of leading the dropdown (ties broken by cheaper gold).
      const onBase = states?.[slot]?.base?.name ?? loadout[slot]?.base ?? null;
      const opts = (groups[part] || [])
        .slice()
        .sort((a, b) => (b.pointGain || 0) - (a.pointGain || 0) || (a.goldCost || 0) - (b.goldCost || 0))
        .map((m) => ({
          label: planMoveOptionLabel(m),
          steps: moveToSteps(m, moveCtx, onBase),
          value: m.goldCost > 0 && m.pointGain ? m.pointGain / m.goldCost : null,
        }));
      // Partial-tuning suggestion (SPEC §17.7): a companion line per single-row tune that
      // STARTS at one tick, the cap is still the goal, you grow it with the card's Target
      // stepper instead of shrinking a to-cap lump. Skipped when one tick from done (the
      // to-cap line already IS that) or when the move bundles prereqs (not tick-adjustable).
      if (part === "tuning") {
        for (const m of groups.tuning || []) {
          if (!m.tickSize || m.breakdown?.length !== 1) continue;
          const cur = m.cap - m.breakdown[0].gain;
          const first = cur + m.tickSize;
          if (first >= m.cap) continue;
          const perTick = m.breakdown[0].ticks ? m.breakdown[0].rowGold / m.breakdown[0].ticks : 0;
          opts.push({
            label: `${m.stat}, partial, starts at 1 tick (${fmt(perTick)} gold/tick · goal ${fmt(m.cap)})`,
            steps: [{ id: newStepId(), kind: "move", slot, type: "tuneStep", stat: m.stat,
              capstone: m.capstone || 0, partial: true,
              maxes: [{ stat: m.apply.maxes[0].stat, amount: first }],
              ...(onBase ? { onItem: onBase } : {}) }],
            value: m.goldCost > 0 && m.pointGain ? m.pointGain / m.goldCost : null,
          });
        }
      }
      // The "base" part's single "+N → +N+1" enhance move is joined by multi-level "enhance
      // to +X" targets (SPEC §17.7) so one add jumps straight to +20 (accessories) or +15
      // (Orna gear) instead of stepping level-by-level. Only the MULTI-level jumps (2+ levels)
      // are added here, the single next level is already in groups.base.
      if (part === "base") {
        const multi = (o) => o.steps.length > 1;
        opts.push(...enhanceTargetOptions(loadout, slot, moveCtx, states).filter(multi)
          .map((o) => ({ label: `enhance ${o.label}`, steps: o.steps })));
        opts.push(...gearEnhanceTargetOptions(loadout, slot, moveCtx, states).filter(multi)
          .map((o) => ({ label: `enhance ${o.label}`, steps: o.steps })));
      }
      return opts;
    }

    // Cascading slot → part → change builder embedded in the add chooser. Re-renders on each
    // select change (planBuildSlot/planBuildPart drive what the next dropdown shows).
    function planUpgradeBuilder() {
      const slotOpts = SIDEBAR_SLOT_ORDER.filter((s) => (plannerTailStates?.[s] ?? loadout[s])?.base)
        .map((s) => `<option value="${s}"${s === planBuildSlot ? " selected" : ""}>${escTxt(planSlotLabel(s))}</option>`).join("");
      let partSel = "", changeSel = "", addBtn = "";
      if (planBuildSlot) {
        const groups = slotUpgradeOptions(loadout, planBuildSlot, moveCtx, plannerTailStates) || {};
        const app = groups.applicable || {};
        // List every STRUCTURALLY applicable part (even ones with nothing to upgrade right now),
        // so a maxed part shows "no available upgrades" instead of silently vanishing.
        const parts = [];
        if (app.base) parts.push(["base", "Base / tier / enhance"]);
        if (app.prefix) parts.push(["prefix", "Prefix enchant"]);
        if (app.suffix) parts.push(["suffix", "Suffix enchant"]);
        if (app.tuning) parts.push(["tuning", "Tuning"]);
        if (infusionKind(planBuildSlot) && infusionTargets(planBuildSlot).length) parts.push(["infusion", "Infusion"]);
        partSel = `<select data-plan-build-part><option value="">Part…</option>` +
          parts.map(([v, l]) => `<option value="${v}"${v === planBuildPart ? " selected" : ""}>${l}</option>`).join("") + `</select>`;
        if (planBuildPart) {
          const opts = planChangeOptions(planBuildSlot, planBuildPart, groups, plannerTailStates);
          if (opts.length) {
            changeSel = `<select data-plan-build-change>` +
              opts.map((o, i) => `<option value="${i}">${escTxt(o.label)}</option>`).join("") + `</select>`;
            addBtn = `<button data-plan-do="add-upgrade">Add upgrade</button>`;
          } else changeSel = `<span class="plan-add-or">no available upgrades</span>`;
        }
      }
      return `<div class="plan-add-row plan-build">
        <span class="plan-add-or">Upgrade</span>
        <select data-plan-build-slot><option value="">Slot…</option>${slotOpts}</select>
        ${partSel}${changeSel}${addBtn}
      </div>`;
    }

    // Weekly-box week → calendar date ("week 1" = the next Tue 07:00 UTC reset; week N =
    // N−1 resets later). Shared by the weekly section, the box-wait card tags, and the
    // Total gold (− boxes) line.
    function planWeekDate(w) {
      const d = new Date(nextReset(new Date()));
      d.setUTCDate(d.getUTCDate() + (w - 1) * 7);
      return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    }

    // One step card. `coverable` = the projectAffordability set of later individually-affordable steps.
    // `boxWait` = the last FUTURE weekly-box week this step's materials wait on (SPEC §18), if any.
    function planCard(entry, i, coverable, boxWait = null) {
      const { step, status, move, gold, warnings = [], gap, reason, free } = entry;
      const kind = step.kind;
      const chip = kind === "note" ? "note" : kind === "goal" ? (status === "done" ? "done" : "goal") : status;
      const label = kind === "note" ? escTxt(step.text || "(empty note)")
        : kind === "goal" ? escTxt(goalStepLabel(step))
        : escTxt(stepLabelPure(step, planSlotLabel));
      const sel = plannerSel.has(step.id) ? " sel" : "";

      // Right side of the head: the affordable flag, live gold, and the ONE primary action
      // (Complete on a ready move / goal). Everything secondary reveals on selection.
      const side = [];
      // A FREE-flagged ready step (SPEC §17.9) shows a "free" badge in place of its gold + the
      // "affordable" pill (both moot, it costs nothing). Its stat gain still applies.
      if (coverable.has(step.id) && !free) side.push(`<span class="plan-cover" title="You can afford this step now from your current materials + gold">affordable</span>`);
      // Box-wait tag (SPEC §18): part of this step's materials arrives from a FUTURE free
      // weekly box, the date of the last one it waits on (advisory, like the whole section).
      if (status === "ready" && kind === "move" && boxWait)
        side.push(`<span class="plan-boxwait" title="Some of this step's materials are covered by future free weekly boxes. The last one lands the week of ${esc(planWeekDate(boxWait))}. Buy them instead if you'd rather not wait (see Weekly boxes in the right rail).">boxes ${esc(planWeekDate(boxWait))}</span>`);
      if (status === "ready" && free) side.push(`<span class="plan-cover" title="You marked this step free. No gold or materials counted">free</span>`);
      else if (status === "ready" && gold != null) side.push(`<span class="plan-gold">${fmt(gold)}</span>`);
      if (status === "ready" && kind === "move") {
        side.push(`<button data-plan-do="complete" data-plan-id="${esc(step.id)}" title="Apply this step to your loadout (updates the sidebar gear + stats)${plannerConsume ? " and consume its materials + gold" : ""}">Complete</button>`);
      } else if (kind === "goal") {
        // Goal steps mirror the Checklist tab: completing checks the goal AND folds its stat
        // reward into the character's totals (undo un-folds). Same checklistDone set as the tab.
        side.push(status === "done"
          ? `<button data-plan-do="goal-undo" data-plan-id="${esc(step.id)}" title="Uncheck this checklist goal and remove its stat reward from your totals">Undo</button>`
          : `<button data-plan-do="goal-complete" data-plan-id="${esc(step.id)}" title="Check this checklist goal and fold its stat reward into your totals">Complete</button>`);
      } else if (status === "done" && kind === "move" && step.completed
          && slotShapeEq(loadout[step.slot], step.completed.next)) {
        // Mark incomplete (SPEC §17.14): reverse a completion done here, restore the slot's
        // prior gear/stats and refund what consume-on-complete drew. Offered only while the
        // live slot still matches the completion's result (a later change would be clobbered).
        side.push(`<button data-plan-do="uncomplete" data-plan-id="${esc(step.id)}" title="Reverse this completion: restore the slot's previous gear + stats${step.completed.consumed ? " and refund the consumed materials + gold" : ""}">Mark incomplete</button>`);
      }

      const meta = (status === "blocked" || status === "impossible") && reason
        ? `<div class="plan-meta"><span class="plan-reason">${escTxt(reason)}</span></div>` : "";
      // Multi-tier fold hint: a lone tierStep whose live move spans MORE than one tier hop
      // (e.g. you deleted the intermediate cards, so "advance to Superior Eriu" now re-prices
      // as the whole jump from your current base). Always shown, the card label only names the
      // target, so without this the folded cost + span is invisible. `move.from` is the base at
      // THIS point in the plan (reconcile's forward simulation), i.e. what stage you're at.
      const tierFold = status === "ready" && move && move.type === "tierStep" && move.steps > 1
        ? `<div class="plan-tierfold" title="This one step advances through ${move.steps} tiers. Its gold covers every hop from your current ${escTxt(move.from)}. Add the in-between tiers as their own steps (⁺ Upgrade) if you'd rather track them separately.">` +
          `spans ${move.steps} tiers · from your current <b>${escTxt(move.from)}</b>` +
          (move.wipe ? (move.wipePreserved ? ` · enchants carried by rune` : ` · re-enchant needed`) : "") +
          `</div>`
        : "";
      const diff = move && move.statDiff && Object.keys(move.statDiff).some((k) => move.statDiff[k])
        ? `<div class="plan-diff">${diffLine(move.statDiff)}</div>` : "";
      const warns = warnings.map((w) => `<div class="plan-warn">⚠ ${escTxt(w)}</div>`).join("");
      const gapBanner = (status === "blocked" && gap)
        ? `<div class="plan-gap"><span>${escTxt(gap.reason)}</span>` +
          `<button data-plan-do="gap-insert" data-plan-id="${esc(step.id)}">Insert ${gap.steps.length} step${gap.steps.length !== 1 ? "s" : ""}</button>` +
          `<button data-plan-do="skip" data-plan-id="${esc(step.id)}">Skip step</button></div>`
        : "";

      // Selection-revealed secondary actions (the CSS hides .plan-btns on unselected cards).
      // Comment: an optional free-text annotation on this step (SPEC §17.8). Toggle an inline
      // editor with the button; the saved comment renders as a block above the buttons.
      const editing = plannerCommentEdit.has(step.id);
      const hasComment = typeof step.comment === "string" && step.comment.trim();
      const btns = [];
      // "Complete through here" (SPEC §17.14): finish every ready step up to and including
      // this one in order (one confirm; respects the consume toggle like a single Complete).
      if (status === "ready" && kind !== "note")
        btns.push(`<button data-plan-do="complete-through" data-plan-id="${esc(step.id)}" title="Mark every ready step up to and including this one complete, in order${plannerConsume ? ", consuming their materials + gold" : ""}">Complete through here</button>`);
      // Tune-target stepper (SPEC §17.7): a single-row tune step can be tick-adjusted, each
      // ± moves the target by one tick (cost is linear, so gold/point never changes). The live
      // move carries the grid (tickSize/cap) and the breakdown's gain gives the current tuned
      // amount (target − gain), so the lower clamp is always one tick above where you are.
      if (status === "ready" && kind === "move" && step.type === "tuneStep"
          && step.maxes?.length === 1 && move?.tickSize && move.breakdown?.length === 1) {
        const tgt = step.maxes[0].amount, curAmt = tgt - move.breakdown[0].gain;
        const nTicks = move.breakdown[0].ticks; // capstone moves carry ticks only per-row
        const adjBtn = (dir, sym) =>
          `<button class="plan-tunebtn" data-plan-do="tune-adj" data-plan-id="${esc(step.id)}" data-dir="${dir}" data-tick="${move.tickSize}" data-cap="${move.cap}" data-cur="${curAmt}" title="${dir > 0 ? "+" : "−"}1 tick (${dir > 0 ? "+" : "−"}${move.tickSize} ${escTxt(tuneStatDisplay(step.stat))})">${sym}</button>`;
        btns.push(`<span class="plan-tunetarget">Target ${adjBtn(-1, "−")}<b>${fmt(tgt)}</b>${adjBtn(1, "+")}<span class="muted">/ ${fmt(move.cap)} · ${nTicks} tick${nTicks !== 1 ? "s" : ""}</span></span>`);
      }
      // Free toggle (SPEC §17.9): mark a move step as costing nothing (event box, hand-me-down,
      // freebie). Its gold + materials read as 0 everywhere, but its stat gain still applies.
      if (kind === "move")
        btns.push(`<button class="plan-free-pill${step.free ? " on" : ""}" data-plan-do="free-toggle" data-plan-id="${esc(step.id)}" title="${step.free ? "Marked free. Its gold + materials count as 0. Click to un-mark." : "Mark this step free. You can get this upgrade for nothing. Its gold + materials will read as 0 (the stat gain still applies)."}">${step.free ? "✓ free" : "Mark free"}</button>`);
      btns.push(`<button data-plan-do="comment" data-plan-id="${esc(step.id)}" title="${hasComment ? "Edit the comment on this step" : "Add a comment / note to this step"}">${hasComment ? "Edit comment" : "Add comment"}</button>`);
      btns.push(`<button class="plan-del" data-plan-do="delete" data-plan-id="${esc(step.id)}" title="Remove this step">Delete</button>`);

      const commentBlock = editing
        ? `<div class="plan-comment-edit">
             <textarea class="plan-comment-input" data-plan-comment-id="${esc(step.id)}" rows="2" placeholder="Comment on this step: e.g. wait for a sale, farm the mats first…">${escTxt(hasComment ? step.comment : "")}</textarea>
             <div class="plan-comment-actions">
               <button data-plan-do="comment-save" data-plan-id="${esc(step.id)}">Save</button>
               <button data-plan-do="comment-cancel" data-plan-id="${esc(step.id)}">Cancel</button>
               ${hasComment ? `<button class="plan-del" data-plan-do="comment-del" data-plan-id="${esc(step.id)}">Delete</button>` : ""}
             </div>
           </div>`
        : (hasComment ? `<div class="plan-comment"><span class="plan-comment-h">Note</span>${escTxt(step.comment)}</div>` : "");

      // Note-text editor (SPEC §17.14): clicking a SELECTED note card's label opens this:
      // the same inline shape as the comment editor, but it edits step.text itself.
      const noteEditing = kind === "note" && plannerNoteEdit.has(step.id);
      const noteEditBlock = noteEditing
        ? `<div class="plan-comment-edit">
             <textarea class="plan-comment-input" data-plan-note-edit-id="${esc(step.id)}" rows="2" placeholder="Note text…">${escTxt(step.text || "")}</textarea>
             <div class="plan-comment-actions">
               <button data-plan-do="note-save" data-plan-id="${esc(step.id)}">Save</button>
               <button data-plan-do="note-cancel" data-plan-id="${esc(step.id)}">Cancel</button>
             </div>
           </div>`
        : "";

      // While the comment (or note-text) editor is open the card is NON-draggable: a <textarea>
      // inside a draggable element can't take mouse clicks to place the cursor (the browser
      // intercepts mousedown for a potential drag), so editing would only work via arrow keys.
      return `<div class="plan-card status-${chip}${sel}${hasComment ? " has-comment" : ""}" draggable="${editing || noteEditing ? "false" : "true"}" data-plan-id="${esc(step.id)}">
        <div class="plan-head">
          <span class="plan-handle" title="Drag to reorder">⋮⋮</span>
          <span class="plan-num">${i + 1}</span>
          <span class="plan-chip plan-chip-${chip}">${chip}</span>
          <span class="plan-label" title="${kind === "note" ? "Click to select; click again to edit the note text" : "Click to select for the materials tally + details"}">${label}</span>
          <span class="plan-side">${side.join("")}</span>
        </div>
        ${meta}${tierFold}${diff}${warns}${gapBanner}${commentBlock}${noteEditBlock}
        <div class="plan-btns">${btns.join("")}</div>
      </div>`;
    }

    // Hover insertion line between cards: click opens the quick-add chooser at index `i`.
    const planInsLine = (i) =>
      `<div class="plan-ins" data-plan-ins="${i}" title="Insert a step here"><span class="plan-ins-plus">+</span></div>`;

    // Terse stock status for one materials-panel row (materials AND the Total-gold row share it,
    // the "have" count lives on the stepper, never in the text): always "need N" (the total),
    // with a ✓ + green when your stock covers it, red when it doesn't.
    const planStockStatus = (have, need) =>
      `<span class="${have >= need ? "pos" : "neg"}">${have >= need ? "✓ " : ""}need ${fmt(need)}</span>`;

    // Selection materials panel: sum of the READY selection (whole path when nothing's picked),
    // owned/shortfall coloring vs the live inventory, total gold vs the tracker, and the
    // affordability projection ("finish through step N").
    // Projected-stats panel (SPEC §17, phase 3), atop the materials panel. Current → projected
    // per changed stat (colored delta), a total ranking-points line, and the total gold. Scoped
    // the same way as materials: the whole path, or the selection when one exists. Sums the
    // reconciled entries' READY move statDiffs, no new math (they're already forward-simulated).
    function planStatsSection(entries, matAgg, weekly = null) {
      const hasSel = plannerSel.size > 0;
      const st = aggregateStatDiffs(entries, hasSel ? plannerSel : null);
      const keys = Object.keys(STAT_LABEL).filter((k) => st.stats[k]);
      const rows = keys.map((k) => {
        const d = st.stats[k], cur = currentStats[k] || 0, proj = cur + d;
        return `<div class="plan-stat"><span class="plan-stat-name">${STAT_LABEL[k]}</span>` +
          `<span class="plan-stat-val"><span class="muted">${fmt(cur)}</span> → ${fmt(proj)} ` +
          `<span class="${d > 0 ? "pos" : "neg"}">(${sfmt(d)})</span></span></div>`;
      }).join("");
      const body = keys.length ? rows
        : `<div class="muted" style="font-size:12px;padding:4px 0">No stat change${st.steps ? "" : " (nothing ready in the selection)"}.</div>`;
      return `<h4>Projected stats: ${hasSel ? "selection" : "whole path"}</h4>
        ${body}
        <div class="plan-stat plan-stat-total"><span class="plan-stat-name">Ranking points</span>` +
          `<span class="plan-stat-val"><span class="${st.points > 0 ? "pos" : st.points < 0 ? "neg" : "muted"}">${sfmt(st.points)}</span></span></div>
        <div class="plan-stat plan-stat-total"><span class="plan-stat-name">Total gold</span>` +
          `<span class="plan-stat-val gold">${fmt(matAgg.gold)}</span></div>` +
        // Total gold net of the free weekly boxes (SPEC §18): the whole claim/open schedule's
        // coverage, so future weeks count too, the date says how long the last box takes.
        (weekly && weekly.totalSaved > 0
          ? `<div class="plan-stat plan-stat-total"><span class="plan-stat-name" title="What the same scope costs after the free weekly boxes cover ${fmt(weekly.totalSaved)} of it, counting boxes on hand AND future weekly claims (see Weekly boxes below).">Total gold − boxes</span>` +
            `<span class="plan-stat-val gold">${fmt(Math.max(0, matAgg.gold - weekly.totalSaved))}` +
            (weekly.weeks > 0 ? ` <span class="muted">by ${esc(planWeekDate(weekly.weeks))}</span>` : "") +
            `</span></div>`
          : "");
    }

    // Next-raid card (SPEC §17.13, phase 4), between Projected stats and Materials. DYNAMIC:
    // shortfalls are measured against the plan's PROJECTED end stats, so adding (not yet
    // completing) upgrades ticks the numbers up live, and once the plan covers a raid the
    // card auto-advances to the next uncovered one. A raid <select> overrides the auto pick;
    // a QB entry / Caps toggle (mirroring the Target tab's raid sub-toggle) switches the
    // targets, the milestone chips, and what "Plan the gap" solves for. "Plan the gap" runs
    // solveThreshold on the remaining gap FROM THE PLAN-END GEAR (reconcile's simulated
    // states → a pseudo-loadout), so it never re-proposes steps the plan already holds.
    function planRaidSection(entries, milestones, milestonesCap) {
      if (!raids.length) return "";
      const aim = planRaidAim;
      const aimWord = aim === "cap" ? "caps" : "QB entry";
      const proj = entries.length ? projectedStatsAt(entries, currentStats)[entries.length - 1] : currentStats;
      const r = planRaidPick ? raidByName[planRaidPick] : nextUnmetRaid(raids, proj, aim);
      // Controls: the raid override <select> (auto = easiest unmet by the plan's projection)
      // and the QB/Caps aim toggle, always shown, even when everything is met.
      const controls = `<div class="plan-raid-ctl">` +
        `<select data-plan-raid-pick title="Which raid this card tracks. Auto = the easiest raid the plan's projected stats don't yet reach.">` +
        `<option value="">Auto: next unmet</option>` +
        raids.map((x) => `<option value="${esc(x.raid)}"${planRaidPick === x.raid ? " selected" : ""}>${escTxt(x.raid)}</option>`).join("") +
        `</select><div class="modeToggle plan-raid-aim">` +
        `<button type="button" data-plan-raid-aim="qb" class="${aim === "qb" ? "on" : ""}" title="Quick-Battle entry minimums: what actually gates getting in">QB entry</button>` +
        `<button type="button" data-plan-raid-aim="cap" class="${aim === "cap" ? "on" : ""}" title="Entry floors with Bal/Crit/Crit Res raised to the raid's caps">Caps</button></div></div>`;
      if (!r)
        return `<h4>Next raid</h4>${controls}<div class="muted" style="font-size:12px;padding:4px 0">Your ${entries.length ? "projected" : "current"} stats meet every raid's ${aimWord} targets.</div>`;
      const targets = raidAimTargets(r, aim);
      const shortProj = raidShortfall(r, proj, aim);
      // Rows: every target either your CURRENT stats miss (watch it tick up as the plan
      // grows) or your PROJECTED stats still miss. current → projected / target.
      const rowKeys = Object.keys(STAT_LABEL).filter((k) => targets[k] != null
        && ((currentStats[k] || 0) < targets[k] || (proj[k] || 0) < targets[k]));
      const rows = rowKeys.map((k) => {
        const cur = currentStats[k] || 0, p = proj[k] || 0, met = p >= targets[k];
        return `<div class="plan-stat"><span class="plan-stat-name">${STAT_LABEL[k]}</span>` +
          `<span class="plan-stat-val"><span class="muted">${fmt(cur)}</span>${p !== cur ? ` → ${fmt(p)}` : ""} / ${fmt(targets[k])} ` +
          (met ? `<span class="pos">✓</span>` : `<span class="neg">(−${fmt(targets[k] - p)})</span>`) +
          `</span></div>`;
      }).join("");
      const ms = (aim === "cap" ? milestonesCap : milestones).find((m) => m.raid === r.raid);
      // "Plan the gap" is a quiet header pill (same .plan-mat-tool style as the Materials
      // tools) on the Next raid line, not a button dangling under the stat rows.
      const gapPill = Object.keys(shortProj).length
        ? `<button type="button" class="plan-mat-tool" data-plan-do="plan-gap" title="Assemble the cheapest bundle of upgrades that closes the remaining gap to this raid's ${aimWord} targets (from where this plan already ends) and append it to the plan.">plan the gap</button>`
        : "";
      const foot = ms
        ? `<p class="plan-afford" style="margin:6px 0 0">This plan reaches it at step ${ms.index + 1}.</p>`
        : !Object.keys(shortProj).length
          ? `<p class="plan-afford" style="margin:6px 0 0">Your current stats already meet every ${aimWord} target.</p>`
          : "";
      return `<div class="plan-mats-head"><h4>${planRaidPick ? "Raid" : "Next raid"}: ${esc(r.raid)} <span class="muted" style="font-weight:400">(${aimWord})</span></h4>${gapPill}</div>${controls}${rows}${foot}`;
    }

    function planMaterialsPanel(entries, afford, milestones, milestonesCap) {
      const hasSel = plannerSel.size > 0;
      const agg = aggregateMaterials(entries, hasSel ? plannerSel : null);
      // Weekly boxes (SPEC §18): from the SAME pile as the panel (selection-scoped), how much
      // of it the free weekly choice boxes cover, on-hand unopened boxes now, future weekly
      // claims later. Purely advisory: nothing here changes affordability or step costs.
      const weeklyOpts = weeklyBoxes.length ? weeklyBoxOptions(weeklyBoxes, prices, PRICE_BASIS, cost) : [];
      const weekly = weeklyOpts.length
        ? weeklyBoxPlan(weeklyOpts, weeklyDemand(agg.materials, new Set(weeklyOpts.map((o) => o.item)), moveCtx),
            { onHand: weeklyBox.onHand, alts: weeklyBox.alts, maxWeeks: WEEKLY_BOX_MAX_WEEKS })
        : null;
      // One materials row, recursive (SPEC §17.10): a CRAFTED item's name is an expand toggle.
      // Clicking reveals its recipe as indented sub-rows (need = per-craft qty × the parent's
      // remaining shortfall), each with the same free flag + owned stepper, recursively. The pile
      // stays at the first level (stepMaterials is shallow) so an Advancement Stone is one row
      // you can own/adjust, not a pre-flattened pile of its base leaves.
      const planMatRow = (n, q, depth, seen, pathKey) => {
        const need = Math.ceil(q), have = ownedOf(n);
        // "Shortfall only" (SPEC §17.14): a covered (or free) row. And its sub-rows. Hides.
        if (planShortOnly && (freeItems.has(n) || have >= need)) return "";
        // "free" checkbox (SPEC §17.9): flag this item as costing you no gold (you have a stash / a
        // free scroll). Prices it at 0 everywhere. A free row shows a green "free" status instead of
        // the shortfall count, since gold no longer matters for it.
        const free = freeItems.has(n);
        // Weekly-box coverage note (SPEC §18): this item's remaining DEEP shortfall, the row's
        // own need plus units buried inside crafted sub-recipes elsewhere in the pile, net of
        // owned stock, is (partly) coverable by the free weekly boxes, so the count can exceed
        // this row's shallow "need". Details in the Weekly boxes section below the pile.
        const wk = weekly?.perItem?.[n];
        const wkNote = !free && wk?.covered
          ? `<span class="plan-weekly-note" title="${esc(`${wk.covered} coverable by weekly boxes${wk.lastWeek > 0 ? ` within ${wk.lastWeek} week${wk.lastWeek !== 1 ? "s" : ""}` : " from boxes on hand"} (counts this pile's total remaining shortfall, incl. inside crafted sub-recipes), see Weekly boxes below`)}">box ×${wk.covered}</span>`
          : "";
        const status = free ? `<span class="pos">free</span>` : planStockStatus(have, need);
        const expandable = isCraftedMat(moveCtx, n) && !seen.has(n);
        const open = expandable && planOpenSubs.has(pathKey);
        const name = expandable
          ? `<span class="plan-mat-name expandable" data-plan-expand="${esc(pathKey)}" title="Crafted. Click to show its recipe"><span class="exp-caret">${open ? "▾" : "▸"}</span> ${escTxt(n)}</span>`
          : `<span class="plan-mat-name">${escTxt(n)}</span>`;
        let html = `<div class="plan-mat${free ? " is-free" : ""}${depth ? " plan-mat-sub" : ""}"${depth ? ` style="padding-left:${depth * 16}px"` : ""}>${name}` +
          `<span class="plan-mat-ctl">` +
          `<button type="button" class="plan-free-pill${free ? " on" : ""}" data-plan-free="${esc(n)}" ` +
          `title="Mark this item as free. You have a stash or it costs you no gold. Applies everywhere (Planner, Upgrades, Target, catalog).">free</button>` +
          `${wkNote}${status}${invStepper(n)}</span></div>`;
        if (open) {
          // Sub-needs are scaled by what's still MISSING of the parent (owned/free units need no
          // crafting), so topping the parent's stepper up shrinks the sub-rows live.
          const short = free ? 0 : Math.max(0, need - have);
          const subSeen = new Set([...seen, n]);
          for (const m of recipes[n].materials)
            html += planMatRow(m.material, m.qty * short, depth + 1, subSeen, `${pathKey}>${m.material}`);
        }
        return html;
      };
      const matRows = Object.entries(agg.materials).sort((a, b) => a[0].localeCompare(b[0]))
        .map(([n, q]) => planMatRow(n, q, 0, new Set(), n))
        .join("") || (planShortOnly && Object.keys(agg.materials).length
          ? `<div class="muted" style="font-size:12px;padding:4px 0">No shortfalls. Your stock covers every material.</div>`
          : `<div class="muted" style="font-size:12px;padding:4px 0">No materials needed${agg.steps ? "" : " (nothing ready in the selection)"}.</div>`);
      // Gold on hand gets the same inline stepper treatment as the material rows (±1M, shift
      // ×10, click-to-type). It edits the sidebar's goldTracker via data-plan-gold-* handlers.
      const goldStep = `<span class="invstep${goldTracker > 0 ? " has" : ""}" title="Gold on hand. The same manual total as the sidebar field; feeds the affordability projection">`
        + `<button class="inv-btn" data-plan-gold-dir="-1" type="button"${goldTracker <= 0 ? " disabled" : ""}>−</button>`
        + `<span class="inv-n" data-plan-gold-n title="Click to type an exact amount">${fmt(goldTracker)}</span>`
        + `<button class="inv-btn" data-plan-gold-dir="1" type="button">+</button></span>`;
      const N = afford.prefixN, total = entries.length;
      const afmsg = total === 0 ? ""
        : N >= total ? `You have enough for the whole path (${total} step${total !== 1 ? "s" : ""}).`
        : N === 0 ? `You can't cover the first step yet. Top up gold or gather materials.`
        : `With your materials + gold you can finish through step ${N} of ${total}.`;
      return `<div class="plan-mats">
        ${planStatsSection(entries, agg, weekly)}
        ${planRaidSection(entries, milestones, milestonesCap)}
        <div class="plan-mats-head"><h4>Materials: ${hasSel ? `selection (${agg.steps} ready step${agg.steps !== 1 ? "s" : ""})` : "whole path"}</h4>` +
          `<button type="button" class="plan-mat-tool${planShortOnly ? " on" : ""}" data-plan-do="short-toggle" title="Hide materials your stock already covers">shortfall only</button>` +
          `<button type="button" class="plan-mat-tool" data-plan-do="copy-shop" title="Copy this pile as a shopping list (TSV: item, need, have, shortfall, est. gold)">copy list</button></div>
        ${afmsg ? `<p class="plan-afford">${afmsg}</p>` : ""}
        ${matRows}
        <div class="plan-mat plan-mat-gold"><span class="plan-mat-name">Total gold</span>` +
          `<span class="plan-mat-ctl">${planStockStatus(goldTracker, agg.gold)}${goldStep}</span></div>
        ${planWeeklySection(weekly, hasSel)}
      </div>`;
    }

    // Weekly boxes section (SPEC §18), below the materials pile. One free choice box per
    // week per farming character; contents bind, claimed boxes accumulate unopened, so
    // the advice is CLAIM every week, OPEN on demand. Shows the two account counters
    // (unopened bank + farming alts), then the open/claim schedule against the pile above:
    // which boxes to open NOW and what future weeks cover. Advisory only, the "Open"
    // button is the one mutation, and it just moves the contents into owned inventory.
    function planWeeklySection(weekly, hasSel) {
      if (!weekly) return "";
      const counter = (label, field, title) => {
        const v = weeklyBox[field];
        return `<div class="plan-mat"><span class="plan-mat-name" title="${esc(title)}">${label}</span>` +
          `<span class="plan-mat-ctl"><span class="invstep${v > 0 ? " has" : ""}">` +
          `<button class="inv-btn" data-plan-weekly-dir="-1" data-plan-weekly-field="${field}" type="button"${v <= 0 ? " disabled" : ""}>−</button>` +
          `<span class="inv-n">${v}</span>` +
          `<button class="inv-btn" data-plan-weekly-dir="1" data-plan-weekly-field="${field}" type="button">+</button></span></span></div>`;
      };
      // Group identical picks within a week for display (3 alts opening the same box = one line).
      const groups = [];
      for (const p of weekly.picks) {
        const g = groups.find((x) => x.week === p.week && x.box === p.box && x.item === p.item && x.used === p.used);
        if (g) { g.count++; g.saved += p.saved; } else groups.push({ ...p, count: 1 });
      }
      const line = (g) => {
        const qty = Math.round(g.qty);
        const openBtn = g.week === 0 && weeklyBox.onHand > 0
          ? `<button class="plan-ghost" data-plan-weekly-open="${esc(g.item)}" data-plan-weekly-qty="${qty}" title="Open one box: −1 unopened, +${qty} ${esc(g.item)} into owned inventory">Open</button>`
          : "";
        return `<div class="plan-mat plan-mat-sub" style="padding-left:16px"><span class="plan-mat-name">${g.count > 1 ? `${g.count}× ` : ""}${escTxt(g.box)} → ${escTxt(g.item)}${qty > 1 ? ` x${qty}` : ""}</span>` +
          `<span class="plan-mat-ctl"><span class="pos" title="Gold you don't spend because these box units cover the need">−${fmt(g.saved)}</span>${openBtn}</span></div>`;
      };
      const weeks = [...new Set(weekly.picks.map((p) => p.week))].sort((a, b) => a - b);
      let schedule;
      if (!weekly.picks.length) {
        schedule = `<div class="muted" style="font-size:12px;padding:4px 0">This ${hasSel ? "selection" : "path"} needs nothing a weekly box provides. Keep claiming anyway; boxes never expire.</div>`;
      } else {
        schedule = weeks.map((w) => {
          const head = w === 0 ? `Open now (${weeklyBox.onHand} on hand)` : `Week of ${planWeekDate(w)}`;
          return `<div class="plan-weekly-week muted">${head}</div>` +
            groups.filter((g) => g.week === w).map(line).join("");
        }).join("");
        const summary = `Weekly boxes cover ${fmt(weekly.totalSaved)} gold of this ${hasSel ? "selection" : "path"}` +
          (weekly.savedNow > 0 ? ` ${fmt(weekly.savedNow)} openable now` : "") +
          (weekly.weeks > 0 ? `, fully by ${planWeekDate(weekly.weeks)}` : "") + `.` +
          (weekly.exhausted ? ` Some demand outlives the ${WEEKLY_BOX_MAX_WEEKS}-week horizon, buy the rest.` : "");
        schedule = `<p class="plan-afford">${summary}</p>` + schedule;
      }
      return `<h4 title="One free choice box per week per farming character (resets Tue 07:00 UTC). Contents bind, so they're worth only what your plan needs. Claim every week, open on demand.">Weekly boxes</h4>
        <p class="hint" style="margin:2px 0 6px">One free box per farming character per week. Claim weekly; open on demand.</p>
        ${counter("Unopened boxes", "onHand", "Claimed-but-unopened weekly boxes banked across the account")}
        ${counter("Boxes / week", "alts", "Characters claiming a weekly box (each needs the qualifying raid)")}
        ${schedule}`;
    }

    function renderPlanner() {
      // Prune stale selection ids (a deleted step can leave its id behind).
      const liveIds = new Set(plannerPath.steps.map((s) => s.id));
      for (const id of [...plannerSel]) if (!liveIds.has(id)) plannerSel.delete(id);
      for (const id of [...plannerNoteEdit]) if (!liveIds.has(id)) plannerNoteEdit.delete(id);

      const { entries } = reconcilePath(plannerPath, loadout, checklistDone, moveCtx);
      const afford = projectAffordability(entries, inventory, goldTracker, moveCtx);

      // Raid-unlock milestones (SPEC §17.13): whole-path cumulative projected stats vs each
      // raid's targets, an inline chip after the crossing card, and the raid card's
      // "reaches it at step N" line. Always whole-path (never selection-scoped). QB (entry)
      // chips always render; cap-crossing chips join them only when the card's aim is Caps.
      const milestones = raids.length ? raidMilestones(entries, currentStats, raids, "qb") : [];
      const milestonesCap = raids.length && planRaidAim === "cap" ? raidMilestones(entries, currentStats, raids, "cap") : [];
      const msByIndex = {};
      for (const m of milestones) (msByIndex[m.index] ||= []).push({ raid: m.raid, aim: "qb" });
      for (const m of milestonesCap) (msByIndex[m.index] ||= []).push({ raid: m.raid, aim: "cap" });
      const msChips = (i) => (msByIndex[i] || []).map(({ raid: rn, aim }) =>
        `<div class="plan-milestone" title="After this step your projected stats meet every ${aim === "cap" ? "capped-stat target (entry floors + Bal/Crit/Crit Res caps)" : "Quick-Battle entry floor"} for ${esc(rn)}."><span class="plan-milestone-chip">→ ${aim === "cap" ? "meets" : "unlocks"} ${esc(rn)} <span class="plan-milestone-qb">${aim === "cap" ? "caps" : "QB"}</span></span></div>`).join("");

      // Per-card box-wait tags (SPEC §18): from the WHOLE-PATH weekly-box plan, which steps'
      // materials wait on a FUTURE weekly box, and until which week, attributed in path order.
      let planWaits = {};
      if (weeklyBoxes.length) {
        const waitOpts = weeklyBoxOptions(weeklyBoxes, prices, PRICE_BASIS, cost);
        if (waitOpts.length) {
          const waitTargets = new Set(waitOpts.map((o) => o.item));
          const wkAll = weeklyBoxPlan(waitOpts,
            weeklyDemand(aggregateMaterials(entries, null).materials, waitTargets, moveCtx),
            { onHand: weeklyBox.onHand, alts: weeklyBox.alts, maxWeeks: WEEKLY_BOX_MAX_WEEKS });
          planWaits = stepBoxWaits(entries, wkAll.picks, waitTargets, moveCtx);
        }
      }

      // Plan-tail states for the open add chooser: the loadout simulated through the steps
      // BEFORE the insertion point, so the chooser offers follow-ups to what's already
      // planned there (add "+13", get offered "+14") instead of re-offering the live gear's.
      if (plannerAddAt != null) plannerAddAt = Math.min(plannerAddAt, plannerPath.steps.length); // deletions can strand it past the end
      if (plannerAddAt != null) {
        plannerTailStates = reconcilePath({ ...plannerPath, steps: plannerPath.steps.slice(0, plannerAddAt) },
          loadout, checklistDone, moveCtx).states;
        if (plannerAddMode === "upgrade") planQACands = buildQuickAddCands(plannerTailStates);
      } else plannerTailStates = null;

      // Collapse the leading done run (SPEC §17.14): consecutive done cards at the TOP fold
      // into one "✓ N completed" header (2+ only, a single card isn't clutter). Ephemeral
      // (planDoneOpen); an add-chooser open inside the run forces it expanded for the render.
      const doneRun = leadingDoneRun(entries);
      const collapsed = doneRun >= 2 && !planDoneOpen && !(plannerAddAt != null && plannerAddAt < doneRun);
      const doneHeader = doneRun >= 2
        ? `<div class="plan-done-collapse" data-plan-do="done-toggle" title="${collapsed ? "Show" : "Hide"} the completed steps at the top of the path">` +
          `<span class="pos">✓ ${doneRun} completed</span><span class="muted">, click to ${collapsed ? "expand" : "collapse"}</span></div>`
        : "";

      // Interleave: an insertion line before every card (and at the end), except where the
      // add-chooser is open, the chooser takes that boundary's place. A collapsed done run
      // renders only its header (no milestone chips hide in there, done steps shift no stats).
      const pieces = [];
      if (doneHeader) pieces.push(doneHeader);
      entries.forEach((e, i) => {
        if (collapsed && i < doneRun) return;
        pieces.push(plannerAddAt === i ? planAddChooser(i) : planInsLine(i));
        pieces.push(planCard(e, i, afford.coverable, planWaits[e.step.id]));
        pieces.push(msChips(i)); // raid-unlock divider(s) after the crossing card
      });
      if (entries.length) pieces.push(plannerAddAt === entries.length ? planAddChooser(entries.length) : planInsLine(entries.length));
      else if (plannerAddAt === 0) pieces.push(planAddChooser(0));
      const list = pieces.join("") || planEmptyState();

      const hasSteps = plannerPath.steps.length > 0;
      const allSel = hasSteps && plannerSel.size === plannerPath.steps.length;
      const menu = plannerMenuOpen
        ? `<div class="plan-menu">` +
          (hasSteps ? `<button data-plan-do="export" title="Download this path as a shareable JSON file.">Export JSON</button>` : "") +
          (hasSteps ? `<button data-plan-do="copy-text" title="Copy the path as read-only text (TSV) to the clipboard.">Copy as text</button>` : "") +
          `<button data-plan-do="import-toggle" title="Import a shared path (file or pasted JSON).">${plannerImportOpen ? "Hide import" : "Import…"}</button>` +
          (hasSteps ? `<button data-plan-do="${allSel ? "clear-sel" : "select-all"}">${allSel ? "Select none" : "Select all"}</button>` : "") +
          `</div>`
        : "";
      // Smart reorder (SPEC §17.15): a Sort dropdown mirroring the ⋯ menu. Every mode is a
      // dependency-safe reorder, only the tiebreak differs (position / cost / value / boxes).
      const SORT_LABELS = { deps: "Fix dependencies", cheapest: "Cheapest first", value: "Best value", smart: "Smart (uses boxes)" };
      const SORT_TIPS = {
        deps: "Reorder just enough to fix dependency order. Lifts each base or tier above the enchant, enhance, or tune that needs it. Clears red “blocked” cards.",
        cheapest: "Order the ready upgrades by gold cost, cheapest first (dependencies stay respected).",
        value: "Order the ready upgrades by gold per ranking point, best value first (dependencies stay respected).",
        smart: "Best value first, but crediting the gold your weekly free boxes will cover, so box-cheapened upgrades rise to the top.",
      };
      const sortMenu = plannerSortOpen
        ? `<div class="plan-menu">` + REORDER_MODES.map((m) =>
          `<button data-plan-sort="${m}" title="${esc(SORT_TIPS[m])}">${SORT_LABELS[m]}</button>`).join("") + `</div>`
        : "";
      // Keyboard shortcuts reference (SPEC §17.14): its own "?" hover popover in the toolbar
      // (two aligned columns), no longer a footer scrunched into the ⋯ menu.
      const kbdRow = (keys, desc) =>
        `<span class="keys">${keys.map((k) => `<kbd>${k}</kbd>`).join("")}</span><span>${desc}</span>`;
      const kbdHelp = `<span class="plan-kbd-wrap"><span class="help-icon" tabindex="0" title="Keyboard shortcuts">?</span>` +
        `<div class="plan-kbd-pop"><div class="plan-kbd-h">Keyboard (this tab)</div><div class="plan-kbd-grid">` +
        kbdRow(["/"], "search &amp; add an upgrade") +
        kbdRow(["Del"], "delete the selection") +
        kbdRow(["Alt", "↑", "↓"], "move the selected card") +
        kbdRow(["Esc"], "clear the selection") +
        kbdRow(["Ctrl", "Z"], "undo a path edit") +
        kbdRow(["Ctrl", "Y"], "redo (also Ctrl+Shift+Z)") +
        `</div></div></span>`;
      const toolbar = `<div class="plan-toolbar">` +
        `<button data-plan-do="add-upgrade-open" class="plan-ghost" title="Search for an upgrade to add: enchants, tiers, enhance levels, tuning, checklist goals">+ Upgrade</button>` +
        `<button data-plan-do="add-note-open" class="plan-ghost" title="Add a free-text note step">+ Note</button>` +
        (hasSteps ? `<span class="plan-more plan-sortmore"><button data-plan-do="sort" class="plan-ghost" title="Reorder the plan, fix dependencies, or sort by cost, value, or weekly boxes">Sort ▾</button>${sortMenu}</span>` : "") +
        `<span class="plan-more"><button data-plan-do="menu" class="plan-ghost" title="Export, copy, import, select all">⋯</button>${menu}</span>` +
        kbdHelp +
        (plannerSel.size ? `<span class="plan-selcount">${plannerSel.size} selected</span>` : "") +
        (plannerSel.size ? `<button data-plan-do="del-sel" class="plan-ghost plan-danger" title="Delete every selected step">Delete selected</button>` : "") +
        `<label class="plan-consume"><input type="checkbox" data-plan-consume${plannerConsume ? " checked" : ""}>Consume resources on complete` +
        `<span class="plan-help" title="When on, marking a step complete also subtracts its expected materials from your inventory and its gold from your tracker. These are expected values. Real luck and prices differ, so adjust your stock if reality did.">?</span></label>` +
        `</div>` +
        (plannerImportOpen ? planImportPanel() : "");

      plannerPanel.innerHTML = `<h3>Planner</h3>` +
        toolbar +
        `<div class="plan-body"><div class="plan-list">${list}</div>` +
        planMaterialsPanel(entries, afford, milestones, milestonesCap) +
        `</div>`;

      // One-shot focus of the quick-add input (set by the open/insert handlers, innerHTML
      // replacement destroys the old input, so restore focus with the caret at the end).
      if (planQAFocus) {
        planQAFocus = false;
        const qa = plannerPanel.querySelector("[data-plan-qa-input]");
        if (qa) { qa.focus(); qa.setSelectionRange(qa.value.length, qa.value.length); }
      }
    }

    // Seeded empty state (SPEC §17.14): instead of hint prose, the top 3 cheapest-per-point
    // moves from the live ranked list as one-click "Add to plan" cards, the same moves that
    // lead the Upgrades tab. Falls back to plain text when no moves rank (bare loadout).
    function planEmptyState() {
      planSeedMoves = rankedMoves
        .filter((m) => m.pointGain > 0 && Number.isFinite(m.goldPerPoint))
        .sort((a, b) => a.goldPerPoint - b.goldPerPoint)
        .slice(0, 3);
      const intro = `<p class="muted" style="margin:0 0 10px">No steps yet. Build a path with “+ Upgrade” (search enchants, tiers, enhance levels, goals), “+ Note” for free text, or “Add to plan” from the Upgrades, Target, and Checklist tabs.</p>`;
      if (!planSeedMoves.length) return `<div class="plan-empty">${intro}</div>`;
      const cards = planSeedMoves.map((m, i) =>
        `<div class="plan-seed" data-plan-seed="${i}" title="Add this upgrade to the plan">` +
        `<span class="plan-seed-label">${moveLabel(m)} <span class="muted">(${planSlotLabel(m.slot)})</span></span>` +
        `<span class="plan-seed-side"><span class="plan-gold">${fmt(m.goldCost)}</span>` +
        `<span class="muted">${fmt(m.goldPerPoint)}/pt</span>` +
        `<button type="button">Add to plan</button></span></div>`).join("");
      return `<div class="plan-empty">${intro}` +
        `<div class="plan-seed-h muted">Your cheapest upgrades per ranking point right now:</div>${cards}</div>`;
    }

    // Inline import panel (no modal, the app has none): a file picker + a paste textarea, both
    // routed through parsePath. parsePath's error string surfaces here on a bad file/paste.
    function planImportPanel() {
      // Replace vs Append (SPEC §17.14): both the file picker and the paste box obey the
      // toggle. Replace swaps the whole working path (undo-toasted); Append rides the shared
      // de-duping addStepsToPlan, so overlapping steps are skipped.
      const mode = (v, l, t) =>
        `<button data-plan-import-mode="${v}" class="${plannerImportMode === v ? "on" : ""}" title="${esc(t)}">${l}</button>`;
      return `<div class="plan-import">` +
        `<div class="plan-import-row"><div class="modeToggle">` +
        mode("replace", "Replace path", "Importing swaps out your current path (you can undo)") +
        mode("append", "Append to path", "Imported steps are added to the end, skipping any already planned") +
        `</div></div>` +
        `<div class="plan-import-row">` +
        `<label class="plan-ghost" style="cursor:pointer;display:inline-block">Choose JSON file…` +
        `<input type="file" accept=".json,application/json" data-plan-import-file style="display:none"></label>` +
        `<span class="plan-add-or">or paste the exported JSON below</span></div>` +
        `<textarea data-plan-import-text rows="4" placeholder="Paste an exported planner path here…"></textarea>` +
        (plannerImportErr ? `<div class="plan-import-err">${escTxt(plannerImportErr)}</div>` : "") +
        `<div class="plan-import-row">` +
        `<button data-plan-do="import-paste" class="plan-ghost">Import pasted text</button>` +
        `<button data-plan-do="import-cancel" class="plan-ghost">Cancel</button></div>` +
        `<p class="plan-add-or">${plannerImportMode === "append"
          ? "Imported steps append to your current path. Anything already planned is skipped."
          : "Importing replaces your current path (an Undo toast lets you take it back)."} Steps your gear already meets check themselves off; anything that no longer fits prompts to insert build-up steps or skip.</p>` +
        `</div>`;
    }

    // Apply a ready step to the loadout (Mark complete). Mirrors solver.js applyMove's per-kind
    // semantics on the loadout representation, then folds the slot's stat delta into currentStats
    // exactly like commitSlot. recomputeLoadout re-derives everything (incl. this tab, which
    // re-reconciles → the step flips to "done").
    // `recompute=false` defers the (expensive) recomputeLoadout, the bulk "Complete through
    // here" sweep applies its steps back-to-back and recomputes once at the end.
    // `consumed` (optional) = consumeStep's actual draw, recorded on the step alongside the
    // before/after slot shapes so "Mark incomplete" can reverse the whole completion.
    function applyStepToLoadout(entry, recompute = true, consumed = null) {
      const s = entry.step.slot;
      const a = entry.move.apply;
      const cur = loadout[s] || {};
      const slot = { ...cur, tuning: { ...(cur.tuning || {}) }, enhance: cur.enhance ? { ...cur.enhance } : null };
      if (a.kind === "enchant") {
        slot[a.affix] = a.scroll;
      } else if (a.kind === "base") {
        slot.base = a.item.name;
        slot.enhance = a.level != null ? { level: a.level, bracket: a.item.level } : null;
      } else if (a.kind === "gearEnhance") {
        slot.base = a.item.name; // enchants + tuning carry untouched
      } else if (a.kind === "enhance") {
        slot.enhance = { level: a.level, bracket: slot.enhance?.bracket ?? itemByName[slot.base]?.level };
      } else if (a.kind === "tier") {
        slot.base = a.item.name;
        if (a.wipe) { // system jump wipes base-stat tuning; only Destruction carries (SPEC §12)
          const kept = {};
          for (const [label, amt] of Object.entries(slot.tuning)) if (TUNING_STAT_TO_KEY[label] === "destruction") kept[label] = amt;
          slot.tuning = kept;
        }
      } else if (a.kind === "tune") {
        for (const { stat, amount } of a.maxes) slot.tuning[stat] = amount;
      } else if (a.kind === "infuse") {
        slot.infusion = { stat: a.stat, amount: a.amount }; // one line, replaces whatever was there
      }
      if (slot.tuning && !Object.keys(slot.tuning).length) delete slot.tuning;
      if (!slot.enhance) delete slot.enhance; // keep the loadout shape clean (cf. commitSlot)
      const before = slotStats(cur), after = slotStats(slot);
      for (const k of Object.keys(STAT_LABEL)) {
        const d = (after[k] || 0) - (before[k] || 0);
        if (d) currentStats[k] = (currentStats[k] || 0) + d;
      }
      persistStats();
      loadout[s] = slot;
      persistLoadout();
      // Completion record (SPEC §17.14): the before/after slot shapes + the consumed draw,
      // stored ON THE STEP (rides the persisted path; parsePath strips it from imports).
      // "Mark incomplete" restores `prev` and refunds `consumed`, offered only while the
      // live slot still deep-equals `next` (nothing else touched the gear since).
      entry.step.completed = { prev: structuredClone(cur), next: structuredClone(slot), consumed };
      persistPlannerPath();
      if (recompute) recomputeLoadout(); // regenerates moves + threshold + re-renders sidebar AND this tab
    }

    // Order-insensitive slot-shape equality for the un-complete guard: same base/enchants,
    // same nonzero tuning entries, same enhance level+bracket. Missing/empty/undefined all
    // normalize away, so a completion's recorded `next` matches the live slot it produced.
    function slotShapeEq(a, b) {
      const norm = (s) => {
        const o = s || {};
        return JSON.stringify({
          base: o.base ?? null, prefix: o.prefix ?? null, suffix: o.suffix ?? null,
          tuning: Object.entries(o.tuning || {}).filter(([, v]) => v).sort((x, y) => x[0].localeCompare(y[0])),
          enhance: o.enhance ? { level: o.enhance.level ?? null, bracket: o.enhance.bracket ?? null } : null,
          infusion: o.infusion?.stat && o.infusion.amount ? { stat: o.infusion.stat, amount: o.infusion.amount } : null,
        });
      };
      return norm(a) === norm(b);
    }

    // Consume resources (behind the "Consume resources on complete" toggle). Math.ceil the
    // step's EV materials out of inventory and its gold out of the tracker. Opt-in, never
    // forced; real-world luck/prices differ, so the user stays in control (SPEC §17.5).
    // QUIET: persists + rebuilds the catalog (Owned column) but does NOT recompute/re-render.
    // The caller always follows with applyStepToLoadout, whose recomputeLoadout does both.
    // Returns what was ACTUALLY drawn — { mats: {name: qty}, gold }. So "Mark incomplete"
    // can refund exactly it (SPEC §17.14; stored on the step by applyStepToLoadout).
    function consumeStep(entry) {
      // Recursive draw (drawMaterial): an owned crafted intermediate is consumed whole; a
      // shortfall consumes the sub-materials you'd craft it from (owned leaves get drawn,
      // the rest is assumed bought, nothing to take). Diff the scratch stock back in.
      const stock = { ...inventory };
      for (const [n, q] of Object.entries(entry.materials || {}))
        drawMaterial(moveCtx, stock, n, Math.ceil(q));
      const mats = {};
      for (const n of Object.keys(stock)) {
        const next = Math.max(0, Math.floor(stock[n] || 0));
        const taken = (inventory[n] || 0) - next;
        if (!taken) continue;
        mats[n] = taken;
        setOwned(n, next);
      }
      const goldBefore = goldTracker;
      goldTracker = Math.max(0, Math.round(goldTracker - (entry.gold || 0))); // EV gold is fractional, keep the tracker whole
      persistGold();
      persistInventory();
      catalogView = buildCatalogView();
      views[CATALOG_TAB] = catalogView;
      return { mats, gold: goldBefore - goldTracker };
    }

    // Export / import (SPEC §17.5)
    // Export = the path envelope as a downloaded JSON file (identity only, never the live costs).
    // Copy-as-text = the reconciled read-only TSV to the clipboard. Import = parsePath (validating,
    // never throws) → REPLACES the working path (confirm() guards a non-empty one); reconcile then
    // auto-completes any step the current gear already satisfies-or-betters on the next render.
    function exportPath() {
      const blob = new Blob([serializePath(plannerPath)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `planner_path_${new Date().toISOString().slice(0, 10)}.json`;
      a.click(); URL.revokeObjectURL(url);
    }
    // Import in one of two modes (the panel's Replace/Append toggle, SPEC §17.14):
    // replace = the classic swap (undo-toasted, no confirm needed when you can undo);
    // append = the parsed steps ride the shared de-duping addStepsToPlan, so re-importing
    // a path you already hold adds nothing.
    function importPathText(text) {
      const { path, error } = parsePath(text);
      if (error) { plannerImportErr = error; renderPlanner(); return false; }
      if (plannerImportMode === "append") {
        const n = addStepsToPlan(path.steps);
        plannerImportErr = null; plannerImportOpen = false;
        renderPlanner();
        if (!n) showUndoToast("Nothing appended: every step is already planned", null);
        return true;
      }
      const priorN = plannerPath.steps.length;
      snapPlan();
      plannerPath = path; plannerImportErr = null; plannerImportOpen = false;
      plannerSel.clear(); plannerSelAnchor = null; plannerAddAt = null;
      planQuery = ""; planQABrowse = false; planBuildSlot = planBuildPart = null;
      persistPlannerPath(); renderPlanner();
      if (priorN) showUndoToast(`Replaced ${priorN} step${priorN !== 1 ? "s" : ""}`, true);
      return true;
    }

    // Undo toast (SPEC §17.14). Module-scoped
    // Destructive path edits (delete / delete-selected / import-replace) float a transient
    // toast; its Undo button is just a shortcut to the shared multi-level planUndo (the same
    // stack Ctrl+Z walks), so undo still works after the toast times out (5s).
    let planToastEl = null, planToastTimer = null;
    function showUndoToast(label, canUndo) {
      if (planToastEl) { planToastEl.remove(); planToastEl = null; }
      clearTimeout(planToastTimer);
      const el = document.createElement("div");
      el.className = "plan-toast";
      el.innerHTML = `<span>${escTxt(label)}</span>${canUndo ? `<button type="button">Undo</button>` : ""}`;
      el.querySelector("button")?.addEventListener("click", () => {
        planUndo();
        el.remove(); if (planToastEl === el) planToastEl = null;
        clearTimeout(planToastTimer);
      });
      document.body.appendChild(el);
      planToastEl = el;
      planToastTimer = setTimeout(() => { el.remove(); if (planToastEl === el) planToastEl = null; }, 5000);
    }

    // Delete every selected step (the toolbar button AND the Delete key route here):
    // one confirm above a single step, then an undo toast.
    function deleteSelectedSteps() {
      if (!plannerSel.size) return;
      if (plannerSel.size > 1 && !confirm(`Delete ${plannerSel.size} selected steps?`)) return;
      snapPlan();
      const n = plannerSel.size;
      plannerPath = { ...plannerPath, steps: plannerPath.steps.filter((s) => !plannerSel.has(s.id)) };
      plannerSel.clear(); plannerSelAnchor = null; persistPlannerPath(); renderPlanner();
      showUndoToast(`Deleted ${n} step${n !== 1 ? "s" : ""}`, true);
    }

    // One delegated click listener on the Planner panel (data-plan-* attributes, cf. scannerPanel).
    plannerPanel.addEventListener("click", (e) => {
      // Clicking anywhere outside the ⋯ overflow closes it (its own items handle themselves).
      if (plannerMenuOpen && !e.target.closest(".plan-more")) {
        plannerMenuOpen = false;
        if (!e.target.closest("[data-plan-do],[data-plan-qa],[data-plan-ins],.plan-card")) renderPlanner();
      }
      // Same for the Sort dropdown (SPEC §17.15). Clicking outside it closes it.
      if (plannerSortOpen && !e.target.closest(".plan-sortmore")) {
        plannerSortOpen = false;
        if (!e.target.closest("[data-plan-do],[data-plan-qa],[data-plan-ins],.plan-card")) renderPlanner();
      }
      // Sort dropdown: a mode pick reorders the path.
      const sortBtn = e.target.closest("button[data-plan-sort]");
      if (sortBtn) { applyReorder(sortBtn.dataset.planSort); return; }
      // Next-raid card: the QB entry / Caps aim toggle (SPEC §17.13).
      const raim = e.target.closest("button[data-plan-raid-aim]");
      if (raim) {
        if (planRaidAim !== raim.dataset.planRaidAim) { planRaidAim = raim.dataset.planRaidAim; persistPlanRaid(); renderPlanner(); }
        return;
      }
      // Materials panel: the "free" pill toggle (SPEC §17.9). A button now, so click not change.
      const freeBtn = e.target.closest("button[data-plan-free]");
      if (freeBtn) {
        const n = freeBtn.dataset.planFree;
        toggleFreeItem(n, !freeItems.has(n)); // re-prices + re-renders
        return;
      }
      // Materials panel: expand/collapse a crafted item's sub-recipe rows (SPEC §17.10).
      const exp = e.target.closest("[data-plan-expand]");
      if (exp) {
        const k = exp.dataset.planExpand;
        if (planOpenSubs.has(k)) planOpenSubs.delete(k); else planOpenSubs.add(k);
        renderPlanner();
        return;
      }
      // Weekly boxes (SPEC §18): the two account counters (unopened bank / farming alts).
      // stopPropagation for the same reason as the gold stepper, the buttons reuse .inv-btn
      // styling and would otherwise hit the document-level inventory handler.
      const wbtn = e.target.closest("[data-plan-weekly-dir]");
      if (wbtn) {
        e.stopPropagation();
        const field = wbtn.dataset.planWeeklyField;
        weeklyBox[field] = Math.max(0, (weeklyBox[field] || 0) + Number(wbtn.dataset.planWeeklyDir));
        persistWeeklyBox(); renderPlanner();
        return;
      }
      // Open one banked box at the recommended pick: −1 unopened, contents into owned
      // inventory (the plain stock-edit path, everything downstream re-nets from there).
      const wopen = e.target.closest("[data-plan-weekly-open]");
      if (wopen) {
        e.stopPropagation();
        if (weeklyBox.onHand <= 0) return;
        weeklyBox.onHand -= 1;
        persistWeeklyBox();
        const item = wopen.dataset.planWeeklyOpen;
        setOwned(item, ownedOf(item) + Math.max(1, Math.round(+wopen.dataset.planWeeklyQty || 1)));
        applyInventory(); // persists + re-nets moves + rebuilds the catalog + re-renders
        return;
      }
      // Total-gold stepper (materials panel): nudge gold on hand ±1M (shift ×10), mirroring the
      // sidebar field. stopPropagation, the buttons reuse .inv-btn styling, and the document-level
      // inventory handler would otherwise fire on them (no data-inv → a wasted full re-render).
      const gbtn = e.target.closest("[data-plan-gold-dir]");
      if (gbtn) {
        e.stopPropagation();
        goldTracker = Math.max(0, goldTracker + Number(gbtn.dataset.planGoldDir) * (e.shiftKey ? 10 : 1) * 1000000);
        persistGold(); renderSidebar(); renderPlanner();
        return;
      }
      // Click the gold count to type an exact amount (same in-place editor as the inventory counts).
      const gspan = e.target.closest("[data-plan-gold-n]");
      if (gspan && !gspan.querySelector("input")) {
        e.stopPropagation();
        const cur = goldTracker;
        const input = document.createElement("input");
        input.className = "inv-edit plan-gold-edit"; input.type = "text"; input.inputMode = "numeric"; input.value = cur;
        gspan.textContent = ""; gspan.appendChild(input);
        input.focus(); input.select();
        let done = false;
        const commit = (save) => {
          if (done) return; done = true;
          const v = Math.max(0, Math.floor(+String(input.value).replace(/[^0-9]/g, "") || 0));
          if (save && v !== cur) { goldTracker = v; persistGold(); renderSidebar(); renderPlanner(); return; }
          gspan.textContent = fmt(cur); // cancel / unchanged → restore
        };
        input.addEventListener("keydown", (ev) => {
          ev.stopPropagation();
          if (ev.key === "Enter") { ev.preventDefault(); commit(true); }
          else if (ev.key === "Escape") { ev.preventDefault(); commit(false); }
        });
        input.addEventListener("blur", () => commit(true));
        input.addEventListener("click", (ev) => ev.stopPropagation());
        return;
      }
      // Import panel: the Replace/Append mode toggle (SPEC §17.14).
      const imode = e.target.closest("[data-plan-import-mode]");
      if (imode) { plannerImportMode = imode.dataset.planImportMode; plannerImportErr = null; renderPlanner(); return; }
      // Empty-state seed card: add one of the top cheapest-per-point moves (SPEC §17.14).
      const seed = e.target.closest("[data-plan-seed]");
      if (seed) {
        const m = planSeedMoves[+seed.dataset.planSeed];
        if (m) addStepsToPlan(moveToSteps(m, moveCtx, loadout[m.slot]?.base ?? null)); // re-renders
        return;
      }
      // Insertion line between cards: open the quick-add chooser at that index.
      const ins = e.target.closest("[data-plan-ins]");
      if (ins) { openAddChooser(+ins.dataset.planIns, "upgrade"); return; }
      // Quick-add result row: insert the picked candidate's steps (chooser stays open).
      const qaRow = e.target.closest("[data-plan-qa]");
      if (qaRow) {
        const c = planQAShown[+qaRow.dataset.planQa];
        if (c && !c.planned) planQAInsert(c);
        return;
      }
      const doBtn = e.target.closest("[data-plan-do]");
      if (doBtn) {
        const act = doBtn.dataset.planDo, id = doBtn.dataset.planId;
        if (act === "menu") { plannerMenuOpen = !plannerMenuOpen; plannerSortOpen = false; renderPlanner(); return; }
        if (act === "sort") { plannerSortOpen = !plannerSortOpen; plannerMenuOpen = false; renderPlanner(); return; }
        plannerMenuOpen = false; plannerSortOpen = false; // any other action closes the menus
        // Toolbar adds insert after the last selected card (or at the end when none selected).
        if (act === "add-upgrade-open" || act === "add-note-open") {
          const idxs = plannerPath.steps.map((s, i) => plannerSel.has(s.id) ? i : -1).filter((i) => i >= 0);
          openAddChooser(idxs.length ? idxs[idxs.length - 1] + 1 : plannerPath.steps.length,
            act === "add-upgrade-open" ? "upgrade" : "note");
          return;
        }
        if (act === "qa-browse") { planQABrowse = !planQABrowse; planBuildSlot = planBuildPart = null; renderPlanner(); return; }
        if (act === "add-cancel") { plannerAddAt = null; planQuery = ""; planQABrowse = false; planBuildSlot = planBuildPart = null; renderPlanner(); return; }
        // Per-step comment (SPEC §17.8): open/close the inline editor, save/delete the annotation.
        // Per-step free flag (SPEC §17.9): toggle whether this move step costs gold/materials.
        // Tune-target stepper (SPEC §17.7): move a single-row tune step's target by one tick.
        // Clamped to [one tick above the current tuned amount, the row cap]; below the cap the
        // step is flagged `partial` so reconcile prices it via tunePartialMove.
        if (act === "tune-adj") {
          const step = plannerPath.steps.find((s) => s.id === id);
          if (step && step.kind === "move" && step.type === "tuneStep" && step.maxes?.length === 1) {
            const tick = +doBtn.dataset.tick, cap = +doBtn.dataset.cap, cur = +doBtn.dataset.cur;
            const dir = +doBtn.dataset.dir;
            const floor = Math.min(cur + tick, cap); // never below one tick of progress
            const tgt = Math.max(floor, Math.min(cap, step.maxes[0].amount + dir * tick));
            if (tgt !== step.maxes[0].amount) {
              snapPlan();
              step.maxes = [{ stat: step.maxes[0].stat, amount: tgt }];
              if (tgt < cap) step.partial = true; else delete step.partial;
              persistPlannerPath();
            }
          }
          renderPlanner(); return;
        }
        if (act === "free-toggle") {
          const step = plannerPath.steps.find((s) => s.id === id);
          if (step && step.kind === "move") { snapPlan(); if (step.free) delete step.free; else step.free = true; persistPlannerPath(); }
          renderPlanner(); return;
        }
        if (act === "comment") { plannerCommentEdit.add(id); renderPlanner(); return; }
        if (act === "comment-cancel") { plannerCommentEdit.delete(id); renderPlanner(); return; }
        if (act === "comment-save") {
          const ta = plannerPanel.querySelector(`textarea.plan-comment-input[data-plan-comment-id="${CSS.escape(id)}"]`);
          const text = (ta?.value || "").trim();
          const step = plannerPath.steps.find((s) => s.id === id);
          if (step && (text || step.comment != null)) snapPlan();
          if (step) { if (text) step.comment = text; else delete step.comment; }
          plannerCommentEdit.delete(id);
          persistPlannerPath(); renderPlanner(); return;
        }
        if (act === "comment-del") {
          const step = plannerPath.steps.find((s) => s.id === id);
          if (step && step.comment != null) snapPlan();
          if (step) delete step.comment;
          plannerCommentEdit.delete(id);
          persistPlannerPath(); renderPlanner(); return;
        }
        if (act === "add-upgrade") {
          const sel = plannerPanel.querySelector("[data-plan-build-change]");
          if (!planBuildSlot || !planBuildPart || !sel) return;
          // Same plan-tail states the builder rendered its options from.
          const groups = slotUpgradeOptions(loadout, planBuildSlot, moveCtx, plannerTailStates) || {};
          const chosen = planChangeOptions(planBuildSlot, planBuildPart, groups, plannerTailStates)[+sel.value];
          if (!chosen) return;
          planBuildPart = null; // re-pick the part against the new tail (options shift after the add)
          planQAInsert(chosen); // de-dupes, inserts at plannerAddAt, keeps the chooser open
          return;
        }
        if (act === "add-note") {
          const inp = plannerPanel.querySelector("[data-plan-note-text]");
          const text = (inp?.value || "").trim();
          if (!text) { inp?.focus(); return; }
          snapPlan();
          plannerPath = insertSteps(plannerPath, plannerAddAt ?? plannerPath.steps.length, [newNoteStep(text)]);
          plannerAddAt = null; persistPlannerPath(); renderPlanner(); return;
        }
        if (act === "goal-complete" || act === "goal-undo") {
          const gid = plannerPath.steps.find((s) => s.id === id)?.goalId;
          if (!gid) return;
          const has = checklistDone.has(gid);
          if (act === "goal-complete" && !has) { checklistDone.add(gid); applyGoalStats(gid, +1); }
          else if (act === "goal-undo" && has) { checklistDone.delete(gid); applyGoalStats(gid, -1); }
          else return;
